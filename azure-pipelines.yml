resources:
- repo: self

trigger:
  batch: true
  branches:
    include:
    - '*'
    exclude:
    - 'release*'

pr:
  branches:
    include:
    - '*'

variables:
- template: ${{ variables.Pipeline.Workspace }}/.azure-pipelines/templates/variables.yml
- group: 'AME ESRP Variable Group'
- name: Codeql.Enabled
  value: false
- name: ComponentDetection.ForceScan
  value: eq(variables['Build.SourceBranch'], 'refs/heads/release')

# macOS Cask parameters
- name: macos_cask_python_version
  value: '3.13'

parameters:
- name: runMacOSOnly
  type: boolean
  default: true
  displayName: 'Run only macOS jobs (skip all other jobs)'

# COMMENTED OUT: These pools require permissions we don't have
# - name: architectures
#   type: object
#   default:
#   - name: AMD64
#     value: amd64
#     pool: pool-ubuntu-latest-multi-core
#   - name: ARM64
#     value: arm64
#     pool: pool-ubuntu-latest-arm64
- name: architectures
  type: object
  default: []

