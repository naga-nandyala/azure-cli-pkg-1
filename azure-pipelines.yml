# DISABLED: # ============================================================================
# DISABLED: # HOMEBREW CASK JOBS (Pre-built, signed, notarized binaries)
# DISABLED: # These run in parallel with the formula jobs above
# DISABLED: # ============================================================================
# DISABLED: 
# DISABLED: # Phase 1: Build unsigned tarballs (ARM64 + Intel)
- template: .azure-pipelines/templates/macos-build-jobs.yml
  parameters:
    PythonVersion: $(macos_cask_python_version)
    MacosArm64Image: ${{ variables.macos_arm64_pool }}
    MacosIntelImage: ${{ variables.macos_pool }}
    condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual', 'Schedule'))
    dependsOn: ['ExtractMetadata']

# Phase 2: Sign and notarize via ESRP
- template: .azure-pipelines/templates/macos-sign-notarize-jobs.yml
  parameters:
    MacosArm64Image: ${{ variables.macos_arm64_pool }}
    MacosIntelImage: ${{ variables.macos_pool }}
    BundleId: 'com.microsoft.azure.cli'
    PythonVersion: $(macos_cask_python_version)
    UseCurrentPipelineArtifacts: true
    dependsOn: ['VerifyMacOSCli']

# Phase 3: Generate cask and test via temp tap
- template: .azure-pipelines/templates/macos-cask-generation-and-tests.yml
  parameters:
    MacosArm64Image: ${{ variables.macos_arm64_pool }}
    MacosIntelImage: ${{ variables.macos_pool }}
    PythonVersion: $(macos_cask_python_version)
    GitHubRepo: $(Build.Repository.Name)
    Debug: false
    dependsOn: ['CreateFinalTarball']

