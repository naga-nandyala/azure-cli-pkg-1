            - name: Upload Inspection Results
              if: always()
              run: |
                  echo "================================================"
                  echo "CREATING ARTIFACT"
                  echo "================================================"
                  echo ""

                  REPORT_FILE="formula-inspection-x86-64-$(date +%Y%m%d-%H%M%S).txt"

                  {
                    echo "========================================"
                    echo "Azure CLI Homebrew Formula Inspection"
                    echo "========================================"
                    echo ""
                    echo "Date: $(date)"
                    echo "Architecture: $(arch)"
                    echo "macOS: $(sw_vers -productVersion)"
                    echo ""
                    echo "========================================"
                    echo ""
                    
                    echo "INSTALLATION SUMMARY"
                    echo "--------------------"
                    brew info azure-cli
                    echo ""
                    
                    echo "FILE LIST"
                    echo "---------"
                    brew list azure-cli
                    echo ""
                    
                    echo "DEPENDENCIES"
                    echo "------------"
                    brew deps --tree azure-cli
                    echo ""
                    
                  } > "$REPORT_FILE"

                  echo "Report saved to: $REPORT_FILE"
                  echo "report_file=$REPORT_FILE" >> $GITHUB_ENV

            - name: Upload Report as Artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: formula-inspection-report-x86-64
                  path: formula-inspection-*.txt
                  retention-days: 30
