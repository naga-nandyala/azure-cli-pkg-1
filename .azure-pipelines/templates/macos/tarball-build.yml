parameters:
  - name: PythonVersion
    type: string
    default: '3.13'

stages:
- stage: BuildAzureCli
  displayName: 'Stage 1: Build Azure CLI'
  jobs:
  - job: BuildCli
    displayName: 'Build'
    strategy:
      matrix:
        ARM64:
          Architecture: 'arm64'
          vmImageName: ${{ variables.macos_arm64_pool }}
        Intel:
          Architecture: 'x86_64'
          vmImageName: ${{ variables.macos_intel_pool }}
    pool:
      vmImage: $(vmImageName)
    timeoutInMinutes: 60

    steps:
    - checkout: self
      fetchDepth: 1

    - bash: |
        set -e

        echo "=== Installing Homebrew Python ${{ parameters.PythonVersion }} ==="
        echo "Architecture: $(Architecture)"
        echo "VM Image: $(vmImageName)"
        brew install python@${{ parameters.PythonVersion }}

        PYTHON_PATH=$(brew --prefix python@${{ parameters.PythonVersion }})/libexec/bin/python3

        echo "Python path: $PYTHON_PATH"
        $PYTHON_PATH --version

        echo "##vso[task.setvariable variable=PythonPath]$PYTHON_PATH"
      displayName: 'Install Homebrew Python'

    - bash: |
        set -e

        PYTHON="$(PythonPath)"
        ARCH="$(Architecture)"

        echo "=== Building Azure CLI with Homebrew Python ==="
        echo "Python: $PYTHON"
        echo "Architecture: $ARCH"
        $PYTHON --version

        echo ""
        echo "=== Running tarball build script ==="
        $PYTHON scripts/release/macos/build_binary_tar_gz.py \
          --platform-tag macos-$ARCH \
          --output-dir dist/binary_tar_gz

        echo ""
        echo "=== Build Output ==="
        ls -lh dist/binary_tar_gz/

        mkdir -p $(Build.ArtifactStagingDirectory)/cli-build
        cp dist/binary_tar_gz/*.tar.gz $(Build.ArtifactStagingDirectory)/cli-build/
        cp dist/binary_tar_gz/*.sha256 $(Build.ArtifactStagingDirectory)/cli-build/

        echo ""
        echo "=== Staged Artifacts ==="
        ls -lh $(Build.ArtifactStagingDirectory)/cli-build/

      displayName: 'Build Azure CLI Tarball'
      name: BuildStep

    - publish: $(Build.ArtifactStagingDirectory)/cli-build
      artifact: 'cli-build-unsigned-$(Architecture)'
      displayName: 'Publish Unsigned CLI Build ($(Architecture))'

- stage: AnalyzeAndVerify
  displayName: 'Stage 2: Analyze and Verify'
  dependsOn: BuildAzureCli
  jobs:
  - job: AnalyzeTarball
    displayName: 'Verify'
    strategy:
      matrix:
        ARM64:
          Architecture: 'arm64'
          vmImageName: 'macos-15-arm64'
        Intel:
          Architecture: 'x86_64'
          vmImageName: 'macos-15'
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: none

    - download: current
      artifact: 'cli-build-unsigned-$(Architecture)'
      displayName: 'Download CLI Build ($(Architecture))'

    - bash: |
        set -e

        ARCH="$(Architecture)"
        TARBALL=$(find $(Pipeline.Workspace)/cli-build-unsigned-$ARCH -name "azure-cli-*-macos-$ARCH-nopython.tar.gz" | sort | tail -1)
        EXTRACT_DIR=$(mktemp -d)

        echo "=== Tarball Analysis (No Bundled Python) ==="
        echo "Architecture: $ARCH"
        echo "Tarball: $(basename "$TARBALL")"
        TARBALL_SIZE=$(du -h "$TARBALL" | cut -f1)
        echo "Size: $TARBALL_SIZE"
        echo ""

        tar -xzf "$TARBALL" -C "$EXTRACT_DIR"

        echo "=== Directory Structure ==="
        find "$EXTRACT_DIR" -maxdepth 3 -type d | head -20
        echo ""

        echo "=== Native Extensions (.so files) to Sign ==="
        SO_FILES=$(find "$EXTRACT_DIR" -name "*.so" -type f)
        SO_COUNT=$(echo "$SO_FILES" | grep -c . || echo 0)
        echo "Total .so files: $SO_COUNT"
        echo ""
        echo "Files:"
        echo "$SO_FILES" | while read f; do
          if [ -n "$f" ]; then
            SIZE=$(du -h "$f" | cut -f1)
            NAME=$(basename "$f")
            echo "  $NAME ($SIZE)"
          fi
        done

        echo ""
        echo "=== Dylib Files ==="
        DYLIB_FILES=$(find "$EXTRACT_DIR" -name "*.dylib" -type f)
        DYLIB_COUNT=$(echo "$DYLIB_FILES" | grep -c . || echo 0)
        echo "Total .dylib files: $DYLIB_COUNT"

        echo ""
        echo "=== Total Binaries to Sign ==="
        TOTAL=$((SO_COUNT + DYLIB_COUNT))
        echo "Total: $TOTAL"
        echo "##vso[task.setvariable variable=TarballSize;isOutput=true]$TARBALL_SIZE"

        echo ""
        echo "=== Launcher Script ==="
        cat "$EXTRACT_DIR/libexec/bin/az" | head -30

        echo ""
        echo "=== Tarball Contents Summary ==="
        echo "Extracted size: $(du -sh "$EXTRACT_DIR" | cut -f1)"
        echo "File count: $(find "$EXTRACT_DIR" -type f | wc -l)"

        rm -rf "$EXTRACT_DIR"
      displayName: 'Analyze Tarball ($(Architecture))'
      name: AnalyzeStep

    - bash: |
        set -e

        ARCH="$(Architecture)"
        TARBALL=$(find $(Pipeline.Workspace)/cli-build-unsigned-$ARCH -name "azure-cli-*-macos-$ARCH-nopython.tar.gz" | sort | tail -1)
        EXTRACT_DIR=$(mktemp -d)

        echo "=== Verifying Azure CLI on $ARCH ==="
        tar -xzf "$TARBALL" -C "$EXTRACT_DIR"

        if ! brew list python@${{ parameters.PythonVersion }} &>/dev/null; then
          brew install python@${{ parameters.PythonVersion }}
        fi

        AZ_PYTHON="$(brew --prefix python@${{ parameters.PythonVersion }})/libexec/bin/python3"
        export AZ_PYTHON

        echo "System architecture: $(uname -m)"
        echo "Expected: $ARCH"

        export AZ_DEBUG=1
        "$EXTRACT_DIR/bin/az" version

        echo ""
        echo "Azure CLI works correctly on $ARCH"

        rm -rf "$EXTRACT_DIR"
      displayName: 'Verify CLI Works ($(Architecture))'

- stage: BuildSummary
  displayName: 'Stage 3: Build Summary'
  dependsOn:
  - BuildAzureCli
  - AnalyzeAndVerify
  condition: always()
  variables:
    TarballSizeARM64: $[ stageDependencies.AnalyzeAndVerify.AnalyzeTarball.outputs['ARM64.AnalyzeStep.TarballSize'] ]
    TarballSizeIntel: $[ stageDependencies.AnalyzeAndVerify.AnalyzeTarball.outputs['Intel.AnalyzeStep.TarballSize'] ]
  jobs:
  - job: PrintSummary
    displayName: 'Print Build Summary'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: none

    - bash: |
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║          AZURE CLI TARBALL BUILD SUMMARY                             ║"
        echo "╠══════════════════════════════════════════════════════════════════════╣"
        echo "║ Architectures:  ARM64 (Apple Silicon) + x86_64 (Intel)"
        echo "║ Python:         Homebrew ${{ parameters.PythonVersion }} (not bundled)"
        echo "╠══════════════════════════════════════════════════════════════════════╣"
        echo "║ TARBALL SIZES                                                        ║"
        echo "╠══════════════════════════════════════════════════════════════════════╣"
        echo "║ ARM64 tarball size:    $(TarballSizeARM64)"
        echo "║ Intel tarball size:    $(TarballSizeIntel)"
        echo "╠══════════════════════════════════════════════════════════════════════╣"
        echo "║ ARTIFACTS                                                            ║"
        echo "╠══════════════════════════════════════════════════════════════════════╣"
        echo "║ • cli-build-unsigned-arm64                                           ║"
        echo "║   └── azure-cli-<version>-macos-arm64-nopython.tar.gz"
        echo "║ • cli-build-unsigned-x86_64                                          ║"
        echo "║   └── azure-cli-<version>-macos-x86_64-nopython.tar.gz"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
      displayName: 'Print Summary'
