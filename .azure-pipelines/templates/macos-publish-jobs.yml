# macOS Publish Jobs Template
#
# Purpose: Publish signed tarballs to GitHub and update Homebrew cask
# Usage: Called after sign/notarize template completes
#
# Parameters:
#   - PublishToGitHub: Whether to create GitHub release
#   - UpdateHomebrew: Whether to update Homebrew cask
#   - GitHubRepo: GitHub repository (owner/repo)
#   - HomebrewTapRepo: Homebrew tap repository
#   - dependsOn: Jobs this depends on (typically CreateFinalTarball)
#
# Requires:
#   - Artifacts: cli-signed-notarized-arm64, cli-signed-notarized-x86_64

parameters:
  - name: PublishToGitHub
    type: boolean
    default: false
  - name: UpdateHomebrew
    type: boolean
    default: false
  - name: GitHubRepo
    type: string
    default: ''
  - name: HomebrewTapRepo
    type: string
    default: ''
  - name: dependsOn
    type: object
    default: ['CreateFinalTarball']

jobs:
# ============================================================================
# JOB: GITHUB RELEASE (Optional)
# ============================================================================
- ${{ if eq(parameters.PublishToGitHub, true) }}:
  - job: CreateGitHubRelease
    displayName: 'Create GitHub Release'
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: 'cli-signed-notarized-arm64'
      displayName: 'Download signed tarball (ARM64)'
    
    - download: current
      artifact: 'cli-signed-notarized-x86_64'
      displayName: 'Download signed tarball (Intel)'
    
    - task: CopyFiles@2
      displayName: 'Copy ARM64 release files'
      inputs:
        SourceFolder: '$(Pipeline.Workspace)/cli-signed-notarized-arm64'
        Contents: |
          azure-cli-*.tar.gz
          azure-cli-*.tar.gz.sha256
        TargetFolder: '$(Build.ArtifactStagingDirectory)/release'
        flattenFolders: true
    
    - task: CopyFiles@2
      displayName: 'Copy Intel release files'
      inputs:
        SourceFolder: '$(Pipeline.Workspace)/cli-signed-notarized-x86_64'
        Contents: |
          azure-cli-*.tar.gz
          azure-cli-*.tar.gz.sha256
        TargetFolder: '$(Build.ArtifactStagingDirectory)/release'
        flattenFolders: true
    
    - bash: |
        ARM64_TARBALL=$(find "$(Build.ArtifactStagingDirectory)/release" -name "azure-cli-*-macos-arm64-*.tar.gz" | sort | tail -1)
        VERSION=$(basename "$ARM64_TARBALL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([a-z0-9]+)?' | head -1)
        
        echo "=== GitHub Release ==="
        echo "Version: $VERSION"
        ls -lh "$(Build.ArtifactStagingDirectory)/release/"
        
        echo "##vso[task.setvariable variable=ReleaseTag]v${VERSION}"
        echo "##vso[task.setvariable variable=AzureCliVersion]${VERSION}"
        
      displayName: 'Prepare release files'
    
    - task: GitHubRelease@1
      displayName: 'Delete existing release if present'
      continueOnError: true
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '${{ parameters.GitHubRepo }}'
        action: 'delete'
        tag: '$(ReleaseTag)'
    
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '${{ parameters.GitHubRepo }}'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(ReleaseTag)'
        title: 'Azure CLI $(AzureCliVersion) - macOS (Homebrew Python)'
        releaseNotesSource: 'inline'
        releaseNotesInline: |
          ## Azure CLI $(AzureCliVersion) - macOS (Homebrew Python)
          
          ### Available Architectures
          - **Apple Silicon (arm64)**: azure-cli-$(AzureCliVersion)-macos-arm64-nopython-signed-notarized.tar.gz
          - **Intel (x86_64)**: azure-cli-$(AzureCliVersion)-macos-x86_64-nopython-signed-notarized.tar.gz
          
          ### Requirements
          - macOS 11+ (Big Sur or later)
          - Homebrew Python 3.13
          
          ### Installation via Homebrew Cask
          ```bash
          brew tap ${{ parameters.HomebrewTapRepo }}
          brew install --cask azure-cli
          ```
        assets: '$(Build.ArtifactStagingDirectory)/release/*'
        addChangeLog: false

# ============================================================================
# JOB: UPDATE HOMEBREW CASK (Optional)
# ============================================================================
- ${{ if eq(parameters.UpdateHomebrew, true) }}:
  - job: UpdateHomebrewCask
    displayName: 'Update Homebrew Cask'
    dependsOn:
    - ${{ parameters.dependsOn }}
    - ${{ if eq(parameters.PublishToGitHub, true) }}:
      - CreateGitHubRelease
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: self
      fetchDepth: 1

    - checkout: homebrewtap
      persistCredentials: true
      path: homebrew-tap
    
    - download: current
      artifact: 'cli-signed-notarized-arm64'
      displayName: 'Download signed tarball (ARM64)'
    
    - download: current
      artifact: 'cli-signed-notarized-x86_64'
      displayName: 'Download signed tarball (Intel)'
    
    - bash: |
        set -e
        
        GITHUB_REPO="${{ parameters.GitHubRepo }}"
        
        ARM64_TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-arm64 -name "azure-cli-*.tar.gz" | sort | tail -1)
        X86_64_TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-x86_64 -name "azure-cli-*.tar.gz" | sort | tail -1)
        
        VERSION=$(basename "$ARM64_TARBALL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([a-z0-9]+)?' | head -1)
        
        ARM64_SHA256=$(cat ${ARM64_TARBALL}.sha256 | cut -d' ' -f1)
        X86_64_SHA256=$(cat ${X86_64_TARBALL}.sha256 | cut -d' ' -f1)
        
        echo "=== Updating Homebrew Cask ==="
        echo "Version: $VERSION"
        echo "ARM64 SHA256: $ARM64_SHA256"
        echo "x86_64 SHA256: $X86_64_SHA256"
        
        cd $(Pipeline.Workspace)/homebrew-tap
        
        mkdir -p Casks
        
        REPO_NAME="$(Build.Repository.Name)"
        REPO_DIR="${REPO_NAME##*/}"
        REPO_ROOT=""
        for candidate in \
          "$(Build.SourcesDirectory)/$REPO_DIR" \
          "$(Build.SourcesDirectory)/$REPO_NAME" \
          "$(Build.SourcesDirectory)"; do
          if [ -d "$candidate" ]; then
            REPO_ROOT="$candidate"
            break
          fi
        done

        if [ -z "$REPO_ROOT" ]; then
          echo "ERROR: Unable to resolve repo root"
          exit 1
        fi

        python3 "$REPO_ROOT/scripts/release/macos/cask_generate.py" \
          --version "$VERSION" \
          --arm64-sha "$ARM64_SHA256" \
          --x86-64-sha "$X86_64_SHA256" \
          --github-repo "$GITHUB_REPO" \
          --template "$REPO_ROOT/scripts/release/macos/templates/azure-cli.rb.in" \
          --output "Casks/azure-cli.rb"
        
        git config user.name "Azure Pipeline"
        git config user.email "azure-pipeline@microsoft.com"
        git add Casks/azure-cli.rb
        git commit -m "Update azure-cli to $VERSION" || echo "No changes"
        git push origin HEAD:main
        
        echo "Homebrew cask updated successfully"
        
      displayName: 'Update cask definition'

# ============================================================================
# JOB: PRINT SUMMARY
# ============================================================================
- job: PrintSummary
  displayName: 'Print Summary'
  dependsOn:
  - ${{ parameters.dependsOn }}
  - ${{ if eq(parameters.PublishToGitHub, true) }}:
    - CreateGitHubRelease
  - ${{ if eq(parameters.UpdateHomebrew, true) }}:
    - UpdateHomebrewCask
  condition: always()
  pool:
    vmImage: 'ubuntu-latest'
  
  steps:
  - checkout: none
  
  - bash: |
      echo "╔══════════════════════════════════════════════════════════════════╗"
      echo "║      AZURE CLI MACOS RELEASE SUMMARY                             ║"
      echo "╠══════════════════════════════════════════════════════════════════╣"
      echo "║ Architectures:  ARM64 (Apple Silicon) + x86_64 (Intel)           ║"
      echo "║ GitHub Release: ${{ parameters.PublishToGitHub }}                                           ║"
      echo "║ Homebrew Update: ${{ parameters.UpdateHomebrew }}                                          ║"
      echo "╠══════════════════════════════════════════════════════════════════╣"
      echo "║ ARTIFACTS                                                        ║"
      echo "╠══════════════════════════════════════════════════════════════════╣"
      echo "║ • cli-signed-notarized-arm64                                     ║"
      echo "║ • cli-signed-notarized-x86_64                                    ║"
      echo "╚══════════════════════════════════════════════════════════════════╝"
    displayName: 'Print Summary'
