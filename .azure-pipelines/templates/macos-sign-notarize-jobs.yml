# ============================================================================
# JOB: CREATE FINAL TARBALL (ARM64)
# ============================================================================
- job: CreateFinalTarball_ARM64
  displayName: 'Create Final Tarball (ARM64)'
  dependsOn:
  - DownloadAnalyze_ARM64
  - Notarize_ARM64
  - CreateNotarizeBundle_ARM64
  condition: succeeded()
  pool:
    vmImage: 'macos-15-arm64'
  
  steps:
  - checkout: none
  
  - download: current
    artifact: unsigned-tarball-arm64
    displayName: 'Download unsigned tarball (ARM64)'
  
  - download: current
    artifact: signed-binaries-arm64
    displayName: 'Download signed binaries (ARM64)'
  
  - bash: |
      set -e
      
      ARCH="arm64"
      
      echo "=== Creating Final Signed+Notarized Tarball ($ARCH) ==="
      
      UNSIGNED_TARBALL=$(find $(Pipeline.Workspace)/unsigned-tarball-$ARCH -name "azure-cli-*.tar.gz" | sort | tail -1)
      TARBALL_NAME_ORIG=$(basename "$UNSIGNED_TARBALL")
      VERSION=$(echo "$TARBALL_NAME_ORIG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([a-z0-9]+)?' | head -1)
      
      TARBALL_NAME="azure-cli-${VERSION}-macos-${ARCH}-nopython-signed-notarized.tar.gz"
      OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/final"
      FINAL_DIR="$(Build.ArtifactStagingDirectory)/merged"
      
      mkdir -p "$OUTPUT_DIR" "$FINAL_DIR"
      
      echo "Version: $VERSION"
      
      # Extract unsigned (preserves symlinks)
      tar -xzf "$UNSIGNED_TARBALL" -C "$FINAL_DIR"
      
      # Verify/recreate symlink
      if [ -L "$FINAL_DIR/bin/az" ]; then
        echo "bin/az symlink preserved"
      else
        rm -f "$FINAL_DIR/bin/az"
        ln -s ../libexec/bin/az "$FINAL_DIR/bin/az"
        echo "Recreated symlink: bin/az -> ../libexec/bin/az"
      fi
      
      # Overlay signed binaries
      SIGNED_DIR="$(Pipeline.Workspace)/signed-binaries-$ARCH"
      cd "$SIGNED_DIR"
      find . -type f | while read signed_file; do
        target="$FINAL_DIR/$signed_file"
        if [ -f "$target" ]; then
          cp "$signed_file" "$target"
        fi
      done
      
      # Restore permissions
      find "$FINAL_DIR" -name "*.so" -exec chmod +x {} \;
      find "$FINAL_DIR" -name "*.dylib" -exec chmod +x {} \;
      chmod +x "$FINAL_DIR/libexec/bin/az" 2>/dev/null || true
      
      # Create final tarball
      cd "$FINAL_DIR"
      tar -czf "$OUTPUT_DIR/$TARBALL_NAME" --preserve-permissions .
      
      # Generate SHA256
      cd "$OUTPUT_DIR"
      shasum -a 256 "$TARBALL_NAME" > "$TARBALL_NAME.sha256"
      
      echo "=== Final Artifacts ==="
      ls -lh "$OUTPUT_DIR"
      cat "$TARBALL_NAME.sha256"
      
      echo "##vso[task.setvariable variable=TarballName;isOutput=true]$TARBALL_NAME"
      echo "##vso[task.setvariable variable=AzureCliVersion;isOutput=true]$VERSION"
      
    displayName: 'Create final tar.gz (ARM64)'
    name: CreateStep
  
  - bash: |
      set -e
      
      OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/final"
      TARBALL=$(find "$OUTPUT_DIR" -name "azure-cli-*.tar.gz" | sort | tail -1)
      TEST_DIR=$(mktemp -d)
      
      tar -xzf "$TARBALL" -C "$TEST_DIR"
      
      # Verify signature
      SAMPLE_SO=$(find "$TEST_DIR" -name "*.so" -type f | head -1)
      if [ -n "$SAMPLE_SO" ]; then
        echo "Checking signature: $(basename "$SAMPLE_SO")"
        codesign -dvv "$SAMPLE_SO" 2>&1 | head -10
      fi
      
      # Test CLI
      if brew list python@${{ parameters.PythonVersion }} &>/dev/null; then
        AZ_PYTHON="$(brew --prefix python@${{ parameters.PythonVersion }})/libexec/bin/python3"
        export AZ_PYTHON
        export AZ_DEBUG=1
        "$TEST_DIR/bin/az" version 2>&1 | head -5
        echo "CLI works correctly (ARM64)"
      fi
      
      rm -rf "$TEST_DIR"
      
    displayName: 'Verify final tarball (ARM64)'
  
  - publish: $(Build.ArtifactStagingDirectory)/final
    artifact: 'cli-signed-notarized-arm64'
    displayName: 'Publish final signed+notarized tarball (ARM64)'

