# ============================================================================
# JOB: NOTARIZE WITH APPLE (ARM64) - Windows Agent for ESRP
# ============================================================================
- job: Notarize_ARM64
  displayName: 'Notarize with Apple (ARM64)'
  dependsOn:
  - DownloadAnalyze_ARM64
  - CreateNotarizeBundle_ARM64
  condition: succeeded()
  pool:
    vmImage: 'windows-latest'
  timeoutInMinutes: 60
  
  steps:
  - checkout: none
  
  - download: current
    artifact: notarization-bundle-arm64
    displayName: 'Download notarization bundle (ARM64)'
  
  - pwsh: |
      Write-Host "=== Submitting to Apple for Notarization (ARM64) ==="
      Write-Host "Bundle ID: ${{ parameters.BundleId }}"
      
      $bundleDir = "$(Pipeline.Workspace)/notarization-bundle-arm64"
      $zipFile = Get-ChildItem -Path $bundleDir -Filter "*.zip" | Select-Object -First 1
      
      Write-Host "ZIP file: $($zipFile.Name)"
      Write-Host "Size: $([math]::Round($zipFile.Length / 1MB, 2)) MB"
      
      $toNotarizeDir = "$(Pipeline.Workspace)/toNotarize"
