# Azure CLI - macOS Build Pipeline (Standalone Wrapper)
#
# Purpose: Build lightweight tar.gz artifacts without bundled Python.
# Architecture: This is a thin wrapper that calls the job template.
#               The template is the single source of truth.
#
# Output: cli-build-unsigned-arm64, cli-build-unsigned-x86_64
# Next: Sign/notarize via macos-sign-notarize.yml
#
# Integration: The same template can be called from azure-pipelines.yml

trigger: none

parameters:
  - name: PythonVersion
    displayName: 'Python Version (Homebrew)'
    type: string
    default: '3.13'

resources:
  repositories:
  - repository: selfRepo
    type: github
    endpoint: 'github.com_naga-nandyala'
    name: naga-nandyala/azure-cli-pkg-1
    ref: main

variables:
  - template: templates/variables.yml
  # Disable auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true

name: macos-build-$(Build.BuildId)

# Use jobs from template (single source of truth)
jobs:
- template: templates/macos-build-jobs.yml
  parameters:
    PythonVersion: ${{ parameters.PythonVersion }}

# NOTE: The template includes:
# - BuildMacOSCli_ARM64: Build on macos-15-arm64
# - BuildMacOSCli_x86_64: Build on macos-15
# - VerifyMacOSCli_ARM64: Verify ARM64 tarball
# - VerifyMacOSCli_x86_64: Verify Intel tarball
#
# Artifacts published:
# - cli-build-unsigned-arm64
# - cli-build-unsigned-x86_64