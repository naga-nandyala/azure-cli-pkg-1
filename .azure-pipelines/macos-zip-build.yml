# Azure CLI - macOS ZIP Build Pipeline
# This pipeline builds ZIP archives for direct distribution
# ZIP files can be notarized and stapled (unlike tar.gz)

trigger: none # Manual trigger only

parameters:
  - name: CreateGitHubRelease
    displayName: 'Create GitHub Release with artifacts'
    type: boolean
    default: false
  - name: Prerelease
    displayName: 'Mark as pre-release'
    type: boolean
    default: false
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'

variables:
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: PYTHON_VERSION
    value: '3.12'
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}

name: build-macos-zip-$(Date:yyyyMMdd)-$(Rev:r)

stages:
- stage: BuildZip
  displayName: 'Build macOS ZIP Archives'
  jobs:
  
  # Build ARM64 ZIP on Apple Silicon
  - job: BuildARM64
    displayName: 'Build ZIP (ARM64)'
    pool:
      vmImage: 'macOS-15-arm64'  # Apple Silicon (ARM64)
    
    variables:
      ARCH: 'arm64'
      PLATFORM_TAG: 'macos-arm64'
    
    steps:
    - checkout: self
      clean: true
    
    - task: UsePythonVersion@0
      displayName: 'Set up Python $(PYTHON_VERSION)'
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
        addToPath: true
    
    - bash: |
        # Auto-detect version from azure-cli-core/__init__.py
        VERSION=$(python -c "import re; content = open('src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\'''\"](.+?)['\'''\"]', content); print(m.group(1) if m else 'ERROR')")
        if [ "$VERSION" = "ERROR" ]; then
          echo "❌ Failed to detect version"
          exit 1
        fi
        echo "Auto-detected version from code: $VERSION"
        echo "##vso[task.setvariable variable=CLI_VERSION]$VERSION"
      displayName: 'Auto-detect version from code'
    
    - bash: python -m pip install --upgrade pip setuptools wheel
      displayName: 'Upgrade pip'
    
    - bash: mkdir -p dist/binary_zip
      displayName: 'Create dist directory'
    
    - bash: |
        echo "========================================"
        echo "Building macOS ARM64 ZIP"
        echo "========================================"
        HOST_ARCH=$(uname -m)
        echo "Host: $HOST_ARCH ($([ "$HOST_ARCH" = "arm64" ] && echo "Apple Silicon - native build" || echo "Intel - INCOMPATIBLE"))"
        echo "Python: $(python --version)"
        echo "Version: $(CLI_VERSION)"
        echo "Target: ARM64"
        echo ""
        
        # Build tarball first (reuse existing build script)
        python scripts/release/macos/build_binary_tar_gz.py --platform-tag $(PLATFORM_TAG)
        
        # Convert tarball to ZIP
        cd dist/binary_tar_gz
        TARBALL=$(ls azure-cli-*-$(PLATFORM_TAG).tar.gz 2>/dev/null | head -1)
        
        if [ -z "$TARBALL" ]; then
          echo "❌ Tarball not found"
          exit 1
        fi
        
        echo ""
        echo "Converting tarball to ZIP..."
        
        # Extract tarball
        EXTRACT_DIR="azure-cli-extract"
        mkdir -p "$EXTRACT_DIR"
        tar -xzf "$TARBALL" -C "$EXTRACT_DIR"
        
        # Create ZIP from extracted contents
        ZIP_NAME=$(echo "$TARBALL" | sed 's/\.tar\.gz$/.zip/')
        cd "$EXTRACT_DIR"
        zip -r -q "../$ZIP_NAME" .
        cd ..
        
        # Move ZIP to dist/binary_zip
        mkdir -p ../binary_zip
        mv "$ZIP_NAME" ../binary_zip/
        
        # Generate SHA256 for ZIP
        cd ../binary_zip
        shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"
        
        echo ""
        echo "========================================"
        echo "✅ ARM64 ZIP Build Complete"
        echo "========================================"
        ls -lh *.zip
        echo ""
        echo "SHA256:"
        cat "${ZIP_NAME}.sha256"
      displayName: 'Build ARM64 ZIP'
    
    - bash: |
        echo "=== Verifying ARM64 ZIP ==="
        cd dist/binary_zip
        
        # Find the ZIP file
        ZIP=$(ls azure-cli-*-$(PLATFORM_TAG).zip 2>/dev/null | head -1)
        
        if [ -z "$ZIP" ]; then
          echo "❌ ZIP not found"
          exit 1
        fi
        
        SHA_FILE="${ZIP}.sha256"
        
        echo "  ✅ ZIP: $ZIP ($(du -h "$ZIP" | cut -f1))"
        
        if [ -f "$SHA_FILE" ]; then
          echo "  ✅ SHA256 file exists"
          shasum -a 256 -c "$SHA_FILE"
        else
          echo "❌ SHA256 file missing"
          exit 1
        fi
        
        # Verify ZIP structure
        echo ""
        echo "  ZIP structure:"
        unzip -l "$ZIP" | head -20
        
        echo ""
        echo "  Total files: $(unzip -l "$ZIP" | grep -c '\.py' || echo 0) Python files"
        echo ""
        echo "✅ ARM64 ZIP verified"
      displayName: 'Verify ARM64 ZIP'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Upload ARM64 ZIP artifact'
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist/binary_zip'
        artifact: 'zip-arm64'
        publishLocation: 'pipeline'
  
  # Build x86_64 ZIP on Intel (native build)
  - job: BuildX86_64
    displayName: 'Build ZIP (x86_64)'
    pool:
      vmImage: 'macos-latest'  # Currently Intel - native x86_64 build
    
    variables:
      ARCH: 'x86_64'
      PLATFORM_TAG: 'macos-x86_64'
    
    steps:
    - checkout: self
      clean: true
    
    - task: UsePythonVersion@0
      displayName: 'Set up Python $(PYTHON_VERSION)'
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
        addToPath: true
    
    - bash: |
        # Auto-detect version from azure-cli-core/__init__.py
        VERSION=$(python -c "import re; content = open('src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\'''\"](.+?)['\'''\"]', content); print(m.group(1) if m else 'ERROR')")
        if [ "$VERSION" = "ERROR" ]; then
          echo "❌ Failed to detect version"
          exit 1
        fi
        echo "Auto-detected version from code: $VERSION"
        echo "##vso[task.setvariable variable=CLI_VERSION]$VERSION"
      displayName: 'Auto-detect version from code'
    
    - bash: python -m pip install --upgrade pip setuptools wheel
      displayName: 'Upgrade pip'
    
    - bash: mkdir -p dist/binary_zip
      displayName: 'Create dist directory'
    
    - bash: |
        echo "========================================"
        echo "Building macOS x86_64 ZIP"
        echo "========================================"
        HOST_ARCH=$(uname -m)
        echo "Host: $HOST_ARCH ($([ "$HOST_ARCH" = "x86_64" ] && echo "Intel - native build" || echo "Apple Silicon - using Rosetta"))"
        echo "Python: $(python --version)"
        echo "Version: $(CLI_VERSION)"
        echo "Target: x86_64"
        echo ""
        
        # Build tarball first (reuse existing build script)
        python scripts/release/macos/build_binary_tar_gz.py --platform-tag $(PLATFORM_TAG)
        
        # Convert tarball to ZIP
        cd dist/binary_tar_gz
        TARBALL=$(ls azure-cli-*-$(PLATFORM_TAG).tar.gz 2>/dev/null | head -1)
        
        if [ -z "$TARBALL" ]; then
          echo "❌ Tarball not found"
          exit 1
        fi
        
        echo ""
        echo "Converting tarball to ZIP..."
        
        # Extract tarball
        EXTRACT_DIR="azure-cli-extract"
        mkdir -p "$EXTRACT_DIR"
        tar -xzf "$TARBALL" -C "$EXTRACT_DIR"
        
        # Create ZIP from extracted contents
        ZIP_NAME=$(echo "$TARBALL" | sed 's/\.tar\.gz$/.zip/')
        cd "$EXTRACT_DIR"
        zip -r -q "../$ZIP_NAME" .
        cd ..
        
        # Move ZIP to dist/binary_zip
        mkdir -p ../binary_zip
        mv "$ZIP_NAME" ../binary_zip/
        
        # Generate SHA256 for ZIP
        cd ../binary_zip
        shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"
        
        echo ""
        echo "========================================"
        echo "✅ x86_64 ZIP Build Complete"
        echo "========================================"
        ls -lh *.zip
        echo ""
        echo "SHA256:"
        cat "${ZIP_NAME}.sha256"
      displayName: 'Build x86_64 ZIP'
    
    - bash: |
        echo "=== Verifying x86_64 ZIP ==="
        cd dist/binary_zip
        
        # Find the ZIP file
        ZIP=$(ls azure-cli-*-$(PLATFORM_TAG).zip 2>/dev/null | head -1)
        
        if [ -z "$ZIP" ]; then
          echo "❌ ZIP not found"
          exit 1
        fi
        
        SHA_FILE="${ZIP}.sha256"
        
        echo "  ✅ ZIP: $ZIP ($(du -h "$ZIP" | cut -f1))"
        
        if [ -f "$SHA_FILE" ]; then
          echo "  ✅ SHA256 file exists"
          shasum -a 256 -c "$SHA_FILE"
        else
          echo "❌ SHA256 file missing"
          exit 1
        fi
        
        # Verify ZIP structure
        echo ""
        echo "  ZIP structure:"
        unzip -l "$ZIP" | head -20
        
        echo ""
        echo "  Total files: $(unzip -l "$ZIP" | grep -c '\.py' || echo 0) Python files"
        echo ""
        echo "✅ x86_64 ZIP verified"
      displayName: 'Verify x86_64 ZIP'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Upload x86_64 ZIP artifact'
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist/binary_zip'
        artifact: 'zip-x86_64'
        publishLocation: 'pipeline'

- stage: CreateGitHubRelease
  displayName: 'Create GitHub Release (Unsigned)'
  dependsOn: BuildZip
  condition: and(succeeded(), eq('${{ parameters.CreateGitHubRelease }}', true))
  jobs:
  - job: PublishRelease
    displayName: 'Publish to GitHub Releases'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: self
      clean: true
    
    - task: UsePythonVersion@0
      displayName: 'Set up Python $(PYTHON_VERSION)'
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
        addToPath: true
    
    - bash: |
        # Auto-detect version from azure-cli-core/__init__.py
        VERSION=$(python -c "import re; content = open('src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\'''\"](.+?)['\'''\"]', content); print(m.group(1) if m else 'ERROR')")
        if [ "$VERSION" = "ERROR" ]; then
          echo "❌ Failed to detect version"
          exit 1
        fi
        echo "Auto-detected version: $VERSION"
        echo "##vso[task.setvariable variable=CLI_VERSION]$VERSION"
      displayName: 'Auto-detect version from code'
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARM64 artifact'
      inputs:
        artifact: 'zip-arm64'
        targetPath: '$(Pipeline.Workspace)/zip-arm64'
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download x86_64 artifact'
      inputs:
        artifact: 'zip-x86_64'
        targetPath: '$(Pipeline.Workspace)/zip-x86_64'
    
    - bash: |
        mkdir -p release
        VERSION="$(CLI_VERSION)"
        
        echo "=== Preparing Release Assets ==="
        find $(Pipeline.Workspace)/zip-arm64 -type f
        find $(Pipeline.Workspace)/zip-x86_64 -type f
        
        # Copy ZIPs to release directory
        cp $(Pipeline.Workspace)/zip-arm64/*.zip release/
        cp $(Pipeline.Workspace)/zip-arm64/*.sha256 release/
        cp $(Pipeline.Workspace)/zip-x86_64/*.zip release/
        cp $(Pipeline.Workspace)/zip-x86_64/*.sha256 release/
        
        echo ""
        echo "Release assets:"
        ls -lh release/
      displayName: 'Consolidate release assets'
    
    - pwsh: |
        $version = "$(CLI_VERSION)"
        $releaseTag = "v${version}-zip"
        $prerelease = "${{ parameters.Prerelease }}"
        
        Write-Host "=== Creating GitHub Release ==="
        Write-Host "Version: $version"
        Write-Host "Tag: $releaseTag"
        Write-Host "Prerelease: $prerelease"
        Write-Host ""
        
        # Prepare release notes
        $releaseNotes = @"
        # Azure CLI $version - ZIP Distribution (Unsigned)
        
        **⚠️ Note:** These are unsigned ZIP archives for testing. For production use with notarization, use the signed release pipeline.
        
        ## Downloads
        
        ### ARM64 (Apple Silicon: M1, M2, M3, M4)
        ``````
        https://github.com/$(GitHubRepo)/releases/download/$releaseTag/azure-cli-${version}-macos-arm64.zip
        ``````
        
        ### x86_64 (Intel Macs)
        ``````
        https://github.com/$(GitHubRepo)/releases/download/$releaseTag/azure-cli-${version}-macos-x86_64.zip
        ``````
        
        ## Installation
        
        ``````bash
        # Download
        curl -fsSL -o azure-cli.zip "https://github.com/$(GitHubRepo)/releases/download/$releaseTag/azure-cli-${version}-macos-arm64.zip"
        
        # Verify checksum
        curl -fsSL -o azure-cli.zip.sha256 "https://github.com/$(GitHubRepo)/releases/download/$releaseTag/azure-cli-${version}-macos-arm64.zip.sha256"
        shasum -a 256 -c azure-cli.zip.sha256
        
        # Extract
        mkdir -p ~/.local/azure-cli
        unzip azure-cli.zip -d ~/.local/azure-cli
        
        # Add to PATH
        echo 'export PATH="\$HOME/.local/azure-cli/bin:\$PATH"' >> ~/.zshrc
        source ~/.zshrc
        
        # Verify
        az --version
        ``````
        
        ## Features
        
        - ✅ Self-contained Python 3.13.11 runtime
        - ✅ All Azure CLI modules pre-installed
        - ✅ Binary packages (msal[broker])
        - ✅ No compilation required
        - ⚠️ **Not signed/notarized** - Use signed pipeline for production
        
        ## Build Information
        
        - Build Pipeline: $(Build.DefinitionName)
        - Build ID: $(Build.BuildId)
        - Build Date: $(Build.BuildDate)
        - Python Version: 3.13.11
        "@
        
        # Save release notes
        Set-Content -Path "$(Build.ArtifactStagingDirectory)/release-notes.md" -Value $releaseNotes
        
        Write-Host "Release notes prepared"
      displayName: 'Prepare release notes'
    
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: 'v$(CLI_VERSION)-zip'
        title: 'Azure CLI $(CLI_VERSION) - ZIP (Unsigned)'
        releaseNotesFilePath: '$(Build.ArtifactStagingDirectory)/release-notes.md'
        assets: 'release/*'
        isDraft: false
        isPreRelease: ${{ parameters.Prerelease }}
        addChangeLog: false

- stage: Summary
  displayName: 'Build Summary'
  dependsOn: BuildZip
  condition: always()
  jobs:
  - job: PrintSummary
    displayName: 'Print Build Summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "============================================"
        echo "Azure CLI - macOS ZIP Build Summary"
        echo "============================================"
        echo ""
        echo "✅ Build completed"
        echo ""
        echo "Artifacts produced:"
        echo "  - ARM64 ZIP archive"
        echo "  - x86_64 ZIP archive"
        echo "  - SHA256 checksums"
        echo ""
        echo "Next steps:"
        echo "  1. Run macos-zip-release-signed pipeline for signing & notarization"
        echo "  2. ZIPs will be code-signed and notarized with Apple"
        echo "  3. Notarization ticket will be stapled to ZIPs"
        echo "  4. No Gatekeeper warnings for users!"
        echo ""
        echo "============================================"
      displayName: 'Print summary'
