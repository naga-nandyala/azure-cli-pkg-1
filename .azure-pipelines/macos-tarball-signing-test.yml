# Azure CLI - macOS Tar.gz Signing and Notarization Test Pipeline
# 
# This pipeline demonstrates the difference between:
# 1. Unsigned tar.gz (baseline - will fail with quarantine)
# 2. Signed-only tar.gz (requires right-click approval per binary)
# 3. Signed + Notarized tar.gz (requires internet first run)
#
# Pipeline Flow:
# - Download unsigned tar.gz
# - Sign all binaries with ESRP
# - Create TWO distributions: signed-only and signed+notarized
# - Test all three variants with quarantine to demonstrate behavior

trigger: none

parameters:
  - name: UnsignedTarballUrl
    displayName: 'URL to Unsigned tar.gz'
    type: string
    default: 'https://github.com/naga-nandyala/azure-cli-pkg-1/releases/download/v2.77.0-tarball/azure-cli-2.77.0-macos-arm64.tar.gz'
  
  - name: BundleId
    displayName: 'Bundle ID for notarization'
    type: string
    default: 'com.microsoft.azure.cli'
  
  - name: Architecture
    displayName: 'Architecture (arm64 or x86_64)'
    type: string
    default: 'arm64'
    values:
    - arm64
    - x86_64

variables:
  - group: 'AME ESRP Variable Group'
  
  # Disable auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true

name: tarball-signing-test-$(Build.BuildId)

stages:
# ============================================================================
# STAGE 1: DOWNLOAD AND EXTRACT UNSIGNED TAR.GZ
# ============================================================================
- stage: DownloadUnsignedTarball
  displayName: 'Stage 1: Download Unsigned Tar.gz'
  jobs:
  - job: DownloadAndExtract
    displayName: 'Download and extract unsigned tar.gz'
    pool:
      vmImage: 'macOS-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "Downloading unsigned tar.gz..."
        curl -L -o unsigned.tar.gz "${{ parameters.UnsignedTarballUrl }}"
        
        # Verify download
        ls -lh unsigned.tar.gz
        
        # Detect version from filename or content
        TAR_FILENAME=$(basename "${{ parameters.UnsignedTarballUrl }}")
        VERSION=$(echo "$TAR_FILENAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        
        if [ -z "$VERSION" ]; then
          echo "Could not detect version from filename, using default"
          VERSION="2.77.0"
        fi
        
        echo "Detected version: $VERSION"
        echo "##vso[task.setvariable variable=AzureCliVersion;isOutput=true]$VERSION"
        
        # Extract
        echo "Extracting tar.gz..."
        mkdir -p extracted
        tar -xzf unsigned.tar.gz -C extracted
        
        # Show structure
        echo "Structure:"
        find extracted -type f -name "python*" ! -type l | head -5
        find extracted -name "*.dylib" | head -5
        find extracted -name "*.so" | head -5
        
        # Move to staging
        mkdir -p $(Build.ArtifactStagingDirectory)/unsigned-tarball
        cp unsigned.tar.gz $(Build.ArtifactStagingDirectory)/unsigned-tarball/
        
        # Move extracted contents
        mkdir -p $(Build.ArtifactStagingDirectory)/unsigned-contents
        cp -R extracted/* $(Build.ArtifactStagingDirectory)/unsigned-contents/
        
        echo "Unsigned tar.gz prepared for signing"
      displayName: 'Download and extract unsigned tar.gz'
      name: DetectVersion
    
    - publish: $(Build.ArtifactStagingDirectory)/unsigned-tarball
      artifact: unsigned-tarball
      displayName: 'Publish unsigned tar.gz artifact'
    
    - publish: $(Build.ArtifactStagingDirectory)/unsigned-contents
      artifact: unsigned-contents
      displayName: 'Publish unsigned contents for signing'

# ============================================================================
# STAGE 2: SIGN ALL BINARIES WITH ESRP
# ============================================================================
- stage: SignBinaries
  displayName: 'Stage 2: Sign All Binaries'
  dependsOn: DownloadUnsignedTarball
  condition: succeeded()
  jobs:
  - job: SignWithESRP
    displayName: 'Sign binaries using ESRP (Windows)'
    pool:
      vmImage: 'windows-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-contents
      displayName: 'Download unsigned contents'
    
    - pwsh: |
        Write-Host "Preparing binaries for signing..."
        
        $extractedPath = "$(Pipeline.Workspace)/unsigned-contents"
        $signingRoot = "$(Build.SourcesDirectory)/signing"
        New-Item -ItemType Directory -Force -Path $signingRoot | Out-Null
        
        Write-Host "Finding binaries to sign..."
        
        # Find all executables (binaries without extension)
        $executables = Get-ChildItem -Path $extractedPath -Recurse -File | Where-Object {
            ($_.Extension -eq '') -and 
            ($_.Name -match '^(python|az|pip|chardetect|fab|humanfriendly|inv|invoke|jdiff|jp\.py|normalizer|pkginfo|pygmentize|pygrun|pysemver)') -and
            ($_.Directory.Name -eq 'bin')
        }
        
        # Find all .dylib files
        $dylibs = Get-ChildItem -Path $extractedPath -Recurse -Filter "*.dylib"
        
        # Find all .so files
        $soFiles = Get-ChildItem -Path $extractedPath -Recurse -Filter "*.so"
        
        $allFiles = @()
        $allFiles += $executables
        $allFiles += $dylibs
        $allFiles += $soFiles
        
        Write-Host "Found $($allFiles.Count) files to sign:"
        Write-Host "  Executables: $($executables.Count)"
        Write-Host "  Dylibs: $($dylibs.Count)"
        Write-Host "  SO files: $($soFiles.Count)"
        
        # Copy files to signing directory preserving structure
        $fileList = @()
        foreach ($file in $allFiles) {
            $relativePath = $file.FullName.Substring($extractedPath.Length + 1)
            $destPath = Join-Path $signingRoot $relativePath
            $destDir = Split-Path $destPath -Parent
            
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item -Path $file.FullName -Destination $destPath -Force
            
            $fileList += @{
                SourcePath = $file.FullName
                DestPath = $destPath
                RelativePath = $relativePath
            }
        }
        
        # Save file mapping for later
        $fileList | ConvertTo-Json -Depth 10 | Set-Content "$(Build.SourcesDirectory)/file-mapping.json"
        
        Write-Host "Files prepared for signing in: $signingRoot"
        
        # Create ESRP input JSON
        $esrpFiles = @()
        foreach ($file in $allFiles) {
            $relativePath = $file.FullName.Substring($extractedPath.Length + 1)
            $destPath = Join-Path $signingRoot $relativePath
            
            $esrpFiles += @{
                SourceLocation = $destPath
            }
        }
        
        $esrpInput = @{
            Version = "1.0.0"
            SignBatches = @(
                @{
                    SourceLocationType = "File"
                    SignRequestFiles = $esrpFiles
                }
            )
        }
        
        $esrpInputPath = "$(Build.SourcesDirectory)/esrp-input.json"
        $esrpInput | ConvertTo-Json -Depth 10 | Set-Content $esrpInputPath
        
        Write-Host "ESRP input created with $($esrpFiles.Count) files"
        Write-Host "Contents of esrp-input.json:"
        Get-Content $esrpInputPath
        
      displayName: 'Prepare binaries for ESRP signing'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'Sign binaries with ESRP'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Build.SourcesDirectory)/signing'
        Pattern: |
          **/python3.13
          **/python3
          **/python
          **/*.dylib
          **/*.so
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppDeveloperSign",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "Hardening": "--options=runtime"
              }
            }
          ]
        SessionTimeout: '120'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "Copying signed binaries back to original structure..."
        
        $signingRoot = "$(Build.SourcesDirectory)/signing"
        $signedContents = "$(Build.ArtifactStagingDirectory)/signed-contents"
        $unsignedPath = "$(Pipeline.Workspace)/unsigned-contents"
        
        # Copy entire unsigned structure first
        Write-Host "Copying base structure..."
        Copy-Item -Path "$unsignedPath/*" -Destination $signedContents -Recurse -Force
        
        # Read file mapping
        $fileMapping = Get-Content "$(Build.SourcesDirectory)/file-mapping.json" | ConvertFrom-Json
        
        # Replace with signed versions
        Write-Host "Replacing with signed binaries..."
        foreach ($file in $fileMapping) {
            $signedFile = $file.DestPath
            $targetFile = Join-Path $signedContents $file.RelativePath
            
            if (Test-Path $signedFile) {
                $targetDir = Split-Path $targetFile -Parent
                New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
                
                Copy-Item -Path $signedFile -Destination $targetFile -Force
                Write-Host "Replaced: $($file.RelativePath)"
            } else {
                Write-Warning "Signed file not found: $signedFile"
            }
        }
        
        Write-Host "Signed contents prepared"
        
        # Verify signatures (convert paths for verification)
        Write-Host "`nVerifying signatures on a sample of files..."
        $sampleFiles = Get-ChildItem -Path $signedContents -Recurse -File | 
                       Where-Object { $_.Extension -in @('.dylib', '.so', '') -and $_.Name -match 'python' } | 
                       Select-Object -First 3
        
        foreach ($file in $sampleFiles) {
            Write-Host "`nFile: $($file.Name)"
            Write-Host "Path: $($file.FullName)"
            # We can't verify on Windows, will verify on macOS in next stage
        }
        
      displayName: 'Copy signed binaries to output structure'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-contents
      artifact: signed-contents
      displayName: 'Publish signed contents'

# ============================================================================
# STAGE 3: CREATE SIGNED-ONLY TAR.GZ
# ============================================================================
- stage: CreateSignedTarball
  displayName: 'Stage 3: Create Signed-Only Tar.gz'
  dependsOn:
  - SignBinaries
  - DownloadUnsignedTarball
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadUnsignedTarball.DownloadAndExtract.outputs['DetectVersion.AzureCliVersion'] ]
  jobs:
  - job: CreateSignedTarball
    displayName: 'Create signed tar.gz (macOS)'
    pool:
      vmImage: 'macOS-14'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: signed-contents
      displayName: 'Download signed contents'
    
    - bash: |
        set -e
        
        SIGNED_DIR="$(Pipeline.Workspace)/signed-contents"
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/signed-tarball"
        VERSION="$(AzureCliVersion)"
        ARCH="${{ parameters.Architecture }}"
        
        mkdir -p "$OUTPUT_DIR"
        
        echo "Creating signed-only tar.gz..."
        echo "Version: $VERSION"
        echo "Architecture: $ARCH"
        
        # Verify signatures on signed binaries
        echo ""
        echo "=== Verifying Signatures on Sample Files ==="
        echo ""
        
        # Check Python binary
        if [ -f "$SIGNED_DIR/libexec/bin/python3.13" ]; then
          echo "Python 3.13 signature:"
          codesign -dvv "$SIGNED_DIR/libexec/bin/python3.13" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
          echo ""
        fi
        
        # Check a dylib
        SAMPLE_DYLIB=$(find "$SIGNED_DIR" -name "*.dylib" -type f | head -1)
        if [ -n "$SAMPLE_DYLIB" ]; then
          echo "Sample dylib signature: $(basename $SAMPLE_DYLIB)"
          codesign -dvv "$SAMPLE_DYLIB" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
          echo ""
        fi
        
        # Create tar.gz preserving extended attributes and permissions
        echo "Creating tar.gz with ditto..."
        cd "$SIGNED_DIR"
        
        # Use tar with proper flags to preserve everything
        TARBALL_NAME="azure-cli-${VERSION}-macos-${ARCH}-signed.tar.gz"
        tar -czf "$OUTPUT_DIR/$TARBALL_NAME" \
          --preserve-permissions \
          --no-xattrs \
          .
        
        echo ""
        echo "Created: $TARBALL_NAME"
        ls -lh "$OUTPUT_DIR/$TARBALL_NAME"
        
        # Calculate SHA256
        shasum -a 256 "$OUTPUT_DIR/$TARBALL_NAME" | tee "$OUTPUT_DIR/$TARBALL_NAME.sha256"
        
        # Test extraction
        echo ""
        echo "Testing extraction..."
        TEST_DIR=$(mktemp -d)
        tar -xzf "$OUTPUT_DIR/$TARBALL_NAME" -C "$TEST_DIR"
        
        # Verify signature preserved
        echo "Verifying signature preserved after extraction:"
        if [ -f "$TEST_DIR/libexec/bin/python3.13" ]; then
          codesign -v "$TEST_DIR/libexec/bin/python3.13" && echo "✅ Signature valid" || echo "❌ Signature invalid"
        fi
        
        rm -rf "$TEST_DIR"
        
        echo ""
        echo "Signed-only tar.gz created successfully!"
        
      displayName: 'Create signed tar.gz'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-tarball
      artifact: signed-tarball
      displayName: 'Publish signed-only tar.gz'

# ============================================================================
# STAGE 4: NOTARIZE WITH APPLE (ESRP)
# ============================================================================
- stage: NotarizeTarball
  displayName: 'Stage 4: Notarize Tar.gz with Apple'
  dependsOn:
  - CreateSignedTarball
  - DownloadUnsignedTarball
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadUnsignedTarball.DownloadAndExtract.outputs['DetectVersion.AzureCliVersion'] ]
  jobs:
  - job: NotarizeWithESRP
    displayName: 'Submit to Apple notarization via ESRP (Windows)'
    pool:
      vmImage: 'windows-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: signed-tarball
      displayName: 'Download signed tar.gz'
    
    - pwsh: |
        Write-Host "Preparing for notarization..."
        
        $tarballPath = Get-ChildItem -Path "$(Pipeline.Workspace)/signed-tarball" -Filter "*.tar.gz" | Select-Object -First 1
        Write-Host "Tar.gz to notarize: $($tarballPath.Name)"
        
        # ESRP requires .zip for notarization, so wrap tar.gz in zip
        $zipPath = "$(Build.SourcesDirectory)/azure-cli-notarize.zip"
        Compress-Archive -Path $tarballPath.FullName -DestinationPath $zipPath -Force
        
        Write-Host "Created wrapper zip for ESRP: azure-cli-notarize.zip"
        
        # Create notarization config
        $notarizeConfig = @{
          Version = "1.0.0"
          Bundles = @(
            @{
              BundleId = "${{ parameters.BundleId }}"
              BundlePath = $zipPath
            }
          )
        }
        
        $configPath = "$(Build.SourcesDirectory)/notarize-config.json"
        $notarizeConfig | ConvertTo-Json -Depth 10 | Set-Content $configPath
        
        Write-Host "Notarization config created"
        
      displayName: 'Prepare for notarization'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'Notarize with Apple via ESRP'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Build.SourcesDirectory)'
        Pattern: 'azure-cli-notarize.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppNotarize",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "BundleId": "${{ parameters.BundleId }}"
              }
            }
          ]
        SessionTimeout: '60'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "Notarization complete!"
        
        # Extract notarized tar.gz from wrapper zip
        $wrapperZip = "$(Build.SourcesDirectory)/azure-cli-notarize.zip"
        $extractPath = "$(Build.SourcesDirectory)/notarized-extract"
        
        Expand-Archive -Path $wrapperZip -DestinationPath $extractPath -Force
        
        # Find the tar.gz
        $notarizedTarball = Get-ChildItem -Path $extractPath -Filter "*.tar.gz" -Recurse | Select-Object -First 1
        
        if ($notarizedTarball) {
            Write-Host "Found notarized tar.gz: $($notarizedTarball.Name)"
            
            # Rename to indicate it's notarized
            $newName = $notarizedTarball.Name -replace '-signed\.tar\.gz$', '-signed-notarized.tar.gz'
            $outputPath = "$(Build.ArtifactStagingDirectory)/signed-notarized-tarball"
            New-Item -ItemType Directory -Force -Path $outputPath | Out-Null
            
            Copy-Item -Path $notarizedTarball.FullName -Destination "$outputPath/$newName" -Force
            
            Write-Host "Notarized tar.gz saved as: $newName"
            Get-ChildItem "$outputPath" | Format-Table Name, Length
        } else {
            Write-Error "Could not find notarized tar.gz in wrapper"
            exit 1
        }
        
      displayName: 'Extract notarized tar.gz'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-notarized-tarball
      artifact: signed-notarized-tarball
      displayName: 'Publish signed+notarized tar.gz'

# ============================================================================
# STAGE 5: TEST ALL THREE VARIANTS
# ============================================================================
- stage: TestAllVariants
  displayName: 'Stage 5: Test All Variants'
  dependsOn:
  - DownloadUnsignedTarball
  - CreateSignedTarball
  - NotarizeTarball
  condition: succeeded()
  jobs:
  - job: TestUnsigned
    displayName: 'Test 1: Unsigned tar.gz (should fail with quarantine)'
    pool:
      vmImage: 'macOS-14'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-tarball
    
    - bash: |
        set -e
        
        echo "=========================================="
        echo "TEST 1: UNSIGNED TAR.GZ WITH QUARANTINE"
        echo "=========================================="
        echo ""
        
        TARBALL=$(find "$(Pipeline.Workspace)/unsigned-tarball" -name "*.tar.gz" | head -1)
        echo "Testing: $(basename $TARBALL)"
        
        # Add quarantine to simulate browser download
        xattr -w com.apple.quarantine "0083;$(date +%s);Safari;|com.apple.Safari" "$TARBALL"
        
        echo "Quarantine attributes on tar.gz:"
        xattr "$TARBALL"
        echo ""
        
        # Extract
        TEST_DIR=$(mktemp -d)
        tar -xzf "$TARBALL" -C "$TEST_DIR"
        
        echo "Quarantine on extracted Python:"
        xattr "$TEST_DIR/libexec/bin/python3.13" || echo "(no attributes)"
        echo ""
        
        echo "Signature check:"
        codesign -dvv "$TEST_DIR/libexec/bin/python3.13" 2>&1 | grep -E "Signature|Authority|TeamIdentifier" || echo "No valid signature"
        echo ""
        
        echo "Attempting to execute (EXPECTED TO FAIL):"
        set +e  # Allow failure
        "$TEST_DIR/libexec/bin/python3.13" --version 2>&1
        EXIT_CODE=$?
        set -e
        
        echo ""
        if [ $EXIT_CODE -eq 137 ] || [ $EXIT_CODE -ne 0 ]; then
          echo "✅ TEST PASSED: Unsigned binary was blocked by Gatekeeper (exit code: $EXIT_CODE)"
          echo "   This is the expected behavior for unsigned code with quarantine."
        else
          echo "⚠️  TEST UNEXPECTED: Binary executed (exit code: $EXIT_CODE)"
          echo "   Quarantine may not have been applied properly."
        fi
        
        echo ""
        echo "After removing quarantine:"
        xattr -cr "$TEST_DIR"
        "$TEST_DIR/libexec/bin/python3.13" --version && echo "✅ Works without quarantine"
        
        rm -rf "$TEST_DIR"
        
      displayName: 'Test unsigned with quarantine'
      continueOnError: true
  
  - job: TestSignedOnly
    displayName: 'Test 2: Signed-only tar.gz (requires manual approval)'
    pool:
      vmImage: 'macOS-14'
    dependsOn: []
    
    steps:
    - checkout: none
    
    - download: current
      artifact: signed-tarball
    
    - bash: |
        set -e
        
        echo "=========================================="
        echo "TEST 2: SIGNED-ONLY TAR.GZ WITH QUARANTINE"
        echo "=========================================="
        echo ""
        
        TARBALL=$(find "$(Pipeline.Workspace)/signed-tarball" -name "*-signed.tar.gz" | head -1)
        echo "Testing: $(basename $TARBALL)"
        
        # Add quarantine
        xattr -w com.apple.quarantine "0083;$(date +%s);Safari;|com.apple.Safari" "$TARBALL"
        
        echo "Quarantine on tar.gz:"
        xattr "$TARBALL"
        echo ""
        
        # Extract
        TEST_DIR=$(mktemp -d)
        tar -xzf "$TARBALL" -C "$TEST_DIR"
        
        echo "Quarantine on extracted Python:"
        xattr "$TEST_DIR/libexec/bin/python3.13"
        echo ""
        
        echo "Signature verification:"
        codesign -dvv "$TEST_DIR/libexec/bin/python3.13" 2>&1 | grep -E "Signature|Authority|TeamIdentifier"
        codesign -v "$TEST_DIR/libexec/bin/python3.13" && echo "✅ Signature is valid"
        echo ""
        
        echo "Attempting to execute (MAY FAIL without notarization):"
        set +e
        timeout 5 "$TEST_DIR/libexec/bin/python3.13" --version 2>&1
        EXIT_CODE=$?
        set -e
        
        echo ""
        if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 137 ]; then
          echo "⚠️  Binary was blocked or prompted for approval"
          echo "   With signed-only (no notarization), macOS shows warning dialog."
          echo "   User must right-click → Open to approve each binary."
          echo "   Exit code: $EXIT_CODE"
        elif [ $EXIT_CODE -eq 0 ]; then
          echo "✅ Binary executed successfully"
          echo "   System may have cached approval or notarization ticket exists."
        else
          echo "❌ Unexpected exit code: $EXIT_CODE"
        fi
        
        echo ""
        echo "Testing with quarantine removed:"
        xattr -cr "$TEST_DIR"
        "$TEST_DIR/libexec/bin/python3.13" --version && echo "✅ Works without quarantine"
        
        # Test the az wrapper
        echo ""
        echo "Testing az command:"
        xattr -cr "$TEST_DIR"
        "$TEST_DIR/bin/az" --version 2>&1 | head -5 && echo "✅ Azure CLI works"
        
        rm -rf "$TEST_DIR"
        
      displayName: 'Test signed-only with quarantine'
      continueOnError: true
  
  - job: TestSignedNotarized
    displayName: 'Test 3: Signed+Notarized tar.gz (best experience)'
    pool:
      vmImage: 'macOS-14'
    dependsOn: []
    
    steps:
    - checkout: none
    
    - download: current
      artifact: signed-notarized-tarball
    
    - bash: |
        set -e
        
        echo "=========================================="
        echo "TEST 3: SIGNED + NOTARIZED TAR.GZ"
        echo "=========================================="
        echo ""
        
        TARBALL=$(find "$(Pipeline.Workspace)/signed-notarized-tarball" -name "*-notarized.tar.gz" | head -1)
        echo "Testing: $(basename $TARBALL)"
        
        # Add quarantine
        xattr -w com.apple.quarantine "0083;$(date +%s);Safari;|com.apple.Safari" "$TARBALL"
        
        echo "Quarantine on tar.gz:"
        xattr "$TARBALL"
        echo ""
        
        # Extract
        TEST_DIR=$(mktemp -d)
        tar -xzf "$TARBALL" -C "$TEST_DIR"
        
        echo "Quarantine on extracted Python:"
        xattr "$TEST_DIR/libexec/bin/python3.13"
        echo ""
        
        echo "Signature verification:"
        codesign -dvv "$TEST_DIR/libexec/bin/python3.13" 2>&1 | grep -E "Signature|Authority|TeamIdentifier"
        codesign -v "$TEST_DIR/libexec/bin/python3.13" && echo "✅ Signature is valid"
        echo ""
        
        echo "Checking notarization status (requires internet):"
        spctl --assess --verbose --type execute "$TEST_DIR/libexec/bin/python3.13" 2>&1 || true
        echo ""
        
        echo "Attempting to execute (should work with internet):"
        "$TEST_DIR/libexec/bin/python3.13" --version && echo "✅ Executed successfully!"
        
        echo ""
        echo "Testing az command:"
        "$TEST_DIR/bin/az" --version 2>&1 | head -5 && echo "✅ Azure CLI works!"
        
        echo ""
        echo "=========================================="
        echo "SUMMARY FOR SIGNED + NOTARIZED:"
        echo "=========================================="
        echo "✅ Valid code signature"
        echo "✅ Notarized by Apple"
        echo "✅ Works with quarantine (requires internet first run)"
        echo "✅ Best user experience"
        echo ""
        
        rm -rf "$TEST_DIR"
        
      displayName: 'Test signed+notarized with quarantine'
      continueOnError: true

# ============================================================================
# STAGE 6: COMPARISON SUMMARY
# ============================================================================
- stage: ComparisonSummary
  displayName: 'Stage 6: Test Results Summary'
  dependsOn:
  - DownloadUnsignedTarball
  - TestAllVariants
  condition: always()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadUnsignedTarball.DownloadAndExtract.outputs['DetectVersion.AzureCliVersion'] ]
  jobs:
  - job: PrintSummary
    displayName: 'Print comparison summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - bash: |
        cat << 'EOF'
        
        ================================================================================
                            MACOS TAR.GZ SIGNING COMPARISON
        ================================================================================
        
        Version: $(AzureCliVersion)
        
        This pipeline created and tested THREE variants:
        
        ┌────────────────────────────────────────────────────────────────────────────┐
        │ 1. UNSIGNED TAR.GZ                                                         │
        ├────────────────────────────────────────────────────────────────────────────┤
        │ ❌ Result: BLOCKED by Gatekeeper (exit code 137 - killed)                  │
        │ 📦 Status: No code signature                                               │
        │ 🌐 Internet: N/A (doesn't run)                                            │
        │ 👤 User Action: Must use xattr -cr to remove quarantine                   │
        │ ✅ Works: Only via Homebrew (strips quarantine) or without quarantine     │
        └────────────────────────────────────────────────────────────────────────────┘
        
        ┌────────────────────────────────────────────────────────────────────────────┐
        │ 2. SIGNED-ONLY TAR.GZ                                                      │
        ├────────────────────────────────────────────────────────────────────────────┤
        │ ⚠️  Result: Shows warning dialog per binary                                │
        │ 📦 Status: Valid Developer ID signature                                    │
        │ 🌐 Internet: NOT required (signature verified locally)                    │
        │ 👤 User Action: Must right-click → Open for EACH binary/library           │
        │ ⚠️  Experience: Tedious for many files (~50+ approvals needed)            │
        │ ✅ Advantage: Works offline completely                                     │
        └────────────────────────────────────────────────────────────────────────────┘
        
        ┌────────────────────────────────────────────────────────────────────────────┐
        │ 3. SIGNED + NOTARIZED TAR.GZ (RECOMMENDED)                                 │
        ├────────────────────────────────────────────────────────────────────────────┤
        │ ✅ Result: Works automatically on first run                                │
        │ 📦 Status: Valid signature + Apple notarization ticket                     │
        │ 🌐 Internet: REQUIRED on first run only (ticket verification)             │
        │ 👤 User Action: None - works out of the box                               │
        │ ✅ Experience: Best - no warnings or approvals needed                      │
        │ ⚠️  Limitation: Cannot staple ticket (tar.gz doesn't support it)          │
        │ 💾 Cache: After first run, ticket cached for offline use                  │
        └────────────────────────────────────────────────────────────────────────────┘
        
        ================================================================================
                                    RECOMMENDATIONS
        ================================================================================
        
        FOR PUBLIC DISTRIBUTION:
          ✅ Use: Signed + Notarized tar.gz
          ✅ Alternative: .pkg installer (can staple - works fully offline)
        
        FOR HOMEBREW-ONLY:
          ✅ Use: Even unsigned works (Homebrew strips quarantine)
          ✅ Recommended: Still use signed for consistency
        
        FOR INTERNAL/DEVELOPER USE:
          ✅ Use: Signed-only is acceptable
          ✅ Benefit: Works offline, no internet dependency
        
        ================================================================================
                                    ARTIFACTS PUBLISHED
        ================================================================================
        
        1. unsigned-tarball          - Original unsigned tar.gz
        2. signed-tarball            - Signed-only tar.gz (no notarization)
        3. signed-notarized-tarball  - Signed + Notarized tar.gz (recommended)
        
        Download and compare these artifacts to see the differences!
        
        ================================================================================
        
        EOF
      displayName: 'Print summary'
