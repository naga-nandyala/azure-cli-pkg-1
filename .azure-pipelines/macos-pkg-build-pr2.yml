      displayName: 'Verify .pkg creation'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Upload PKG artifacts (x86_64)'
      inputs:
        targetPath: 'dist/macos_pkg_pr2'
        artifact: 'pkg-installer-macos-x86_64'
        publishLocation: 'pipeline'

# Optional: Create GitHub Release with both PKG files
- stage: GitHubRelease
  displayName: 'Create GitHub Release (Optional)'
  condition: and(succeeded(), eq(variables['CreateGitHubRelease'], 'true'))
  dependsOn: BuildPkg
  jobs:
  - job: CreateRelease
    displayName: 'Create GitHub Release'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - task: DownloadBuildArtifacts@0
      displayName: 'Download ARM64 PKG'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'macos-pkg-arm64-pr2'
        downloadPath: '$(System.ArtifactsDirectory)'
    
    - task: DownloadBuildArtifacts@0
      displayName: 'Download x86_64 PKG'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'macos-pkg-x86_64-pr2'
        downloadPath: '$(System.ArtifactsDirectory)'
    
    - bash: |
        echo "========================================"
        echo "Downloaded artifacts:"
        find "$(System.ArtifactsDirectory)" -type f
        echo "========================================"
      displayName: 'List downloaded artifacts'
    
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: 'v$(Version)-pr2'
        title: 'Azure CLI $(Version) (PR2 - Versioned Installation)'
        releaseNotesSource: 'inline'
        releaseNotesInline: |
          # Azure CLI $(Version) - PR2 (Versioned Installation)
          
          **This is a parallel release with Homebrew-style versioned installation support.**
          
          ## What's New in PR2
          
          - ✅ **Versioned Installation Paths**: `/usr/local/microsoft/azure-cli/$(Version)/`
          - ✅ **Active Version Symlink**: `current` symlink points to active version
          - ✅ **Side-by-Side Versions**: Multiple versions can coexist
          - ✅ **Upgrade Management**: Automatic version switching during upgrades
          - ✅ **Cleanup Utility**: Remove old versions when needed
          
          ## Installation
          
          ### Homebrew Cask (Recommended)
          ```bash
          brew install --cask azure-cli-pr2
          ```
          
          ### Direct PKG Installation
          Download the appropriate PKG for your architecture:
          - **Apple Silicon (M1/M2/M3)**: `azure-cli-$(Version)-pr2-macos-arm64.pkg`
          - **Intel**: `azure-cli-$(Version)-pr2-macos-x86_64.pkg`
          
          Double-click to install or use:
          ```bash
          sudo installer -pkg azure-cli-$(Version)-pr2-macos-arm64.pkg -target /
          ```
          
          ## Verification
          ```bash
          az version
          ```
          
          ## Installation Structure
          ```
          /usr/local/microsoft/azure-cli/
          ├── $(Version)/           # This version
          ├── current -> $(Version)/ # Symlink to active version
          /usr/local/bin/
          └── az                    # Launcher script
          ```
          
          ## Upgrading
          The installer automatically:
          - Installs new version to `/usr/local/microsoft/azure-cli/$(Version)/`
          - Updates `current` symlink to point to new version
          - Preserves old versions for rollback
          
          ## Removing Old Versions
          ```bash
          # List installed versions
          ls -l /usr/local/microsoft/azure-cli/
          
          # Remove specific version
          sudo rm -rf /usr/local/microsoft/azure-cli/2.80.0
          ```
          
          ---
          
          **Note**: This is an experimental parallel release. For production use, please use the standard Azure CLI release.
        assets: |
          $(System.ArtifactsDirectory)/macos-pkg-arm64-pr2/*.pkg
          $(System.ArtifactsDirectory)/macos-pkg-arm64-pr2/*.sha256
          $(System.ArtifactsDirectory)/macos-pkg-x86_64-pr2/*.pkg
          $(System.ArtifactsDirectory)/macos-pkg-x86_64-pr2/*.sha256
        isDraft: ${{ parameters.Prerelease }}
        isPreRelease: ${{ parameters.Prerelease }}
        addChangeLog: false
