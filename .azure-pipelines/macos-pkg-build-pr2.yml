# Azure CLI - macOS PKG Build Pipeline (PR2 - Versioned Installation)
# This parallel pipeline implements Homebrew-style versioned installations
# Using Cask name: azure-cli-pr2
# Installation path: /usr/local/microsoft/azure-cli/{version}/
# Active version managed via 'current' symlink
#
# Key differences from original pipeline:
# - Uses versioned installation paths (/usr/local/microsoft/azure-cli/2.81.0/)
# - Includes pre/post install scripts for version management
# - Creates 'current' symlink for active version
# - Launcher script uses 'current' symlink
# - Supports side-by-side installation of multiple versions

trigger: none # Manual trigger only

parameters:
  - name: Version
    displayName: 'Azure CLI Version (e.g., 2.81.0)'
    type: string
    default: '3.0.0'
  - name: CreateGitHubRelease
    displayName: 'Create GitHub Release with artifacts'
    type: boolean
    default: false
  - name: Prerelease
    displayName: 'Mark as pre-release'
    type: boolean
    default: false
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  - name: VersionedInstall
    displayName: 'Use versioned installation paths (PR2 mode)'
    type: boolean
    default: true

variables:
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: PYTHON_VERSION
    value: '3.12'
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: Version
    value: ${{ parameters.Version }}
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  - name: VersionedInstall
    value: ${{ parameters.VersionedInstall }}
  # Variable groups (optional - only needed for GitHub releases)
  # Uncomment the line below after creating the variable group in Azure DevOps Library
  # - group: github-integration  # Contains GITHUB_PAT for GitHub releases

name: build-macos-pkg-pr2-$(Date:yyyyMMdd)-$(Rev:r)

stages:
- stage: BuildPkg
  displayName: 'Build macOS PKG Installers (PR2 - Versioned)'
  jobs:
  
  # Build ARM64 PKG
  - job: BuildPkgARM64
    displayName: 'Build PKG (macOS ARM64) - Versioned'
    pool:
      vmImage: 'macos-14'  # Apple Silicon
    
    variables:
      PLATFORM_TAG: 'macos-arm64'
      ARCH: 'arm64'
    
    steps:
    - checkout: self
      clean: true
    
    - task: UsePythonVersion@0
      displayName: 'Set up Python $(PYTHON_VERSION)'
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
        addToPath: true
    
    - bash: |
        if [ -n "$(Version)" ]; then
          echo "VERSION=$(Version)" >> $AZURE_PIPELINES_ENV
          echo "Using provided version: $(Version)"
        else
          # Extract version from azure-cli-core/__init__.py
          VERSION=$(python -c "import re; content = open('src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\''\"'](.+?)['\''\"']', content); print(m.group(1) if m else 'ERROR')")
          if [ "$VERSION" = "ERROR" ]; then
            echo "❌ Failed to detect version from azure-cli-core"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $AZURE_PIPELINES_ENV
          echo "Using version from azure-cli-core: $VERSION"
        fi
      displayName: 'Set VERSION environment variable'
      name: SetVersion
    
    - bash: |
        # Check if pkgbuild is available
        if ! command -v pkgbuild >/dev/null 2>&1; then
          echo "Installing Xcode Command Line Tools..."
          xcode-select --install || true
          # Wait for installation to complete
          until command -v pkgbuild >/dev/null 2>&1; do
            echo "Waiting for pkgbuild..."
            sleep 10
          done
        fi
        echo "pkgbuild found: $(which pkgbuild)"
        echo "productbuild found: $(which productbuild)"
        pkgbuild 2>&1 | head -5 || true
      displayName: 'Install Xcode Command Line Tools (if needed)'
    
    - bash: python -m pip install --upgrade pip setuptools wheel
      displayName: 'Upgrade pip'
    
    - bash: mkdir -p dist/macos_pkg_pr2
      displayName: 'Create dist directory'
    
    - bash: |
        echo "=== Build Environment Check ==="
        pwd
        ls -la scripts/release/macos/
        python --version
        uname -m
        
        echo "=== Azure CLI Version Check ==="
        if [ -n "$(Version)" ]; then
          echo "Using provided version: $(Version)"
          CLI_VERSION="$(Version)"
        else
          echo "Attempting to detect version from azure-cli-core..."
          CLI_VERSION=$(python -c "import re; content = open('src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\''\"'](.+?)['\''\"']', content); print(m.group(1) if m else 'ERROR')")
          echo "Detected version: $CLI_VERSION"
        fi
        echo "##vso[task.setvariable variable=CLI_VERSION]$CLI_VERSION"
        
        echo "=== Build Tools Check ==="
        which pkgbuild || (echo "❌ pkgbuild not found"; exit 1)
        which productbuild || (echo "❌ productbuild not found"; exit 1)
        
        echo "=== Starting PKG Build (PR2 - Versioned) ==="
        echo "Building Azure CLI PKG installer for $(PLATFORM_TAG)"
        echo "Using productbuild (enhanced distribution package with versioned installation)"
        
        # Run the build script
        python scripts/release/macos/build_pkg_installer_pr2.py \
          --platform-tag $(PLATFORM_TAG)
      displayName: 'Build PKG installer'
    
    - bash: |
        echo "=== Post-Build Diagnostics ==="
        echo "Checking dist/macos_pkg_pr2 directory:"
        ls -la dist/macos_pkg_pr2/
        
        echo "Finding all PKG files:"
        find dist/ -name "*.pkg" -exec ls -lh {} \;
      displayName: 'Debug PKG contents'
    
    - bash: |
        cd dist/macos_pkg_pr2
        
        # Get version
        if [ -n "$(Version)" ]; then
          VERSION="$(Version)"
        else
          VERSION=$(python -c "import re; content = open('../../src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\''\"'](.+?)['\''\"']', content); print(m.group(1) if m else 'ERROR')")
        fi
        
        PKG_FILE="azure-cli-${VERSION}-$(PLATFORM_TAG).pkg"
        SHA_FILE="${PKG_FILE}.sha256"
        
        echo "=== PKG Build Verification ==="
        echo "Looking for: $PKG_FILE"
        echo "Available files:"
        ls -la
        
        if [ -f "$PKG_FILE" ]; then
          echo "✅ PKG file created: $PKG_FILE"
          echo "📦 Size: $(du -h "$PKG_FILE" | cut -f1)"
        else
          echo "❌ PKG file missing: $PKG_FILE"
          echo "Let's check what files were actually created:"
          find . -name "*.pkg" -o -name "*.sha256"
          exit 1
        fi
        
        if [ -f "$SHA_FILE" ]; then
          echo "✅ SHA256 file created: $SHA_FILE"
          echo "🔍 Checksum: $(cat "$SHA_FILE")"
        else
          echo "❌ SHA256 file missing: $SHA_FILE"
          exit 1
        fi
      displayName: 'Verify .pkg creation'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Upload PKG artifacts (ARM64)'
      inputs:
        targetPath: 'dist/macos_pkg_pr2'
        artifact: 'pkg-installer-macos-arm64'
        publishLocation: 'pipeline'
  
  # Build x86_64 PKG
  - job: BuildPkgx86_64
    displayName: 'Build PKG (macOS x86_64) - Versioned'
    pool:
      vmImage: 'macos-13'  # Intel
    
    variables:
      PLATFORM_TAG: 'macos-x86_64'
      ARCH: 'x86_64'
    
    steps:
    - checkout: self
      clean: true
    
    - task: UsePythonVersion@0
      displayName: 'Set up Python $(PYTHON_VERSION)'
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
        addToPath: true
    
    - bash: |
        if [ -n "$(Version)" ]; then
          echo "VERSION=$(Version)" >> $AZURE_PIPELINES_ENV
          echo "Using provided version: $(Version)"
        else
          # Extract version from azure-cli-core/__init__.py
          VERSION=$(python -c "import re; content = open('src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\''\"'](.+?)['\''\"']', content); print(m.group(1) if m else 'ERROR')")
          if [ "$VERSION" = "ERROR" ]; then
            echo "❌ Failed to detect version from azure-cli-core"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $AZURE_PIPELINES_ENV
          echo "Using version from azure-cli-core: $VERSION"
        fi
      displayName: 'Set VERSION environment variable'
      name: SetVersion
    
    - bash: |
        # Check if pkgbuild is available
        if ! command -v pkgbuild >/dev/null 2>&1; then
          echo "Installing Xcode Command Line Tools..."
          xcode-select --install || true
          # Wait for installation to complete
          until command -v pkgbuild >/dev/null 2>&1; do
            echo "Waiting for pkgbuild..."
            sleep 10
          done
        fi
        echo "pkgbuild found: $(which pkgbuild)"
        echo "productbuild found: $(which productbuild)"
        pkgbuild 2>&1 | head -5 || true
      displayName: 'Install Xcode Command Line Tools (if needed)'
    
    - bash: python -m pip install --upgrade pip setuptools wheel
      displayName: 'Upgrade pip'
    
    - bash: mkdir -p dist/macos_pkg_pr2
      displayName: 'Create dist directory'
    
    - bash: |
        echo "=== Build Environment Check ==="
        pwd
        ls -la scripts/release/macos/
        python --version
        uname -m
        
        echo "=== Azure CLI Version Check ==="
        if [ -n "$(Version)" ]; then
          echo "Using provided version: $(Version)"
          CLI_VERSION="$(Version)"
        else
          echo "Attempting to detect version from azure-cli-core..."
          CLI_VERSION=$(python -c "import re; content = open('src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\''\"'](.+?)['\''\"']', content); print(m.group(1) if m else 'ERROR')")
          echo "Detected version: $CLI_VERSION"
        fi
        echo "##vso[task.setvariable variable=CLI_VERSION]$CLI_VERSION"
        
        echo "=== Build Tools Check ==="
        which pkgbuild || (echo "❌ pkgbuild not found"; exit 1)
        which productbuild || (echo "❌ productbuild not found"; exit 1)
        
        echo "=== Starting PKG Build (PR2 - Versioned) ==="
        echo "Building Azure CLI PKG installer for $(PLATFORM_TAG)"
        echo "Using productbuild (enhanced distribution package with versioned installation)"
        
        # Run the build script
        python scripts/release/macos/build_pkg_installer_pr2.py \
          --platform-tag $(PLATFORM_TAG)
      displayName: 'Build PKG installer'
    
    - bash: |
        echo "=== Post-Build Diagnostics ==="
        echo "Checking dist/macos_pkg_pr2 directory:"
        ls -la dist/macos_pkg_pr2/
        
        echo "Finding all PKG files:"
        find dist/ -name "*.pkg" -exec ls -lh {} \;
      displayName: 'Debug PKG contents'
    
    - bash: |
        cd dist/macos_pkg_pr2
        
        # Get version
        if [ -n "$(Version)" ]; then
          VERSION="$(Version)"
        else
          VERSION=$(python -c "import re; content = open('../../src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\''\"'](.+?)['\''\"']', content); print(m.group(1) if m else 'ERROR')")
        fi
        
        PKG_FILE="azure-cli-${VERSION}-$(PLATFORM_TAG).pkg"
        SHA_FILE="${PKG_FILE}.sha256"
        
        echo "=== PKG Build Verification ==="
        echo "Looking for: $PKG_FILE"
        echo "Available files:"
        ls -la
        
        if [ -f "$PKG_FILE" ]; then
