          echo "📦 Size: $(du -h "$PKG_FILE" | cut -f1)"
        else
          echo "❌ PKG file missing: $PKG_FILE"
          echo "Let's check what files were actually created:"
          find . -name "*.pkg" -o -name "*.sha256"
