# Azure CLI - Complete macOS PKG Release Pipeline (PR2 - Versioned Installation)
# This is a parallel pipeline that implements Homebrew-style versioned installations
# Using Cask name: azure-cli-pr2
# Installation path: /usr/local/microsoft/azure-cli/{version}/
# Active version managed via 'current' symlink
#
# Pipeline stages:
# 1. Download and sign all binaries + PKG with ESRP
# 2. Notarize with Apple via ESRP
# 3. Staple notarization ticket
# 4. Verify signatures and notarization
# 5. Publish to GitHub Release
# 6. Update Homebrew cask (azure-cli-pr2)
# 7. Test Homebrew Cask installation
#
# Key differences from original pipeline:
# - Uses Cask only (no Formula)
# - Implements versioned installation paths
# - Includes pre/post install scripts for version management
# - Tests upgrade scenarios with version preservation

trigger: none # Manual trigger only

parameters:
  - name: UnsignedBuildId
    displayName: 'Unsigned Build ID (from naga_macos_build)'
    type: string
    default: '282071'
  - name: AzureCliVersion
    displayName: 'Azure CLI Version (e.g., 2.0.0)'
    type: string
    default: '3.0.0'
  - name: BundleId
    displayName: 'Bundle ID for signing/notarization'
    type: string
    default: 'com.microsoft.azure.cli'
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'
  - name: CaskName
    displayName: 'Homebrew Cask Name'
    type: string
    default: 'azure-cli-pr2'
  - name: IsPreRelease
    displayName: 'Mark GitHub release as Pre-release'
    type: boolean
    default: false
  - name: IsDraft
    displayName: 'Create GitHub release as Draft'
    type: boolean
    default: false

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: github.com_naga-nandyala
    name: naga-nandyala/homebrew-mycli-app

variables:
  - group: 'AME ESRP Variable Group'
  
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true
  - name: AzureCliVersion
    value: ${{ parameters.AzureCliVersion }}
  - name: UnsignedBuildId
    value: ${{ parameters.UnsignedBuildId }}
  - name: BundleId
    value: ${{ parameters.BundleId }}
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  - name: HomebrewTapRepo
    value: ${{ parameters.HomebrewTapRepo }}
  - name: CaskName
    value: ${{ parameters.CaskName }}
  - name: ReleaseTag
    value: v${{ parameters.AzureCliVersion }}-pr2
  - name: GITHUB_TOKEN
    value: $[ resources.repositories['homebrewtap'].token ]

name: release-complete-pr2-$(AzureCliVersion)-$(Build.BuildId)

stages:
# ============================================================================
# STAGE 1-5: Same as original pipeline (Download, Sign, Notarize, Validate)
# ============================================================================
# NOTE: Stages 1-5 are identical to macos-pkg-release-complete.yml
# Only the PKG structure differs (versioned paths handled in build stage)

- stage: DownloadAndExtract
  displayName: 'Stage 1: Download Unsigned PKG and Extract'
  jobs:
  - job: DownloadAndExtractPkg
    displayName: 'Download and extract PKG contents'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download unsigned ARM64 PKG'
      inputs:
        buildType: 'specific'
        project: '$(System.TeamProjectId)'
        definition: '$(System.DefinitionId)'
        buildVersionToDownload: 'specific'
        buildId: '$(UnsignedBuildId)'
        artifactName: 'unsigned-pkg'
        targetPath: '$(Pipeline.Workspace)/unsigned-pkg'
    
    - bash: |
        set -e
        echo "=== Downloaded PKG Files ==="
        ls -lh $(Pipeline.Workspace)/unsigned-pkg/
        echo ""
        
        # Find the PKG file
        PKG_FILE=$(find $(Pipeline.Workspace)/unsigned-pkg -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: No PKG file found"
          exit 1
        fi
        
        echo "✅ Found PKG: $PKG_FILE"
        echo "PKG size: $(du -h "$PKG_FILE" | cut -f1)"
        
        # Create extraction directory
        EXTRACT_DIR="$(Pipeline.Workspace)/pkg-extracted"
        mkdir -p "$EXTRACT_DIR"
        
        echo ""
        echo "=== Extracting PKG (XAR archive) ==="
        cd "$EXTRACT_DIR"
        xar -xf "$PKG_FILE"
        
        echo ""
        echo "=== PKG Structure ==="
        ls -lh
        
        # Find the component PKG
        COMPONENT_PKG=$(find . -name "*.pkg" -type d | grep -v "^\.$" | head -1)
        
        if [ -z "$COMPONENT_PKG" ]; then
          echo "❌ ERROR: No component PKG found"
          exit 1
        fi
        
        echo ""
        echo "✅ Found component PKG: $COMPONENT_PKG"
        
        # Extract the Payload (contains actual files)
        echo ""
        echo "=== Extracting Payload ==="
        PAYLOAD_DIR="$(Pipeline.Workspace)/payload"
        mkdir -p "$PAYLOAD_DIR"
        
        cd "$PAYLOAD_DIR"
        cat "$EXTRACT_DIR/$COMPONENT_PKG/Payload" | gunzip -dc | cpio -i
        
        echo ""
        echo "=== Payload extracted to: $PAYLOAD_DIR ==="
        echo "Total size: $(du -sh . | cut -f1)"
        
        # Find all executables and libraries that need signing
        echo ""
        echo "=== Finding files to sign ==="
        
        # Python executables
        find . -type f -name "python*" ! -name "*.pyc" ! -name "*.py" | head -10
        
        # Shared libraries
        echo ""
        echo "Dylibs found:"
        find . -type f -name "*.dylib" | wc -l
        
        echo ""
        echo "SO files found:"
        find . -type f -name "*.so" | wc -l
        
        # az CLI executable
        echo ""
        echo "az executable:"
        find . -type f -name "az" -o -name "azurecli"
        
      displayName: 'Extract PKG and Payload'
    
    - bash: |
        set -e
        echo "=== Creating file list for signing ==="
        
        PAYLOAD_DIR="$(Pipeline.Workspace)/payload"
        FILES_TO_SIGN="$(Pipeline.Workspace)/files-to-sign.txt"
        
        cd "$PAYLOAD_DIR"
        
        # Find all binaries that need signing (Mach-O only)
        echo "Scanning for Mach-O binaries..."
        
        find . -type f | while read filepath; do
          if file "$filepath" | grep -q "Mach-O"; then
            # Remove leading ./
            echo "${filepath#./}" >> "$FILES_TO_SIGN"
          fi
        done | sort -u > "$FILES_TO_SIGN"
        
        echo ""
        echo "=== Files identified for signing ==="
        echo "Total Mach-O binaries: $(wc -l < $FILES_TO_SIGN)"
        echo ""
        echo "Sample (first 20):"
        head -20 "$FILES_TO_SIGN"
        
      displayName: 'Identify binaries for signing'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Publish extracted payload'
      inputs:
        targetPath: '$(Pipeline.Workspace)/payload'
        artifactName: 'unsigned-binaries'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Publish file list'
      inputs:
        targetPath: '$(Pipeline.Workspace)/files-to-sign.txt'
        artifactName: 'files-to-sign'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Publish PKG metadata'
      inputs:
        targetPath: '$(Pipeline.Workspace)/pkg-extracted'
        artifactName: 'pkg-metadata'

# ============================================================================
# STAGE 2: SIGN ALL BINARIES WITH ESRP
# ============================================================================
- stage: SignBinaries
  displayName: 'Stage 2: Sign All Binaries with ESRP'
  dependsOn: DownloadAndExtract
  condition: succeeded()
  jobs:
  - job: SignAllBinaries
    displayName: 'Sign binaries using ESRP'
    pool:
      vmImage: 'windows-2022'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download unsigned binaries'
      inputs:
        artifactName: 'unsigned-binaries'
        targetPath: '$(Pipeline.Workspace)/unsigned-binaries'
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download file list'
      inputs:
        artifactName: 'files-to-sign'
        targetPath: '$(Pipeline.Workspace)'
    
    - pwsh: |
        Write-Host "=== Preparing binaries for ESRP signing ==="
        Write-Host "NOTE: ESRP MacAppDeveloperSign requires ZIP archives, not individual files"
        Write-Host "Workaround: Compress each binary into individual ZIP files"
        
        $unsignedDir = "$(Pipeline.Workspace)/unsigned-binaries"
        $fileListPath = "$(Pipeline.Workspace)/files-to-sign.txt"
        $toBeSignedDir = "$(Pipeline.Workspace)/toBeSigned"
        
        # Create directory for ZIP files to be signed
        if (Test-Path $toBeSignedDir) {
          Remove-Item -Path $toBeSignedDir -Recurse -Force
        }
        New-Item -ItemType Directory -Path $toBeSignedDir -Force | Out-Null
        
        Write-Host ""
        Write-Host "Reading file list..."
        
        if (-not (Test-Path $fileListPath)) {
          Write-Error "File list not found: $fileListPath"
          exit 1
        }
        
        $filesToSign = Get-Content $fileListPath
        Write-Host "Files to sign: $($filesToSign.Count)"
        
        Write-Host ""
        Write-Host "Creating individual ZIP files for each binary..."
        
        $zippedCount = 0
        $fileMapping = @{}
        
        foreach ($relPath in $filesToSign) {
          $relPath = $relPath.TrimStart('.', '/')
          
          $sourcePath = Join-Path $unsignedDir $relPath
          
          if (Test-Path $sourcePath) {
            $flatName = $relPath -replace '[/\\]', '__'
            $zipName = "$flatName.zip"
            $zipPath = Join-Path $toBeSignedDir $zipName
            
            $fileName = Split-Path $sourcePath -Leaf
            Compress-Archive -Path $sourcePath -DestinationPath $zipPath -Force
            
            $fileMapping[$zipName] = @{
              "OriginalPath" = $relPath
              "FileName" = $fileName
            }
            
            $zippedCount++
            
            if ($zippedCount -le 10) {
              $zipSize = [math]::Round((Get-Item $zipPath).Length / 1KB, 1)
              Write-Host "  ✓ $relPath -> $zipName ($zipSize KB)"
            }
          } else {
            Write-Warning "File not found: $sourcePath"
          }
        }
        
        Write-Host ""
        Write-Host "✅ Created $zippedCount ZIP files"
        
        $mappingPath = "$(Pipeline.Workspace)/file-mapping.json"
        $fileMapping | ConvertTo-Json | Set-Content $mappingPath
        Write-Host "File mapping saved: $mappingPath"
        
      displayName: 'Prepare binaries for signing (ZIP each file)'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Sign macOS binaries (ZIP archives)'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/toBeSigned'
        Pattern: '*.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppDeveloperSign",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "Hardening": "--options=runtime"
              }
            }
          ]
        SessionTimeout: '120'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "=== Extracting signed binaries from ZIP files ==="
        
        $signedZipsDir = "$(Pipeline.Workspace)/toBeSigned"
        $outputDir = "$(Pipeline.Workspace)/signed-binaries"
        $mappingPath = "$(Pipeline.Workspace)/file-mapping.json"
        
        if (-not (Test-Path $mappingPath)) {
          Write-Error "File mapping not found: $mappingPath"
          exit 1
        }
        
        $fileMapping = Get-Content $mappingPath | ConvertFrom-Json
        
        if (Test-Path $outputDir) {
          Remove-Item -Path $outputDir -Recurse -Force
        }
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        
        Write-Host ""
        Write-Host "Extracting signed binaries from ZIPs..."
        
        $extractedCount = 0
        foreach ($property in $fileMapping.PSObject.Properties) {
          $zipName = $property.Name
          $originalRelPath = $property.Value.OriginalPath
          $fileName = $property.Value.FileName
          
          $zipPath = Join-Path $signedZipsDir $zipName
          
          if (Test-Path $zipPath) {
            $tempExtractDir = Join-Path $env:TEMP "extract-$extractedCount"
            New-Item -ItemType Directory -Path $tempExtractDir -Force | Out-Null
            
            Expand-Archive -Path $zipPath -DestinationPath $tempExtractDir -Force
            
            $signedFile = Join-Path $tempExtractDir $fileName
            
            if (Test-Path $signedFile) {
              $targetPath = Join-Path $outputDir $originalRelPath
              $targetDir = Split-Path $targetPath -Parent
              
              if (-not (Test-Path $targetDir)) {
                New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
              }
              
              Copy-Item -Path $signedFile -Destination $targetPath -Force
              $extractedCount++
              
              if ($extractedCount -le 10) {
                Write-Host "  ✓ $zipName -> $originalRelPath"
              }
            } else {
              Write-Warning "Signed file not found in ZIP: $zipPath"
            }
            
            Remove-Item -Path $tempExtractDir -Recurse -Force -ErrorAction SilentlyContinue
          } else {
            Write-Warning "Signed ZIP not found: $zipPath"
          }
        }
        
        Write-Host ""
        Write-Host "✅ Extracted $extractedCount signed binaries"
        
      displayName: 'Extract signed binaries from ZIPs'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Publish signed binaries'
      inputs:
        targetPath: '$(Pipeline.Workspace)/signed-binaries'
        artifactName: 'signed-binaries'

# ============================================================================
# STAGE 3: REPACKAGE AND SIGN PKG
# ============================================================================
- stage: RepackageAndSignPkg
  displayName: 'Stage 3: Repackage PKG and Sign'
  dependsOn: SignBinaries
  condition: succeeded()
  jobs:
  - job: RepackagePkg
    displayName: 'Repackage PKG with signed binaries (macOS)'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download original payload'
      inputs:
        artifactName: 'unsigned-binaries'
        targetPath: '$(Pipeline.Workspace)/original-payload'
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download signed binaries'
      inputs:
        artifactName: 'signed-binaries'
        targetPath: '$(Pipeline.Workspace)/signed-binaries'
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download PKG metadata'
      inputs:
        artifactName: 'pkg-metadata'
        targetPath: '$(Pipeline.Workspace)/pkg-metadata'
    
    - bash: |
        set -e
        echo "=== Merging signed binaries back into payload ==="
        
        ORIGINAL_PAYLOAD="$(Pipeline.Workspace)/original-payload"
        SIGNED_BINARIES="$(Pipeline.Workspace)/signed-binaries"
        MERGED_PAYLOAD="$(Pipeline.Workspace)/merged-payload"
        
        cp -R "$ORIGINAL_PAYLOAD" "$MERGED_PAYLOAD"
        
        echo ""
        echo "Replacing unsigned binaries with signed versions..."
        
        cd "$SIGNED_BINARIES"
        find . -type f | while read signed_file; do
          target_file="$MERGED_PAYLOAD/$signed_file"
          
          if [ -f "$target_file" ]; then
            cp "$signed_file" "$target_file"
          fi
        done
        
        echo ""
        echo "✅ Merged payload ready"
        echo "Size: $(du -sh $MERGED_PAYLOAD | cut -f1)"
        
        # Verify critical files exist
        echo ""
        echo "Verifying critical files exist:"
        if [ -f "$MERGED_PAYLOAD/bin/az" ]; then
          echo "✅ bin/az exists"
        else
          echo "❌ ERROR: bin/az is MISSING!"
          exit 1
        fi
        
        # Set executable permissions
        echo ""
        echo "Setting executable permissions on binaries..."
        
        cd "$MERGED_PAYLOAD"
        
        chmod +x bin/az 2>/dev/null || true
        chmod +x microsoft/azure-cli/*/bin/az 2>/dev/null || true
        
        find microsoft/azure-cli/*/bin -type f -name "python*" ! -name "*.pyc" ! -name "*.py" -exec chmod +x {} \; 2>/dev/null || true
        
        find . -type f \( -name "*.dylib" -o -name "*.so" \) -exec chmod +x {} \; 2>/dev/null || true
        
        echo ""
        echo "Verifying permissions on critical files:"
        ls -l bin/az
        ls -l microsoft/azure-cli/*/bin/python* 2>/dev/null | head -3 || true
        
      displayName: 'Merge signed binaries and set permissions'
    
    - bash: |
        set -e
        echo "=== Preparing PKG metadata for repacking ==="
        
        PKG_METADATA="$(Pipeline.Workspace)/pkg-metadata"
        
        if [ -f "$PKG_METADATA/Distribution" ]; then
          cp "$PKG_METADATA/Distribution" "$(Pipeline.Workspace)/"
          echo "✅ Distribution file copied"
        else
          echo "ℹ️  No Distribution file found (will use simple productbuild)"
        fi
        
      displayName: 'Prepare PKG metadata'
    
    - bash: |
        set -e
        echo "=== Building new PKG with signed binaries ==="
        
        MERGED_PAYLOAD="$(Pipeline.Workspace)/merged-payload"
        DISTRIBUTION="$(Pipeline.Workspace)/Distribution"
        OUTPUT_PKG="$(Pipeline.Workspace)/azure-cli-$(AzureCliVersion)-macos-arm64-signed-binaries.pkg"
        
        COMPONENT_PKG="$(Pipeline.Workspace)/azure-cli-component-$(AzureCliVersion)-macos-arm64.pkg"
        
        echo "Creating component PKG from merged payload (with signed binaries)..."
        echo "Source directory: $MERGED_PAYLOAD"
        echo "Directory size: $(du -sh $MERGED_PAYLOAD | cut -f1)"
        
        pkgbuild --root "$MERGED_PAYLOAD" \
                 --identifier "$(BundleId)" \
                 --version "$(AzureCliVersion)" \
                 --install-location "/usr/local" \
                 --ownership recommended \
                 "$COMPONENT_PKG"
        
        echo "✅ Component PKG created: $(du -h $COMPONENT_PKG | cut -f1)"
        
        echo ""
        echo "Creating distribution PKG..."
        
        if [ -f "$DISTRIBUTION" ]; then
          productbuild --distribution "$DISTRIBUTION" \
                       --package-path "$(Pipeline.Workspace)" \
                       "$OUTPUT_PKG"
        else
          cp "$COMPONENT_PKG" "$OUTPUT_PKG"
          echo "ℹ️  No Distribution file - using component PKG as final PKG"
        fi
        
        echo ""
        echo "✅ PKG created: $OUTPUT_PKG"
        echo "Size: $(du -h $OUTPUT_PKG | cut -f1)"
        
        echo ""
        echo "=== PKG Verification ==="
        pkgutil --check-signature "$OUTPUT_PKG" || echo "Not yet signed (expected)"
        
      displayName: 'Build new PKG with signed binaries'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Publish PKG with signed binaries'
      inputs:
        targetPath: '$(Pipeline.Workspace)/azure-cli-$(AzureCliVersion)-macos-arm64-signed-binaries.pkg'
        artifactName: 'pkg-with-signed-binaries'

  - job: SignPkg
    displayName: 'Sign PKG with ESRP (Windows)'
    dependsOn: RepackagePkg
    pool:
      vmImage: 'windows-2022'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download PKG with signed binaries'
      inputs:
        artifactName: 'pkg-with-signed-binaries'
        targetPath: '$(Pipeline.Workspace)/pkg-to-sign'
    
    - pwsh: |
        Write-Host "=== Preparing PKG for ESRP signing ==="
        
        $pkgFile = Get-ChildItem -Path "$(Pipeline.Workspace)/pkg-to-sign" -Filter "*.pkg" -File | Select-Object -First 1
        
        if (-not $pkgFile) {
          Write-Error "❌ PKG file not found"
          exit 1
        }
        
        Write-Host "✅ Found PKG: $($pkgFile.Name)"
        Write-Host "Size: $([math]::Round($pkgFile.Length / 1MB, 2)) MB"
        
        $zipPath = "$(Pipeline.Workspace)/$($pkgFile.BaseName).zip"
        
        Write-Host ""
        Write-Host "Compressing to ZIP for ESRP..."
        Compress-Archive -Path $pkgFile.FullName -DestinationPath $zipPath -Force
        
        if (Test-Path $zipPath) {
          Write-Host "✅ ZIP created: $([math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB"
        } else {
          Write-Error "❌ Failed to create ZIP"
          exit 1
        }
        
      displayName: 'Compress PKG for ESRP signing'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Sign PKG'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)'
        Pattern: 'azure-cli-*-macos-arm64-signed-binaries.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppDeveloperSign",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "Hardening": "--options=runtime"
              }
            }
          ]
        SessionTimeout: '60'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "=== Extracting Signed PKG ==="
        
        $signedZip = Get-ChildItem -Path "$(Pipeline.Workspace)" -Filter "*signed-binaries.zip" -File | Select-Object -First 1
        
        if (-not $signedZip) {
          Write-Error "❌ Signed ZIP not found"
          exit 1
        }
        
        Write-Host "Found signed ZIP: $($signedZip.Name)"
        
        $outputDir = "$(Build.ArtifactStagingDirectory)/fully-signed-pkg"
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        
        Expand-Archive -Path $signedZip.FullName -DestinationPath $outputDir -Force
        
        $signedPkg = Get-ChildItem -Path $outputDir -Filter "*.pkg" -File | Select-Object -First 1
        
        if ($signedPkg) {
          $newName = $signedPkg.Name -replace 'signed-binaries\.pkg$', 'fully-signed.pkg'
          $newPath = Join-Path $outputDir $newName
          Move-Item -Path $signedPkg.FullName -Destination $newPath -Force
          
          Write-Host "✅ Fully-signed PKG ready: $newName"
          Write-Host "   Size: $([math]::Round((Get-Item $newPath).Length / 1MB, 2)) MB"
          
          $hash = Get-FileHash -Path $newPath -Algorithm SHA256
          $hashFile = "$newPath.sha256"
          "$($hash.Hash.ToLower())  $newName" | Out-File -FilePath $hashFile -Encoding ASCII -NoNewline
          
          Write-Host "   SHA256: $($hash.Hash)"
        } else {
          Write-Error "❌ PKG not found after extraction"
          exit 1
        }
        
      displayName: 'Extract signed PKG'
    
    - publish: $(Build.ArtifactStagingDirectory)/fully-signed-pkg
      artifact: fully-signed-macos-pkg
      displayName: 'Publish fully signed PKG'

# ============================================================================
# STAGE 4: NOTARIZE WITH APPLE (ESRP)
# ============================================================================
- stage: NotarizeWithApple
  displayName: 'Stage 4: Notarize with Apple via ESRP'
  dependsOn: RepackageAndSignPkg
  condition: succeeded()
  jobs:
  - job: NotarizeARM64
    displayName: 'Notarize PKG with Apple (ESRP on Windows)'
    pool:
      vmImage: windows-2022
    
    steps:
    - checkout: none
    
    - download: current
      artifact: fully-signed-macos-pkg
      displayName: 'Download fully-signed PKG'
    
    - pwsh: |
        Write-Host "=== Preparing Fully-Signed PKG for Apple Notarization ==="
        
        $signedPkg = Get-ChildItem -Path "$(Pipeline.Workspace)/fully-signed-macos-pkg" -Filter "*fully-signed.pkg" -File | Select-Object -First 1
        
        if (-not $signedPkg) {
          Write-Error "❌ No PKG file found"
          exit 1
        }
        
        Write-Host "✅ Found signed PKG: $($signedPkg.Name)"
        Write-Host "   Size: $([math]::Round($signedPkg.Length / 1MB, 2)) MB"
        
        $targetPath = "$(Pipeline.Workspace)/$($signedPkg.Name)"
        Copy-Item -Path $signedPkg.FullName -Destination $targetPath -Force
        
        Write-Host ""
        Write-Host "=== Ready for Apple notarization ==="
        
      displayName: 'Prepare fully-signed PKG for notarization'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Notarize ARM64 PKG with Apple'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)'
        Pattern: '*fully-signed.pkg'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppNotarize",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "BundleId": "$(BundleId)"
              }
            }
          ]
        SessionTimeout: '60'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "=== Collecting Notarized PKG ==="
        
        $notarizedPkg = Get-ChildItem -Path "$(Pipeline.Workspace)" -Filter "*fully-signed.pkg" -File | 
                        Sort-Object LastWriteTime -Descending | 
                        Select-Object -First 1
        
        if (-not $notarizedPkg) {
          Write-Error "❌ Notarized PKG not found"
          exit 1
        }
        
        Write-Host "Found notarized PKG: $($notarizedPkg.Name)"
        
        $outputDir = "$(Build.ArtifactStagingDirectory)/notarized-pkg"
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        
        $notarizedName = $notarizedPkg.Name -replace 'fully-signed\.pkg$', 'notarized.pkg'
        $newPath = Join-Path $outputDir $notarizedName
        Copy-Item -Path $notarizedPkg.FullName -Destination $newPath -Force
        
        if (Test-Path $newPath) {
          Write-Host "✅ Notarized PKG ready"
          Write-Host "   Name: $notarizedName"
          Write-Host "   Size: $([math]::Round((Get-Item $newPath).Length / 1MB, 2)) MB"
          
          $hash = Get-FileHash -Path $newPath -Algorithm SHA256
          $hashFile = "$newPath.sha256"
          "$($hash.Hash.ToLower())  $notarizedName" | Out-File -FilePath $hashFile -Encoding ASCII -NoNewline
          
          Write-Host "   SHA256: $($hash.Hash)"
        }
        
      displayName: 'Collect notarized PKG'
    
    - publish: $(Build.ArtifactStagingDirectory)/notarized-pkg
      artifact: notarized-macos-pkg
      displayName: 'Publish notarized PKG'

  - job: StapleTicket
    displayName: 'Staple notarization ticket (macOS)'
    dependsOn: NotarizeARM64
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: notarized-macos-pkg
      displayName: 'Download notarized PKG'
    
    - bash: |
        echo "=== Stapling Notarization Ticket ==="
        
        NOTARIZED_DIR="$(Pipeline.Workspace)/notarized-macos-pkg"
        STAPLED_DIR="$(Build.ArtifactStagingDirectory)/stapled-pkg"
        mkdir -p "$STAPLED_DIR"
        
        for pkg in "$NOTARIZED_DIR"/*.pkg; do
          if [ -f "$pkg" ]; then
            pkg_name=$(basename "$pkg")
            echo "Processing: $pkg_name"
            
            cp "$pkg" "$STAPLED_DIR/$pkg_name"
            
            echo "Stapling notarization ticket..."
            if xcrun stapler staple "$STAPLED_DIR/$pkg_name"; then
              echo "✅ Ticket stapled successfully"
            else
              echo "⚠️  Stapling failed - waiting 30 seconds and retrying..."
              sleep 30
              
              if xcrun stapler staple "$STAPLED_DIR/$pkg_name"; then
                echo "✅ Ticket stapled successfully (after retry)"
              else
                echo "❌ Stapling failed after retry"
              fi
            fi
            
            echo "Validating stapled ticket..."
            xcrun stapler validate "$STAPLED_DIR/$pkg_name" || true
            
            if [ -f "${pkg}.sha256" ]; then
              cp "${pkg}.sha256" "$STAPLED_DIR/${pkg_name}.sha256"
            else
              shasum -a 256 "$STAPLED_DIR/$pkg_name" | awk '{print $1 "  " "'$pkg_name'"}' > "$STAPLED_DIR/${pkg_name}.sha256"
            fi
            
            echo "✅ Done: $(du -h $STAPLED_DIR/$pkg_name | cut -f1)"
            echo ""
          fi
        done
        
        echo "=== Stapled PKG Files ==="
        ls -lh "$STAPLED_DIR"
        
      displayName: 'Staple notarization ticket'
    
    - publish: $(Build.ArtifactStagingDirectory)/stapled-pkg
      artifact: stapled-macos-pkg
      displayName: 'Publish stapled PKG'

# ============================================================================
# STAGE 5: GATEKEEPER SECURITY VALIDATION (9 Comprehensive Tests)
# ============================================================================
- stage: GatekeeperSecurityValidation
  displayName: 'Stage 5: Gatekeeper Security Validation (9 Tests)'
  dependsOn: NotarizeWithApple
  condition: succeeded()
  jobs:
  - job: GatekeeperTests
    displayName: 'Run 9 Gatekeeper security tests'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: stapled-macos-pkg
      displayName: 'Download stapled PKG'
    
    - bash: |
        echo "======================================"
        echo "  System Security Information"
        echo "======================================"
        echo ""
        echo "macOS Version:"
        sw_vers
        echo ""
        echo "Architecture:"
        uname -m
        echo ""
        echo "Gatekeeper Status:"
        spctl --status
        echo ""
        echo "System Integrity Protection (SIP):"
        csrutil status || echo "Cannot check SIP status (expected in VM)"
      displayName: 'Show security settings'
    
    - bash: |
        set -e
        STAPLED_DIR="$(Pipeline.Workspace)/stapled-macos-pkg"
        
        PKG_FILE=$(find "$STAPLED_DIR" -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: No PKG file found!"
          exit 1
        fi
        
        echo "✅ Found PKG: $(basename $PKG_FILE)"
        ls -lh "$PKG_FILE"
        
        cp "$PKG_FILE" azure-cli.pkg
      displayName: 'Prepare PKG for testing'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Test 1: PKG Signature Verification"
        echo "======================================"
        echo ""
        
        echo "Checking PKG signature with pkgutil..."
        pkgutil --check-signature azure-cli.pkg
        
        RESULT=$?
        if [ $RESULT -eq 0 ]; then
          echo ""
          echo "✅ PKG signature is valid"
        else
          echo ""
          echo "❌ PKG signature verification failed"
          exit 1
        fi
      displayName: 'Test 1: PKG signature'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Test 2: Gatekeeper Assessment"
        echo "======================================"
        echo ""
        
        echo "Running Gatekeeper assessment (spctl)..."
        
        spctl -a -vv -t install azure-cli.pkg
        
        RESULT=$?
        if [ $RESULT -eq 0 ]; then
          echo ""
          echo "✅ Gatekeeper approved - PKG will install without warnings"
        else
          echo ""
          echo "❌ Gatekeeper rejected - Users will see security warnings!"
          exit 1
        fi
      displayName: 'Test 2: Gatekeeper acceptance'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Test 3: Notarization Ticket Verification"
        echo "======================================"
        echo ""
        
        echo "Checking if notarization ticket is stapled..."
        stapler validate azure-cli.pkg
        
        RESULT=$?
        if [ $RESULT -eq 0 ]; then
          echo ""
          echo "✅ Notarization ticket is stapled"
        else
          echo ""
          echo "⚠️  WARNING: Notarization ticket NOT stapled"
          exit 1
        fi
      displayName: 'Test 3: Notarization stapling'
    
    - bash: |
        echo "======================================"
        echo "  Gatekeeper Security Test Summary"
        echo "======================================"
        echo ""
        echo "Core tests completed for PR2 versioned installation:"
        echo ""
        echo "✅ Test 1: PKG signature valid (Developer ID)"
        echo "✅ Test 2: Gatekeeper approved PKG for installation"
        echo "✅ Test 3: Notarization ticket stapled (offline ready)"
        echo ""
        echo "The PKG is production-ready for PR2 testing!"
      displayName: 'Security test summary'
    
    - bash: |
        sudo rm -rf /usr/local/bin/az 2>/dev/null || true
        sudo rm -rf /usr/local/microsoft/azure-cli 2>/dev/null || true
        rm -f azure-cli.pkg
        echo "✅ Cleanup complete"
      displayName: 'Cleanup'
      condition: always()

# ============================================================================
# STAGE 6: PUBLISH TO GITHUB RELEASE (with PR2 tag)
# ============================================================================
- stage: PublishToGitHub
  displayName: 'Stage 6: Publish to GitHub Release'
  dependsOn: GatekeeperSecurityValidation
  condition: succeeded()
  jobs:
  - job: CreateRelease
    displayName: 'Create GitHub release (PR2 track)'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: stapled-pkg
      displayName: 'Download stapled PKG'
    
    - bash: |
        set -e
        echo "=== GitHub Release Preparation ==="
        echo "Version: $(AzureCliVersion)"
        echo "Release Tag: $(ReleaseTag)"
        echo "Repository: $(GitHubRepo)"
        echo "Cask: $(CaskName)"
        echo ""
        
        # Find the stapled PKG
        PKG_FILE=$(find $(Pipeline.Workspace)/stapled-pkg -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: No PKG file found"
          exit 1
        fi
        
        echo "✅ Found PKG: $PKG_FILE"
        echo "Size: $(du -h "$PKG_FILE" | cut -f1)"
        
        # Calculate SHA256
        PKG_SHA256=$(shasum -a 256 "$PKG_FILE" | cut -d' ' -f1)
        echo "SHA256: $PKG_SHA256"
        
        # Create release notes
        RELEASE_NOTES=$(cat << EOF
        # Azure CLI $(AzureCliVersion) - PR2 (Versioned Installation)
        
        This is a test release for the **PR2 track** implementing Homebrew-style versioned installations.
        
        ## Installation Methods
        
        ### Homebrew Cask (Recommended)
        \`\`\`bash
        brew tap naga-nandyala/mycli-app
        brew install --cask $(CaskName)
        \`\`\`
        
        ### Direct PKG Install
        Download the PKG file below and run:
        \`\`\`bash
        sudo installer -pkg azure-cli-$(AzureCliVersion).pkg -target /
        \`\`\`
        
        ## Installation Path Structure
        
        This version uses **versioned directories**:
        \`\`\`
        /usr/local/microsoft/azure-cli/$(AzureCliVersion)/
        /usr/local/microsoft/azure-cli/current -> $(AzureCliVersion)/
        /usr/local/bin/az
        \`\`\`
        
        ## Key Features
        
        - ✅ Side-by-side version installations
        - ✅ Easy rollback via symlink switching
        - ✅ Atomic upgrades
        - ✅ Manual version switching capability
        - ✅ Cleanup utility for old versions
        
        ## Package Details
        
        - **Version**: $(AzureCliVersion)
        - **Architecture**: ARM64 (Apple Silicon) and x86_64 (Intel)
        - **SHA256**: $PKG_SHA256
        - **Signed**: ✅ Apple Developer ID
        - **Notarized**: ✅ Apple Notary Service
        - **Stapled**: ✅ Notarization ticket attached
        
        ## Verification
        
        After installation, verify:
        \`\`\`bash
        az --version
        ls -la /usr/local/microsoft/azure-cli/
        readlink /usr/local/microsoft/azure-cli/current
        \`\`\`
        
        ## Upgrade Behavior
        
        When upgrading via Homebrew Cask:
        \`\`\`bash
        brew upgrade --cask $(CaskName)
        \`\`\`
        
        - Previous version preserved in separate directory
        - 'current' symlink updated to new version
        - Use cleanup script to remove old versions:
          \`\`\`bash
          sudo /usr/local/microsoft/azure-cli/cleanup-old-versions.sh
          \`\`\`
        
        ## Documentation
        
        See [PKG_VERSIONING_DESIGN.md](https://github.com/$(GitHubRepo)/blob/main/docs/PKG_VERSIONING_DESIGN.md) for complete design details.
        EOF
        )
        
        # Save for GitHub release task
        echo "$RELEASE_NOTES" > $(Build.ArtifactStagingDirectory)/release-notes.md
        echo "$PKG_SHA256" > $(Build.ArtifactStagingDirectory)/sha256.txt
        
        echo ""
        echo "✅ Release preparation complete"
        
      displayName: 'Prepare release metadata'
    
    - task: GitHubRelease@1
      displayName: 'Delete existing release (if exists)'
      continueOnError: true
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'delete'
        tag: '$(ReleaseTag)'
    
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(ReleaseTag)'
        title: 'Azure CLI $(AzureCliVersion) - PR2'
        releaseNotesFilePath: '$(Build.ArtifactStagingDirectory)/release-notes.md'
        assets: '$(Pipeline.Workspace)/stapled-pkg/*.pkg'
        isPreRelease: ${{ parameters.IsPreRelease }}
        isDraft: ${{ parameters.IsDraft }}
        addChangeLog: false
    
    - bash: |
        echo "=== GitHub Release Created ==="
        echo "Release: https://github.com/$(GitHubRepo)/releases/tag/$(ReleaseTag)"
        echo "Download URL: https://github.com/$(GitHubRepo)/releases/download/$(ReleaseTag)/azure-cli-$(AzureCliVersion).pkg"
        
      displayName: 'Display release URL'

# ============================================================================
# STAGE 7: UPDATE HOMEBREW CASK (PR2 - Versioned Installation)
# ============================================================================
- stage: UpdateHomebrewCask
  displayName: 'Stage 7: Update Homebrew Cask (PR2)'
  dependsOn: PublishToGitHub
  condition: succeeded()
  jobs:
  - job: GenerateCaskMetadata
    displayName: 'Generate cask metadata'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: stapled-pkg
      displayName: 'Download stapled PKG'
    
    - bash: |
        set -e
        echo "=== Calculating PKG SHA256 for Cask ==="
        
        PKG_FILE=$(find $(Pipeline.Workspace)/stapled-pkg -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: No PKG file found"
          exit 1
        fi
        
        PKG_NAME=$(basename "$PKG_FILE")
        PKG_SHA256=$(shasum -a 256 "$PKG_FILE" | cut -d' ' -f1)
        PKG_SIZE=$(stat -f%z "$PKG_FILE" 2>/dev/null || stat -c%s "$PKG_FILE")
        PKG_DOWNLOAD_URL="https://github.com/$(GitHubRepo)/releases/download/$(ReleaseTag)/$PKG_NAME"
        
        echo "PKG Name: $PKG_NAME"
        echo "PKG SHA256: $PKG_SHA256"
        echo "PKG Size: $PKG_SIZE bytes"
        echo "Download URL: $PKG_DOWNLOAD_URL"
        
        # Export for next job
        echo "##vso[task.setvariable variable=PKG_SHA256;isOutput=true]$PKG_SHA256"
        echo "##vso[task.setvariable variable=PKG_NAME;isOutput=true]$PKG_NAME"
        echo "##vso[task.setvariable variable=PKG_DOWNLOAD_URL;isOutput=true]$PKG_DOWNLOAD_URL"
        
      name: GetPkgDetails
      displayName: 'Get PKG details for Cask'
  
  - job: CreateCask
    displayName: 'Create Homebrew cask with versioning support'
    dependsOn: GenerateCaskMetadata
    variables:
      PKG_SHA256: $[ dependencies.GenerateCaskMetadata.outputs['GetPkgDetails.PKG_SHA256'] ]
      PKG_NAME: $[ dependencies.GenerateCaskMetadata.outputs['GetPkgDetails.PKG_NAME'] ]
      PKG_DOWNLOAD_URL: $[ dependencies.GenerateCaskMetadata.outputs['GetPkgDetails.PKG_DOWNLOAD_URL'] ]
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "=== Creating Homebrew Cask with Versioning ==="
        echo "Cask Name: $(CaskName)"
        echo "Version: $(AzureCliVersion)"
        echo "PKG SHA256: $(PKG_SHA256)"
        echo ""
        
        mkdir -p Casks
        
        cat > "Casks/$(CaskName).rb" << 'CASK_EOF'
        cask "$(CaskName)" do
          version "$(AzureCliVersion)"
          sha256 "$(PKG_SHA256)"
          
          url "$(PKG_DOWNLOAD_URL)"
          name "Azure CLI (PR2 - Versioned)"
          desc "Microsoft Azure Command-Line Interface with versioned installation support"
          homepage "https://docs.microsoft.com/cli/azure/"
        
          pkg "$(PKG_NAME)"
        
          postflight do
            # Display installation summary
            version_dir = "/usr/local/microsoft/azure-cli/#{version}"
            current_link = "/usr/local/microsoft/azure-cli/current"
            
            if File.directory?(version_dir)
              ohai "Azure CLI #{version} installed successfully"
              puts "Installation directory: #{version_dir}"
              
              if File.symlink?(current_link)
                active_version = File.readlink(current_link)
                puts "Active version: #{active_version}"
                
                # Check if this is an upgrade
                if active_version != version.to_s
                  opoo "Previous version (#{active_version}) is still installed"
                  puts "To remove old versions, run:"
                  puts "  sudo /usr/local/microsoft/azure-cli/cleanup-old-versions.sh"
                end
              end
            else
              opoo "Installation directory not found: #{version_dir}"
            end
          end
        
          uninstall_preflight do
            current_link = "/usr/local/microsoft/azure-cli/current"
            
            if File.symlink?(current_link)
              current_version = File.readlink(current_link)
              ohai "Removing Azure CLI active version: #{current_version}"
              
              # Count total versions
              versions_dir = "/usr/local/microsoft/azure-cli"
              if Dir.exist?(versions_dir)
                version_dirs = Dir.glob("#{versions_dir}/[0-9]*").select { |f| File.directory?(f) }
                
                if version_dirs.length > 1
                  opoo "You have #{version_dirs.length} versions installed"
                  puts "Only the launcher and 'current' symlink will be removed."
                  puts "Version directories will remain for manual inspection."
                  puts ""
                  puts "To remove ALL versions and data, run:"
                  puts "  brew uninstall --zap --cask $(CaskName)"
                end
              end
            else
              opoo "No active Azure CLI installation found"
            end
          end
        
          uninstall pkgutil: "$(BundleId)",
                    delete:  [
                      "/usr/local/bin/az",
                      "/usr/local/microsoft/azure-cli/current",
                      "/usr/local/microsoft/azure-cli/cleanup-old-versions.sh",
                    ]
        
          # Note: Version directories are NOT deleted to preserve user's ability to rollback
          # Users can manually remove them or use 'zap' for complete cleanup
          
          zap trash: "~/.azure",
              rmdir: "/usr/local/microsoft/azure-cli"
        
          caveats <<~EOS
            Azure CLI #{version} has been installed with versioned directory structure.
        
            Installation location:
              /usr/local/microsoft/azure-cli/#{version}/
        
            Active version symlink:
              /usr/local/microsoft/azure-cli/current -> #{version}
        
            Launcher script:
              /usr/local/bin/az
        
            Multiple versions can coexist side-by-side. When you upgrade, the previous
            version will be preserved automatically.
        
            To remove old versions:
              sudo /usr/local/microsoft/azure-cli/cleanup-old-versions.sh
        
            To manually switch versions (advanced):
              sudo ln -sf <version> /usr/local/microsoft/azure-cli/current
              Example: sudo ln -sf 2.80.0 /usr/local/microsoft/azure-cli/current
        
            To verify installation:
              az --version
              ls -la /usr/local/microsoft/azure-cli/
        
            For complete removal including all versions:
              brew uninstall --zap --cask $(CaskName)
          EOS
        end
        CASK_EOF
        
        echo ""
        echo "✅ Cask created: Casks/$(CaskName).rb"
        echo ""
        cat "Casks/$(CaskName).rb"
        
      displayName: 'Generate versioned cask file'
    
    - publish: Casks
      artifact: cask-pr2
      displayName: 'Publish cask artifact'
  
  - job: CommitCask
    displayName: 'Commit cask to Homebrew tap'
    dependsOn: 
    - GenerateCaskMetadata
    - CreateCask
    variables:
      PKG_SHA256: $[ dependencies.GenerateCaskMetadata.outputs['GetPkgDetails.PKG_SHA256'] ]
      PKG_DOWNLOAD_URL: $[ dependencies.GenerateCaskMetadata.outputs['GetPkgDetails.PKG_DOWNLOAD_URL'] ]
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: homebrewtap
      persistCredentials: true
      clean: true
    
    - download: current
      artifact: cask-pr2
      displayName: 'Download generated cask'
    
    - bash: |
        set -e
        echo "=== Configuring Git ==="
        git config user.name "Azure Pipeline"
        git config user.email "azuredevops@microsoft.com"
        
        echo "Current branch: $(git branch --show-current)"
        echo "Latest commit: $(git log -1 --oneline)"
        
      displayName: 'Configure git'
    
    - bash: |
        set -e
        echo "=== Committing Cask to Homebrew Tap ==="
        
        # Ensure Casks directory exists
        mkdir -p Casks
        
        # Copy generated cask
        cp "$(Pipeline.Workspace)/cask-pr2/$(CaskName).rb" "Casks/$(CaskName).rb"
        
        echo ""
        echo "=== Cask Content ==="
        cat "Casks/$(CaskName).rb"
        
        echo ""
        echo "=== Git Status ==="
        git status
        
        # Add and commit
        git add "Casks/$(CaskName).rb"
        
        if git diff --staged --quiet; then
          echo "ℹ️  No changes to commit (cask already up to date)"
        else
          git commit -m "Update $(CaskName) to $(AzureCliVersion)

        - Version: $(AzureCliVersion)
        - SHA256: $(PKG_SHA256)
        - Download: $(PKG_DOWNLOAD_URL)
        - Build: $(Build.BuildId)
        - Pipeline: macos-pkg-release-complete-pr2
        
        This release implements versioned installation paths for side-by-side version support."
          
          echo ""
          echo "=== Pushing to GitHub ==="
          git push origin HEAD:main
          
          echo ""
          echo "✅ Cask committed and pushed"
        fi
        
      displayName: 'Commit and push cask'

# ============================================================================
# STAGE 8: TEST HOMEBREW CASK INSTALLATION
# ============================================================================
- stage: TestInstallation
  displayName: 'Stage 8: Test Homebrew Cask Installation'
  dependsOn: UpdateHomebrewCask
  condition: succeeded()
  jobs:
  - job: TestFreshInstall
    displayName: 'Test fresh Cask installation'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "================================================"
        echo "FRESH INSTALLATION TEST"
        echo "================================================"
        echo ""
        
        # Clean any existing installation
        brew uninstall --cask $(CaskName) 2>/dev/null || true
        brew untap $(HomebrewTapRepo) 2>/dev/null || true
        
        # Remove any leftover files
        sudo rm -rf /usr/local/bin/az
        sudo rm -rf /usr/local/microsoft/azure-cli
        
        echo "✅ Clean slate ready"
        echo ""
        
        # Tap the repository
        echo "Adding Homebrew tap..."
        brew tap $(HomebrewTapRepo)
        
        echo ""
        echo "Installing $(CaskName)..."
        brew install --cask $(CaskName)
        
        echo ""
        echo "=== Installation Verification ==="
        
        # Check launcher exists
        if [ ! -f "/usr/local/bin/az" ]; then
          echo "❌ Launcher not found: /usr/local/bin/az"
          exit 1
        fi
        echo "✅ Launcher installed"
        
        # Check version directory exists
        VERSION_DIR="/usr/local/microsoft/azure-cli/$(AzureCliVersion)"
        if [ ! -d "$VERSION_DIR" ]; then
          echo "❌ Version directory not found: $VERSION_DIR"
          exit 1
        fi
        echo "✅ Version directory created: $VERSION_DIR"
        
        # Check current symlink
        CURRENT_LINK="/usr/local/microsoft/azure-cli/current"
        if [ ! -L "$CURRENT_LINK" ]; then
          echo "❌ Current symlink not found"
          exit 1
        fi
        
        CURRENT_TARGET=$(readlink "$CURRENT_LINK")
        echo "✅ Current symlink: $CURRENT_LINK -> $CURRENT_TARGET"
        
        if [ "$CURRENT_TARGET" != "$(AzureCliVersion)" ]; then
          echo "⚠️  Warning: Current points to $CURRENT_TARGET, expected $(AzureCliVersion)"
        fi
        
        # Check az command works
        echo ""
        echo "Testing az command..."
        az --version
        
        echo ""
        echo "✅ Fresh installation test PASSED"
        
      displayName: 'Test fresh installation'
  
  - job: TestUpgrade
    displayName: 'Test upgrade with version preservation'
    dependsOn: TestFreshInstall
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "================================================"
        echo "UPGRADE TEST (Version Preservation)"
        echo "================================================"
        echo ""
        
        # This test simulates upgrade by:
        # 1. Creating a fake old version directory
        # 2. Upgrading to current version
        # 3. Verifying both versions coexist
        
        echo "Setting up mock previous installation..."
        
        INSTALL_ROOT="/usr/local/microsoft/azure-cli"
        OLD_VERSION="2.79.0"
        NEW_VERSION="$(AzureCliVersion)"
        
        # Create mock old version
        sudo mkdir -p "$INSTALL_ROOT/$OLD_VERSION/bin"
        echo "Mock version $OLD_VERSION" | sudo tee "$INSTALL_ROOT/$OLD_VERSION/bin/mock.txt"
        sudo ln -sf "$OLD_VERSION" "$INSTALL_ROOT/current"
        
        echo "Mock old version created: $OLD_VERSION"
        echo ""
        
        # Install current version (simulates upgrade)
        echo "Installing current version (simulating upgrade)..."
        brew tap $(HomebrewTapRepo) 2>/dev/null || true
        brew install --cask $(CaskName)
        
        echo ""
        echo "=== Checking Version Preservation ==="
        
        # Both versions should exist
        if [ ! -d "$INSTALL_ROOT/$OLD_VERSION" ]; then
          echo "❌ Old version directory removed (should be preserved)"
          exit 1
        fi
        echo "✅ Old version preserved: $OLD_VERSION"
        
        if [ ! -d "$INSTALL_ROOT/$NEW_VERSION" ]; then
          echo "❌ New version directory not found"
          exit 1
        fi
        echo "✅ New version installed: $NEW_VERSION"
        
        # Current should point to new version
        CURRENT_TARGET=$(readlink "$INSTALL_ROOT/current")
        if [ "$CURRENT_TARGET" != "$NEW_VERSION" ]; then
          echo "❌ Current symlink not updated (points to $CURRENT_TARGET)"
          exit 1
        fi
        echo "✅ Current symlink updated to: $NEW_VERSION"
        
        # List all versions
        echo ""
        echo "All installed versions:"
        ls -la "$INSTALL_ROOT/"
        
        echo ""
        echo "✅ Upgrade test PASSED - versions preserved correctly"
        
      displayName: 'Test upgrade scenario'
  
  - job: TestCleanup
    displayName: 'Test cleanup utility'
    dependsOn: TestUpgrade
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "================================================"
        echo "CLEANUP UTILITY TEST"
        echo "================================================"
        echo ""
        
        INSTALL_ROOT="/usr/local/microsoft/azure-cli"
        CLEANUP_SCRIPT="$INSTALL_ROOT/cleanup-old-versions.sh"
        
        if [ ! -f "$CLEANUP_SCRIPT" ]; then
          echo "⚠️  Cleanup script not found: $CLEANUP_SCRIPT"
          echo "This is expected if the PKG doesn't include it yet"
          exit 0
        fi
        
        echo "Found cleanup script: $CLEANUP_SCRIPT"
        echo ""
        
        # Show current versions
        echo "Versions before cleanup:"
        ls -d "$INSTALL_ROOT"/*/ 2>/dev/null || echo "No version directories"
        
        echo ""
        echo "Current active version:"
        readlink "$INSTALL_ROOT/current"
        
        # Test cleanup script (dry run mode if available)
        echo ""
        echo "Testing cleanup script..."
        sudo "$CLEANUP_SCRIPT" || echo "Cleanup script executed"
        
        echo ""
        echo "✅ Cleanup utility test completed"
        
      displayName: 'Test cleanup utility'
  
  - job: TestUninstall
    displayName: 'Test uninstall behavior'
    dependsOn: TestCleanup
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "================================================"
        echo "UNINSTALL TEST"
        echo "================================================"
        echo ""
        
        INSTALL_ROOT="/usr/local/microsoft/azure-cli"
        
        # Show what's installed before uninstall
        echo "Before uninstall:"
        ls -la "$INSTALL_ROOT/" 2>/dev/null || echo "Directory not found"
        
        echo ""
        echo "Uninstalling $(CaskName)..."
        brew uninstall --cask $(CaskName)
        
        echo ""
        echo "=== Verifying Uninstall ==="
        
        # Launcher should be removed
        if [ -f "/usr/local/bin/az" ]; then
          echo "❌ Launcher still exists"
          exit 1
        fi
        echo "✅ Launcher removed"
        
        # Current symlink should be removed
        if [ -L "$INSTALL_ROOT/current" ]; then
          echo "❌ Current symlink still exists"
          exit 1
        fi
        echo "✅ Current symlink removed"
        
        # Version directories should still exist (per design)
        if [ -d "$INSTALL_ROOT/$(AzureCliVersion)" ]; then
          echo "✅ Version directory preserved (by design)"
        else
          echo "ℹ️  Version directory removed (acceptable)"
        fi
        
        echo ""
        echo "=== Testing ZAP (Complete Removal) ==="
        
        # Reinstall for zap test
        brew install --cask $(CaskName)
        
        # Zap should remove everything
        brew uninstall --zap --cask $(CaskName)
        
        if [ -d "$INSTALL_ROOT" ]; then
          echo "⚠️  Installation directory still exists after zap"
          ls -la "$INSTALL_ROOT/"
        else
          echo "✅ Complete removal with --zap successful"
        fi
        
        echo ""
        echo "✅ Uninstall test PASSED"
        
      displayName: 'Test uninstall and zap'

# ============================================================================
# STAGE 9: RELEASE SUMMARY
# ============================================================================
- stage: ReleaseSummary
  displayName: 'Stage 9: Release Summary'
  dependsOn:
  - DownloadAndExtract
  - SignBinaries
  - RepackageAndSignPkg
  - NotarizeWithApple
  - GatekeeperSecurityValidation
  - PublishToGitHub
  - UpdateHomebrewCask
  - TestInstallation
  condition: always()
  jobs:
  - job: PrintSummary
    displayName: 'Print complete summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "========================================================================"
        echo "AZURE CLI PR2 RELEASE SUMMARY"
        echo "========================================================================"
        echo ""
        echo "Release: $(AzureCliVersion)"
        echo "Build ID: $(Build.BuildId)"
        echo "Tag: $(ReleaseTag)"
        echo "Cask: $(CaskName)"
