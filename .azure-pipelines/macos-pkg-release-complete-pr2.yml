        echo "========================================================================"
        echo "RELEASE ARTIFACTS"
        echo "========================================================================"
        echo ""
        echo "GitHub Release:"
        echo "  https://github.com/$(GitHubRepo)/releases/tag/$(ReleaseTag)"
        echo ""
        echo "PKG Download:"
        echo "  https://github.com/$(GitHubRepo)/releases/download/$(ReleaseTag)/azure-cli-$(AzureCliVersion).pkg"
        echo ""
        echo "Homebrew Cask:"
        echo "  Repository: https://github.com/$(HomebrewTapRepo)"
        echo "  Cask: $(CaskName)"
        echo ""
        echo "========================================================================"
        echo "INSTALLATION INSTRUCTIONS"
        echo "========================================================================"
        echo ""
        echo "Option 1: Homebrew Cask (Recommended)"
        echo "  brew tap $(HomebrewTapRepo)"
        echo "  brew install --cask $(CaskName)"
        echo ""
        echo "Option 2: Direct PKG Install"
        echo "  curl -L https://github.com/$(GitHubRepo)/releases/download/$(ReleaseTag)/azure-cli-$(AzureCliVersion).pkg -o azure-cli.pkg"
        echo "  sudo installer -pkg azure-cli.pkg -target /"
        echo ""
        echo "========================================================================"
        echo "VERSIONING FEATURES"
        echo "========================================================================"
        echo ""
        echo "Installation Path:"
        echo "  /usr/local/microsoft/azure-cli/$(AzureCliVersion)/"
        echo ""
        echo "Active Version Symlink:"
        echo "  /usr/local/microsoft/azure-cli/current -> $(AzureCliVersion)"
        echo ""
        echo "Features:"
        echo "  ✅ Side-by-side version installations"
        echo "  ✅ Automatic version preservation on upgrade"
        echo "  ✅ Easy rollback by changing symlink"
        echo "  ✅ Cleanup utility for old versions"
        echo ""
        echo "========================================================================"
        echo "VERIFICATION"
        echo "========================================================================"
        echo ""
        echo "After installation, verify:"
        echo "  az --version"
        echo "  ls -la /usr/local/microsoft/azure-cli/"
        echo "  readlink /usr/local/microsoft/azure-cli/current"
        echo ""
        echo "To remove old versions:"
        echo "  sudo /usr/local/microsoft/azure-cli/cleanup-old-versions.sh"
        echo ""
        echo "========================================================================"
        echo "PIPELINE STAGES STATUS"
        echo "========================================================================"
        echo ""
        echo "Stage 1 - Download & Extract:   $(stageDependencies.DownloadAndExtract.result)"
        echo "Stage 2 - Sign Binaries:         $(stageDependencies.SignBinaries.result)"
        echo "Stage 3 - Repackage & Sign PKG:  $(stageDependencies.RepackageAndSignPkg.result)"
        echo "Stage 4 - Notarize with Apple:   $(stageDependencies.NotarizeWithApple.result)"
        echo "Stage 5 - Gatekeeper Tests:      $(stageDependencies.GatekeeperSecurityValidation.result)"
        echo "Stage 6 - GitHub Release:        $(stageDependencies.PublishToGitHub.result)"
        echo "Stage 7 - Update Homebrew Cask:  $(stageDependencies.UpdateHomebrewCask.result)"
        echo "Stage 8 - Test Installation:     $(stageDependencies.TestInstallation.result)"
        echo ""
        echo "========================================================================"
        echo "RELEASE COMPLETE"
        echo "========================================================================"
        
      displayName: 'Release summary'
