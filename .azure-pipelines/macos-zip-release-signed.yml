      displayName: 'Publish x86_64 signed content'

# ============================================================================
# STAGE 4: REPACKAGE SIGNED ZIPS
# ============================================================================
- stage: RepackageZips
  displayName: 'Stage 4: Repackage Signed ZIPs'
  dependsOn:
  - SignARM64Binaries
  - SignX86_64Binaries
  - DownloadAndConvert
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndConvert.ConvertARM64.outputs['ConvertARM64.AzureCliVersion'] ]
  jobs:
  - job: RepackageARM64
    displayName: 'Repackage ARM64 ZIP (macOS)'
    pool:
      vmImage: 'macos-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: arm64-signed-content
      displayName: 'Download ARM64 signed content'
    
    - bash: |
        echo "=== Repackaging ARM64 Signed ZIP ==="
        
        CONTENT_DIR="$(Pipeline.Workspace)/arm64-signed-content"
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/signed-zips"
        mkdir -p "$OUTPUT_DIR"
        
        VERSION="$(AzureCliVersion)"
        ZIP_NAME="azure-cli-${VERSION}-macos-arm64-signed.zip"
        
        echo "Creating signed ZIP: $ZIP_NAME"
        
        cd "$CONTENT_DIR"
        zip -r -q "$OUTPUT_DIR/$ZIP_NAME" .
        
        # Generate SHA256
        cd "$OUTPUT_DIR"
        shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"
        
        echo ""
        echo "✅ ARM64 signed ZIP created"
        ls -lh "$OUTPUT_DIR"
      displayName: 'Create ARM64 signed ZIP'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-zips
      artifact: arm64-signed-zip
      displayName: 'Publish ARM64 signed ZIP'
  
  - job: RepackageX86_64
    displayName: 'Repackage x86_64 ZIP (macOS)'
    pool:
      vmImage: 'macos-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: x86_64-signed-content
      displayName: 'Download x86_64 signed content'
    
    - bash: |
        echo "=== Repackaging x86_64 Signed ZIP ==="
        
        CONTENT_DIR="$(Pipeline.Workspace)/x86_64-signed-content"
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/signed-zips"
        mkdir -p "$OUTPUT_DIR"
        
        VERSION="$(AzureCliVersion)"
        ZIP_NAME="azure-cli-${VERSION}-macos-x86_64-signed.zip"
        
        echo "Creating signed ZIP: $ZIP_NAME"
        
        cd "$CONTENT_DIR"
        zip -r -q "$OUTPUT_DIR/$ZIP_NAME" .
        
        # Generate SHA256
        cd "$OUTPUT_DIR"
        shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"
        
        echo ""
        echo "✅ x86_64 signed ZIP created"
        ls -lh "$OUTPUT_DIR"
      displayName: 'Create x86_64 signed ZIP'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-zips
      artifact: x86_64-signed-zip
      displayName: 'Publish x86_64 signed ZIP'

# ============================================================================
# STAGE 5: NOTARIZE ZIPS WITH APPLE (ESRP) - DIRECT NOTARIZATION!
# ============================================================================
- stage: NotarizeWithApple
  displayName: 'Stage 5: Notarize ZIPs with Apple via ESRP'
  dependsOn:
  - RepackageZips
  - DownloadAndConvert
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndConvert.ConvertARM64.outputs['ConvertARM64.AzureCliVersion'] ]
  jobs:
  - job: NotarizeARM64
    displayName: 'Notarize ARM64 ZIP (ESRP on Windows)'
    pool:
      vmImage: 'windows-2022'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: arm64-signed-zip
      displayName: 'Download ARM64 signed ZIP'
    
    - pwsh: |
        Write-Host "=== Preparing ARM64 Signed ZIP for Apple Notarization ==="
        Write-Host "NOTE: ZIP can be notarized directly - no wrapper needed!"
        
        $zipDir = "$(Pipeline.Workspace)/arm64-signed-zip"
        $zip = Get-ChildItem -Path $zipDir -Filter "*-signed.zip" -File | Select-Object -First 1
        
        if (-not $zip) {
          Write-Error "❌ No signed ZIP found"
          exit 1
        }
        
        Write-Host "✅ Found signed ZIP: $($zip.Name)"
        Write-Host "   Size: $([math]::Round((Get-Item $zip.FullName).Length / 1MB, 2)) MB"
        Write-Host ""
        Write-Host "Ready for direct notarization (no conversion needed!)"
        
      displayName: 'Prepare ARM64 ZIP for notarization'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Notarize ARM64 ZIP with Apple'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/arm64-signed-zip'
        Pattern: '*-signed.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppNotarize",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "BundleId": "$(BundleId)"
              }
            }
          ]
        SessionTimeout: '60'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "=== Collecting Notarized ARM64 ZIP ==="
        
        $zipDir = "$(Pipeline.Workspace)/arm64-signed-zip"
        $outputDir = "$(Build.ArtifactStagingDirectory)/notarized-zips"
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        
        # Copy notarized ZIP
        $zip = Get-ChildItem -Path $zipDir -Filter "*-signed.zip" -File | Select-Object -First 1
        
        if ($zip) {
          $notarizedName = $zip.Name -replace '-signed\.zip$', '-notarized.zip'
          Copy-Item -Path $zip.FullName -Destination "$outputDir/$notarizedName" -Force
          
          # Copy SHA256
          if (Test-Path "$($zip.FullName).sha256") {
            Copy-Item -Path "$($zip.FullName).sha256" -Destination "$outputDir/$notarizedName.sha256" -Force
          }
          
          Write-Host "✅ ARM64 notarized ZIP ready: $notarizedName"
        }
        
      displayName: 'Collect notarized ARM64 ZIP'
    
    - publish: $(Build.ArtifactStagingDirectory)/notarized-zips
      artifact: arm64-notarized-zip
      displayName: 'Publish ARM64 notarized ZIP'
  
  - job: NotarizeX86_64
    displayName: 'Notarize x86_64 ZIP (ESRP on Windows)'
    pool:
      vmImage: 'windows-2022'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: x86_64-signed-zip
      displayName: 'Download x86_64 signed ZIP'
    
    - pwsh: |
        Write-Host "=== Preparing x86_64 Signed ZIP for Apple Notarization ==="
        
        $zipDir = "$(Pipeline.Workspace)/x86_64-signed-zip"
        $zip = Get-ChildItem -Path $zipDir -Filter "*-signed.zip" -File | Select-Object -First 1
        
        if (-not $zip) {
          Write-Error "❌ No signed ZIP found"
          exit 1
        }
        
        Write-Host "✅ Found signed ZIP: $($zip.Name)"
        Write-Host "   Size: $([math]::Round((Get-Item $zip.FullName).Length / 1MB, 2)) MB"
        
      displayName: 'Prepare x86_64 ZIP for notarization'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Notarize x86_64 ZIP with Apple'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/x86_64-signed-zip'
        Pattern: '*-signed.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppNotarize",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "BundleId": "$(BundleId)"
              }
            }
          ]
        SessionTimeout: '60'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "=== Collecting Notarized x86_64 ZIP ==="
        
        $zipDir = "$(Pipeline.Workspace)/x86_64-signed-zip"
        $outputDir = "$(Build.ArtifactStagingDirectory)/notarized-zips"
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        
        # Copy notarized ZIP
        $zip = Get-ChildItem -Path $zipDir -Filter "*-signed.zip" -File | Select-Object -First 1
        
        if ($zip) {
          $notarizedName = $zip.Name -replace '-signed\.zip$', '-notarized.zip'
          Copy-Item -Path $zip.FullName -Destination "$outputDir/$notarizedName" -Force
          
          # Copy SHA256
          if (Test-Path "$($zip.FullName).sha256") {
            Copy-Item -Path "$($zip.FullName).sha256" -Destination "$outputDir/$notarizedName.sha256" -Force
          }
          
          Write-Host "✅ x86_64 notarized ZIP ready: $notarizedName"
        }
        
      displayName: 'Collect notarized x86_64 ZIP'
    
    - publish: $(Build.ArtifactStagingDirectory)/notarized-zips
      artifact: x86_64-notarized-zip
      displayName: 'Publish x86_64 notarized ZIP'

  # CRITICAL: Staple notarization ticket to ZIPs (macOS only)
  - job: StapleTicket
    displayName: 'Staple notarization ticket to ZIPs (macOS)'
    dependsOn:
    - NotarizeARM64
    - NotarizeX86_64
    pool:
      vmImage: 'macos-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: arm64-notarized-zip
      displayName: 'Download ARM64 notarized ZIP'
    
    - download: current
      artifact: x86_64-notarized-zip
      displayName: 'Download x86_64 notarized ZIP'
    
    - bash: |
        echo "=== Stapling Notarization Tickets to ZIPs ==="
        echo "This embeds the Apple notarization ticket into the ZIP files"
        echo ""
        
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/stapled-zips"
        mkdir -p "$OUTPUT_DIR"
        
        # Staple ARM64
        ARM64_ZIP=$(find $(Pipeline.Workspace)/arm64-notarized-zip -name "*-notarized.zip" | head -1)
        if [ -n "$ARM64_ZIP" ]; then
          echo "Stapling ARM64 ZIP: $(basename "$ARM64_ZIP")"
          
          # Copy to output first
          cp "$ARM64_ZIP" "$OUTPUT_DIR/"
          cp "${ARM64_ZIP}.sha256" "$OUTPUT_DIR/" 2>/dev/null || true
          
          # Staple the ticket
          cd "$OUTPUT_DIR"
          xcrun stapler staple "$(basename "$ARM64_ZIP")"
          
          # Verify
          echo "Verifying stapled ticket..."
          xcrun stapler validate "$(basename "$ARM64_ZIP")"
          
          echo "✅ ARM64 ZIP stapled successfully"
          echo ""
        fi
        
        # Staple x86_64
        X86_64_ZIP=$(find $(Pipeline.Workspace)/x86_64-notarized-zip -name "*-notarized.zip" | head -1)
        if [ -n "$X86_64_ZIP" ]; then
          echo "Stapling x86_64 ZIP: $(basename "$X86_64_ZIP")"
          
          # Copy to output first
          cp "$X86_64_ZIP" "$OUTPUT_DIR/"
          cp "${X86_64_ZIP}.sha256" "$OUTPUT_DIR/" 2>/dev/null || true
          
          # Staple the ticket
          cd "$OUTPUT_DIR"
          xcrun stapler staple "$(basename "$X86_64_ZIP")"
          
          # Verify
          echo "Verifying stapled ticket..."
          xcrun stapler validate "$(basename "$X86_64_ZIP")"
          
          echo "✅ x86_64 ZIP stapled successfully"
          echo ""
        fi
        
        echo "=== Stapling Complete ==="
        ls -lh "$OUTPUT_DIR"
      displayName: 'Staple notarization tickets'
    
    - publish: $(Build.ArtifactStagingDirectory)/stapled-zips
      artifact: stapled-zips
      displayName: 'Publish stapled ZIPs'

# ============================================================================
# STAGE 6: VERIFY SIGNATURES AND NOTARIZATION
# ============================================================================
- stage: VerifySignatures
  displayName: 'Stage 6: Verify Signatures and Notarization'
  dependsOn: NotarizeWithApple
  condition: succeeded()
  jobs:
  - job: VerifyARM64
    displayName: 'Verify ARM64 signatures and notarization'
    pool:
      vmImage: 'macos-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: stapled-zips
      displayName: 'Download stapled ZIPs'
    
    - bash: |
        echo "=== Verifying ARM64 ZIP Signatures and Notarization ==="
        
        cd $(Pipeline.Workspace)/stapled-zips
        ARM64_ZIP=$(ls *-arm64-notarized.zip 2>/dev/null | head -1)
        
        if [ -z "$ARM64_ZIP" ]; then
          echo "❌ ARM64 ZIP not found"
          exit 1
        fi
        
        echo "Verifying: $ARM64_ZIP"
        echo ""
        
        # Verify stapled ticket
        echo "1. Checking stapled notarization ticket..."
        xcrun stapler validate "$ARM64_ZIP"
        echo "✅ Notarization ticket valid"
        echo ""
        
        # Extract and verify binary signatures
        echo "2. Extracting ZIP to verify binary signatures..."
        EXTRACT_DIR="verify-extract"
        mkdir -p "$EXTRACT_DIR"
        unzip -q "$ARM64_ZIP" -d "$EXTRACT_DIR"
        
        echo "3. Verifying binary signatures..."
        for binary in "$EXTRACT_DIR/bin/python3" "$EXTRACT_DIR/bin/az"; do
          if [ -f "$binary" ]; then
            echo "   Checking: $(basename "$binary")"
            codesign -vvv "$binary" 2>&1 | head -5
            echo ""
          fi
        done
        
        echo "✅ ARM64 verification complete"
      displayName: 'Verify ARM64'
  
  - job: VerifyX86_64
    displayName: 'Verify x86_64 signatures and notarization'
    pool:
      vmImage: 'macos-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: stapled-zips
      displayName: 'Download stapled ZIPs'
    
    - bash: |
        echo "=== Verifying x86_64 ZIP Signatures and Notarization ==="
        
        cd $(Pipeline.Workspace)/stapled-zips
        X86_64_ZIP=$(ls *-x86_64-notarized.zip 2>/dev/null | head -1)
        
        if [ -z "$X86_64_ZIP" ]; then
          echo "❌ x86_64 ZIP not found"
          exit 1
        fi
        
        echo "Verifying: $X86_64_ZIP"
        echo ""
        
        # Verify stapled ticket
        echo "1. Checking stapled notarization ticket..."
        xcrun stapler validate "$X86_64_ZIP"
        echo "✅ Notarization ticket valid"
        echo ""
        
        # Extract and verify binary signatures
        echo "2. Extracting ZIP to verify binary signatures..."
        EXTRACT_DIR="verify-extract"
        mkdir -p "$EXTRACT_DIR"
        unzip -q "$X86_64_ZIP" -d "$EXTRACT_DIR"
        
        echo "3. Verifying binary signatures..."
        for binary in "$EXTRACT_DIR/bin/python3" "$EXTRACT_DIR/bin/az"; do
          if [ -f "$binary" ]; then
            echo "   Checking: $(basename "$binary")"
            codesign -vvv "$binary" 2>&1 | head -5
            echo ""
          fi
        done
        
        echo "✅ x86_64 verification complete"
      displayName: 'Verify x86_64'

# ============================================================================
# STAGE 7: PUBLISH TO GITHUB RELEASE
# ============================================================================
- stage: PublishToGitHub
  displayName: 'Stage 7: Publish to GitHub Release'
  dependsOn:
  - VerifySignatures
  - DownloadAndConvert
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndConvert.ConvertARM64.outputs['ConvertARM64.AzureCliVersion'] ]
    ReleaseTag: $[ stageDependencies.DownloadAndConvert.ConvertARM64.outputs['ConvertARM64.ReleaseTag'] ]
  jobs:
  - job: ConsolidateAndRelease
    displayName: 'Consolidate ZIPs and create GitHub release'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: stapled-zips
      displayName: 'Download stapled ZIPs'
    
    - bash: |
        echo "=== Preparing GitHub Release ==="
        
        mkdir -p release
        
        # Copy stapled ZIPs
        cp $(Pipeline.Workspace)/stapled-zips/*.zip release/
        cp $(Pipeline.Workspace)/stapled-zips/*.sha256 release/
        
        echo ""
        echo "Release assets:"
        ls -lh release/
      displayName: 'Prepare release assets'
    
    - pwsh: |
        $version = "$(AzureCliVersion)"
        $releaseTag = "$(ReleaseTag)"
        
        $releaseNotes = @"
        # Azure CLI $version - ZIP Distribution (Signed & Notarized)
        
        **✅ Fully signed and notarized by Apple - No Gatekeeper warnings!**
        
        ## Downloads
        
        ### ARM64 (Apple Silicon: M1, M2, M3, M4)
        ``````
        https://github.com/$(GitHubRepo)/releases/download/$releaseTag/azure-cli-${version}-macos-arm64-notarized.zip
        ``````
        
        **SHA256:** See .sha256 file
        
        ### x86_64 (Intel Macs)
        ``````
        https://github.com/$(GitHubRepo)/releases/download/$releaseTag/azure-cli-${version}-macos-x86_64-notarized.zip
        ``````
        
        **SHA256:** See .sha256 file
        
        ## Installation
        
        ``````bash
        # Download (browser or curl - both work!)
        curl -fsSL -o azure-cli.zip "https://github.com/$(GitHubRepo)/releases/download/$releaseTag/azure-cli-${version}-macos-arm64-notarized.zip"
        
        # Verify checksum
        curl -fsSL -o azure-cli.zip.sha256 "https://github.com/$(GitHubRepo)/releases/download/$releaseTag/azure-cli-${version}-macos-arm64-notarized.zip.sha256"
        shasum -a 256 -c azure-cli.zip.sha256
        
        # Extract
        mkdir -p ~/.local/azure-cli
        unzip azure-cli.zip -d ~/.local/azure-cli
        
        # Add to PATH
        echo 'export PATH="\$HOME/.local/azure-cli/bin:\$PATH"' >> ~/.zshrc
        source ~/.zshrc
        
        # Verify (no warnings!)
        az --version
        ``````
        
        ## Features
        
        - ✅ **Apple notarized** - No Gatekeeper warnings
        - ✅ **Code-signed binaries** - All Mach-O files signed with Developer ID
        - ✅ **Stapled ticket** - Notarization ticket embedded in ZIP
        - ✅ Self-contained Python 3.13.11 runtime
        - ✅ All Azure CLI modules pre-installed
        - ✅ Works with browser downloads
        - ✅ Works in air-gapped environments (after download)
        
        ## Security
        
        - Code-signed with: Developer ID Application
        - Notarized by: Apple
        - Certificate: Microsoft Corporation
        - Bundle ID: $(BundleId)
        
        ## Build Information
        
        - Version: $version
        - Build Pipeline: $(Build.DefinitionName)
        - Build ID: $(Build.BuildId)
        - Build Date: $(Build.BuildDate)
        - Source Build: $(ZipBuildId)
        "@
        
        Set-Content -Path "$(Build.ArtifactStagingDirectory)/release-notes.md" -Value $releaseNotes
      displayName: 'Prepare release notes'
    
    - task: GitHubRelease@1
      displayName: 'Delete existing release (if any)'
      continueOnError: true
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'delete'
        tag: '$(ReleaseTag)'
    
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(ReleaseTag)'
        title: 'Azure CLI $(AzureCliVersion) - ZIP (Signed & Notarized)'
        releaseNotesFilePath: '$(Build.ArtifactStagingDirectory)/release-notes.md'
        assets: 'release/*'
        isDraft: ${{ parameters.IsDraft }}
        isPreRelease: ${{ parameters.IsPreRelease }}
        addChangeLog: false

