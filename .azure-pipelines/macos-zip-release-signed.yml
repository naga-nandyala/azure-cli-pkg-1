# Azure CLI - Complete macOS ZIP Release Pipeline with ESRP Signing
# This pipeline performs:
# 1. Download tar.gz from build pipeline and convert to ZIP
# 2. Extract ZIP contents
# 3. Sign all Mach-O binaries with ESRP (Developer ID Application certificate)
# 4. Repackage signed ZIP
# 5. Notarize ZIP directly with Apple via ESRP (no wrapper needed!)
# 6. Staple notarization ticket to ZIP
# 7. Verify signatures and notarization
# 8. Publish to GitHub Release
# 9. Update Homebrew formula
# 10. Test installation

trigger: none # Manual trigger only

parameters:
  - name: TarballBuildId
    displayName: 'Tarball Build ID (from macos-tarball-build pipeline)'
    type: string
    default: '289882'
  - name: BundleId
    displayName: 'Bundle ID for signing/notarization'
    type: string
    default: 'com.microsoft.azure.cli'
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'
  - name: FormulaName
    displayName: 'Homebrew Formula Name'
    type: string
    default: 'azure-cli-zip-signed'
  - name: IsPreRelease
    displayName: 'Mark GitHub release as Pre-release'
    type: boolean
    default: false
  - name: IsDraft
    displayName: 'Create GitHub release as Draft'
    type: boolean
    default: false

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: github.com_naga-nandyala
    name: naga-nandyala/homebrew-mycli-app

variables:
  - group: 'AME ESRP Variable Group'
  
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true
  - name: TarballBuildId
    value: ${{ parameters.TarballBuildId }}
  - name: BundleId
    value: ${{ parameters.BundleId }}
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  - name: HomebrewTapRepo
    value: ${{ parameters.HomebrewTapRepo }}
  - name: FormulaName
    value: ${{ parameters.FormulaName }}
  - name: GITHUB_TOKEN
    value: $[ resources.repositories['homebrewtap'].token ]

name: zip-signed-release-$(Build.BuildId)

stages:
# ============================================================================
# STAGE 1: DOWNLOAD TARBALLS AND CONVERT TO ZIP
# ============================================================================
- stage: DownloadAndConvert
  displayName: 'Stage 1: Download Tarballs and Convert to ZIP'
  jobs:
  - job: ConvertARM64
    displayName: 'Download ARM64 tarball and convert to ZIP'
    pool:
      vmImage: 'macos-latest'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARM64 tarball artifact'
      inputs:
        buildType: 'specific'
        project: '$(System.TeamProjectId)'
        definition: '$(System.DefinitionId)'
        buildVersionToDownload: 'specific'
        buildId: '$(TarballBuildId)'
        artifactName: 'tarball-arm64'
        targetPath: '$(Pipeline.Workspace)/arm64-tarball'
    
    - bash: |
        echo "=== Converting ARM64 Tarball to ZIP ==="
        cd $(Pipeline.Workspace)/arm64-tarball
        
        TARBALL=$(ls azure-cli-*.tar.gz 2>/dev/null | grep -v '.sha256' | head -1)
        
        if [ -z "$TARBALL" ]; then
          echo "❌ Tarball not found"
          exit 1
        fi
        
        echo "Found tarball: $TARBALL"
        echo "Size: $(du -h "$TARBALL" | cut -f1)"
        
        # Extract version from filename
        VERSION=$(echo "$TARBALL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "Detected version: $VERSION"
        echo "##vso[task.setvariable variable=AzureCliVersion;isOutput=true]$VERSION"
        echo "##vso[task.setvariable variable=ReleaseTag;isOutput=true]v${VERSION}-zip-tarball"
        
        # Create extraction directory
        EXTRACT_DIR="$(Pipeline.Workspace)/arm64-extracted"
        mkdir -p "$EXTRACT_DIR"
        
        # Extract tarball
        echo ""
        echo "Extracting tarball to: $EXTRACT_DIR"
        tar -xzf "$TARBALL" -C "$EXTRACT_DIR"
        
        # Create ZIP from extracted content
        ZIP_DIR="$(Pipeline.Workspace)/arm64-zip"
        mkdir -p "$ZIP_DIR"
        
        ZIP_NAME="azure-cli-${VERSION}-macos-arm64.zip"
        echo ""
        echo "Creating ZIP: $ZIP_NAME"
        cd "$EXTRACT_DIR"
        zip -r -q "$ZIP_DIR/$ZIP_NAME" .
        
        # Generate SHA256 for ZIP
        cd "$ZIP_DIR"
        shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"
        
        echo ""
        echo "✅ ARM64 tarball converted to ZIP"
        echo "ZIP: $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))"
      displayName: 'Convert ARM64 tarball to ZIP'
      name: ConvertARM64
    
    - publish: $(Pipeline.Workspace)/arm64-extracted
      artifact: arm64-extracted-content
      displayName: 'Publish ARM64 extracted content'
    
    - publish: $(Pipeline.Workspace)/arm64-zip
      artifact: arm64-original-zip
      displayName: 'Publish ARM64 ZIP'
  
  - job: ConvertX86_64
    displayName: 'Download x86_64 tarball and convert to ZIP'
    pool:
      vmImage: 'macos-latest'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download x86_64 tarball artifact'
      inputs:
        buildType: 'specific'
        project: '$(System.TeamProjectId)'
        definition: '$(System.DefinitionId)'
        buildVersionToDownload: 'specific'
        buildId: '$(TarballBuildId)'
        artifactName: 'tarball-x86_64'
        targetPath: '$(Pipeline.Workspace)/x86_64-tarball'
    
    - bash: |
        echo "=== Converting x86_64 Tarball to ZIP ==="
        cd $(Pipeline.Workspace)/x86_64-tarball
        
        TARBALL=$(ls azure-cli-*.tar.gz 2>/dev/null | grep -v '.sha256' | head -1)
        
        if [ -z "$TARBALL" ]; then
          echo "❌ Tarball not found"
          exit 1
        fi
        
        echo "Found tarball: $TARBALL"
        echo "Size: $(du -h "$TARBALL" | cut -f1)"
        
        # Extract version from filename
        VERSION=$(echo "$TARBALL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "Detected version: $VERSION"
        
        # Create extraction directory
        EXTRACT_DIR="$(Pipeline.Workspace)/x86_64-extracted"
        mkdir -p "$EXTRACT_DIR"
        
        # Extract tarball
        echo ""
        echo "Extracting tarball to: $EXTRACT_DIR"
        tar -xzf "$TARBALL" -C "$EXTRACT_DIR"
        
        # Create ZIP from extracted content
        ZIP_DIR="$(Pipeline.Workspace)/x86_64-zip"
        mkdir -p "$ZIP_DIR"
        
        ZIP_NAME="azure-cli-${VERSION}-macos-x86_64.zip"
        echo ""
        echo "Creating ZIP: $ZIP_NAME"
        cd "$EXTRACT_DIR"
        zip -r -q "$ZIP_DIR/$ZIP_NAME" .
        
        # Generate SHA256 for ZIP
        cd "$ZIP_DIR"
        shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"
        
        echo ""
        echo "✅ x86_64 tarball converted to ZIP"
        echo "ZIP: $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))"
      displayName: 'Convert x86_64 tarball to ZIP'
    
    - publish: $(Pipeline.Workspace)/x86_64-extracted
      artifact: x86_64-extracted-content
      displayName: 'Publish x86_64 extracted content'
    
    - publish: $(Pipeline.Workspace)/x86_64-zip
      artifact: x86_64-original-zip
      displayName: 'Publish x86_64 ZIP'

# ============================================================================
# STAGE 2: SIGN ARM64 BINARIES WITH ESRP
# ============================================================================
- stage: SignARM64Binaries
  displayName: 'Stage 2: Sign ARM64 Binaries with ESRP'
  dependsOn: DownloadAndConvert
  condition: succeeded()
  jobs:
  - job: SignARM64
    displayName: 'Sign ARM64 binaries using ESRP'
    pool:
      vmImage: 'windows-2022'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: arm64-extracted-content
      displayName: 'Download ARM64 extracted content'
    
    - download: current
      artifact: arm64-original-zip
      displayName: 'Download ARM64 original ZIP'
    
    - pwsh: |
        Write-Host "=== Preparing ARM64 Binaries for ESRP Signing ==="
        
        $extractedDir = "$(Pipeline.Workspace)/arm64-extracted-content"
        $signingDir = "$(Pipeline.Workspace)/binaries-to-sign"
        New-Item -ItemType Directory -Path $signingDir -Force | Out-Null
        
        Write-Host "Searching for Mach-O binaries in: $extractedDir"
        
        # Find all Mach-O binaries (using file command would be better, but on Windows we'll use extensions and paths)
        $binaryPaths = @(
          "bin/python*",
          "bin/pip*",
          "bin/az",
          "libexec/bin/*"
        )
        
        $count = 0
        foreach ($pattern in $binaryPaths) {
          $fullPattern = Join-Path $extractedDir $pattern
          $files = Get-ChildItem -Path $fullPattern -File -ErrorAction SilentlyContinue
          
          foreach ($file in $files) {
            # Skip .bat, .ps1, .sh, .py files
            if ($file.Extension -in @('.bat', '.ps1', '.sh', '.py', '.pyc', '.txt', '.md')) {
              continue
            }
            
            $relativePath = $file.FullName.Substring($extractedDir.Length + 1)
            $targetDir = Join-Path $signingDir (Split-Path $relativePath -Parent)
            New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            
            Copy-Item -Path $file.FullName -Destination (Join-Path $signingDir $relativePath) -Force
            $count++
            Write-Host "  ✅ $relativePath"
          }
        }
        
        Write-Host ""
        Write-Host "Total binaries prepared for signing: $count"
        
        if ($count -eq 0) {
          Write-Error "❌ No binaries found to sign"
          exit 1
        }
      displayName: 'Prepare binaries for signing'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Sign ARM64 binaries'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/binaries-to-sign'
        Pattern: '**'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppDeveloperSign",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {}
            }
          ]
        SessionTimeout: '60'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "=== Copying Signed Binaries Back ==="
        
        $signedDir = "$(Pipeline.Workspace)/binaries-to-sign"
        $extractedDir = "$(Pipeline.Workspace)/arm64-extracted-content"
        $outputDir = "$(Build.ArtifactStagingDirectory)/arm64-signed-content"
        
        # Copy entire extracted content
        Write-Host "Copying extracted content to output..."
        Copy-Item -Path $extractedDir -Destination $outputDir -Recurse -Force
        
        # Overwrite with signed binaries
        Write-Host "Overwriting with signed binaries..."
        $signedFiles = Get-ChildItem -Path $signedDir -Recurse -File
        
        $count = 0
        foreach ($signedFile in $signedFiles) {
          $relativePath = $signedFile.FullName.Substring($signedDir.Length + 1)
          $targetPath = Join-Path $outputDir $relativePath
          
          Copy-Item -Path $signedFile.FullName -Destination $targetPath -Force
          $count++
          Write-Host "  ✅ $relativePath"
        }
        
        Write-Host ""
        Write-Host "✅ Copied $count signed binaries"
      displayName: 'Merge signed binaries'
    
    - publish: $(Build.ArtifactStagingDirectory)/arm64-signed-content
      artifact: arm64-signed-content
      displayName: 'Publish ARM64 signed content'

# ============================================================================
