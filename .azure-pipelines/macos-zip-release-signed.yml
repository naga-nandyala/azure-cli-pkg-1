    ReleaseTag: $[ stageDependencies.DownloadAndConvert.ConvertARM64.outputs['ConvertARM64.ReleaseTag'] ]
  jobs:
  - job: PrintSummary
    displayName: 'Print Release Summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "============================================"
        echo "Azure CLI ZIP Release - COMPLETE"
        echo "============================================"
        echo ""
        echo "Version: $(AzureCliVersion)"
        echo "Release Tag: $(ReleaseTag)"
        echo ""
        echo "✅ All binaries code-signed"
        echo "✅ ZIPs notarized by Apple"
        echo "✅ Notarization tickets stapled"
        echo "✅ Published to GitHub Releases"
        echo ""
        echo "🎉 NO GATEKEEPER WARNINGS FOR USERS! 🎉"
        echo ""
