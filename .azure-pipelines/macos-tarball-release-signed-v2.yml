# ============================================================================
# STAGE 4: NOTARIZE ARM64 SIGNED BINARIES
# ============================================================================
- stage: NotarizeARM64Binaries
  displayName: 'Stage 4: Notarize ARM64 Signed Binaries'
  dependsOn: SignARM64Binaries
  condition: succeeded()
  jobs:
  - job: NotarizeARM64
    displayName: 'Notarize ARM64 signed binaries (ESRP on Windows)'
    pool:
      vmImage: 'windows-2022'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: arm64-signed-binaries
      displayName: 'Download ARM64 signed binaries'
    
    - pwsh: |
        Write-Host "=== Preparing ARM64 Signed Binaries for Apple Notarization ==="
        Write-Host "NOTE: Notarizing binaries BEFORE merging into complete tarball"
        
        $signedDir = "$(Pipeline.Workspace)/arm64-signed-binaries"
        $zipPath = "$(Pipeline.Workspace)/arm64-signed-binaries.zip"
        
        # Count files
        $fileCount = (Get-ChildItem -Path $signedDir -File -Recurse).Count
        Write-Host "Files to notarize: $fileCount"
        
        Write-Host ""
        Write-Host "Creating ZIP for notarization..."
        Compress-Archive -Path "$signedDir/*" -DestinationPath $zipPath -Force
        
        Write-Host "✅ ZIP created: arm64-signed-binaries.zip"
        Write-Host "   Size: $([math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB"
        
      displayName: 'Prepare ARM64 binaries for notarization (create ZIP)'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Notarize ARM64 binaries with Apple'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)'
        Pattern: 'arm64-signed-binaries.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppNotarize",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "BundleId": "$(BundleId)"
              }
            }
          ]
        SessionTimeout: '60'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "=== Extracting Notarized ARM64 Binaries ==="
        
        $zipPath = "$(Pipeline.Workspace)/arm64-signed-binaries.zip"
        $outputDir = "$(Build.ArtifactStagingDirectory)/arm64-notarized-binaries"
        
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        
        Write-Host "Extracting notarized binaries from ZIP..."
        Expand-Archive -Path $zipPath -DestinationPath $outputDir -Force
        
        $extractedCount = (Get-ChildItem -Path $outputDir -File -Recurse).Count
        Write-Host "✅ Extracted $extractedCount notarized binaries"
        
      displayName: 'Extract notarized ARM64 binaries'
    
    - publish: $(Build.ArtifactStagingDirectory)/arm64-notarized-binaries
      artifact: arm64-notarized-binaries
      displayName: 'Publish ARM64 notarized binaries'

