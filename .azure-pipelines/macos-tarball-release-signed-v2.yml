# ============================================================================
# STAGE 6: REPACKAGE TARBALLS WITH NOTARIZED BINARIES
# ============================================================================
- stage: RepackageTarballs
  displayName: 'Stage 6: Repackage Tarballs with Notarized Binaries'
  dependsOn:
  - NotarizeARM64Binaries
  - DownloadAndExtract
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndExtract.DownloadAndExtractARM64.outputs['ExtractARM64.AzureCliVersion'] ]
  jobs:
  - job: RepackageARM64
    displayName: 'Repackage ARM64 tarball (macOS)'
    pool:
      vmImage: 'macos-15-arm64'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download notarized ARM64 binaries'
      inputs:
        artifactName: 'arm64-notarized-binaries'
        targetPath: '$(Pipeline.Workspace)/arm64-signed'
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARM64 original structure'
      inputs:
        artifactName: 'arm64-original-structure'
        targetPath: '$(Pipeline.Workspace)'
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARM64 unsigned (complete) content'
      inputs:
        artifactName: 'arm64-unsigned-binaries'
        targetPath: '$(Pipeline.Workspace)/arm64-original'
    
    - bash: |
        set -e
        echo "=== Repackaging ARM64 Tarball with Notarized Binaries ==="
        
        ORIGINAL_DIR="$(Pipeline.Workspace)/arm64-original"
        SIGNED_DIR="$(Pipeline.Workspace)/arm64-signed"
        MERGED_DIR="$(Pipeline.Workspace)/arm64-merged"
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/notarized-tarballs"
        mkdir -p "$OUTPUT_DIR"
        
        echo "Original content structure:"
        echo "  Files: $(find "$ORIGINAL_DIR" -type f | wc -l)"
        echo "  Symlinks: $(find "$ORIGINAL_DIR" -type l | wc -l)"
        echo "  Size: $(du -sh "$ORIGINAL_DIR" | cut -f1)"
        echo ""
        
        echo "Notarized binaries:"
        echo "  Files: $(find "$SIGNED_DIR" -type f | wc -l)"
        echo ""
        
        # CRITICAL: Use rsync to preserve symlinks and permissions
        echo "Copying complete original content (preserving symlinks)..."
        rsync -a "$ORIGINAL_DIR/" "$MERGED_DIR/"
        
        echo ""
        echo "After rsync, checking symlinks:"
        echo "  bin/az:" && ls -la "$MERGED_DIR/bin/az"
        echo "  libexec/bin/python:" && ls -la "$MERGED_DIR/libexec/bin/python"
        echo "  libexec/bin/python3.13:" && ls -la "$MERGED_DIR/libexec/bin/python3.13"
        
        # Replace unsigned binaries with notarized versions (but NEVER replace symlinks!)
        echo "Replacing unsigned binaries with notarized versions..."
        cd "$SIGNED_DIR"
        find . -type f | while read signed_file; do
          target_file="$MERGED_DIR/$signed_file"
          
          # Critical check: if target is a symlink in the original, DO NOT copy over it!
          if [ -L "$target_file" ]; then
            echo "  ↷ Skipped (target is symlink): $signed_file"
            continue
          fi
          
          # Only replace if target exists and is a regular file
          if [ -f "$target_file" ]; then
            # Double-check it's not a symlink (belt and suspenders)
            if [ ! -L "$target_file" ]; then
              cp "$signed_file" "$target_file"
              echo "  ✓ Replaced: $signed_file"
            fi
          else
            echo "  ⚠️  Warning: $signed_file not found in original (signed artifact may have extra files from PowerShell ZIP issue)"
          fi
        done
        
        echo ""
        echo "After replacing binaries, checking symlinks again:"
        echo "  bin/az:" && ls -la "$MERGED_DIR/bin/az"
        echo "  libexec/bin/python:" && ls -la "$MERGED_DIR/libexec/bin/python"
        echo "  libexec/bin/python3.13:" && ls -la "$MERGED_DIR/libexec/bin/python3.13"
        
        # CRITICAL: Set executable permissions on all binaries
        echo ""
        echo "Setting executable permissions on binaries..."
        cd "$MERGED_DIR"
        
        # Set execute permissions on Python executables (only real files, not symlinks)
        find libexec/bin -type f -name "python*" ! -name "*.pyc" ! -name "*.py" -exec chmod +x {} \; 2>/dev/null || true
        
        # Set execute permissions on all Mach-O binaries (dylibs, .so files)
        find . -type f \( -name "*.dylib" -o -name "*.so" \) -exec chmod +x {} \; 2>/dev/null || true
        
        echo ""
        echo "Verifying symlinks are preserved:"
        ls -l bin/az
        ls -l libexec/bin/python 2>/dev/null || echo "  python -> (no symlink found)"
        ls -l libexec/bin/python3.13 2>/dev/null || echo "  python3.13 -> (no symlink found)"
        
        echo ""
        echo "Verifying permissions on actual executables:"
        ls -l libexec/bin/python3 2>/dev/null || echo "  python3 (not found)"
        ls -l libexec/bin/az 2>/dev/null || echo "  az (not found)"
        
        echo ""
        echo "Merged content:"
        echo "  Files: $(find "$MERGED_DIR" -type f | wc -l)"
        echo "  Symlinks: $(find "$MERGED_DIR" -type l | wc -l)"
        echo "  Size: $(du -sh "$MERGED_DIR" | cut -f1)"
        echo ""
        
        # Create tarball from merged content
        TARBALL_NAME="azure-cli-$(AzureCliVersion)-macos-arm64-notarized.tar.gz"
        
        cd "$MERGED_DIR"
        echo "Creating tarball: $TARBALL_NAME"
        
        # CRITICAL: Create tarball preserving symlinks (-h follows symlinks, we want -H to NOT follow them)
        # Use tar with default behavior (no -h) to preserve symlinks as-is
        tar -czf "$OUTPUT_DIR/$TARBALL_NAME" --no-mac-metadata .
        
        # Generate SHA256
        cd "$OUTPUT_DIR"
        shasum -a 256 "$TARBALL_NAME" | awk '{print $1 "  " $2}' > "$TARBALL_NAME.sha256"
        
        echo ""
        echo "✅ ARM64 tarball created:"
        ls -lh "$OUTPUT_DIR/$TARBALL_NAME"
        echo ""
        echo "Tarball contents:"
        tar -tzf "$TARBALL_NAME" | head -20
        echo ""
        echo "SHA256:"
        cat "$TARBALL_NAME.sha256"
        
        # Verify structure matches original
        echo ""
        echo "=== Verifying Tarball Structure ==="
        tar -tzf "$OUTPUT_DIR/$TARBALL_NAME" | sort > "$OUTPUT_DIR/signed-structure.txt"
        
        # Download original structure for comparison
        if [ -f "$(Pipeline.Workspace)/arm64-original-structure.txt" ]; then
          echo "Comparing with original structure..."
          echo ""
          echo "Original entries: $(wc -l < $(Pipeline.Workspace)/arm64-original-structure.txt)"
          echo "Signed entries: $(wc -l < $OUTPUT_DIR/signed-structure.txt)"
          
          echo ""
          echo "Structure differences (if any):"
          diff -u "$(Pipeline.Workspace)/arm64-original-structure.txt" "$OUTPUT_DIR/signed-structure.txt" || true
          
          echo ""
          if diff -q "$(Pipeline.Workspace)/arm64-original-structure.txt" "$OUTPUT_DIR/signed-structure.txt" > /dev/null; then
            echo "✅ Structure matches original perfectly!"
          else
            echo "⚠️  Structure differs from original - review above diff"
          fi
        else
          echo "⚠️  Original structure file not found for comparison"
        fi
        
      displayName: 'Repackage ARM64 tarball with notarized binaries'
    
    - publish: $(Build.ArtifactStagingDirectory)/notarized-tarballs
      artifact: arm64-notarized-tarball
      displayName: 'Publish ARM64 notarized tarball'
  
  # ============================================================================
  # REMOVED: RepackageX86_64 job (focusing on ARM64 only)
  # ============================================================================
  # - job: RepackageX86_64
  #   displayName: 'Repackage x86_64 tarball (macOS)'
  #   pool:
  #     vmImage: 'macos-14'
  #   
  #   steps:
  #   - checkout: none
  #   
  #   - task: DownloadPipelineArtifact@2
  #     displayName: 'Download notarized x86_64 binaries'
  #     inputs:
  #       artifactName: 'x86_64-notarized-binaries'
  #       targetPath: '$(Pipeline.Workspace)/x86_64-signed'
  #   ... (remaining steps commented out)

# ============================================================================
# STAGE 7: VERIFY SIGNATURES (macOS)
# ============================================================================
- stage: VerifySignatures
  displayName: 'Stage 7: Verify Signatures and Notarization'
  dependsOn: RepackageTarballs
  condition: succeeded()
  jobs:
  - job: VerifyARM64
    displayName: 'Verify ARM64 signatures'
    pool:
      vmImage: 'macos-15-arm64'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: arm64-notarized-tarball
      displayName: 'Download ARM64 notarized tarball'
    
    - bash: |
        set -e
        echo "=== Verify ARM64 Signed Binaries ==="
        
        TARBALL=$(find $(Pipeline.Workspace)/arm64-notarized-tarball -name "*.tar.gz" -type f | head -1)
        
        if [ -z "$TARBALL" ]; then
          echo "❌ ERROR: Tarball not found!"
          exit 1
        fi
        
        echo "Extracting: $(basename $TARBALL)"
        
        EXTRACT_DIR="$(Agent.TempDirectory)/verify-arm64"
        mkdir -p "$EXTRACT_DIR"
        tar -xzf "$TARBALL" -C "$EXTRACT_DIR"
        
        echo ""
        echo "=== Checking Signatures on Binaries ==="
        
        cd "$EXTRACT_DIR"
        find . -type f | while read filepath; do
          filetype=$(file -b "$filepath")
          if echo "$filetype" | grep -q -i "Mach-O"; then
            echo ""
            echo "Checking: $filepath"
            codesign -dvvv "$filepath" 2>&1 | head -10 || true
          fi
        done
        
        echo ""
        echo "✅ ARM64 signature verification complete"
        
      displayName: 'Verify ARM64 signatures with codesign'
  
  # ============================================================================
  # REMOVED: VerifyX86_64 job (focusing on ARM64 only)
  # ============================================================================
  # - job: VerifyX86_64
  #   displayName: 'Verify x86_64 signatures'
  #   pool:
  #     vmImage: 'macos-14'
  #   ... (steps commented out)

# ============================================================================
# STAGE 7: PUBLISH TO GITHUB RELEASE
# ============================================================================
- stage: PublishToGitHub
  displayName: 'Stage 7: Publish to GitHub Release'
  dependsOn:
  - VerifySignatures
  - DownloadAndExtract
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndExtract.DownloadAndExtractARM64.outputs['ExtractARM64.AzureCliVersion'] ]
    ReleaseTag: $[ stageDependencies.DownloadAndExtract.DownloadAndExtractARM64.outputs['ExtractARM64.ReleaseTag'] ]
  jobs:
  - job: ConsolidateAndRelease
    displayName: 'Consolidate tarballs and create GitHub release'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: arm64-notarized-tarball
      displayName: 'Download ARM64 notarized tarball'
    
    # REMOVED: x86_64 download - focusing on ARM64 only
    # - download: current
    #   artifact: x86_64-notarized-tarball
    #   displayName: 'Download x86_64 notarized tarball'
    
    - bash: |
        set -e
        echo "=== Consolidate Release Tarballs (ARM64 Only) ==="
        
        RELEASE_DIR="$(Build.ArtifactStagingDirectory)/release-tarballs"
        mkdir -p "$RELEASE_DIR"
        
        # Copy ARM64 notarized tarball
        cp -v $(Pipeline.Workspace)/arm64-notarized-tarball/*.tar.gz* "$RELEASE_DIR/"
        
        echo ""
        echo "=== Release Files ==="
        ls -lh "$RELEASE_DIR"
        
        # Get details for release notes
        ARM64_TAR=$(find "$RELEASE_DIR" -name "*arm64*.tar.gz" -type f | head -1)
        
        ARM64_NAME=$(basename "$ARM64_TAR")
        
        ARM64_SIZE=$(du -h "$ARM64_TAR" | cut -f1)
        
        ARM64_SHA256=$(cat "${ARM64_TAR}.sha256" | awk '{print $1}')
        
        # Export for release notes
        echo "##vso[task.setvariable variable=ARM64_NAME]$ARM64_NAME"
        echo "##vso[task.setvariable variable=ARM64_SIZE]$ARM64_SIZE"
        echo "##vso[task.setvariable variable=ARM64_SHA256]$ARM64_SHA256"
        
      displayName: 'Consolidate release files (ARM64 only)'
    
    - bash: |
        set -e
        echo "=== Create Release Notes (ARM64 Only) ==="
        
        cat > release-notes.md <<EOF
        # Azure CLI $(AzureCliVersion) - Signed & Notarized Tarball (ARM64)
        
        ## Official Code-Signed Distribution
        
        ✅ **All binaries are code-signed with Apple Developer ID Application certificate**
        ✅ **Notarized by Apple** - No Gatekeeper warnings
        ✅ **No quarantine attribute issues** - Safe for browser downloads
        
        > **Note**: This release provides ARM64 (Apple Silicon) binaries only.
        
        ## Download
        
        ### macOS ARM64 (Apple Silicon) - Signed & Notarized
        - **File**: \`$(ARM64_NAME)\`
        - **Size**: $(ARM64_SIZE)
        - **SHA256**: \`$(ARM64_SHA256)\`
        - **Code Signing**: Developer ID Application
        - **Notarization**: Apple Notarized
        
        ## Installation
        
        ### Option 1: Homebrew (Recommended)
        
        \`\`\`bash
        brew tap $(HomebrewTapRepo)
        brew install $(FormulaName)
        \`\`\`
        
        ### Option 2: Manual Installation
        
        **No Gatekeeper issues - all binaries are signed and notarized!**
        
        \`\`\`bash
        # Download
        curl -LO https://github.com/$(GitHubRepo)/releases/download/$(ReleaseTag)/$(ARM64_NAME)
        curl -LO https://github.com/$(GitHubRepo)/releases/download/$(ReleaseTag)/$(ARM64_NAME).sha256
        
        # Verify SHA256
        echo "$(ARM64_SHA256)  $(ARM64_NAME)" | shasum -a 256 -c -
        
        # Extract and install
        sudo mkdir -p /opt/azure-cli
        sudo tar -xzf $(ARM64_NAME) -C /opt/azure-cli
        
        # Add to PATH
        export PATH="/opt/azure-cli/bin:\$PATH"
        
        # Verify - no Gatekeeper warnings!
        az --version
        \`\`\`
        
        ## Security Features
        
        - ✅ **Code Signing**: All ~17 Mach-O binaries signed with Developer ID Application
        - ✅ **Hardened Runtime**: All executables use hardened runtime
        - ✅ **Apple Notarization**: Verified by Apple's notarization service
        - ✅ **Gatekeeper Compatible**: No quarantine warnings on browser downloads
        - ✅ **SHA256 Verification**: Integrity verification via cryptographic hashes
        
        ## What's Different from Unsigned Tarballs?
        
        | Feature | Unsigned Tarball | Signed & Notarized Tarball |
        |---------|------------------|----------------------------|
        | Browser downloads | ⚠️ Gatekeeper blocks execution | ✅ No warnings |
        | Code signing | ❌ Ad-hoc signed only | ✅ Developer ID Application |
        | Apple notarization | ❌ Not notarized | ✅ Notarized by Apple |
        | Quarantine removal | 🔧 Requires manual xattr fix | ✅ Not needed |
        | Enterprise trust | ⚠️ May be blocked | ✅ Fully trusted |
        
        ## Build Information
        
        - **Build ID**: $(TarballBuildId)
        - **Release ID**: $(Build.BuildId)
        - **ESRP Signed**: Yes
        - **Apple Notarized**: Yes
        
        ## Documentation
        
        - **Azure CLI Docs**: https://learn.microsoft.com/cli/azure/
        - **GitHub Repository**: https://github.com/$(GitHubRepo)
        - **Report Issues**: https://github.com/$(GitHubRepo)/issues
        EOF
        
        echo "✅ Release notes created"
        
      displayName: 'Create release notes'
    
    - task: GitHubRelease@1
      displayName: 'Delete existing release if present'
      continueOnError: true
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'delete'
        tag: '$(ReleaseTag)'
    
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(ReleaseTag)'
        title: 'Azure CLI $(AzureCliVersion) - Signed & Notarized Tarball'
        releaseNotesSource: 'filePath'
        releaseNotesFilePath: '$(System.DefaultWorkingDirectory)/release-notes.md'
        assets: '$(Build.ArtifactStagingDirectory)/release-tarballs/*'
        isDraft: ${{ parameters.IsDraft }}
        isPreRelease: ${{ parameters.IsPreRelease }}
        addChangeLog: false

# ============================================================================
# STAGE 8: UPDATE HOMEBREW FORMULA
# ============================================================================
- stage: UpdateHomebrewFormula
  displayName: 'Stage 8: Update Homebrew Formula'
  dependsOn:
  - PublishToGitHub
  - DownloadAndExtract
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndExtract.DownloadAndExtractARM64.outputs['ExtractARM64.AzureCliVersion'] ]
    ReleaseTag: $[ stageDependencies.DownloadAndExtract.DownloadAndExtractARM64.outputs['ExtractARM64.ReleaseTag'] ]
  jobs:
  - job: GenerateFormula
    displayName: 'Generate Homebrew formula'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: arm64-notarized-tarball
    
    # REMOVED: x86_64-notarized-tarball download (focusing on ARM64 only)
    
    - bash: |
        set -e
        echo "=== Get Tarball Details ==="
        
        ARM64_TAR=$(find $(Pipeline.Workspace)/arm64-notarized-tarball -name "*.tar.gz" -type f | head -1)
        
        ARM64_NAME=$(basename "$ARM64_TAR")
        ARM64_SHA256=$(cat "${ARM64_TAR}.sha256" | awk '{print $1}')
        ARM64_URL="https://github.com/$(GitHubRepo)/releases/download/$(ReleaseTag)/$ARM64_NAME"
        
        echo "ARM64: $ARM64_URL"
        echo "SHA256: $ARM64_SHA256"
        
        # Export variables
        echo "##vso[task.setvariable variable=ARM64_SHA256;isOutput=true]$ARM64_SHA256"
        echo "##vso[task.setvariable variable=ARM64_URL;isOutput=true]$ARM64_URL"
        
      name: GetDetails
      displayName: 'Get tarball URLs and SHA256'
    
    - bash: |
        set -e
        echo "=== Generate Homebrew Formula ==="
        
        mkdir -p Formula
        
        cat > Formula/$(FormulaName).rb <<'FORMULA_END'
        class AzureCliTarballSigned < Formula
          desc "Microsoft Azure CLI - Code-Signed & Notarized Tarball"
          homepage "https://learn.microsoft.com/cli/azure/"
          version "$(AzureCliVersion)"
          
          # ARM64 (Apple Silicon) only - Intel Macs can use Rosetta 2
          url "$(GetDetails.ARM64_URL)"
          sha256 "$(GetDetails.ARM64_SHA256)"
          
          def install
            # Install signed and notarized tarball
            prefix.install Dir["*"]
          end
          
          test do
            system "#{bin}/az", "--version"
          end
          
          def caveats
            <<~EOS
              Azure CLI Signed Tarball has been installed!
              
              ✅ All binaries are code-signed with Apple Developer ID
              ✅ Notarized by Apple - No Gatekeeper warnings
              
              Installation Details:
                • Executable: #{bin}/az
                • Runtime: #{prefix}/libexec/az/
                • Python: Bundled Python 3.13.11
              
              This is a fully code-signed and notarized distribution.
              No quarantine issues with browser downloads!
              
              To get started:
                az login
                az account list
            EOS
          end
        end
        FORMULA_END
        
        echo "✅ Formula generated"
        cat Formula/$(FormulaName).rb
        
      displayName: 'Generate formula'
    
    - publish: Formula
      artifact: homebrew-formula
      displayName: 'Publish formula'
  
  - job: CommitFormula
    displayName: 'Commit formula to tap repository'
    dependsOn: GenerateFormula
    variables:
      ARM64_SHA256: $[ dependencies.GenerateFormula.outputs['GetDetails.ARM64_SHA256'] ]
      # REMOVED: X86_64_SHA256 (focusing on ARM64 only)
      ARM64_URL: $[ dependencies.GenerateFormula.outputs['GetDetails.ARM64_URL'] ]
      # REMOVED: X86_64_URL (focusing on ARM64 only)
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: homebrewtap
      persistCredentials: true
      displayName: 'Checkout Homebrew tap repository'
    
    - download: current
      artifact: homebrew-formula
      displayName: 'Download formula'
    
    - bash: |
        set -e
        echo "=== Configure Git ==="
        
        git config --global user.email "azure-pipelines@microsoft.com"
        git config --global user.name "Azure Pipelines Bot"
        
        echo "✅ Git configured"
      displayName: 'Configure git'
    
    - bash: |
        set -e
        echo "=== Commit Formula to Main Branch ==="
        
        # Check current state
        echo "Current branch:"
        git branch -a
        echo ""
        
        # Checkout main branch
        git checkout -B main origin/main
        
        # Copy formula
        mkdir -p Formula
        cp $(Pipeline.Workspace)/homebrew-formula/$(FormulaName).rb Formula/
        
        # Add formula
        git add Formula/$(FormulaName).rb
        
        # Check if there are changes to commit
        if git diff --cached --quiet; then
          echo "ℹ️  No changes detected - formula is already up-to-date"
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "✅ Formula is current (no update needed)"
          echo "   Repository: https://github.com/$(HomebrewTapRepo)"
          echo "   Latest commit: $COMMIT_SHA"
        else
          # Commit changes
          git commit -m "Update Azure CLI Signed Tarball to version $(AzureCliVersion)

          - Version: $(AzureCliVersion)
          - Release Tag: $(ReleaseTag)
          - ARM64 SHA256: $(ARM64_SHA256)
          - x86_64 SHA256: $(X86_64_SHA256)
          - Code-signed with Developer ID Application
          - Notarized by Apple
          - No Gatekeeper warnings

          Build: $(TarballBuildId)
          Release: $(Build.BuildId)
          "
          
          # Push to main
          git push origin main
          
          COMMIT_SHA=$(git rev-parse HEAD)
          echo ""
          echo "✅ Formula committed to main branch!"
          echo "   Repository: https://github.com/$(HomebrewTapRepo)"
          echo "   Commit: $COMMIT_SHA"
        fi
        echo ""
      displayName: 'Commit and push formula'
    
    - bash: |
        echo "=== Formula Update Summary ==="
        echo ""
        echo "✅ Homebrew Formula Updated!"
        echo ""
        echo "Repository: https://github.com/$(HomebrewTapRepo)"
        echo "Formula: $(FormulaName)"
        echo "Version: $(AzureCliVersion)"
        echo ""
        echo "Users can now install with:"
        echo ""
        echo "  brew tap $(HomebrewTapRepo)"
        echo "  brew install $(FormulaName)"
        echo ""
      displayName: 'Update summary'

# ============================================================================
# STAGE 9: TEST HOMEBREW INSTALLATION
# ============================================================================

- stage: TestInstallation
  displayName: 'Stage 9: Test Homebrew Installation'
  dependsOn:
  - UpdateHomebrewFormula
  - DownloadAndExtract
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndExtract.DownloadAndExtractARM64.outputs['ExtractARM64.AzureCliVersion'] ]
  jobs:
  - job: TestARM64
    displayName: 'Test ARM64 installation on Apple Silicon'
    pool:
      vmImage: 'macos-15-arm64'
    
    steps:
    - checkout: none
    
    - bash: |
        echo "======================================"
        echo "  Update Homebrew"
        echo "======================================"
        echo ""
        brew update
        
        echo ""
        echo "Homebrew version:"
        brew --version
        
        echo ""
        echo "System architecture:"
        uname -m
      displayName: 'Update Homebrew'
    
    - bash: |
        echo "======================================"
        echo "  Cleanup Existing Installations"
        echo "======================================"
        echo ""
        
        # Remove any existing Azure CLI installations
        echo "Checking for existing Azure CLI installations..."
        echo "Current PATH: $PATH"
        
        # Uninstall ALL azure-cli related Homebrew formulas
        echo ""
        echo "Checking Homebrew formulas..."
        brew list | grep -i azure || echo "No Azure formulas found"
        
        brew list 2>/dev/null | grep -i azure | while read formula; do
          echo "Uninstalling Homebrew formula: $formula"
          brew uninstall --force --ignore-dependencies "$formula" 2>/dev/null || true
        done
        
        # Check for az command
        if command -v az &> /dev/null; then
          AZ_LOCATION=$(which az)
          echo ""
          echo "Found 'az' command at: $AZ_LOCATION"
          
          # Try to remove it (won't use sudo, just try regular rm)
          rm -f "$AZ_LOCATION" 2>/dev/null && echo "Removed $AZ_LOCATION" || echo "Could not remove $AZ_LOCATION (no permissions)"
        fi
        
        # Verify cleanup
        echo ""
        if command -v az &> /dev/null; then
          echo "⚠️  WARNING: 'az' command still exists at: $(which az)"
        else
          echo "✅ No 'az' command found - cleanup successful"
        fi
      displayName: 'Cleanup existing installations'
    
    - bash: |
        echo "======================================"
        echo "  Add Homebrew Tap"
        echo "======================================"
        echo ""
        
        TAP_NAME="$(HomebrewTapRepo)"
        echo "Tapping repository: $TAP_NAME"
        brew tap "$TAP_NAME"
        
        echo ""
        echo "Verifying tap:"
        # Extract tap name without 'homebrew-' prefix for verification
        TAP_VERIFY=$(echo "$TAP_NAME" | sed 's/homebrew-//')
        brew tap | grep "$TAP_VERIFY" || {
          echo "❌ ERROR: Tap not found"
          exit 1
        }
        
        echo ""
        echo "✅ Tap added successfully"
      displayName: 'Add Homebrew tap'
    
    - bash: |
        echo "======================================"
        echo "  Install Azure CLI via Homebrew"
        echo "======================================"
        echo ""
        
        FORMULA_NAME="$(FormulaName)"
        echo "Installing formula: $FORMULA_NAME"
        
        brew install "$FORMULA_NAME" -v
        
        echo ""
        echo "✅ Installation complete"
      displayName: 'Install Azure CLI'
    
    - bash: |
        echo "======================================"
        echo "  Verify Installation"
        echo "======================================"
        echo ""
        
        # Get Cellar path
        FORMULA_NAME="$(FormulaName)"
        CELLAR_PATH=$(brew --cellar "$FORMULA_NAME")
        VERSION=$(brew info "$FORMULA_NAME" --json | python3 -c "import sys, json; print(json.load(sys.stdin)[0]['installed'][0]['version'])")
        
        echo "Formula: $FORMULA_NAME"
        echo "Version: $VERSION"
        echo "Cellar path: $CELLAR_PATH/$VERSION"
        echo ""
        
        # Check installation directory structure
        echo "Installation structure:"
        ls -la "$CELLAR_PATH/$VERSION/" || {
          echo "❌ ERROR: Installation directory not found"
          exit 1
        }
        
        echo ""
        echo "Binary location:"
        ls -la "$CELLAR_PATH/$VERSION/bin/az" || {
          echo "❌ ERROR: az binary not found"
          exit 1
        }
        
        echo ""
        echo "✅ Installation structure verified"
      displayName: 'Verify installation structure'
    
    - bash: |
        echo "======================================"
        echo "  Test Azure CLI Commands"
        echo "======================================"
        echo ""
        
        FORMULA_NAME="$(FormulaName)"
        EXPECTED_VERSION="$(AzureCliVersion)"
        
        # Get the Homebrew-installed az path explicitly
        BREW_PREFIX=$(brew --prefix)
        HOMEBREW_AZ="$BREW_PREFIX/bin/az"
        
        echo "Homebrew prefix: $BREW_PREFIX"
        echo "Expected az location: $HOMEBREW_AZ"
        echo ""
        
        # Verify the Homebrew az exists
        if [ ! -f "$HOMEBREW_AZ" ]; then
          echo "❌ ERROR: Homebrew az not found at $HOMEBREW_AZ"
          echo ""
          echo "Searching for az installations:"
          find /usr/local/bin /opt/homebrew/bin -name "az" -type f -o -name "az" -type l 2>/dev/null || echo "  None found"
          exit 1
        fi
        
        echo "✅ Found Homebrew az at: $HOMEBREW_AZ"
        ls -la "$HOMEBREW_AZ"
        
        echo ""
        echo "Expected version: $EXPECTED_VERSION"
        echo "Expected formula: $FORMULA_NAME"
        
        echo ""
        echo "Testing: $HOMEBREW_AZ --version"
        AZ_OUTPUT=$("$HOMEBREW_AZ" --version 2>&1)
        echo "$AZ_OUTPUT"
        
        # Verify version matches
        if ! echo "$AZ_OUTPUT" | grep -q "$EXPECTED_VERSION"; then
          echo ""
          echo "❌ ERROR: Version mismatch!"
          echo "   Expected: $EXPECTED_VERSION"
          echo "   Got output above"
          exit 1
        fi
        
        echo ""
        echo "✅ Correct version verified: $EXPECTED_VERSION"
        
        echo ""
        echo "Testing: $HOMEBREW_AZ help"
        "$HOMEBREW_AZ" help > /dev/null || {
          echo "❌ ERROR: az help failed"
          exit 1
        }
        
        echo "✅ az help succeeded"
        
        echo ""
        echo "Testing: $HOMEBREW_AZ account list-locations"
        "$HOMEBREW_AZ" account list-locations --output table 2>/dev/null || true
        
        echo ""
        echo "======================================"
        echo "  ✅ All CLI Command Tests Passed"
        echo "======================================"
      displayName: 'Test CLI commands'
    
    - bash: |
        echo "======================================"
        echo "  Verify Code Signatures (Signed Tarball)"
        echo "======================================"
        echo ""
        
        FORMULA_NAME="$(FormulaName)"
        CELLAR_PATH=$(brew --cellar "$FORMULA_NAME")
        VERSION=$(brew info "$FORMULA_NAME" --json | python3 -c "import sys, json; print(json.load(sys.stdin)[0]['installed'][0]['version'])")
        
        echo "Checking code signatures..."
        echo ""
        
        # Check Python binary signature
        PYTHON_BIN="$CELLAR_PATH/$VERSION/libexec/bin/python3"
        echo "Python binary: $PYTHON_BIN"
        codesign -dv "$PYTHON_BIN" 2>&1 || {
          echo "⚠️  WARNING: Python binary not signed (expected for testing)"
        }
        
        echo ""
        echo "Checking quarantine attributes..."
        xattr "$PYTHON_BIN" || echo "  No extended attributes"
        
        echo ""
        echo "✅ Signature verification complete"
      displayName: 'Verify code signatures'
    
    - bash: |
        echo "======================================"
        echo "  Cleanup"
        echo "======================================"
        echo ""
        
        FORMULA_NAME="$(FormulaName)"
        
        echo "Uninstalling $FORMULA_NAME..."
        brew uninstall "$FORMULA_NAME"
        
        echo ""
        echo "Removing tap..."
        brew untap "$(HomebrewTapRepo)"
        
        echo ""
        echo "✅ Cleanup complete"
      displayName: 'Cleanup test installation'
  
  # ============================================================================
  # REMOVED: TestX86_64 job (focusing on ARM64 only)
  # ============================================================================
  # - job: TestX86_64
  #   ... (steps commented out)

