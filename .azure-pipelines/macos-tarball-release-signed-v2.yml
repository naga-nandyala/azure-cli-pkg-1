# STAGE 10: RELEASE SUMMARY
# ============================================================================
- stage: ReleaseSummary
  displayName: 'Stage 10: Release Summary'
  dependsOn:
  - DownloadAndExtract
  - SignARM64Binaries
  # REMOVED: - SignX86_64Binaries (focusing on ARM64 only)
  - NotarizeARM64Binaries
  # REMOVED: - NotarizeX86_64Binaries (focusing on ARM64 only)
  - RepackageTarballs
  - VerifySignatures
  - PublishToGitHub
  - UpdateHomebrewFormula
  - TestInstallation
  condition: always()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndExtract.DownloadAndExtractARM64.outputs['ExtractARM64.AzureCliVersion'] ]
    ReleaseTag: $[ stageDependencies.DownloadAndExtract.DownloadAndExtractARM64.outputs['ExtractARM64.ReleaseTag'] ]
  jobs:
  - job: PrintSummary
    displayName: 'Print release summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "=============================================="
        echo "  Azure CLI Signed Tarball Release Summary"
        echo "=============================================="
        echo ""
        echo "✅ RELEASE COMPLETE!"
        echo ""
        echo "Version: $(AzureCliVersion)"
        echo "Release Tag: $(ReleaseTag)"
        echo ""
        echo "GitHub Release:"
        echo "  https://github.com/$(GitHubRepo)/releases/tag/$(ReleaseTag)"
        echo ""
        echo "Homebrew Installation:"
        echo "  brew tap $(HomebrewTapRepo)"
        echo "  brew install $(FormulaName)"
        echo ""
        echo "Security Features:"
        echo "  ✅ All binaries code-signed with Developer ID Application"
        echo "  ✅ Notarized by Apple"
        echo "  ✅ No Gatekeeper warnings"
        echo "  ✅ Safe for browser downloads"
        echo ""
        echo "=============================================="
      displayName: 'Release summary'
