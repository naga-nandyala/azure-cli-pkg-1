# Azure CLI - Complete macOS Tarball Release Pipeline with ESRP Signing (v2)
# This pipeline performs:
# 1. Download tarballs from build pipeline
# 2. Extract tarball contents
# 3. Sign all Mach-O binaries with ESRP (Developer ID Application certificate)
# 4. Notarize with Apple via ESRP
# 5. Staple notarization ticket
# 6. Repackage signed tarball
# 7. Publish to GitHub Release
# 8. Update Homebrew formula
# 9. Test Homebrew installation

trigger: none # Manual trigger only

parameters:
  - name: TarballBuildId
    displayName: 'Tarball Build ID (from macos-tarball-build pipeline)'
    type: string
    default: '289882'
  - name: BundleId
    displayName: 'Bundle ID for signing/notarization'
    type: string
    default: 'com.microsoft.azure.cli'
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'
  - name: FormulaName
    displayName: 'Homebrew Formula Name'
    type: string
    default: 'azure-cli-tarball-signed'
  - name: IsPreRelease
    displayName: 'Mark GitHub release as Pre-release'
    type: boolean
    default: false
  - name: IsDraft
    displayName: 'Create GitHub release as Draft'
    type: boolean
    default: false

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: github.com_naga-nandyala
    name: naga-nandyala/homebrew-mycli-app

variables:
  - group: 'AME ESRP Variable Group'
  
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true
  - name: TarballBuildId
    value: ${{ parameters.TarballBuildId }}
  - name: BundleId
    value: ${{ parameters.BundleId }}
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  - name: HomebrewTapRepo
    value: ${{ parameters.HomebrewTapRepo }}
  - name: FormulaName
    value: ${{ parameters.FormulaName }}
  - name: GITHUB_TOKEN
    value: $[ resources.repositories['homebrewtap'].token ]

name: tarball-signed-release-$(Build.BuildId)

stages:
# ============================================================================
# STAGE 1: DOWNLOAD AND EXTRACT TARBALLS
# ============================================================================
- stage: DownloadAndExtract
  displayName: 'Stage 1: Download and Extract Tarballs'
  jobs:
  - job: DownloadAndExtractARM64
    displayName: 'Download and extract ARM64 tarball'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARM64 tarball'
      inputs:
        source: 'specific'
        project: '$(System.TeamProjectId)'
        pipeline: 'macos-tarball-build'
        runVersion: 'specific'
        runId: '$(TarballBuildId)'
        artifact: 'tarball-arm64'
        path: '$(Pipeline.Workspace)/tarball-arm64'
    
    - bash: |
        set -e
        echo "=== Download and Extract ARM64 Tarball ==="
        
        TAR_FILE=$(find $(Pipeline.Workspace)/tarball-arm64 -name "*.tar.gz" -type f | head -1)
        
        if [ -z "$TAR_FILE" ]; then
          echo "❌ ERROR: ARM64 tarball not found!"
          exit 1
        fi
        
        echo "✅ Found tarball: $(basename $TAR_FILE)"
        echo "   Size: $(du -h $TAR_FILE | cut -f1)"
        
        # Extract version from filename
        TAR_NAME=$(basename "$TAR_FILE")
        VERSION=$(echo "$TAR_NAME" | sed -E 's/azure-cli-([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
        
        echo ""
        echo "Detected Version: $VERSION"
        echo "##vso[task.setvariable variable=AzureCliVersion;isOutput=true]$VERSION"
        echo "##vso[task.setvariable variable=ReleaseTag;isOutput=true]v$VERSION-tarball-signed"
        echo "##vso[task.setvariable variable=ARM64_TARBALL_NAME;isOutput=true]$TAR_NAME"
        
        # Extract tarball contents
        EXTRACT_DIR="$(Pipeline.Workspace)/arm64-extracted"
        mkdir -p "$EXTRACT_DIR"
        
        # Capture original tarball structure for verification
        echo ""
        echo "=== Original Tarball Structure ==="
        tar -tzf "$TAR_FILE" | head -30
        
        # Save full structure for later comparison
        tar -tzf "$TAR_FILE" | sort > "$(Pipeline.Workspace)/arm64-original-structure.txt"
        echo "Saved original structure to: arm64-original-structure.txt"
        echo "Total files/dirs: $(wc -l < $(Pipeline.Workspace)/arm64-original-structure.txt)"
        
        echo ""
        echo "Extracting tarball..."
        tar -xzf "$TAR_FILE" -C "$EXTRACT_DIR"
        
        echo ""
        echo "=== Extracted Structure ==="
        ls -lh "$EXTRACT_DIR"
        
        # Find binaries to sign
        echo ""
        echo "=== Finding Mach-O binaries to sign ==="
        
        FILES_TO_SIGN="$(Pipeline.Workspace)/arm64-files-to-sign.txt"
        
        cd "$EXTRACT_DIR"
        find . -type f | while read filepath; do
          filetype=$(file -b "$filepath")
          if echo "$filetype" | grep -q -i "Mach-O"; then
            echo "$filepath"
          fi
        done | sort -u > "$FILES_TO_SIGN"
        
        echo "Total Mach-O binaries: $(wc -l < $FILES_TO_SIGN)"
        echo ""
        echo "Binaries to sign:"
        cat "$FILES_TO_SIGN"
        
      name: ExtractARM64
      displayName: 'Extract ARM64 tarball and identify binaries'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Publish ARM64 extracted contents'
      inputs:
        targetPath: '$(Pipeline.Workspace)/arm64-extracted'
        artifactName: 'arm64-unsigned-binaries'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Publish ARM64 file list'
      inputs:
        targetPath: '$(Pipeline.Workspace)/arm64-files-to-sign.txt'
        artifactName: 'arm64-files-to-sign-list'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Publish ARM64 original structure'
      inputs:
        targetPath: '$(Pipeline.Workspace)/arm64-original-structure.txt'
        artifactName: 'arm64-original-structure'
  
  # ============================================================================
  # REMOVED: x86_64 job - focusing on ARM64 only
  # ============================================================================
  # - job: DownloadAndExtractX86_64
  #   displayName: 'Download and extract x86_64 tarball'
