# Test Pipeline - Check macOS Runner Architectures
# This pipeline tests what architecture each macOS runner image provides

trigger: none # Manual trigger only

variables:
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false

name: test-macos-runners-$(Date:yyyyMMdd)-$(Rev:r)

jobs:
- job: TestMacOSLatest
  displayName: 'Test macOS-latest'
  pool:
    vmImage: 'macOS-latest'
  
  steps:
  - bash: |
      echo "========================================"
      echo "macOS-latest Runner Info"
      echo "========================================"
      echo "Architecture: $(uname -m)"
      echo "OS Version: $(sw_vers -productVersion)"
      echo "OS Build: $(sw_vers -buildVersion)"
      echo "Hostname: $(hostname)"
      echo ""
      echo "Rosetta 2 available:"
      if arch -x86_64 /bin/bash -c "echo 'Yes'" 2>/dev/null; then
        echo "  ✅ Yes (can run x86_64 on ARM64)"
      else
        echo "  ❌ No (Intel-only or Rosetta not installed)"
      fi
      echo ""
      echo "Python info:"
      python3 --version
      echo "Python architecture: $(python3 -c 'import platform; print(platform.machine())')"
    displayName: 'Check macOS-latest'

