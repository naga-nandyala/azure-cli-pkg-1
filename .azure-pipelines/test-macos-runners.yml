- job: Summary
  displayName: 'Print Summary'
  dependsOn:
  - TestMacOSLatest
  - TestMacOS14
  - TestMacOS15
  - TestMacOS13
  condition: always()
  pool:
    vmImage: 'ubuntu-latest'
  
  steps:
  - bash: |
      echo "=========================================="
      echo "macOS Runner Architecture Test Complete"
      echo "=========================================="
      echo ""
      echo "Check the logs above to see:"
      echo "  - Architecture (arm64 or x86_64)"
      echo "  - macOS version"
      echo "  - Rosetta 2 availability"
      echo ""
      echo "Key findings:"
      echo "  - arm64 = Apple Silicon (M1/M2/M3)"
      echo "  - x86_64 = Intel"
      echo "  - Rosetta 2 = Can run x86_64 on ARM64"
      echo ""
      echo "Use this information to choose the right"
      echo "vmImage for your builds."
    displayName: 'Summary'
