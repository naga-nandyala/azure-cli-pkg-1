# Azure CLI - macOS PKG Notarization Pipeline
# This pipeline takes signed PKG files and notarizes them with Apple

trigger: none # Manual trigger only

parameters:
  - name: SourceBuildId
    displayName: 'Source Build ID (the build that created signed PKGs)'
    type: string
    default: '282373'  # Updated to use the fully-signed PKG build
  - name: SourcePipelineName
    displayName: 'Source Pipeline Name'
    type: string
    default: 'macos-pkg-sign-all'  # Changed from macos-pkg-sign-release
  - name: AzureCliVersion
    displayName: 'Azure CLI Version (e.g., 2.0.0)'
    type: string
    default: '2.0.0'
  - name: BundleId
    displayName: 'Bundle ID for notarization'
    type: string
    default: 'com.microsoft.azure.cli'
  - name: OfficialBuild
    displayName: 'Official Build (enables ESRP notarization)'
    type: boolean
    default: true

variables:
  # Import ESRP signing/notarization variables from the variable group
  - group: 'AME ESRP Variable Group'
  
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true
  - name: AzureCliVersion
    value: ${{ parameters.AzureCliVersion }}
  - name: SourceBuildId
    value: ${{ parameters.SourceBuildId }}
  - name: SourcePipelineName
    value: ${{ parameters.SourcePipelineName }}
  - name: BundleId
    value: ${{ parameters.BundleId }}

name: notarize-macos-pkg-$(AzureCliVersion)-$(Build.BuildId)

stages:
- stage: DownloadSignedPkg
  displayName: 'Download Signed PKG from Build Artifacts'
  jobs:
  - job: DownloadArtifacts
    displayName: 'Download signed PKG files from build $(SourceBuildId)'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Fully-Signed PKG artifact'
      inputs:
        buildType: 'specific'
        project: 'public'
        definition: $(SourcePipelineName)
        buildVersionToDownload: 'specific'
        buildId: $(SourceBuildId)
        artifactName: 'fully-signed-macos-pkg'  # Changed from 'signed-macos-pkg'
        targetPath: '$(Pipeline.Workspace)/signed-pkg'
    
    - bash: |
        echo "=== Downloaded Signed PKG Files ==="
        ls -lh $(Pipeline.Workspace)/signed-pkg/
        echo ""
        
        # Count PKG files
        pkg_count=$(find $(Pipeline.Workspace)/signed-pkg -name "*.pkg" -type f | wc -l)
        echo "Found $pkg_count PKG file(s)"
        
        # Display file details
        for pkg in $(Pipeline.Workspace)/signed-pkg/*.pkg; do
          if [ -f "$pkg" ]; then
            echo ""
            echo "PKG: $(basename $pkg)"
            echo "  Size: $(du -h $pkg | cut -f1)"
            
            # Check if SHA256 file exists
            if [ -f "${pkg}.sha256" ]; then
              echo "  SHA256: $(cat ${pkg}.sha256)"
            fi
          fi
        done
      displayName: 'List downloaded signed PKG files'
    
    - publish: $(Pipeline.Workspace)/signed-pkg
      artifact: signed-pkg-for-notarization
      displayName: 'Publish signed PKG artifacts for notarization'

- stage: NotarizePkgSimple
  displayName: 'Mock Notarization (Development)'
  dependsOn: DownloadSignedPkg
  condition: and(succeeded(), eq(${{ parameters.OfficialBuild }}, false))
  jobs:
  - job: MockNotarization
    displayName: 'Mock Notarization (Development)'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: signed-pkg-for-notarization
      displayName: 'Download signed PKGs'
    
    - bash: |
        echo "=== Mock Notarization Process ==="
        echo "NOTE: This is a development/test notarization process"
        echo "For production, enable OfficialBuild=true to use ESRP notarization"
        echo ""
        
        SIGNED_DIR="$(Pipeline.Workspace)/signed-pkg-for-notarization"
        NOTARIZED_DIR="$(Build.ArtifactStagingDirectory)/notarized-pkg"
        mkdir -p "$NOTARIZED_DIR"
        
        for pkg in "$SIGNED_DIR"/*.pkg; do
          if [ -f "$pkg" ]; then
            pkg_name=$(basename "$pkg")
            notarized_pkg="$NOTARIZED_DIR/${pkg_name}"
            
            echo "Processing: $pkg_name"
            
            # For development: just copy
            # In production, this would be replaced with actual Apple notarization
            cp "$pkg" "$notarized_pkg"
            
            # Copy SHA256 if exists
            if [ -f "${pkg}.sha256" ]; then
              cp "${pkg}.sha256" "${notarized_pkg}.sha256"
            fi
            
            # Verify the PKG structure
            echo "Checking PKG contents:"
            pkgutil --payload-files "$notarized_pkg" | head -10
            
            echo "✅ Processed: $pkg_name"
            echo ""
          fi
        done
        
        echo "=== Mock Notarized PKG Files ==="
        ls -lh "$NOTARIZED_DIR"
      displayName: 'Mock notarize PKG files (development)'
    
    - publish: $(Build.ArtifactStagingDirectory)/notarized-pkg
      artifact: notarized-macos-pkg
      displayName: 'Publish notarized PKG artifacts'

- stage: NotarizePkgESRP
  displayName: 'Notarize macOS PKG Files (ESRP)'
  dependsOn: DownloadSignedPkg
  condition: and(succeeded(), eq(${{ parameters.OfficialBuild }}, true))
  jobs:
  - job: NotarizeARM64
    displayName: 'Notarize ARM64 PKG with Apple via ESRP'
    pool:
      vmImage: windows-2022
    
    steps:
    - checkout: none
    
    - download: current
      artifact: signed-pkg-for-notarization
      displayName: 'Download signed PKGs'
    
    - pwsh: |
        Write-Host "=== Preparing Fully-Signed PKG for Apple Notarization ==="
        
        # Find the fully-signed PKG from macos-pkg-sign-all pipeline
        $signedPkg = Get-ChildItem -Path "$(Pipeline.Workspace)/signed-pkg-for-notarization" -Filter "*fully-signed.pkg" -File | Select-Object -First 1
        
        if (-not $signedPkg) {
          Write-Host "⚠️  Fully-signed PKG not found, checking for other PKG files..."
          $signedPkg = Get-ChildItem -Path "$(Pipeline.Workspace)/signed-pkg-for-notarization" -Filter "*.pkg" -File | Select-Object -First 1
        }
        
        if (-not $signedPkg) {
          Write-Error "❌ No PKG file found in artifact"
          Write-Host "Available files:"
          Get-ChildItem "$(Pipeline.Workspace)/signed-pkg-for-notarization" | ForEach-Object {
            Write-Host "  - $($_.Name)"
          }
          exit 1
        }
        
        Write-Host "✅ Found signed PKG: $($signedPkg.Name)"
        Write-Host "   Size: $([math]::Round($signedPkg.Length / 1MB, 2)) MB"
        Write-Host "   Path: $($signedPkg.FullName)"
        
        # Copy PKG to Pipeline.Workspace for ESRP to find it
        # Apple notarization works directly with PKG files (no ZIP needed)
        $targetPath = "$(Pipeline.Workspace)/$($signedPkg.Name)"
        
        Write-Host ""
        Write-Host "Copying fully-signed PKG for ESRP notarization..."
        Write-Host "  Source: $($signedPkg.FullName)"
        Write-Host "  Target: $targetPath"
        Write-Host "  Bundle ID: $(BundleId)"
        
        Copy-Item -Path $signedPkg.FullName -Destination $targetPath -Force
        
        if (Test-Path $targetPath) {
          Write-Host "✅ PKG ready: $([math]::Round((Get-Item $targetPath).Length / 1MB, 2)) MB"
        } else {
          Write-Error "❌ Failed to copy PKG"
          exit 1
        }
        
        Write-Host ""
        Write-Host "=== Ready for Apple notarization ==="
        Write-Host "PKG file: $($signedPkg.Name)"
        Write-Host "Note: This PKG is fully signed (binaries + PKG container)"
      displayName: 'Prepare fully-signed PKG for notarization'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'Notarize ARM64 PKG with Apple using ESRP v5'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)'
        Pattern: '*fully-signed.pkg'  # Updated to match the artifact from macos-pkg-sign-all
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppNotarize",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "BundleId": "$(BundleId)"
              }
            }
          ]
        SessionTimeout: '60'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "=== Collecting Notarized PKG ==="
        
        # Find the notarized PKG (ESRP processes it in-place)
        $notarizedPkg = Get-ChildItem -Path "$(Pipeline.Workspace)" -Filter "*fully-signed.pkg" -File | 
                        Sort-Object LastWriteTime -Descending | 
                        Select-Object -First 1
        
        if (-not $notarizedPkg) {
          Write-Error "❌ Notarized PKG not found"
          Write-Host "Available files:"
          Get-ChildItem "$(Pipeline.Workspace)" -File | ForEach-Object {
            Write-Host "  - $($_.Name) [$($_.LastWriteTime)]"
          }
          exit 1
        }
        
        Write-Host "Found notarized PKG: $($notarizedPkg.Name)"
        Write-Host "Size: $([math]::Round($notarizedPkg.Length / 1MB, 2)) MB"
        Write-Host "Modified: $($notarizedPkg.LastWriteTime)"
        
        # Create output directory
        $outputDir = "$(Build.ArtifactStagingDirectory)/notarized-pkg"
        if (-not (Test-Path $outputDir)) {
          $null = New-Item -ItemType Directory -Path $outputDir -Force
        }
        
        # Copy and rename the notarized PKG
        Write-Host ""
        Write-Host "Processing notarized PKG..."
        
        # Rename to indicate it's notarized (replace 'fully-signed' with 'notarized')
        $notarizedName = $notarizedPkg.Name -replace 'fully-signed\.pkg$', 'notarized.pkg'
        $newPath = Join-Path $outputDir $notarizedName
        Copy-Item -Path $notarizedPkg.FullName -Destination $newPath -Force
        
        if (Test-Path $newPath) {
          Write-Host "✅ Notarized PKG ready"
          Write-Host "   Name: $notarizedName"
          Write-Host "   Size: $([math]::Round((Get-Item $newPath).Length / 1MB, 2)) MB"
          
          # Generate SHA256
          $hash = Get-FileHash -Path $newPath -Algorithm SHA256
          $hashFile = "$newPath.sha256"
          "$($hash.Hash.ToLower())  $notarizedName" | Out-File -FilePath $hashFile -Encoding ASCII -NoNewline
          
          Write-Host "   SHA256: $($hash.Hash)"
        } else {
          Write-Error "❌ Failed to copy notarized PKG"
          exit 1
        }
        
        Write-Host ""
        Write-Host "=== Notarized PKG Ready ==="
        Get-ChildItem $outputDir | ForEach-Object {
          Write-Host "✅ $($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
        }
      displayName: 'Collect notarized PKG'
    
    - publish: $(Build.ArtifactStagingDirectory)/notarized-pkg
      artifact: notarized-macos-pkg
      displayName: 'Publish notarized PKG artifacts'

- stage: StapleNotarization
  displayName: 'Staple Notarization Ticket'
  dependsOn: NotarizePkgESRP
  condition: and(succeeded(), eq(${{ parameters.OfficialBuild }}, true))
  jobs:
  - job: StapleTicket
    displayName: 'Staple notarization ticket to PKG'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: notarized-macos-pkg
      displayName: 'Download notarized PKG'
    
    - bash: |
        echo "=== Stapling Notarization Ticket ==="
        echo ""
        echo "Stapling embeds the notarization ticket directly into the PKG."
        echo "This allows offline installation without internet connection."
        echo ""
        
        NOTARIZED_DIR="$(Pipeline.Workspace)/notarized-macos-pkg"
        STAPLED_DIR="$(Build.ArtifactStagingDirectory)/stapled-pkg"
        mkdir -p "$STAPLED_DIR"
        
        for pkg in "$NOTARIZED_DIR"/*.pkg; do
          if [ -f "$pkg" ]; then
            pkg_name=$(basename "$pkg")
            echo "Processing: $pkg_name"
            echo ""
            
            # Copy to staging directory first
            cp "$pkg" "$STAPLED_DIR/$pkg_name"
            
            # Staple the notarization ticket
            echo "1. Stapling notarization ticket..."
            if xcrun stapler staple "$STAPLED_DIR/$pkg_name"; then
              echo "✅ Ticket stapled successfully"
            else
              echo "⚠️  Stapling failed - ticket may need more time to propagate"
              echo "   Waiting 30 seconds and retrying..."
              sleep 30
              
              if xcrun stapler staple "$STAPLED_DIR/$pkg_name"; then
                echo "✅ Ticket stapled successfully (after retry)"
              else
                echo "❌ Stapling failed after retry"
                echo "   The PKG is still notarized and will work online"
                echo "   For offline support, staple manually later"
              fi
            fi
            echo ""
            
            # Validate the stapled ticket
            echo "2. Validating stapled ticket..."
            if xcrun stapler validate "$STAPLED_DIR/$pkg_name"; then
              echo "✅ Stapled ticket is valid"
            else
              echo "⚠️  Validation failed - ticket may not be stapled"
            fi
            echo ""
            
            # Verify with spctl
            echo "3. Verifying with macOS Gatekeeper (spctl)..."
            spctl -a -vv -t install "$STAPLED_DIR/$pkg_name" 2>&1 || true
            echo ""
            
            # Copy SHA256 file if exists
            if [ -f "${pkg}.sha256" ]; then
              cp "${pkg}.sha256" "$STAPLED_DIR/${pkg_name}.sha256"
            else
              # Generate new SHA256 for stapled PKG
              echo "Generating SHA256 for stapled PKG..."
              shasum -a 256 "$STAPLED_DIR/$pkg_name" | awk '{print $1 "  " "'$pkg_name'"}' > "$STAPLED_DIR/${pkg_name}.sha256"
            fi
            
            # Show file size
            pkg_size=$(du -h "$STAPLED_DIR/$pkg_name" | cut -f1)
            echo "Final size: $pkg_size"
            echo ""
            echo "---"
            echo ""
          fi
        done
        
        echo "=== Stapled PKG Files ==="
        ls -lh "$STAPLED_DIR"
        echo ""
        echo "✅ Notarization tickets stapled for offline installation"
      displayName: 'Staple notarization ticket'
    
    - publish: $(Build.ArtifactStagingDirectory)/stapled-pkg
      artifact: stapled-macos-pkg
      displayName: 'Publish stapled PKG artifacts'

- stage: VerifyNotarization
  displayName: 'Verify Notarization'
  dependsOn:
  - StapleNotarization
  condition: and(succeeded(), eq(${{ parameters.OfficialBuild }}, true))
  jobs:
  - job: VerifyOnMac
    displayName: 'Verify notarization on macOS'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: stapled-macos-pkg
      displayName: 'Download stapled PKGs'
    
    - bash: |
        echo "=== Verifying Apple Notarization (Stapled PKG) ==="
        echo ""
        
        STAPLED_DIR="$(Pipeline.Workspace)/stapled-macos-pkg"
        
        for pkg in "$STAPLED_DIR"/*.pkg; do
          if [ -f "$pkg" ]; then
            pkg_name=$(basename "$pkg")
            echo "Verifying: $pkg_name"
            echo ""
            
            # Check PKG signature
            echo "1. Checking PKG signature:"
            pkgutil --check-signature "$pkg"
            echo ""
            
            # Check stapled ticket (should succeed now)
            echo "2. Checking stapled notarization ticket:"
            if stapler validate "$pkg"; then
              echo "✅ Stapled ticket is valid - PKG works offline!"
            else
              echo "⚠️  No stapled ticket found"
            fi
            echo ""
            
            # Check notarization status using spctl
            echo "3. Checking notarization with spctl:"
            spctl -a -vv -t install "$pkg" 2>&1 || true
            echo ""
            
            # Test PKG structure (simulates offline readability)
            echo "4. Testing PKG structure and offline readiness:"
            if pkgutil --payload-files "$pkg" >/dev/null 2>&1; then
              echo "✅ PKG structure is valid"
              echo "✅ PKG can be read and installed offline"
            else
              echo "⚠️  PKG structure test failed (but signature and stapling are valid)"
            fi
            
            # Show PKG info
            echo ""
            echo "PKG Information:"
            pkgutil --pkg-info-plist "$pkg" 2>/dev/null | grep -A 1 "identifier\|version" | head -4 || echo "  (Package metadata available)"
            echo ""
            
            echo "---"
            echo ""
          fi
        done
        
        echo "=== Verification Complete ==="
        echo ""
        echo "Expected results for stapled, notarized PKG:"
        echo "  ✅ pkgutil should show valid signature with Developer ID"
        echo "  ✅ stapler should confirm ticket is stapled and valid"
        echo "  ✅ spctl should show 'accepted' or 'source=Notarized Developer ID'"
        echo "  ✅ PKG works completely offline (no internet required)"
      displayName: 'Verify Apple notarization and stapled ticket'

- stage: Summary
  displayName: 'Notarization Summary'
  dependsOn:
  - DownloadSignedPkg
  - NotarizePkgESRP
  - StapleNotarization
  - VerifyNotarization
  condition: always()
  jobs:
  - job: PrintSummary
    displayName: 'Print Summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "# macOS PKG Notarization Summary"
        echo ""
        echo "## Source"
        echo "- **Source Build ID**: $(SourceBuildId)"
        echo "- **Version**: $(AzureCliVersion)"
        echo "- **Architecture**: ARM64"
        echo "- **Bundle ID**: $(BundleId)"
        echo ""
        echo "## Process"
        if [ "${{ parameters.OfficialBuild }}" == "True" ]; then
          echo "- **Notarization Method**: Apple Notarization via ESRP"
          echo "- **Service Connection**: ame_esrp_connection"
          echo "- **KeyCode**: CP-401337-Apple"
          echo "- **Operation**: MacAppNotarize"
          echo "- **Stapling**: Enabled (ticket embedded for offline use)"
        else
          echo "- **Notarization Method**: Mock Notarization (Development)"
        fi
        echo ""
        echo "## Apple Notarization Process"
        echo "Notarization submits the PKG to Apple's notary service, which:"
        echo "1. Scans the PKG for malicious content"
        echo "2. Verifies the code signature"
        echo "3. Issues a notarization ticket"
        echo "4. Returns the notarized PKG"
        echo ""
        echo "## Stapling Process"
        echo "Stapling embeds the notarization ticket into the PKG:"
        echo "1. Downloads the notarization ticket from Apple"
        echo "2. Embeds it directly into the PKG file"
        echo "3. Enables completely offline installation"
        echo "4. No internet connection required for first install"
        echo ""
        echo "## Artifacts"
        echo "This build produces the following artifacts:"
        echo "- **notarized-macos-pkg**: PKG with Apple notarization (online install)"
        echo "- **stapled-macos-pkg**: PKG with stapled ticket (offline install) ⭐"
        echo ""
        echo "## Verification"
        echo "1. Download stapled-macos-pkg artifacts from this build"
        echo "2. Test installation on macOS ARM64"
        echo "3. Verify notarization: spctl -a -vv -t install <pkg-file>"
        echo "4. Verify signature: pkgutil --check-signature <pkg-file>"
        echo "5. Verify stapled ticket: stapler validate <pkg-file>"
        echo ""
        echo "## Distribution"
        echo "The stapled PKG can be distributed to macOS users."
        echo "✅ macOS Gatekeeper will allow installation without warnings"
        echo "✅ Works completely offline (no internet required)"
        echo "✅ Faster installation (no ticket lookup)"
        echo "✅ More reliable (works even if Apple services are down)"
      displayName: 'Summary'
