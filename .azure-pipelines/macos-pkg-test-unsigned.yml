trigger: none

pr: none

parameters:
  - name: UnsignedBuildId
    displayName: 'Build ID from naga_macos_build_pr2 pipeline'
    type: string
    default: '285883'
  
  - name: AzureCliVersion
    displayName: 'Azure CLI Version'
    type: string
    default: '3.0.0'
  
  - name: BundleId
    displayName: 'Bundle Identifier'
    type: string
    default: 'com.microsoft.azure.cli'
  
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  
  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'
  
  - name: CaskName
    displayName: 'Homebrew Cask Name'
    type: string
    default: 'azure-cli-pr2-test'

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: github.com_naga-nandyala
    name: naga-nandyala/homebrew-mycli-app

variables:
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true
  
  - name: BuildId
    value: ${{ parameters.UnsignedBuildId }}
  - name: GITHUB_TOKEN
    value: $(GitHubPAT)

pool:
  vmImage: 'macOS-latest'

stages:

# ============================================================================
# STAGE 1: DOWNLOAD UNSIGNED PKG
# ============================================================================
- stage: DownloadPkg
  displayName: '📦 Download Unsigned PKG'
  jobs:
  - job: Download
    displayName: 'Download from build pipeline'
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download unsigned PKG'
      inputs:
        buildType: 'specific'
        project: 'public'
        definition: 'naga_macos_build_pr2'
        buildVersionToDownload: 'specific'
        buildId: '$(BuildId)'
        artifactName: 'pkg-installer-macos-arm64'
        targetPath: '$(Pipeline.Workspace)/unsigned-pkg'
    
    - bash: |
        set -e
        echo "=== Downloaded PKG ==="
        ls -lh "$(Pipeline.Workspace)/unsigned-pkg"/*.pkg
        
        PKG_FILE=$(find "$(Pipeline.Workspace)/unsigned-pkg" -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: No PKG file found"
          exit 1
        fi
        
        echo ""
        echo "✅ PKG found: $PKG_FILE"
        echo "Size: $(du -h $PKG_FILE | cut -f1)"
        
      displayName: 'Verify PKG downloaded'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Publish unsigned PKG for next stage'
      inputs:
        targetPath: '$(Pipeline.Workspace)/unsigned-pkg'
        artifactName: 'unsigned-pkg'

# ============================================================================
# STAGE 2: PUBLISH TO GITHUB RELEASE
# ============================================================================
- stage: PublishToGitHub
  displayName: '🚀 Publish to GitHub'
  dependsOn: DownloadPkg
  jobs:
  - job: PublishRelease
    displayName: 'Create GitHub release'
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download PKG'
      inputs:
        artifactName: 'unsigned-pkg'
        targetPath: '$(Pipeline.Workspace)/unsigned-pkg'
    
    - bash: |
        set -e
        echo "=== Preparing GitHub Release ==="
        
        VERSION="${{ parameters.AzureCliVersion }}"
        TAG_NAME="v${VERSION}-test-unsigned"
        PKG_FILE=$(find "$(Pipeline.Workspace)/unsigned-pkg" -name "*.pkg" -type f | head -1)
        RENAMED_PKG="$(Build.ArtifactStagingDirectory)/azure-cli-${VERSION}-macos-arm64-unsigned.pkg"
        
        echo "Version: $VERSION"
        echo "Tag: $TAG_NAME"
        echo "Original PKG: $PKG_FILE"
        
        # Rename PKG for clarity
        mv "$PKG_FILE" "$RENAMED_PKG"
        echo "Renamed to: $RENAMED_PKG"
        
        # Create release notes
        cat > "$(Build.ArtifactStagingDirectory)/release-notes.md" <<'EOF'
WARNING: UNSIGNED TEST BUILD - DO NOT USE IN PRODUCTION

This is an unsigned PKG for testing installation workflow.
- No code signing
- No Apple notarization  
- For development/testing only

Installation:
\`\`\`bash
brew install --cask --no-quarantine azure-cli-pr2-test
\`\`\`

Version: VERSION_PLACEHOLDER
Build: BUILD_PLACEHOLDER
EOF
        
        sed -i.bak "s/VERSION_PLACEHOLDER/${VERSION}/g" "$(Build.ArtifactStagingDirectory)/release-notes.md"
        sed -i.bak "s/BUILD_PLACEHOLDER/$(BuildId)/g" "$(Build.ArtifactStagingDirectory)/release-notes.md"
        rm "$(Build.ArtifactStagingDirectory)/release-notes.md.bak"
        
        echo ""
        echo "✅ Release preparation complete"
        
      displayName: 'Prepare release assets'
    
    - task: GitHubRelease@1
      displayName: 'Delete existing release (if exists)'
      continueOnError: true
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '${{ parameters.GitHubRepo }}'
        action: 'delete'
        tag: 'v${{ parameters.AzureCliVersion }}-test-unsigned'
    
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '${{ parameters.GitHubRepo }}'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: 'v${{ parameters.AzureCliVersion }}-test-unsigned'
        title: 'Azure CLI ${{ parameters.AzureCliVersion }} (Test - Unsigned)'
        releaseNotesFilePath: '$(Build.ArtifactStagingDirectory)/release-notes.md'
        assets: '$(Build.ArtifactStagingDirectory)/*.pkg'
        addChangeLog: false
    
    - bash: |
        echo "=== GitHub Release Created ==="
        echo "Release: https://github.com/${{ parameters.GitHubRepo }}/releases/tag/v${{ parameters.AzureCliVersion }}-test-unsigned"
        echo "Download URL: https://github.com/${{ parameters.GitHubRepo }}/releases/download/v${{ parameters.AzureCliVersion }}-test-unsigned/azure-cli-${{ parameters.AzureCliVersion }}-macos-arm64-unsigned.pkg"
        
      displayName: 'Display release URL'

# ============================================================================
# STAGE 3: UPDATE HOMEBREW CASK
# ============================================================================
- stage: UpdateHomebrew
  displayName: '🍺 Update Homebrew Cask'
  dependsOn: PublishToGitHub
  jobs:
  - job: UpdateCask
    displayName: 'Update Cask formula'
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "=== Cloning Homebrew tap repository ==="
        
        git clone https://$(GitHubPAT)@github.com/naga-nandyala/homebrew-mycli-app.git tap-repo
        cd tap-repo
        
        git config user.name "Azure DevOps"
        git config user.email "azuredevops@microsoft.com"
        
      env:
        GITHUB_TOKEN: $(GitHubPAT)
      displayName: 'Clone tap repository'
    
    - bash: |
        set -e
        cd tap-repo
        
        echo "=== Generating Homebrew Cask ==="
        
        VERSION="${{ parameters.AzureCliVersion }}"
        TAG_NAME="v${VERSION}-test-unsigned"
        CASK_NAME="${{ parameters.CaskName }}"
        PKG_URL="https://github.com/${{ parameters.GitHubRepo }}/releases/download/${TAG_NAME}/azure-cli-${VERSION}-macos-arm64-unsigned.pkg"
        
        echo "Cask name: $CASK_NAME"
        echo "PKG URL: $PKG_URL"
        
        # Download PKG to calculate SHA256
        echo ""
        echo "Downloading PKG to calculate SHA256..."
        curl -L -o temp.pkg "$PKG_URL"
        SHA256=$(shasum -a 256 temp.pkg | cut -d' ' -f1)
        rm temp.pkg
        
        echo "SHA256: $SHA256"
        
        # Generate Cask file (matching azure-cli-pr2.rb structure)
        CASK_FILE="Casks/${CASK_NAME}.rb"
        mkdir -p Casks
        
        # Create cask using printf to avoid YAML parsing issues
        printf 'cask "%s" do\n' "$CASK_NAME" > "$CASK_FILE"
        printf '  version "%s"\n' "$VERSION" >> "$CASK_FILE"
        printf '  sha256 "%s"\n' "$SHA256" >> "$CASK_FILE"
        printf '\n' >> "$CASK_FILE"
        printf '  url "%s"\n' "$PKG_URL" >> "$CASK_FILE"
        printf '  name "Azure CLI (Test - Unsigned)"\n' >> "$CASK_FILE"
        printf '  desc "UNSIGNED TEST - Azure CLI with versioned installation"\n' >> "$CASK_FILE"
        printf '  homepage "https://github.com/%s"\n' "${{ parameters.GitHubRepo }}" >> "$CASK_FILE"
        printf '\n' >> "$CASK_FILE"
        printf '  pkg "azure-cli-%s-macos-arm64-unsigned.pkg"\n' "$VERSION" >> "$CASK_FILE"
        printf '\n' >> "$CASK_FILE"
        printf '  caveats <<~EOS\n' >> "$CASK_FILE"
        printf '    Azure CLI %s (UNSIGNED TEST BUILD)\n' "$VERSION" >> "$CASK_FILE"
        printf '    Installation: /usr/local/microsoft/azure-cli/%s/\n' "$VERSION" >> "$CASK_FILE"
        printf '    Symlink: /usr/local/microsoft/azure-cli/current -> %s\n' "$VERSION" >> "$CASK_FILE"
        printf '    Launcher: /usr/local/bin/az\n' >> "$CASK_FILE"
        printf '  EOS\n' >> "$CASK_FILE"
        printf '\n' >> "$CASK_FILE"
        printf '  zap trash: [\n' >> "$CASK_FILE"
        printf '    "/usr/local/bin/az",\n' >> "$CASK_FILE"
        printf '    "/usr/local/microsoft/azure-cli",\n' >> "$CASK_FILE"
        printf '  ]\n' >> "$CASK_FILE"
        printf 'end\n' >> "$CASK_FILE"
        
        echo ""
        echo "✅ Cask generated:"
        cat "$CASK_FILE"
        
      displayName: 'Generate Cask file'
    
    - bash: |
        set -e
        cd tap-repo
        
        echo "=== Committing Cask to Repository ==="
        
        CASK_NAME="${{ parameters.CaskName }}"
        VERSION="${{ parameters.AzureCliVersion }}"
        CASK_FILE="Casks/${CASK_NAME}.rb"
        
        # Configure git
        git config user.name "Azure DevOps"
        git config user.email "azuredevops@microsoft.com"
        
        # Add and commit
        git add "$CASK_FILE"
        
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          COMMIT_MSG="Update ${CASK_NAME} to ${VERSION} (unsigned test) - Build $(BuildId)"
          git commit -m "$COMMIT_MSG"
          
          git push origin HEAD:main
          echo "✅ Cask committed and pushed"
        fi
        
      displayName: 'Commit Cask to repository'

# ============================================================================
# STAGE 4: TEST INSTALLATION
# ============================================================================
- stage: TestInstallation
  displayName: '✅ Test Installation'
  dependsOn: UpdateHomebrew
  jobs:
  - job: TestFreshInstall
    displayName: 'Test fresh installation'
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "=== Testing Fresh Installation ==="
        
        CASK_NAME="${{ parameters.CaskName }}"
        TAP_REPO="${{ parameters.HomebrewTapRepo }}"
        EXPECTED_VERSION="${{ parameters.AzureCliVersion }}"
        
        # Add tap
        echo "Adding Homebrew tap..."
        brew tap "$TAP_REPO"
        
        # Install with --no-quarantine (unsigned PKG)
        echo ""
        echo "Installing $CASK_NAME..."
        brew install --cask --no-quarantine "$CASK_NAME"
        
        # Wait for installation
        sleep 5
        
        # Verify installation
        echo ""
        echo "=== Verification ==="
        
        # Check az command
        if command -v az &> /dev/null; then
          echo "✅ 'az' command available"
          az --version | head -5
        else
          echo "❌ 'az' command not found"
          exit 1
        fi
        
        # Check version directory
        VERSION_DIR="/usr/local/microsoft/azure-cli/${EXPECTED_VERSION}"
        if [ -d "$VERSION_DIR" ]; then
          echo ""
          echo "✅ Version directory exists: $VERSION_DIR"
        else
          echo ""
          echo "❌ Version directory missing: $VERSION_DIR"
          exit 1
        fi
        
        # Check current symlink
        CURRENT_LINK="/usr/local/microsoft/azure-cli/current"
        if [ -L "$CURRENT_LINK" ]; then
          ACTUAL_TARGET=$(readlink "$CURRENT_LINK")
          echo ""
          echo "✅ 'current' symlink exists: $CURRENT_LINK -> $ACTUAL_TARGET"
          
          if [ "$ACTUAL_TARGET" = "$EXPECTED_VERSION" ]; then
            echo "✅ Symlink points to correct version"
          else
            echo "❌ Symlink points to wrong version. Expected: $EXPECTED_VERSION, Got: $ACTUAL_TARGET"
            exit 1
          fi
        else
          echo ""
          echo "❌ 'current' symlink missing: $CURRENT_LINK"
          exit 1
        fi
        
        # Check Python executable
        PYTHON_EXEC="$VERSION_DIR/bin/python3"
        if [ -x "$PYTHON_EXEC" ]; then
          echo ""
          echo "✅ Python executable exists and is executable: $PYTHON_EXEC"
        else
          echo ""
          echo "❌ Python executable missing or not executable: $PYTHON_EXEC"
          ls -l "$PYTHON_EXEC" 2>&1 || echo "File not found"
          exit 1
        fi
        
        echo ""
        echo "=== All Tests Passed! ==="
        
      displayName: 'Test fresh installation'

  - job: Summary
    displayName: 'Test summary'
    dependsOn: TestFreshInstall
    condition: always()
    steps:
    - bash: |
        echo "=== Test Summary ==="
        echo "Version: ${{ parameters.AzureCliVersion }}"
        echo "Cask: ${{ parameters.CaskName }}"
        echo "Build: $(BuildId)"
        echo ""
        echo "Installation command:"
        echo "  brew install --cask --no-quarantine ${{ parameters.CaskName }}"
        
      displayName: 'Summary'
