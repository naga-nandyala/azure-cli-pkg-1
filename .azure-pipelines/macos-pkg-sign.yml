  - job: CollectSignedPkgs
    displayName: 'Collect Signed PKGs'
    dependsOn:
    - SignARM64
    # COMMENTED OUT - Testing ARM64 only
    # - SignX64
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: drop_SignPkgESRP_SignARM64
      displayName: 'Download signed ARM64 PKG'
    
    # COMMENTED OUT - Testing ARM64 only
    # - download: current
    #   artifact: drop_SignPkgESRP_SignX64
    #   displayName: 'Download signed x86_64 PKG'
    
    - bash: |
        echo "=== Collecting Signed PKG Files ==="
        
        SIGNED_DIR="$(Build.ArtifactStagingDirectory)/signed-pkg"
        mkdir -p "$SIGNED_DIR"
        
        echo "Searching for signed PKGs in:"
        echo "$(Pipeline.Workspace)"
        
        # Find all signed PKG files
        find "$(Pipeline.Workspace)" -name "*-signed.pkg" -o -name "*-signed.pkg.sha256" | while read file; do
          filename=$(basename "$file")
          echo "Copying: $filename"
          cp "$file" "$SIGNED_DIR/"
        done
        
        echo ""
        echo "=== Final Signed Artifacts ==="
        ls -lh "$SIGNED_DIR"
      displayName: 'Collect all signed PKGs'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-pkg
      artifact: signed-macos-pkg
      displayName: 'Publish final signed PKG artifacts'

