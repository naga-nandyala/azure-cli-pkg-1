- stage: Summary
  displayName: 'Signing Summary'
  dependsOn:
  - DownloadUnsignedPkg
  - SignPkgSimple
  condition: always()
  jobs:
  - job: PrintSummary
    displayName: 'Print Summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "# macOS PKG Signing Summary"
        echo ""
        echo "## Source"
        echo "- **Build ID**: $(SourceBuildId)"
        echo "- **Version**: $(AzureCliVersion)"
        echo ""
        echo "## Process"
        if [ "${{ parameters.OfficialBuild }}" == "True" ]; then
          echo "- **Signing Method**: OneBranch/ESRP (Official)"
        else
          echo "- **Signing Method**: Mock Signing (Development)"
        fi
        echo "- **GitHub Upload**: ${{ parameters.UploadToGitHub }}"
        echo ""
        echo "## Next Steps"
        echo "1. Download signed PKG artifacts from this build"
        echo "2. Test installation on macOS (ARM64 and Intel)"
        echo "3. For production: Set OfficialBuild=true to use real code signing"
      displayName: 'Summary'
