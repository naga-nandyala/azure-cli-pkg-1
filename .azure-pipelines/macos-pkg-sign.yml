# Azure CLI - macOS PKG Signing Pipeline (from ADO artifacts)
# This pipeline downloads unsigned PKG files from a previous build and signs them

trigger: none # Manual trigger only

parameters:
  - name: SourceBuildId
    displayName: 'Source Build ID (the build that created the PKGs)'
    type: string
    default: '282071'  # Hardcoded for testing - change as needed
  - name: SourcePipelineName
    displayName: 'Source Pipeline Name'
    type: string
    default: 'naga_macos_build'
  - name: AzureCliVersion
    displayName: 'Azure CLI Version (e.g., 2.0.0)'
    type: string
    default: '2.0.0'
  - name: OfficialBuild
    displayName: 'Official Build (enables OneBranch signing)'
    type: boolean
    default: false  # Set to true when you have OneBranch setup
  - name: UploadToGitHub
    displayName: 'Upload signed PKGs to GitHub release'
    type: boolean
    default: false
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo) - only if uploading'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'

variables:
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true
  - name: AzureCliVersion
    value: ${{ parameters.AzureCliVersion }}
  - name: SourceBuildId
    value: ${{ parameters.SourceBuildId }}
  - name: SourcePipelineName
    value: ${{ parameters.SourcePipelineName }}
  # Note: Variable groups are referenced at job level where needed
  # - mscodehub-macos-package-signing (for ESRP signing when OfficialBuild=true)
  # - github-integration (for GitHub upload when UploadToGitHub=true)

name: sign-macos-pkg-$(AzureCliVersion)-$(Build.BuildId)

stages:
- stage: DownloadUnsignedPkg
  displayName: 'Download Unsigned PKG from Build Artifacts'
  jobs:
  - job: DownloadArtifacts
    displayName: 'Download PKG files from build $(SourceBuildId)'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARM64 PKG'
      inputs:
        buildType: 'specific'
        project: 'public'
        definition: $(SourcePipelineName)
        buildVersionToDownload: 'specific'
        buildId: $(SourceBuildId)
        artifactName: 'pkg-installer-macos-arm64'
        targetPath: '$(Pipeline.Workspace)/unsigned-pkg/arm64'
    
    # COMMENTED OUT - Testing ARM64 only for now
    # - task: DownloadPipelineArtifact@2
    #   displayName: 'Download x86_64 PKG'
    #   inputs:
    #     buildType: 'specific'
    #     project: 'public'
    #     definition: $(SourcePipelineName)
    #     buildVersionToDownload: 'specific'
    #     buildId: $(SourceBuildId)
    #     artifactName: 'pkg-installer-macos-x86_64'
    #     targetPath: '$(Pipeline.Workspace)/unsigned-pkg/x86_64'
    
    - bash: |
        echo "=== Downloaded PKG Files ==="
        echo "ARM64 artifacts:"
        ls -lh $(Pipeline.Workspace)/unsigned-pkg/arm64/
        echo ""
        # COMMENTED OUT - Testing ARM64 only
        # echo "x86_64 artifacts:"
        # ls -lh $(Pipeline.Workspace)/unsigned-pkg/x86_64/
        # echo ""
        
        # Copy to a single directory for easier handling
        mkdir -p $(Pipeline.Workspace)/unsigned-pkg/all
        cp $(Pipeline.Workspace)/unsigned-pkg/arm64/*.pkg $(Pipeline.Workspace)/unsigned-pkg/all/
        # COMMENTED OUT - Testing ARM64 only
        # cp $(Pipeline.Workspace)/unsigned-pkg/x86_64/*.pkg $(Pipeline.Workspace)/unsigned-pkg/all/
        
        echo "=== All PKG Files ==="
        ls -lh $(Pipeline.Workspace)/unsigned-pkg/all/
      displayName: 'List downloaded PKG files'
    
    - publish: $(Pipeline.Workspace)/unsigned-pkg/all
      artifact: unsigned-pkg-files
      displayName: 'Publish unsigned PKG artifacts for signing'

- stage: SignPkgSimple
  displayName: 'Sign macOS PKG Files (Simple)'
  dependsOn: DownloadUnsignedPkg
  condition: and(succeeded(), eq('${{ parameters.OfficialBuild }}', false))
  jobs:
  - job: MockSigning
    displayName: 'Mock Signing (Development)'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-pkg-files
      displayName: 'Download unsigned PKGs'
    
    - bash: |
        echo "=== Mock Signing Process ==="
        echo "NOTE: This is a development/test signing process"
        echo "For production, enable OfficialBuild=true to use OneBranch/ESRP"
        echo ""
        
        UNSIGNED_DIR="$(Pipeline.Workspace)/unsigned-pkg-files"
        SIGNED_DIR="$(Build.ArtifactStagingDirectory)/signed-pkg"
        mkdir -p "$SIGNED_DIR"
        
        for pkg in "$UNSIGNED_DIR"/*.pkg; do
          if [ -f "$pkg" ]; then
            pkg_name=$(basename "$pkg")
            signed_pkg="$SIGNED_DIR/${pkg_name%.pkg}-signed.pkg"
            
            echo "Processing: $pkg_name"
            
            # For development: just copy and rename
            # In production, this would be replaced with actual signing
            cp "$pkg" "$signed_pkg"
            
            # Verify the PKG structure
            echo "Checking PKG contents:"
            pkgutil --payload-files "$signed_pkg" | head -10
            
            # Generate SHA256
            cd "$SIGNED_DIR"
            shasum -a 256 "$(basename "$signed_pkg")" > "$(basename "$signed_pkg").sha256"
            cd -
            
            echo "✅ Processed: $pkg_name"
            echo ""
          fi
        done
        
        echo "=== Signed PKG Files ==="
        ls -lh "$SIGNED_DIR"
      displayName: 'Mock sign PKG files (development)'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-pkg
      artifact: signed-macos-pkg
      displayName: 'Publish signed PKG artifacts'

- stage: SignPkgESRP
  displayName: 'Sign macOS PKG Files (ESRP/OneBranch)'
  dependsOn: DownloadUnsignedPkg
  condition: and(succeeded(), eq('${{ parameters.OfficialBuild }}', true))
  jobs:
  - job: SignARM64
    displayName: 'Sign ARM64 PKG with ESRP'
    pool:
      type: windows
      isCustom: true
      name: Azure Pipelines
      vmImage: windows-2022
    
    variables:
      - name: runCodesignValidationInjection
        value: false
      - name: NugetSecurityAnalysisWarningLevel
        value: none
      - name: skipNugetSecurityAnalysis
        value: true
      - name: ob_outputDirectory
        value: '$(Build.ArtifactStagingDirectory)/ONEBRANCH_ARTIFACT'
      - name: ob_sdl_binskim_enabled
        value: true
      - name: ob_sdl_credscan_enabled
        value: false
      - name: ob_sdl_sbom_enabled
        value: true
      - name: ob_sdl_sbom_packageName
        value: 'Microsoft.AzureCLI.macOS.arm64'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-pkg-files
      displayName: 'Download unsigned PKGs'
    
    - pwsh: |
        Write-Host "=== Preparing ARM64 PKG for ESRP Signing ==="
        
        $pkgName = "azure-cli-$(AzureCliVersion)-macos-arm64.pkg"
        $pkgPath = "$(Pipeline.Workspace)/unsigned-pkg-files/$pkgName"
        
        if (-not (Test-Path $pkgPath)) {
          Write-Error "❌ PKG not found: $pkgPath"
          Write-Host "Available files:"
          Get-ChildItem "$(Pipeline.Workspace)/unsigned-pkg-files" | ForEach-Object {
            Write-Host "  - $($_.Name)"
          }
          exit 1
        }
        
        Write-Host "✅ Found PKG: $pkgName"
        Write-Host "   Size: $([math]::Round((Get-Item $pkgPath).Length / 1MB, 2)) MB"
        
        # ESRP signing requires PKG to be in a ZIP archive
        $zipName = "azure-cli-$(AzureCliVersion)-macos-arm64.zip"
        $zipPath = "$(Pipeline.Workspace)/$zipName"
        
        Write-Host ""
        Write-Host "Creating ZIP archive for ESRP signing..."
        Write-Host "  Source: $pkgPath"
        Write-Host "  Archive: $zipPath"
        
        Compress-Archive -Path $pkgPath -DestinationPath $zipPath -CompressionLevel Optimal -Force
        
        if (Test-Path $zipPath) {
          Write-Host "✅ ZIP created: $([math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB"
        } else {
          Write-Error "❌ Failed to create ZIP"
          exit 1
        }
        
        Write-Host ""
        Write-Host "=== Ready for signing ==="
        Write-Host "ZIP file: $zipName"
      displayName: 'Compress ARM64 PKG for signing'
    
    - task: EsrpCodeSigning@2
      displayName: 'Sign ARM64 PKG using ESRP'
      inputs:
        ConnectedServiceName: 'anne_esrp_connection'  # Using the same service connection as MSI signing
        FolderPath: '$(Pipeline.Workspace)'
        Pattern: '**/azure-cli-*-macos-arm64.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppDeveloperSign",
              "Parameters": {
                "Hardening": "Enable",
                "OpusInfo": "http://microsoft.com",
                "BundleId": "com.microsoft.azure.cli"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]
    
    - pwsh: |
        Write-Host "=== Extracting Signed ARM64 PKG ==="
        
        $signedZip = Get-ChildItem -Path "$(Pipeline.Workspace)" -Filter "*arm64.zip" -File | Select-Object -First 1
        
        if (-not $signedZip) {
          Write-Error "❌ Signed ZIP not found"
          Write-Host "Available files:"
          Get-ChildItem "$(Pipeline.Workspace)" -File | ForEach-Object {
            Write-Host "  - $($_.Name)"
          }
          exit 1
        }
        
        Write-Host "Found signed ZIP: $($signedZip.Name)"
        Write-Host "Size: $([math]::Round($signedZip.Length / 1MB, 2)) MB"
        
        # Create output directory
        if (-not (Test-Path $(ob_outputDirectory))) {
          $null = New-Item -ItemType Directory -Path $(ob_outputDirectory) -Force
        }
        
        # Extract the signed PKG
        Write-Host ""
        Write-Host "Extracting signed PKG..."
        Expand-Archive -Path $signedZip.FullName -DestinationPath $(ob_outputDirectory) -Force
        
        # Verify extraction
        $signedPkg = Get-ChildItem -Path $(ob_outputDirectory) -Filter "*.pkg" -File | Select-Object -First 1
        
        if ($signedPkg) {
          Write-Host "✅ Signed PKG extracted successfully"
          Write-Host "   Name: $($signedPkg.Name)"
          Write-Host "   Size: $([math]::Round($signedPkg.Length / 1MB, 2)) MB"
          
          # Rename to indicate it's signed
          $signedName = $signedPkg.Name -replace '\.pkg$', '-signed.pkg'
          $newPath = Join-Path $(ob_outputDirectory) $signedName
          Move-Item $signedPkg.FullName -Destination $newPath -Force
          
          Write-Host "   Renamed to: $signedName"
          
          # Generate SHA256
          $hash = Get-FileHash -Path $newPath -Algorithm SHA256
          $hashFile = "$newPath.sha256"
          "$($hash.Hash.ToLower())  $signedName" | Out-File -FilePath $hashFile -Encoding ASCII -NoNewline
          
          Write-Host "   SHA256: $($hash.Hash)"
        } else {
          Write-Error "❌ No PKG file found after extraction"
          exit 1
        }
        
        Write-Host ""
        Write-Host "=== Signed ARM64 PKG Ready ==="
        Get-ChildItem $(ob_outputDirectory) | ForEach-Object {
          Write-Host "✅ $($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
        }
      displayName: 'Extract signed ARM64 PKG'
  
  # COMMENTED OUT - Testing ARM64 only for now
