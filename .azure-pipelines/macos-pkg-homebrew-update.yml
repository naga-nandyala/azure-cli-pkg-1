# Azure CLI - Homebrew Formula PR Pipeline
# This pipeline generates a Homebrew formula and creates a PR to the homebrew tap repository

trigger: none # Manual trigger only

parameters:
  - name: SourceBuildId
    displayName: 'Source Build ID (the complete pipeline build with stapled PKG)'
    type: string
    default: '284346'
  - name: SourcePipelineName
    displayName: 'Source Pipeline Name'
    type: string
    default: 'macos-pkg-release-complete'
  - name: AzureCliVersion
    displayName: 'Azure CLI Version (e.g., 2.0.0)'
    type: string
    default: '2.0.0'
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo) where PKG is released'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: github.com_naga-nandyala
    name: naga-nandyala/homebrew-mycli-app

variables:
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: GITHUB_TOKEN
    value: $[ resources.repositories['homebrewtap'].token ]
  - name: AzureCliVersion
    value: ${{ parameters.AzureCliVersion }}
  - name: SourceBuildId
    value: ${{ parameters.SourceBuildId }}
  - name: SourcePipelineName
    value: ${{ parameters.SourcePipelineName }}
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  - name: HomebrewTapRepo
    value: ${{ parameters.HomebrewTapRepo }}
  - name: ReleaseTag
    value: v${{ parameters.AzureCliVersion }}

name: homebrew-formula-$(AzureCliVersion)-$(Build.BuildId)

stages:
- stage: DownloadStapledPkg
  displayName: 'Download Stapled PKG'
  jobs:
  - job: DownloadArtifact
    displayName: 'Download stapled PKG from build $(SourceBuildId)'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download stapled-macos-pkg artifact'
      inputs:
        buildType: 'specific'
        project: 'public'
        definition: $(SourcePipelineName)
        buildVersionToDownload: 'specific'
        buildId: $(SourceBuildId)
        artifactName: 'stapled-macos-pkg'
        targetPath: '$(Pipeline.Workspace)/stapled-pkg'
    
    - bash: |
        echo "=== Downloaded Stapled PKG Files ==="
        ls -lh $(Pipeline.Workspace)/stapled-pkg/
        echo ""
        
        # Find the PKG file
        PKG_FILE=$(find $(Pipeline.Workspace)/stapled-pkg -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: No PKG file found"
          exit 1
        fi
        
        PKG_NAME=$(basename "$PKG_FILE")
        echo "PKG File: $PKG_NAME"
        echo "Size: $(du -h $PKG_FILE | cut -f1)"
        
        # Calculate SHA256
        if [ -f "${PKG_FILE}.sha256" ]; then
          echo "SHA256 from file:"
          cat "${PKG_FILE}.sha256"
          SHA256=$(cat "${PKG_FILE}.sha256" | awk '{print $1}')
        else
          echo "Calculating SHA256..."
          SHA256=$(sha256sum "$PKG_FILE" | awk '{print $1}')
        fi
        
        # Construct GitHub release download URL
        DOWNLOAD_URL="https://github.com/$(GitHubRepo)/releases/download/$(ReleaseTag)/${PKG_NAME}"
        
        echo ""
        echo "=== Release Information ==="
        echo "GitHub Repo: $(GitHubRepo)"
        echo "Release Tag: $(ReleaseTag)"
        echo "Download URL: $DOWNLOAD_URL"
        echo "SHA256: $SHA256"
        
        # Store variables for next stage
        echo "##vso[task.setvariable variable=PKG_SHA256;isOutput=true]$SHA256"
        echo "##vso[task.setvariable variable=PKG_DOWNLOAD_URL;isOutput=true]$DOWNLOAD_URL"
        echo "##vso[task.setvariable variable=PKG_NAME;isOutput=true]$PKG_NAME"
      name: GetSHA256
      displayName: 'Get PKG SHA256'
    
    - publish: $(Pipeline.Workspace)/stapled-pkg
      artifact: stapled-pkg-for-formula
      displayName: 'Publish stapled PKG'

- stage: GenerateFormulaAndCask
  displayName: 'Generate Homebrew Formula and Cask'
  dependsOn: DownloadStapledPkg
  variables:
    PKG_SHA256: $[ stageDependencies.DownloadStapledPkg.DownloadArtifact.outputs['GetSHA256.PKG_SHA256'] ]
    PKG_DOWNLOAD_URL: $[ stageDependencies.DownloadStapledPkg.DownloadArtifact.outputs['GetSHA256.PKG_DOWNLOAD_URL'] ]
    PKG_NAME: $[ stageDependencies.DownloadStapledPkg.DownloadArtifact.outputs['GetSHA256.PKG_NAME'] ]
  jobs:
  - job: CreateFormula
    displayName: 'Create azure-cli-pr.rb formula'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Generate Homebrew Formula"
        echo "======================================"
        echo ""
        echo "Version: $(AzureCliVersion)"
        echo "PKG Name: $(PKG_NAME)"
        echo "PKG URL: $(PKG_DOWNLOAD_URL)"
        echo "SHA256: $(PKG_SHA256)"
        echo ""
        
        # Create Formula directory
        mkdir -p Formula
        
        # Generate the formula file using printf to avoid heredoc issues
        printf 'class AzureCliPr < Formula\n' > Formula/azure-cli-pr.rb
        printf '  desc "Microsoft Azure CLI - Official command-line interface"\n' >> Formula/azure-cli-pr.rb
        printf '  homepage "https://learn.microsoft.com/cli/azure/"\n' >> Formula/azure-cli-pr.rb
        printf '  url "%s"\n' "$(PKG_DOWNLOAD_URL)" >> Formula/azure-cli-pr.rb
        printf '  sha256 "%s"\n' "$(PKG_SHA256)" >> Formula/azure-cli-pr.rb
        printf '\n' >> Formula/azure-cli-pr.rb
        printf '  def install\n' >> Formula/azure-cli-pr.rb
        printf '    # Extract the PKG contents to get the payload\n' >> Formula/azure-cli-pr.rb
        printf '    system "pkgutil", "--expand", cached_download, buildpath/"azure-cli.unpkg"\n' >> Formula/azure-cli-pr.rb
        printf '    payload = Dir[buildpath/"azure-cli.unpkg"/"*.pkg"].first\n' >> Formula/azure-cli-pr.rb
        printf '    \n' >> Formula/azure-cli-pr.rb
        printf '    # Extract the Payload archive to the Cellar prefix\n' >> Formula/azure-cli-pr.rb
        printf '    system "tar", "-xzf", "#{payload}/Payload", "-C", prefix\n' >> Formula/azure-cli-pr.rb
        printf '    \n' >> Formula/azure-cli-pr.rb
        printf '    # The PKG installs to absolute paths, so files are at:\n' >> Formula/azure-cli-pr.rb
        printf '    #   prefix/bin/az (wrapper script)\n' >> Formula/azure-cli-pr.rb
        printf '    #   prefix/microsoft/azure-cli/ (Python venv)\n' >> Formula/azure-cli-pr.rb
        printf '    # Homebrew bin.install will create symlinks automatically from prefix/bin/\n' >> Formula/azure-cli-pr.rb
        printf '    \n' >> Formula/azure-cli-pr.rb
        printf '    # Ensure the wrapper script is executable\n' >> Formula/azure-cli-pr.rb
        printf '    chmod 0755, prefix/"bin/az"\n' >> Formula/azure-cli-pr.rb
        printf '  end\n' >> Formula/azure-cli-pr.rb
        printf '\n' >> Formula/azure-cli-pr.rb
        printf '  test do\n' >> Formula/azure-cli-pr.rb
        printf '    system "#{bin}/az", "--version"\n' >> Formula/azure-cli-pr.rb
        printf '  end\n' >> Formula/azure-cli-pr.rb
        printf 'end\n' >> Formula/azure-cli-pr.rb
        
        echo "✅ Formula generated: Formula/azure-cli-pr.rb"
        echo ""
        cat Formula/azure-cli-pr.rb
      displayName: 'Generate formula file'
    
    - publish: Formula
      artifact: homebrew-formula
      displayName: 'Publish formula artifact'
  
  - job: CreateCask
    displayName: 'Create azure-cli-pr.rb cask'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Generate Homebrew Cask"
        echo "======================================"
        echo ""
        echo "Version: $(AzureCliVersion)"
        echo "PKG Name: $(PKG_NAME)"
        echo "PKG URL: $(PKG_DOWNLOAD_URL)"
        echo "SHA256: $(PKG_SHA256)"
        echo ""
        
        # Create Casks directory
        mkdir -p Casks
        
        # Generate the cask file using printf
        printf 'cask "azure-cli-pr" do\n' > Casks/azure-cli-pr.rb
        printf '  version "%s"\n' "$(AzureCliVersion)" >> Casks/azure-cli-pr.rb
        printf '  sha256 "%s"\n' "$(PKG_SHA256)" >> Casks/azure-cli-pr.rb
        printf '\n' >> Casks/azure-cli-pr.rb
        printf '  url "%s"\n' "$(PKG_DOWNLOAD_URL)" >> Casks/azure-cli-pr.rb
        printf '  name "Azure CLI PR"\n' >> Casks/azure-cli-pr.rb
        printf '  desc "Microsoft Azure command-line interface (PKG installer)"\n' >> Casks/azure-cli-pr.rb
        printf '  homepage "https://learn.microsoft.com/cli/azure/"\n' >> Casks/azure-cli-pr.rb
        printf '\n' >> Casks/azure-cli-pr.rb
        printf '  depends_on macos: ">= :catalina"\n' >> Casks/azure-cli-pr.rb
        printf '\n' >> Casks/azure-cli-pr.rb
        printf '  pkg "%s"\n' "$(PKG_NAME)" >> Casks/azure-cli-pr.rb
        printf '\n' >> Casks/azure-cli-pr.rb
        printf '  uninstall pkgutil: "com.microsoft.azure-cli",\n' >> Casks/azure-cli-pr.rb
        printf '            delete:  [\n' >> Casks/azure-cli-pr.rb
        printf '              "/usr/local/bin/az",\n' >> Casks/azure-cli-pr.rb
        printf '              "/usr/local/microsoft/azure-cli",\n' >> Casks/azure-cli-pr.rb
        printf '            ]\n' >> Casks/azure-cli-pr.rb
        printf '\n' >> Casks/azure-cli-pr.rb
        printf '  zap trash: [\n' >> Casks/azure-cli-pr.rb
        printf '    "~/.azure",\n' >> Casks/azure-cli-pr.rb
        printf '  ]\n' >> Casks/azure-cli-pr.rb
        printf '\n' >> Casks/azure-cli-pr.rb
        printf '  caveats <<~EOS\n' >> Casks/azure-cli-pr.rb
        printf '    Azure CLI has been installed successfully!\n' >> Casks/azure-cli-pr.rb
        printf '    \n' >> Casks/azure-cli-pr.rb
        printf '    Installation Details:\n' >> Casks/azure-cli-pr.rb
        printf '      • Executable: /usr/local/bin/az\n' >> Casks/azure-cli-pr.rb
        printf '      • Runtime: /usr/local/microsoft/azure-cli/\n' >> Casks/azure-cli-pr.rb
        printf '    \n' >> Casks/azure-cli-pr.rb
        printf '    This is a PKG-based installation with all dependencies bundled.\n' >> Casks/azure-cli-pr.rb
        printf '    No additional Homebrew formula dependencies required!\n' >> Casks/azure-cli-pr.rb
        printf '    \n' >> Casks/azure-cli-pr.rb
        printf '    To verify installation:\n' >> Casks/azure-cli-pr.rb
        printf '      az --version\n' >> Casks/azure-cli-pr.rb
        printf '    \n' >> Casks/azure-cli-pr.rb
        printf '    To get started:\n' >> Casks/azure-cli-pr.rb
        printf '      az login\n' >> Casks/azure-cli-pr.rb
        printf '      az account list\n' >> Casks/azure-cli-pr.rb
        printf '    \n' >> Casks/azure-cli-pr.rb
        printf '    Documentation:\n' >> Casks/azure-cli-pr.rb
        printf '      https://learn.microsoft.com/cli/azure/\n' >> Casks/azure-cli-pr.rb
        printf '  EOS\n' >> Casks/azure-cli-pr.rb
        printf 'end\n' >> Casks/azure-cli-pr.rb
        
        echo "✅ Cask generated: Casks/azure-cli-pr.rb"
        echo ""
        cat Casks/azure-cli-pr.rb
      displayName: 'Generate cask file'
    
    - publish: Casks
      artifact: homebrew-cask
      displayName: 'Publish cask artifact'

- stage: CommitToHomebrew
  displayName: 'Commit to Homebrew Tap Main Branch'
  dependsOn: GenerateFormulaAndCask
  jobs:
  - job: CommitFormula
    displayName: 'Commit formula to main branch'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: homebrewtap
      persistCredentials: true
      displayName: 'Checkout homebrew tap repository'
    
    - download: current
      artifact: homebrew-formula
      displayName: 'Download formula'
    
    - download: current
      artifact: homebrew-cask
      displayName: 'Download cask'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Configure Git"
        echo "======================================"
        echo ""
        
        # Configure git
        git config --global user.email "azure-pipelines@microsoft.com"
        git config --global user.name "Azure Pipelines Bot"
        
        echo "✅ Git configured"
        ls -la
      displayName: 'Configure git'
    
    - bash: |
        set -e
        
        echo "======================================"
        echo "  Commit Formula to Main Branch"
        echo "======================================"
        echo ""
        
        # Check current git state
        echo "Current branch:"
        git branch -a
        echo ""
        echo "Current status:"
        git status
        echo ""
        
        # Checkout main branch (we're in detached HEAD state)
        git checkout -B main origin/main
        
        # Copy formula and cask
        mkdir -p Formula
        mkdir -p Casks
        cp $(Pipeline.Workspace)/homebrew-formula/azure-cli-pr.rb Formula/
        cp $(Pipeline.Workspace)/homebrew-cask/azure-cli-pr.rb Casks/
        
        # Add and commit directly to main
        git add Formula/azure-cli-pr.rb Casks/azure-cli-pr.rb
        git commit -m "Update Azure CLI to version $(AzureCliVersion)

        - Update to version $(AzureCliVersion)
        - PKG URL: $(PKG_DOWNLOAD_URL)
        - SHA256: $(PKG_SHA256)
        - Fully signed and notarized by Apple
        - Stapled for offline installation
        - Updated both Formula and Cask variants
        
        Build: $(SourceBuildId)
        Pipeline: $(Build.BuildNumber)"
        
        # Push directly to main
        git push origin main
        
        COMMIT_SHA=$(git rev-parse HEAD)
        echo ""
        echo "✅ Formula committed to main branch!"
        echo "   Repository: https://github.com/$(HomebrewTapRepo)"
        echo "   Commit: $COMMIT_SHA"
      displayName: 'Commit and push to main'
    
    - bash: |
        echo "======================================"
        echo "  Update Summary"
        echo "======================================"
        echo ""
        echo "✅ Formula and Cask Updated on Main Branch!"
        echo ""
        echo "Repository: https://github.com/$(HomebrewTapRepo)"
        echo "Version: $(AzureCliVersion)"
        echo ""
        echo "Users can now install with either:"
        echo ""
        echo "Option 1 - Using Formula (extracts PKG to Cellar):"
        echo "  brew tap $(HomebrewTapRepo)"
        echo "  brew install azure-cli-pr"
        echo ""
        echo "Option 2 - Using Cask (native PKG installer - RECOMMENDED):"
        echo "  brew tap $(HomebrewTapRepo)"
        echo "  brew install --cask azure-cli-pr"
      displayName: 'Print summary'

- stage: Summary
  displayName: 'Pipeline Summary'
  dependsOn:
  - DownloadStapledPkg
  - GenerateFormulaAndCask
  - CommitToHomebrew
  condition: always()
  jobs:
  - job: PrintSummary
    displayName: 'Summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "# Homebrew Formula and Cask Update Pipeline Summary"
        echo ""
        echo "## Configuration"
        echo "- **Version**: $(AzureCliVersion)"
        echo "- **Source Build**: $(SourceBuildId)"
        echo "- **Source Pipeline**: $(SourcePipelineName)"
        echo "- **GitHub Repo**: $(GitHubRepo)"
        echo "- **Release Tag**: $(ReleaseTag)"
        echo "- **Homebrew Tap**: $(HomebrewTapRepo)"
        echo ""
        echo "## Artifacts Generated"
        echo "- **Formula File**: Formula/azure-cli-pr.rb"
        echo "- **Cask File**: Casks/azure-cli-pr.rb"
        echo ""
        echo "## Installation Options"
        echo ""
        echo "### Option 1: Formula (extracts PKG to Homebrew Cellar)"
        echo "\`\`\`bash"
        echo "brew tap $(HomebrewTapRepo)"
        echo "brew install azure-cli-pr"
        echo "\`\`\`"
        echo ""
        echo "### Option 2: Cask (native PKG installer - RECOMMENDED)"
        echo "\`\`\`bash"
        echo "brew tap $(HomebrewTapRepo)"
        echo "brew install --cask azure-cli-pr"
        echo "\`\`\`"
        echo ""
        echo "## Why Cask is Recommended"
        echo "- ✅ Uses native PKG installer (same as sudo installer -pkg)"
        echo "- ✅ Installs to standard Microsoft paths (/usr/local/bin/az)"
        echo "- ✅ Preserves all permissions and metadata"
        echo "- ✅ Works exactly as designed by Microsoft"
      displayName: 'Pipeline summary'
