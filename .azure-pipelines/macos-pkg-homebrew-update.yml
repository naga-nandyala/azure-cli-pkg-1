# Azure CLI - Homebrew Formula PR Pipeline
# This pipeline generates a Homebrew formula and creates a PR to the homebrew tap repository

trigger: none # Manual trigger only

parameters:
  - name: SourceBuildId
    displayName: 'Source Build ID (the notarization build with stapled PKG)'
    type: string
    default: '283737'
  - name: SourcePipelineName
    displayName: 'Source Pipeline Name'
    type: string
    default: 'macos-pkg-notarize'
  - name: AzureCliVersion
    displayName: 'Azure CLI Version (e.g., 2.0.0)'
    type: string
    default: '2.0.0'
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo) where PKG is released'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: github.com_naga-nandyala
    name: naga-nandyala/homebrew-mycli-app

variables:
  - name: GITHUB_TOKEN
    value: $[ resources.repositories['homebrewtap'].token ]
  - name: AzureCliVersion
    value: ${{ parameters.AzureCliVersion }}
  - name: SourceBuildId
    value: ${{ parameters.SourceBuildId }}
  - name: SourcePipelineName
    value: ${{ parameters.SourcePipelineName }}
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  - name: HomebrewTapRepo
    value: ${{ parameters.HomebrewTapRepo }}
  - name: ReleaseTag
    value: v${{ parameters.AzureCliVersion }}

name: homebrew-formula-$(AzureCliVersion)-$(Build.BuildId)

stages:
- stage: DownloadStapledPkg
  displayName: 'Download Stapled PKG'
  jobs:
  - job: DownloadArtifact
    displayName: 'Download stapled PKG from build $(SourceBuildId)'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download stapled-macos-pkg artifact'
      inputs:
        buildType: 'specific'
        project: 'public'
        definition: $(SourcePipelineName)
        buildVersionToDownload: 'specific'
        buildId: $(SourceBuildId)
        artifactName: 'stapled-macos-pkg'
        targetPath: '$(Pipeline.Workspace)/stapled-pkg'
    
    - bash: |
        echo "=== Downloaded Stapled PKG Files ==="
        ls -lh $(Pipeline.Workspace)/stapled-pkg/
        echo ""
        
        # Find the PKG file
        PKG_FILE=$(find $(Pipeline.Workspace)/stapled-pkg -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: No PKG file found"
          exit 1
        fi
        
        PKG_NAME=$(basename "$PKG_FILE")
        echo "PKG File: $PKG_NAME"
        echo "Size: $(du -h $PKG_FILE | cut -f1)"
        
        # Calculate SHA256
        if [ -f "${PKG_FILE}.sha256" ]; then
          echo "SHA256 from file:"
          cat "${PKG_FILE}.sha256"
          SHA256=$(cat "${PKG_FILE}.sha256" | awk '{print $1}')
        else
          echo "Calculating SHA256..."
          SHA256=$(sha256sum "$PKG_FILE" | awk '{print $1}')
        fi
        
        # Construct GitHub release download URL
        DOWNLOAD_URL="https://github.com/$(GitHubRepo)/releases/download/$(ReleaseTag)/${PKG_NAME}"
        
        echo ""
        echo "=== Release Information ==="
        echo "GitHub Repo: $(GitHubRepo)"
        echo "Release Tag: $(ReleaseTag)"
        echo "Download URL: $DOWNLOAD_URL"
        echo "SHA256: $SHA256"
        
        # Store variables for next stage
        echo "##vso[task.setvariable variable=PKG_SHA256;isOutput=true]$SHA256"
        echo "##vso[task.setvariable variable=PKG_DOWNLOAD_URL;isOutput=true]$DOWNLOAD_URL"
        echo "##vso[task.setvariable variable=PKG_NAME;isOutput=true]$PKG_NAME"
      name: GetSHA256
      displayName: 'Get PKG SHA256'
    
    - publish: $(Pipeline.Workspace)/stapled-pkg
      artifact: stapled-pkg-for-formula
      displayName: 'Publish stapled PKG'

- stage: GenerateFormula
  displayName: 'Generate Homebrew Formula'
  dependsOn: DownloadStapledPkg
  variables:
    PKG_SHA256: $[ stageDependencies.DownloadStapledPkg.DownloadArtifact.outputs['GetSHA256.PKG_SHA256'] ]
    PKG_DOWNLOAD_URL: $[ stageDependencies.DownloadStapledPkg.DownloadArtifact.outputs['GetSHA256.PKG_DOWNLOAD_URL'] ]
    PKG_NAME: $[ stageDependencies.DownloadStapledPkg.DownloadArtifact.outputs['GetSHA256.PKG_NAME'] ]
  jobs:
  - job: CreateFormula
    displayName: 'Create azure-cli-pr.rb formula'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Generate Homebrew Formula"
        echo "======================================"
        echo ""
        echo "Version: $(AzureCliVersion)"
        echo "PKG Name: $(PKG_NAME)"
        echo "PKG URL: $(PKG_DOWNLOAD_URL)"
        echo "SHA256: $(PKG_SHA256)"
        echo ""
        
        # Create Formula directory
        mkdir -p Formula
        
        # Generate the formula file using printf to avoid heredoc issues
        printf 'class AzureCliPr < Formula\n' > Formula/azure-cli-pr.rb
        printf '  desc "Microsoft Azure CLI - Official command-line interface"\n' >> Formula/azure-cli-pr.rb
        printf '  homepage "https://learn.microsoft.com/cli/azure/"\n' >> Formula/azure-cli-pr.rb
        printf '  url "%s"\n' "$(PKG_DOWNLOAD_URL)" >> Formula/azure-cli-pr.rb
        printf '  sha256 "%s"\n' "$(PKG_SHA256)" >> Formula/azure-cli-pr.rb
        printf '  version "%s"\n' "$(AzureCliVersion)" >> Formula/azure-cli-pr.rb
        printf '\n' >> Formula/azure-cli-pr.rb
        printf '  bottle :unneeded\n' >> Formula/azure-cli-pr.rb
        printf '\n' >> Formula/azure-cli-pr.rb
        printf '  def install\n' >> Formula/azure-cli-pr.rb
        printf '    system "pkgutil", "--expand", cached_download, buildpath/"azure-cli.unpkg"\n' >> Formula/azure-cli-pr.rb
        printf '    payload = Dir[buildpath/"azure-cli.unpkg"/"*.pkg"].first\n' >> Formula/azure-cli-pr.rb
        printf '    system "tar", "-xzf", "#{payload}/Payload", "-C", prefix\n' >> Formula/azure-cli-pr.rb
        printf '    bin.install_symlink prefix/"usr/local/bin/az"\n' >> Formula/azure-cli-pr.rb
        printf '  end\n' >> Formula/azure-cli-pr.rb
        printf '\n' >> Formula/azure-cli-pr.rb
        printf '  def caveats\n' >> Formula/azure-cli-pr.rb
        printf '    "Azure CLI installed. Run '"'"'az --version'"'"' to verify."\n' >> Formula/azure-cli-pr.rb
        printf '  end\n' >> Formula/azure-cli-pr.rb
        printf '\n' >> Formula/azure-cli-pr.rb
        printf '  test do\n' >> Formula/azure-cli-pr.rb
        printf '    system "#{bin}/az", "--version"\n' >> Formula/azure-cli-pr.rb
        printf '  end\n' >> Formula/azure-cli-pr.rb
        printf 'end\n' >> Formula/azure-cli-pr.rb
        
        echo "✅ Formula generated: Formula/azure-cli-pr.rb"
        echo ""
        cat Formula/azure-cli-pr.rb
      displayName: 'Generate formula file'
    
    - publish: Formula
      artifact: homebrew-formula
      displayName: 'Publish formula artifact'

- stage: CreatePullRequest
  displayName: 'Create PR to Homebrew Tap'
  dependsOn: GenerateFormula
  jobs:
  - job: SubmitPR
    displayName: 'Submit PR to homebrew tap'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: homebrewtap
      persistCredentials: true
      displayName: 'Checkout homebrew tap repository'
    
    - download: current
      artifact: homebrew-formula
      displayName: 'Download formula'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Configure Git"
        echo "======================================"
        echo ""
        
        # Configure git
        git config --global user.email "azure-pipelines@microsoft.com"
        git config --global user.name "Azure Pipelines Bot"
        
        echo "✅ Git configured"
        ls -la
      displayName: 'Configure git'
    
    - bash: |
        set -e
        
        echo "======================================"
        echo "  Create Branch and Commit Formula"
        echo "======================================"
        echo ""
        
        # Create new branch
        BRANCH_NAME="update-azure-cli-$(AzureCliVersion)-$(Build.BuildId)"
        git checkout -b "$BRANCH_NAME"
        
        # Copy formula
        mkdir -p Formula
        cp $(Pipeline.Workspace)/homebrew-formula/azure-cli-pr.rb Formula/
        
        # Add and commit
        git add Formula/azure-cli-pr.rb
        git commit -m "Update Azure CLI to version $(AzureCliVersion)

        - Update to version $(AzureCliVersion)
        - PKG URL: $(PKG_DOWNLOAD_URL)
        - SHA256: $(PKG_SHA256)
        - Fully signed and notarized by Apple
        - Stapled for offline installation
        
        Build: $(SourceBuildId)
        Pipeline: $(Build.BuildNumber)"
        
        # Push branch
        git push origin "$BRANCH_NAME"
        
        echo "✅ Branch pushed: $BRANCH_NAME"
        echo "##vso[task.setvariable variable=BRANCH_NAME;isOutput=true]$BRANCH_NAME"
      name: CreateBranch
      displayName: 'Create branch and commit'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Install GitHub CLI"
        echo "======================================"
        
        # Install gh CLI
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
        sudo apt update
        sudo apt install gh -y
        
        gh --version
        echo "✅ GitHub CLI installed"
      displayName: 'Install GitHub CLI'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Create Pull Request"
        echo "======================================"
        echo ""
        
        BRANCH_NAME="$(CreateBranch.BRANCH_NAME)"
        
        # Authenticate with GitHub using service connection token
        echo "${GITHUB_TOKEN}" | gh auth login --with-token
        
        # Create PR - use variable for body to avoid YAML parsing issues
        PR_BODY="Update Azure CLI to version $(AzureCliVersion). This PR updates the formula with the latest notarized and stapled package."
        
        PR_URL=$(gh pr create \
          --repo "$(HomebrewTapRepo)" \
          --title "Update Azure CLI to $(AzureCliVersion)" \
          --body "${PR_BODY}" \
          --base main)
        
        echo ""
        echo "✅ Pull Request created successfully!"
        echo "   URL: $PR_URL"
        echo "##vso[task.setvariable variable=PR_URL]$PR_URL"
      displayName: 'Create GitHub PR'
    
    - bash: |
        echo "======================================"
        echo "  PR Summary"
        echo "======================================"
        echo ""
        echo "✅ Pull Request Created!"
        echo ""
        echo "Repository: https://github.com/$(HomebrewTapRepo)"
        echo "PR URL: $(PR_URL)"
        echo "Version: $(AzureCliVersion)"
        echo ""
        echo "After merging, users can install with:"
        echo "  brew tap $(HomebrewTapRepo)"
        echo "  brew install azure-cli-pr"
      displayName: 'Print summary'

- stage: Summary
  displayName: 'Pipeline Summary'
  dependsOn:
  - DownloadStapledPkg
  - GenerateFormula
  - CreatePullRequest
  condition: always()
  jobs:
  - job: PrintSummary
    displayName: 'Summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "# Homebrew Formula PR Pipeline Summary"
        echo ""
        echo "## Configuration"
        echo "- **Version**: $(AzureCliVersion)"
        echo "- **Source Build**: $(SourceBuildId)"
        echo "- **GitHub Repo**: $(GitHubRepo)"
        echo "- **Release Tag**: $(ReleaseTag)"
        echo "- **Homebrew Tap**: $(HomebrewTapRepo)"
        echo ""
        echo "## Artifacts"
        echo "- **Formula File**: azure-cli-pr.rb"
        echo "- **Location**: Formula/azure-cli-pr.rb"
        echo ""
        echo "## Next Steps"
        echo "1. ✅ PR created automatically"
        echo "2. Review and merge the PR"
        echo "3. Test installation: brew install azure-cli-pr"
      displayName: 'Pipeline summary'
