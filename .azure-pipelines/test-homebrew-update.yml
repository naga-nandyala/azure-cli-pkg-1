# Test Pipeline: Offline Install + az login Test
#
# Purpose: Test tarball installation and az login broker activation
# Usage: Downloads artifacts from a previous pipeline run

trigger: none

parameters:
  - name: SourceBuildId
    displayName: 'Build ID (Run ID) with signed tarballs'
    type: string
    default: '297555'
  
  - name: SourcePipelineId
    displayName: 'Source Pipeline Definition ID (from URL)'
    type: string
    default: 'naga_macos_opus_pipeline'
  
  - name: PythonVersion
    displayName: 'Python Version (Homebrew)'
    type: string
    default: '3.13'

variables:
  # Disable auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true

jobs:
# ============================================================================
# JOB: TEST OFFLINE INSTALL + AZ LOGIN (Both Architectures)
# ============================================================================
- job: TestOfflineInstall
  displayName: 'Test Offline Tarball Installation'
  strategy:
    matrix:
      ARM64:
        ARCH: 'arm64'
        VM_IMAGE: 'macos-15-arm64'
      Intel:
        ARCH: 'x86_64'
        VM_IMAGE: 'macos-15'
  pool:
    vmImage: $(VM_IMAGE)

  steps:
  - checkout: none

  # Download tarball from the source build
  - task: DownloadPipelineArtifact@2
    displayName: 'Download signed tarball ($(ARCH))'
    inputs:
      buildType: 'specific'
      project: '$(System.TeamProjectId)'
      pipeline: '${{ parameters.SourcePipelineId }}'
      buildVersionToDownload: 'specific'
      buildId: ${{ parameters.SourceBuildId }}
      artifactName: 'cli-signed-notarized-$(ARCH)'
      targetPath: '$(Pipeline.Workspace)/cli-signed-notarized-$(ARCH)'

  - bash: |
      echo "=== Cleanup: Remove pre-installed Azure CLI ($(ARCH)) ==="
      
      if command -v az &> /dev/null; then
        echo "Pre-installed Azure CLI detected: $(which az)"
        
        brew uninstall azure-cli 2>/dev/null || true
        brew uninstall --cask azure-cli 2>/dev/null || true
        
        sudo rm -f /usr/local/bin/az
        sudo rm -f /opt/homebrew/bin/az
        
        hash -r
      fi
      echo "Cleanup complete"
    displayName: 'Remove pre-installed Azure CLI'

  - bash: |
      set -e
      
      echo "=== Testing Offline/Direct Tarball Installation ($(ARCH)) ==="
      
      TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-$(ARCH) -name "azure-cli-*-macos-$(ARCH).tar.gz" | head -1)
      TEST_DIR="$HOME/azure-cli-test"
      
      mkdir -p "$TEST_DIR"
      tar -xzf "$TARBALL" -C "$TEST_DIR"
      
      if ! brew list python@${{ parameters.PythonVersion }} &>/dev/null; then
        brew install python@${{ parameters.PythonVersion }}
      fi
      
      AZ_PYTHON="$(brew --prefix python@${{ parameters.PythonVersion }})/libexec/bin/python3"
      export AZ_PYTHON
      
      export AZ_DEBUG=1
      "$TEST_DIR/bin/az" version
      
      INSTALLED_VERSION=$("$TEST_DIR/bin/az" version -o tsv --query '"azure-cli"' 2>/dev/null || echo "unknown")
      
      echo ""
      echo "Installed version: $INSTALLED_VERSION"
      echo "Offline installation successful ($(ARCH))"
      
      # Keep TEST_DIR for login test
      echo "##vso[task.setvariable variable=TEST_DIR]$TEST_DIR"
    displayName: 'Test offline install'

  - bash: |
      set -e
      
      echo "=== Testing az login with --debug ($(ARCH)) ==="
      
      TEST_DIR="$(TEST_DIR)"
      AZ_PYTHON="$(brew --prefix python@${{ parameters.PythonVersion }})/libexec/bin/python3"
      export AZ_PYTHON
      
      AZ_CMD="$TEST_DIR/bin/az"
      
      # Test 1: Verify login help works (validates auth module loads)
      echo "--- Testing 'az login --help' ---"
      "$AZ_CMD" login --help | head -20
      
      # Test 2: Run az login --debug to see broker flow activation
      echo ""
      echo "--- Running 'az login --debug' (10 sec timeout) ---"
      echo "Looking for broker activation in debug output..."
      echo ""
      
      # Install coreutils for gtimeout (macOS compatible timeout)
      brew install coreutils 2>/dev/null || true
      
      # Run with gtimeout to capture debug output before interactive prompt
      gtimeout 10 "$AZ_CMD" login --debug 2>&1 || true
      
      echo ""
      echo "--- End of debug output ---"
      
      # Test 3: Verify account commands work (should show not logged in)
      echo ""
      echo "--- Testing 'az account show' (expected: not logged in) ---"
      "$AZ_CMD" account show 2>&1 || echo "Not logged in (expected in CI)"
      
      echo ""
      echo "=== Login test completed ($(ARCH)) ==="
      
      # Cleanup
      rm -rf "$TEST_DIR"
    displayName: 'Test az login'
    continueOnError: true
