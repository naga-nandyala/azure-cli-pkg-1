# Test Pipeline: Signing & Notarization Verification
#
# Purpose: Verify code signing and notarization of macOS binaries
# Usage: Downloads signed tarballs from a previous pipeline run and verifies signing
#
# This pipeline is useful for:
# - Testing signing verification logic without running the full pipeline
# - Validating artifacts from previous builds
# - Quick iteration on verification scripts

trigger: none

parameters:
  - name: SourceBuildId
    displayName: 'Build ID (Run ID) with signed tarballs'
    type: string
    default: '297555'
  
  - name: SourcePipelineId
    displayName: 'Source Pipeline Definition ID (from URL)'
    type: string
    default: 'naga_macos_opus_pipeline'
  
  - name: PythonVersion
    displayName: 'Python Version (Homebrew)'
    type: string
    default: '3.13'

variables:
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: runCodesignValidationInjection
    value: false

jobs:
- job: VerifySigningNotarization
  displayName: 'Verify Signing & Notarization'
  strategy:
    matrix:
      ARM64:
        ARCH: 'arm64'
        VM_IMAGE: 'macos-15-arm64'
      Intel:
        ARCH: 'x86_64'
        VM_IMAGE: 'macos-15'
  pool:
    vmImage: $(VM_IMAGE)

  steps:
  - checkout: none

  - task: DownloadPipelineArtifact@2
    displayName: 'Download signed tarball ($(ARCH))'
    inputs:
      buildType: 'specific'
      project: '$(System.TeamProjectId)'
      pipeline: '${{ parameters.SourcePipelineId }}'
      buildVersionToDownload: 'specific'
      buildId: ${{ parameters.SourceBuildId }}
      artifactName: 'cli-signed-notarized-$(ARCH)'
      targetPath: '$(Pipeline.Workspace)/cli-signed-notarized-$(ARCH)'

  - bash: |
      echo "=== Environment Info ($(ARCH)) ==="
      echo "macOS version: $(sw_vers -productVersion)"
      echo "Architecture: $(uname -m)"
    displayName: 'Show environment info'

  - bash: |
      set -e
      ARCH="$(ARCH)"
      TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-$ARCH -name "azure-cli-*-macos-$ARCH.tar.gz" | head -1)
      if [ -z "$TARBALL" ]; then
        echo "##vso[task.logissue type=error]No tarball found for $ARCH"
        exit 1
      fi
      TEST_DIR=$(mktemp -d)
      echo "Tarball: $(basename $TARBALL)"
      tar -xzf "$TARBALL" -C "$TEST_DIR"
      
      SIGNED_COUNT=0
      UNSIGNED_COUNT=0
      
      while IFS= read -r -d '' file; do
        if codesign -v "$file" 2>/dev/null; then
          ((SIGNED_COUNT++))
        else
          ((UNSIGNED_COUNT++))
          echo "WARNING: Unsigned: $(basename $file)"
        fi
      done < <(find "$TEST_DIR" -name "*.so" -type f -print0)
      
      while IFS= read -r -d '' file; do
        if codesign -v "$file" 2>/dev/null; then
          ((SIGNED_COUNT++))
        else
          ((UNSIGNED_COUNT++))
        fi
      done < <(find "$TEST_DIR" -name "*.dylib" -type f -print0)
      
      echo "Signing Summary:"
      echo "  Signed: $SIGNED_COUNT"
      echo "  Unsigned: $UNSIGNED_COUNT"
      
      if [ "$UNSIGNED_COUNT" -gt 0 ]; then
        echo "##vso[task.logissue type=warning]Found $UNSIGNED_COUNT unsigned binaries"
      fi
      
      SAMPLE_SO=$(find "$TEST_DIR" -name "*.so" -type f | head -1)
      if [ -n "$SAMPLE_SO" ]; then
        echo "=== Sample Signature Details ==="
        codesign -dvvv "$SAMPLE_SO" 2>&1 | grep -E "^(Identifier|TeamIdentifier|Authority|CDHash)" || true
        echo "=== Authority Chain ==="
        codesign -d --verbose=4 "$SAMPLE_SO" 2>&1 | grep "Authority" || true
        echo "=== Strict Verification ==="
        if codesign --verify --deep --strict "$SAMPLE_SO" 2>&1; then
          echo "Signature: VALID"
        else
          echo "Signature: Has issues"
        fi
        echo "=== Developer ID Check ==="
        if codesign -dvv "$SAMPLE_SO" 2>&1 | grep -q "Developer ID"; then
          echo "Signed with Developer ID certificate"
        else
          echo "WARNING: May not be signed with Developer ID"
        fi
      fi
      rm -rf "$TEST_DIR"
    displayName: 'Verify code signing ($(ARCH))'

  - bash: |
      set -e
      ARCH="$(ARCH)"
      TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-$ARCH -name "azure-cli-*-macos-$ARCH.tar.gz" | head -1)
      TEST_DIR=$(mktemp -d)
      tar -xzf "$TARBALL" -C "$TEST_DIR"
      
      if ! brew list python@${{ parameters.PythonVersion }} &>/dev/null; then
        brew install python@${{ parameters.PythonVersion }}
      fi
      
      AZ_PYTHON="$(brew --prefix python@${{ parameters.PythonVersion }})/libexec/bin/python3"
      export AZ_PYTHON
      
      if "$TEST_DIR/bin/az" version 2>&1; then
        echo "CLI functional test: PASSED ($ARCH)"
      else
        echo "##vso[task.logissue type=error]CLI functional test failed"
        exit 1
      fi
      rm -rf "$TEST_DIR"
    displayName: 'Functional test ($(ARCH))'

  - bash: |
      echo "=== VERIFICATION COMPLETE ($(ARCH)) ==="
      echo "Build ID: ${{ parameters.SourceBuildId }}"
      echo "Pipeline: ${{ parameters.SourcePipelineId }}"
    displayName: 'Summary'

