# Test Pipeline: Signing & Notarization Verification
#
# Purpose: Verify code signing and notarization of macOS binaries
# Usage: Downloads signed tarballs from a previous pipeline run and verifies signing
#
# This pipeline is useful for:
# - Testing signing verification logic without running the full pipeline
# - Validating artifacts from previous builds
# - Quick iteration on verification scripts

trigger: none

parameters:
  - name: SourceBuildId
    displayName: 'Build ID (Run ID) with signed tarballs'
    type: string
    default: '297555'
  
  - name: SourcePipelineId
    displayName: 'Source Pipeline Definition ID (from URL)'
    type: string
    default: 'naga_macos_opus_pipeline'
  
  - name: PythonVersion
    displayName: 'Python Version (Homebrew)'
    type: string
    default: '3.13'

variables:
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: runCodesignValidationInjection
    value: false

jobs:
- job: VerifySigningNotarization
  displayName: 'Verify Signing & Notarization'
  strategy:
    matrix:
      ARM64:
        ARCH: 'arm64'
        VM_IMAGE: 'macos-15-arm64'
      Intel:
        ARCH: 'x86_64'
        VM_IMAGE: 'macos-15'
  pool:
    vmImage: $(VM_IMAGE)

  steps:
  - checkout: none

  - task: DownloadPipelineArtifact@2
    displayName: 'Download signed tarball ($(ARCH))'
    inputs:
      buildType: 'specific'
      project: '$(System.TeamProjectId)'
      pipeline: '${{ parameters.SourcePipelineId }}'
      buildVersionToDownload: 'specific'
      buildId: ${{ parameters.SourceBuildId }}
      artifactName: 'cli-signed-notarized-$(ARCH)'
      targetPath: '$(Pipeline.Workspace)/cli-signed-notarized-$(ARCH)'

  - bash: |
      echo "=== Environment Info ($(ARCH)) ==="
      echo "macOS version: $(sw_vers -productVersion)"
      echo "Architecture: $(uname -m)"
    displayName: 'Show environment info'

  - bash: |
      set -e
      ARCH="$(ARCH)"
      TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-$ARCH -name "azure-cli-*-macos-$ARCH.tar.gz" | head -1)
      if [ -z "$TARBALL" ]; then
        echo "##vso[task.logissue type=error]No tarball found for $ARCH"
        exit 1
      fi
      TEST_DIR=$(mktemp -d)
      echo "Tarball: $(basename $TARBALL)"
      tar -xzf "$TARBALL" -C "$TEST_DIR"
      
      # Counters for all checks
      TOTAL_COUNT=0
      SIGNED_COUNT=0
      UNSIGNED_COUNT=0
      STRICT_PASS=0
      STRICT_FAIL=0
      DEVID_PASS=0
      DEVID_FAIL=0
      
      # Collect all binaries (.so, .dylib, and Mach-O executables)
      BINARIES=()
      while IFS= read -r -d '' file; do
        BINARIES+=("$file")
      done < <(find "$TEST_DIR" \( -name "*.so" -o -name "*.dylib" \) -type f -print0)
      
      # Also check Mach-O executables in bin/
      while IFS= read -r -d '' file; do
        if file "$file" | grep -q "Mach-O"; then
          BINARIES+=("$file")
        fi
      done < <(find "$TEST_DIR/bin" -type f -print0 2>/dev/null || true)
      
      TOTAL_COUNT=${#BINARIES[@]}
      echo "Found $TOTAL_COUNT binaries to verify"
      
      # Track failed files for detailed reporting
      UNSIGNED_FILES=()
      STRICT_FAILED_FILES=()
      DEVID_FAILED_FILES=()
      FIRST_SIGNED=
      
      for file in "${BINARIES[@]}"; do
        filename=$(basename "$file")
        
        # 1. Basic signature check
        if codesign -v "$file" 2>/dev/null; then
          ((SIGNED_COUNT++))
          [ -z "$FIRST_SIGNED" ] && FIRST_SIGNED="$file"
          
          # 2. Strict verification (only for signed files)
          if codesign --verify --deep --strict "$file" 2>/dev/null; then
            ((STRICT_PASS++))
          else
            ((STRICT_FAIL++))
            STRICT_FAILED_FILES+=("$filename")
          fi
          
          # 3. Developer ID check (only for signed files)
          if codesign -dvv "$file" 2>&1 | grep -q "Developer ID"; then
            ((DEVID_PASS++))
          else
            ((DEVID_FAIL++))
            DEVID_FAILED_FILES+=("$filename")
          fi
        else
          ((UNSIGNED_COUNT++))
          UNSIGNED_FILES+=("$filename")
        fi
      done
      
      echo ""
      echo "========================================"
      echo "VERIFICATION SUMMARY ($ARCH)"
      echo "========================================"
      echo "Total binaries:        $TOTAL_COUNT"
      echo ""
      echo "Basic Signature:"
      echo "  Signed:              $SIGNED_COUNT"
      echo "  Unsigned:            $UNSIGNED_COUNT"
      echo ""
      echo "Strict Verification (--deep --strict):"
      echo "  Passed:              $STRICT_PASS"
      echo "  Failed:              $STRICT_FAIL"
      echo ""
      echo "Developer ID Certificate:"
      echo "  Has Developer ID:    $DEVID_PASS"
      echo "  Missing Developer ID: $DEVID_FAIL"
      echo "========================================"
      
      # Report failures in detail
      if [ ${#UNSIGNED_FILES[@]} -gt 0 ]; then
        echo ""
        echo "UNSIGNED FILES:"
        printf '  - %s\n' "${UNSIGNED_FILES[@]}"
      fi
      
      if [ ${#STRICT_FAILED_FILES[@]} -gt 0 ]; then
        echo ""
        echo "STRICT VERIFICATION FAILED:"
        printf '  - %s\n' "${STRICT_FAILED_FILES[@]}"
      fi
      
      if [ ${#DEVID_FAILED_FILES[@]} -gt 0 ]; then
        echo ""
        echo "MISSING DEVELOPER ID:"
        printf '  - %s\n' "${DEVID_FAILED_FILES[@]}"
      fi
      
      # Show sample signature details (just for reference)
      if [ -n "$FIRST_SIGNED" ]; then
        echo ""
        echo "=== Sample Signature Details ($(basename $FIRST_SIGNED)) ==="
        codesign -dvvv "$FIRST_SIGNED" 2>&1 | grep -E "^(Identifier|TeamIdentifier|Authority|CDHash)" || true
      fi
      
      # Fail if any issues found
      ERRORS=0
      if [ "$UNSIGNED_COUNT" -gt 0 ]; then
        echo "##vso[task.logissue type=error]Found $UNSIGNED_COUNT unsigned binaries"
        ERRORS=1
      fi
      if [ "$STRICT_FAIL" -gt 0 ]; then
        echo "##vso[task.logissue type=error]$STRICT_FAIL binaries failed strict verification"
        ERRORS=1
      fi
      if [ "$DEVID_FAIL" -gt 0 ]; then
        echo "##vso[task.logissue type=error]$DEVID_FAIL binaries missing Developer ID certificate"
        ERRORS=1
      fi
      
      rm -rf "$TEST_DIR"
      
      if [ "$ERRORS" -eq 1 ]; then
        exit 1
      fi
      
      echo ""
      echo "All $TOTAL_COUNT binaries passed verification"
    displayName: 'Verify ALL binaries ($(ARCH))'

  - bash: |
      set -e
      ARCH="$(ARCH)"
      TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-$ARCH -name "azure-cli-*-macos-$ARCH.tar.gz" | head -1)
      TEST_DIR=$(mktemp -d)
      tar -xzf "$TARBALL" -C "$TEST_DIR"
      
      if ! brew list python@${{ parameters.PythonVersion }} &>/dev/null; then
        brew install python@${{ parameters.PythonVersion }}
      fi
      
      AZ_PYTHON="$(brew --prefix python@${{ parameters.PythonVersion }})/libexec/bin/python3"
      export AZ_PYTHON
      
      if "$TEST_DIR/bin/az" version 2>&1; then
        echo "CLI functional test: PASSED ($ARCH)"
      else
        echo "##vso[task.logissue type=error]CLI functional test failed"
        exit 1
      fi
      rm -rf "$TEST_DIR"
    displayName: 'Functional test ($(ARCH))'

  - bash: |
      echo "=== VERIFICATION COMPLETE ($(ARCH)) ==="
      echo "Build ID: ${{ parameters.SourceBuildId }}"
      echo "Pipeline: ${{ parameters.SourcePipelineId }}"
    displayName: 'Summary'

