- stage: CreateGitHubRelease
  displayName: 'Create GitHub Release'
  dependsOn: BuildPkg
  condition: and(succeeded(), eq('${{ parameters.CreateGitHubRelease }}', true))
  jobs:
  - job: PublishRelease
    displayName: 'Publish to GitHub Releases'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: self
      clean: true
    
    - task: UsePythonVersion@0
      displayName: 'Set up Python $(PYTHON_VERSION)'
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
        addToPath: true
    
    - bash: |
        if [ -n "$(Version)" ]; then
          echo "VERSION=$(Version)" >> $AZURE_PIPELINES_ENV
          echo "Using provided version: $(Version)"
        else
          # Extract version from azure-cli-core/__init__.py
          VERSION=$(python -c "import re; content = open('src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\''\"'](.+?)['\''\"']', content); print(m.group(1) if m else 'ERROR')")
          if [ "$VERSION" = "ERROR" ]; then
            echo "❌ Failed to detect version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $AZURE_PIPELINES_ENV
          echo "Using version from azure-cli-core: $VERSION"
        fi
        echo "##vso[task.setvariable variable=CLI_VERSION]$VERSION"
      displayName: 'Set VERSION environment variable'
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARM64 artifacts'
      inputs:
        artifactName: 'pkg-installer-macos-arm64'
        targetPath: '$(Pipeline.Workspace)/release-artifacts/macos-arm64'
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download x86_64 artifacts'
      inputs:
        artifactName: 'pkg-installer-macos-x86_64'
        targetPath: '$(Pipeline.Workspace)/release-artifacts/macos-x86_64'
    
    - bash: |
        mkdir -p release
        VERSION="$(CLI_VERSION)"
        
        echo "=== Preparing Release Assets ==="
        echo "Version: $VERSION"
        echo "Available artifacts:"
        find $(Pipeline.Workspace)/release-artifacts -type f
        
        for arch in macos-arm64 macos-x86_64; do
          pkg_path=$(find $(Pipeline.Workspace)/release-artifacts -type f -name "azure-cli-${VERSION}-${arch}.pkg" -print -quit)
          sha_path=$(find $(Pipeline.Workspace)/release-artifacts -type f -name "azure-cli-${VERSION}-${arch}.pkg.sha256" -print -quit)
          
          if [[ -z "$pkg_path" || -z "$sha_path" ]]; then
            echo "❌ Missing artifacts for ${arch}"
            echo "Expected PKG: azure-cli-${VERSION}-${arch}.pkg"
            echo "Expected SHA: azure-cli-${VERSION}-${arch}.pkg.sha256"
            exit 1
          fi
          
          cp "$pkg_path" release/
          cp "$sha_path" release/
          
          echo "✅ Prepared ${arch} artifacts:"
          echo "  PKG: $(basename "$pkg_path") ($(du -h "$pkg_path" | cut -f1))"
          echo "  SHA: $(basename "$sha_path")"
        done
        
        echo ""
        echo "=== Release Files ==="
        ls -lh release/
      displayName: 'Prepare release assets'
    
    - pwsh: |
        $version = "$(CLI_VERSION)"
        $tag = "azure-cli-pkg-v$version"
        $repo = "$(GitHubRepo)"
        $prerelease = if ("${{ parameters.Prerelease }}" -eq "true") { $true } else { $false }
        
        # Create release body
        $body = @"
        # Azure CLI v$version - macOS PKG Installer
        
        ## 🍺 Homebrew Cask Installation
        
        ``````bash
        brew tap naga-nandyala/mycli-app
        brew install --cask azure-cli-pkg
        ``````
        
        ## 📦 Direct Installation
        
        **Apple Silicon**: ``azure-cli-$version-macos-arm64.pkg``  
        **Intel**: ``azure-cli-$version-macos-x86_64.pkg``
        
        ``````bash
        sudo installer -pkg azure-cli-$version-macos-<arch>.pkg -target /
        az --version
        ``````
        
        ## Package Info
        
        - **Location**: ``/usr/local/microsoft/azure-cli/``
        - **Executable**: ``/usr/local/bin/az``
        - **Python**: $(PYTHON_VERSION)
        - **Package ID**: ``com.microsoft.azure-cli``
        
        ## Verification
        
        ``````bash
        shasum -a 256 -c azure-cli-$version-macos-<arch>.pkg.sha256
        ``````
        
        ## Uninstall
        
        ``````bash
        # Via Homebrew Cask
        brew uninstall --cask azure-cli-pkg
        
        # Manual
        sudo rm -rf /usr/local/microsoft/azure-cli
        sudo rm /usr/local/bin/az
        ``````
        
        ## Links
        
        - [Repository](https://github.com/$repo)
        - [Azure CLI Docs](https://learn.microsoft.com/cli/azure/)
        "@
        
        # Prepare API request
        $apiUrl = "https://api.github.com/repos/$repo/releases"
        
        $headers = @{
          'Accept' = 'application/vnd.github+json'
          'Authorization' = "Bearer $env:GITHUB_PAT"
          'User-Agent' = 'AzureDevOps-Pipeline'
        }
        
        $releaseData = @{
          tag_name = $tag
          name = "Azure CLI v$version - macOS PKG Installer"
          body = $body
          draft = $false
          prerelease = $prerelease
        } | ConvertTo-Json
        
        Write-Host "Creating GitHub release: $tag"
        $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Post -Body $releaseData -ContentType 'application/json'
        
        Write-Host "✅ Release created: $($release.html_url)"
        Write-Host "Upload URL: $($release.upload_url)"
        
        # Store upload URL for next steps
        $uploadUrl = $release.upload_url -replace '\{\?name,label\}', ''
        Write-Host "##vso[task.setvariable variable=UPLOAD_URL]$uploadUrl"
      displayName: 'Create GitHub Release'
      env:
        GITHUB_PAT: $(GITHUB_PAT)
    
    - pwsh: |
        $version = "$(CLI_VERSION)"
        $uploadUrl = "$(UPLOAD_URL)"
        
        $headers = @{
          'Accept' = 'application/vnd.github+json'
          'Authorization' = "Bearer $env:GITHUB_PAT"
          'User-Agent' = 'AzureDevOps-Pipeline'
        }
        
        # Upload each file
        $files = Get-ChildItem -Path "release" -File
        foreach ($file in $files) {
          $fileName = $file.Name
          $filePath = $file.FullName
          
          Write-Host "Uploading: $fileName"
          
          $uri = "$uploadUrl`?name=$fileName"
          $contentType = if ($fileName.EndsWith('.pkg')) { 'application/octet-stream' } else { 'text/plain' }
          
          $fileBytes = [System.IO.File]::ReadAllBytes($filePath)
          
          try {
            Invoke-RestMethod -Uri $uri -Headers $headers -Method Post -Body $fileBytes -ContentType $contentType | Out-Null
            Write-Host "✅ Uploaded: $fileName"
          } catch {
            Write-Host "❌ Failed to upload: $fileName"
            Write-Host $_.Exception.Message
            exit 1
          }
        }
        
        Write-Host ""
        Write-Host "✅ All files uploaded successfully!"
      displayName: 'Upload release assets'
      env:
        GITHUB_PAT: $(GITHUB_PAT)

- stage: Summary
  displayName: 'Build Summary'
  dependsOn: BuildPkg
  condition: always()
  jobs:
  - job: PrintSummary
    displayName: 'Print Build Summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "# Azure CLI macOS PKG Build Summary (Homebrew Cask Ready)"
        echo ""
        echo "## Configuration"
        echo "- **Version**: \`${{ parameters.Version }}\` $(if [ -z "${{ parameters.Version }}" ]; then echo "(auto-detected from source)"; fi)"
        echo "- **Python Version**: \`$(PYTHON_VERSION)\`"
        echo "- **Build Method**: productbuild (distribution package)"
        echo "- **Script**: \`scripts/release/macos/build_pkg_installer.py\`"
        echo "- **Create Release**: ${{ parameters.CreateGitHubRelease }}"
        echo "- **Pre-release**: ${{ parameters.Prerelease }}"
        echo ""
        echo "## Build Status"
        echo "- **macOS ARM64 (Apple Silicon)**: ✅ Completed"
        echo "- **macOS x86_64 (Intel)**: ✅ Completed"
        echo ""
        echo "## Package Features"
        echo "- ✅ **Homebrew Cask compatible** (.pkg format)"
        echo "- ✅ Native macOS installer with productbuild"
        echo "- ✅ Complete Azure CLI installation (core + telemetry + all modules)"
        echo "- ✅ Direct installation to /usr/local/"
        echo "- ✅ No symlink management required"
        echo "- ✅ Professional installer UI with distribution package"
        echo "- ✅ SHA256 checksums for integrity verification"
        echo "- ✅ Architecture-specific builds (ARM64 + x86_64)"
        echo ""
        echo "## Installation Paths"
        echo "- **Executable**: \`/usr/local/bin/az\`"
        echo "- **Installation**: \`/usr/local/microsoft/azure-cli/\`"
        echo "- **Installer ID**: \`com.microsoft.azure-cli\`"
        echo ""
        echo "## Next Steps"
        echo "1. Create/update Homebrew Cask in \`naga-nandyala/homebrew-mycli-app\` tap"
        echo "2. Test installation via: \`brew install --cask azure-cli-pkg\`"
        echo "3. Verify uninstallation via: \`brew uninstall --cask azure-cli-pkg\`"
      displayName: 'Build Summary'
