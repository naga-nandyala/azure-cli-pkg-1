# Azure CLI - Homebrew Cask Update/Test Pipeline
#
# Purpose: update the cask from signed tarballs and test installation.
# Input: signed+notarized artifacts from macos-tarball-sign-notarize-v3.
# Steps: update cask -> test cask install -> test offline install.

trigger: none

parameters:
  - name: SignNotarizeBuildId
    displayName: 'Sign/Notarize Build ID (macos-tarball-sign-notarize-v3)'
    type: string
    default: '296858'

  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'

  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: 'github.com_naga-nandyala'
    name: naga-nandyala/homebrew-mycli-app
    ref: main

variables:
  - template: templates/variables.yml

  # Disable auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true

  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  - name: HomebrewTapRepo
    value: ${{ parameters.HomebrewTapRepo }}

stages:
# ==========================================================================
# STAGE 1: UPDATE HOMEBREW CASK
# ==========================================================================
- stage: UpdateHomebrewCask
  displayName: 'Stage 1: Update Homebrew Cask'
  jobs:
  - job: UpdateCask
    displayName: 'Update Homebrew Cask Definition'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      fetchDepth: 1


    - checkout: homebrewtap
      persistCredentials: true
      path: homebrew-tap

    - task: DownloadPipelineArtifact@2
      displayName: 'Download signed tarball (ARM64)'
      inputs:
        buildType: 'specific'
        project: 'release'
        definition: 'macos-tarball-sign-notarize-v3'
        buildVersionToDownload: 'specific'
        buildId: ${{ parameters.SignNotarizeBuildId }}
        artifactName: 'cli-signed-notarized-v3-arm64'
        targetPath: '$(Pipeline.Workspace)/cli-signed-notarized-v3-arm64'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download signed tarball (Intel)'
      inputs:
        buildType: 'specific'
        project: 'release'
        definition: 'macos-tarball-sign-notarize-v3'
        buildVersionToDownload: 'specific'
        buildId: ${{ parameters.SignNotarizeBuildId }}
        artifactName: 'cli-signed-notarized-v3-x86_64'
        targetPath: '$(Pipeline.Workspace)/cli-signed-notarized-v3-x86_64'

    - bash: |
        set -e

        GITHUB_REPO="${{ parameters.GitHubRepo }}"

        ARM64_TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-v3-arm64 -name "azure-cli-*.tar.gz" | sort | tail -1)
        X86_64_TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-v3-x86_64 -name "azure-cli-*.tar.gz" | sort | tail -1)

        VERSION=$(basename "$ARM64_TARBALL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([a-z0-9]+)?' | head -1)

        ARM64_SHA256=$(cat ${ARM64_TARBALL}.sha256 | cut -d' ' -f1)
        X86_64_SHA256=$(cat ${X86_64_TARBALL}.sha256 | cut -d' ' -f1)

        echo "=== Updating Homebrew Cask ==="
        echo "Version: $VERSION"
        echo "ARM64 SHA256: $ARM64_SHA256"
        echo "x86_64 SHA256: $X86_64_SHA256"

        cd $(Pipeline.Workspace)/homebrew-tap

        mkdir -p Casks
        CASK_FILE="Casks/azure-cli-v3.rb"

        REPO_NAME="$(Build.Repository.Name)"
        REPO_DIR="${REPO_NAME##*/}"
        REPO_ROOT=""
        for candidate in \
          "$(Build.SourcesDirectory)/$REPO_DIR" \
          "$(Build.SourcesDirectory)/$REPO_NAME" \
          "$(Build.SourcesDirectory)"; do
          if [ -d "$candidate" ]; then
            REPO_ROOT="$candidate"
            break
          fi
        done

        if [ -z "$REPO_ROOT" ]; then
          echo "ERROR: Unable to resolve repo root"
          echo "Build.SourcesDirectory: $(Build.SourcesDirectory)"
          echo "Build.Repository.Name: $(Build.Repository.Name)"
          exit 1
        fi

        TEMPLATE_PATH="$REPO_ROOT/scripts/release/macos/templates/azure-cli-v3.rb.in"
        OUTPUT_PATH="$CASK_FILE"

        python3 "$REPO_ROOT/scripts/release/macos/cask_generate.py" \
          --version "$VERSION" \
          --arm64-sha "$ARM64_SHA256" \
          --x86-64-sha "$X86_64_SHA256" \
          --github-repo "$GITHUB_REPO" \
          --template "$TEMPLATE_PATH" \
          --output "$OUTPUT_PATH"

        echo "=== Updated Cask ==="
        cat "$CASK_FILE"

        git config user.name "Azure Pipeline"
        git config user.email "azure-pipeline@microsoft.com"
        git add Casks/azure-cli-v3.rb
        git commit -m "Update azure-cli-v3 to $VERSION (both architectures)" || echo "No changes to commit"
        git push origin HEAD:main

        echo "Homebrew cask updated successfully"

      displayName: 'Update cask definition (both architectures)'

# ==========================================================================
# STAGE 2: TEST INSTALLATION
# ==========================================================================
- stage: TestInstallation
  displayName: 'Stage 2: Test Installation'
  dependsOn:
  - UpdateHomebrewCask
  condition: succeeded()
  jobs:
  - job: TestCaskInstall
    displayName: 'Test Homebrew Cask Installation'
    strategy:
      matrix:
        ARM64:
          ARCH: 'arm64'
          VM_IMAGE: 'macos-15-arm64'
        Intel:
          ARCH: 'x86_64'
          VM_IMAGE: 'macos-15'
    pool:
      vmImage: $(VM_IMAGE)

    steps:
    - checkout: none

    - bash: |
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║  CLEANUP: Remove Pre-installed Azure CLI ($(ARCH))                   ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        echo ""

        if command -v az &> /dev/null; then
          echo "Pre-installed Azure CLI detected: $(which az)"
          az --version 2>/dev/null | head -3 || true
          echo ""

          echo "Removing via Homebrew..."
          brew uninstall azure-cli 2>/dev/null || true
          brew uninstall --cask azure-cli 2>/dev/null || true
          brew uninstall azure-cli-v3 2>/dev/null || true
          brew uninstall --cask azure-cli-v3 2>/dev/null || true

          echo "Removing symlinks..."
          sudo rm -f /usr/local/bin/az
          sudo rm -f /opt/homebrew/bin/az

          echo "Removing installation directories..."
          sudo rm -rf /usr/local/microsoft/azure-cli
          sudo rm -rf /usr/local/az
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/Cellar/azure-cli*
          sudo rm -rf /opt/homebrew/Cellar/azure-cli*

          hash -r
        else
          echo "No pre-installed Azure CLI detected"
        fi
        echo ""
        echo "Cleanup complete"

      displayName: 'Remove pre-installed Azure CLI ($(ARCH))'

    - bash: |
        set -e

        echo "=== Testing Homebrew Cask Installation (v3 - $(ARCH)) ==="

        if ! brew list python@3.13 &>/dev/null; then
          echo "Installing Python 3.13..."
          brew install python@3.13
        fi

        brew tap ${{ parameters.HomebrewTapRepo }}
        brew install --cask azure-cli-v3

        which az
        az version

        INSTALLED_VERSION=$(az version -o tsv --query '"azure-cli"' 2>/dev/null || echo "unknown")

        echo ""
        echo "Installed version: $INSTALLED_VERSION"
        echo ""
        echo "Cask installation successful ($(ARCH))"

        brew uninstall --cask azure-cli-v3

      displayName: 'Test cask install ($(ARCH))'

  - job: TestOfflineInstall
    displayName: 'Test Offline/Tarball Installation'
    strategy:
      matrix:
        ARM64:
          ARCH: 'arm64'
          VM_IMAGE: 'macos-15-arm64'
        Intel:
          ARCH: 'x86_64'
          VM_IMAGE: 'macos-15'
    pool:
      vmImage: $(VM_IMAGE)

    steps:
    - checkout: none

    - bash: |
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║  CLEANUP: Remove Pre-installed Azure CLI ($(ARCH))                   ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        echo ""

        if command -v az &> /dev/null; then
          echo "Pre-installed Azure CLI detected: $(which az)"
          az --version 2>/dev/null | head -3 || true
          echo ""

          echo "Removing via Homebrew..."
          brew uninstall azure-cli 2>/dev/null || true
          brew uninstall --cask azure-cli 2>/dev/null || true

          echo "Removing symlinks..."
          sudo rm -f /usr/local/bin/az
          sudo rm -f /opt/homebrew/bin/az

          echo "Removing installation directories..."
          sudo rm -rf /usr/local/Cellar/azure-cli*
          sudo rm -rf /opt/homebrew/Cellar/azure-cli*

          hash -r
        else
          echo "No pre-installed Azure CLI detected"
        fi
        echo ""

      displayName: 'Remove pre-installed Azure CLI ($(ARCH))'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download signed tarball ($(ARCH))'
      inputs:
        buildType: 'specific'
        project: 'release'
        definition: 'macos-tarball-sign-notarize-v3'
        buildVersionToDownload: 'specific'
        buildId: ${{ parameters.SignNotarizeBuildId }}
        artifactName: 'cli-signed-notarized-v3-$(ARCH)'
        targetPath: '$(Pipeline.Workspace)/cli-signed-notarized-v3-$(ARCH)'

    - bash: |
        set -e

        echo "=== Testing Offline/Direct Tarball Installation ($(ARCH)) ==="

        TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-v3-$(ARCH) -name "azure-cli-*.tar.gz" | sort | tail -1)
        TEST_DIR="$HOME/azure-cli-test"

        mkdir -p "$TEST_DIR"
        tar -xzf "$TARBALL" -C "$TEST_DIR"

        if ! brew list python@3.13 &>/dev/null; then
          brew install python@3.13
        fi

        AZ_PYTHON="$(brew --prefix python@3.13)/libexec/bin/python3"
        export AZ_PYTHON

        export AZ_DEBUG=1
        "$TEST_DIR/bin/az" version

        INSTALLED_VERSION=$("$TEST_DIR/bin/az" version -o tsv --query '"azure-cli"' 2>/dev/null || echo "unknown")

        echo ""
        echo "Installed version: $INSTALLED_VERSION"
        echo ""
        echo "Offline installation successful ($(ARCH))"

        rm -rf "$TEST_DIR"

      displayName: 'Test offline install ($(ARCH))'
