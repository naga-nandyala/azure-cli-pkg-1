# Azure CLI - GitHub Release Publication Pipeline
# This pipeline publishes the notarized and stapled PKG to GitHub Releases

trigger: none # Manual trigger only

parameters:
  - name: SourceBuildId
    displayName: 'Source Build ID (the notarization build with stapled PKG)'
    type: string
    default: '283737'
  - name: SourcePipelineName
    displayName: 'Source Pipeline Name'
    type: string
    default: 'macos-pkg-notarize'
  - name: AzureCliVersion
    displayName: 'Azure CLI Version (e.g., 2.0.0)'
    type: string
    default: '2.0.0'
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  - name: IsPreRelease
    displayName: 'Mark as Pre-release'
    type: boolean
    default: false
  - name: IsDraft
    displayName: 'Create as Draft'
    type: boolean
    default: false

resources:
  repositories:
  - repository: releaserepo
    type: github
    endpoint: github.com_naga-nandyala
    name: naga-nandyala/azure-cli-pkg-1

variables:
  - name: AzureCliVersion
    value: ${{ parameters.AzureCliVersion }}
  - name: SourceBuildId
    value: ${{ parameters.SourceBuildId }}
  - name: SourcePipelineName
    value: ${{ parameters.SourcePipelineName }}
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  - name: ReleaseTag
    value: v${{ parameters.AzureCliVersion }}

name: github-release-$(AzureCliVersion)-$(Build.BuildId)

stages:
- stage: DownloadArtifacts
  displayName: 'Download Release Artifacts'
  jobs:
  - job: DownloadStapledPkg
    displayName: 'Download stapled PKG'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download stapled-macos-pkg artifact'
      inputs:
        buildType: 'specific'
        project: 'public'
        definition: $(SourcePipelineName)
        buildVersionToDownload: 'specific'
        buildId: $(SourceBuildId)
        artifactName: 'stapled-macos-pkg'
        targetPath: '$(Pipeline.Workspace)/stapled-pkg'
    
    - bash: |
        set -e
        echo "=== Downloaded Artifacts ==="
        ls -lh $(Pipeline.Workspace)/stapled-pkg/
        echo ""
        
        # Find PKG file
        PKG_FILE=$(find $(Pipeline.Workspace)/stapled-pkg -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: No PKG file found"
          exit 1
        fi
        
        PKG_NAME=$(basename "$PKG_FILE")
        echo "PKG File: $PKG_NAME"
        echo "Size: $(du -h $PKG_FILE | cut -f1)"
        
        # Get or calculate SHA256
        if [ -f "${PKG_FILE}.sha256" ]; then
          echo "SHA256 (from file):"
          cat "${PKG_FILE}.sha256"
          SHA256=$(cat "${PKG_FILE}.sha256" | awk '{print $1}')
        else
          echo "Calculating SHA256..."
          SHA256=$(sha256sum "$PKG_FILE" | awk '{print $1}')
          echo "$SHA256  $PKG_NAME" | tee "${PKG_FILE}.sha256"
        fi
        
        echo ""
        echo "=== Artifact Details ==="
        echo "Name: $PKG_NAME"
        echo "SHA256: $SHA256"
        
        # Store variables for next stage
        echo "##vso[task.setvariable variable=PKG_FILE;isOutput=true]$PKG_FILE"
        echo "##vso[task.setvariable variable=PKG_NAME;isOutput=true]$PKG_NAME"
        echo "##vso[task.setvariable variable=PKG_SHA256;isOutput=true]$SHA256"
      name: ValidateArtifact
      displayName: 'Validate artifacts'
    
    - publish: $(Pipeline.Workspace)/stapled-pkg
      artifact: release-artifacts
      displayName: 'Publish release artifacts'

- stage: CreateGitHubRelease
  displayName: 'Create GitHub Release'
  dependsOn: DownloadArtifacts
  variables:
    PKG_NAME: $[ stageDependencies.DownloadArtifacts.DownloadStapledPkg.outputs['ValidateArtifact.PKG_NAME'] ]
    PKG_SHA256: $[ stageDependencies.DownloadArtifacts.DownloadStapledPkg.outputs['ValidateArtifact.PKG_SHA256'] ]
  jobs:
  - job: CreateRelease
    displayName: 'Create GitHub release'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: releaserepo
      persistCredentials: true
      displayName: 'Checkout repository for auth'
    
    - download: current
      artifact: release-artifacts
      displayName: 'Download release artifacts'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Install GitHub CLI"
        echo "======================================"
        
        # Install gh CLI
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
        sudo apt update
        sudo apt install gh jq -y
        
        gh --version
        echo "✅ GitHub CLI installed"
      displayName: 'Install GitHub CLI'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Create GitHub Release with GH CLI"
        echo "======================================"
        echo ""
        echo "Repository: $(GitHubRepo)"
        echo "Tag: $(ReleaseTag)"
        echo "Version: $(AzureCliVersion)"
        echo "Pre-release: ${{ parameters.IsPreRelease }}"
        echo "Draft: ${{ parameters.IsDraft }}"
        echo ""
        
        # Authenticate with GitHub using the checked out repo credentials
        echo "$SYSTEM_ACCESSTOKEN" | gh auth login --with-token
        
        # Find PKG file info
        PKG_FILE=$(find $(Pipeline.Workspace)/release-artifacts -name "*.pkg" -type f | head -1)
        PKG_NAME=$(basename "$PKG_FILE")
        PKG_SIZE=$(du -h "$PKG_FILE" | cut -f1)
        
        # Create release notes
        RELEASE_NOTES="# Azure CLI $(AzureCliVersion)

        ## 🎉 Official Release

        This is the official release of **Azure CLI $(AzureCliVersion)** for macOS.

        ## 📦 Downloads

        - **macOS ARM64 (Apple Silicon)**: \`${PKG_NAME}\`
          - Size: ${PKG_SIZE}
          - SHA256: \`$(PKG_SHA256)\`

        ## ✅ Security & Notarization

        - ✅ **Signed**: Developer ID Installer (Microsoft Corporation)
        - ✅ **Notarized**: Verified by Apple
        - ✅ **Stapled**: Works completely offline
        - ✅ **Gatekeeper**: No security warnings

        ## 🍺 Homebrew Installation

        Install via Homebrew tap:

        \`\`\`bash
        brew tap naga-nandyala/homebrew-mycli-app
        brew install azure-cli-pr
        \`\`\`

        ## 📥 Manual Installation

        1. Download \`${PKG_NAME}\`
        2. Verify SHA256 checksum:
           \`\`\`bash
           echo '$(PKG_SHA256)  ${PKG_NAME}' | shasum -a 256 -c
           \`\`\`
        3. Double-click the PKG or run:
           \`\`\`bash
           sudo installer -pkg ${PKG_NAME} -target /
           \`\`\`
        4. Verify installation:
           \`\`\`bash
           az --version
           \`\`\`

        ## 🔐 Security Verification

        Verify the PKG is properly signed and notarized:

        \`\`\`bash
        # Check signature
        pkgutil --check-signature ${PKG_NAME}

        # Check notarization
        spctl -a -vv -t install ${PKG_NAME}

        # Check stapled ticket
        stapler validate ${PKG_NAME}
        \`\`\`

        ## 📚 Documentation

        - [Azure CLI Documentation](https://learn.microsoft.com/cli/azure/)
        - [Getting Started Guide](https://learn.microsoft.com/cli/azure/get-started-with-azure-cli)
        - [Command Reference](https://learn.microsoft.com/cli/azure/reference-index)

        ## 🚀 Quick Start

        \`\`\`bash
        # Login to Azure
        az login

        # Check version
        az --version

        # Get help
        az --help
        \`\`\`

        ## 📋 Build Information

        - **Build ID**: $(SourceBuildId)
        - **Build Date**: $(date -u +\"%Y-%m-%d %H:%M:%S UTC\")
        - **Pipeline**: $(Build.BuildNumber)

        ## 🐛 Issues & Support

        Report issues at: https://github.com/$(GitHubRepo)/issues

        ---

        *This release was automatically generated by Azure Pipelines*"
        
        # Save release notes to file
        echo "$RELEASE_NOTES" > release-notes.md
        
        # Create GitHub release with gh CLI
        DRAFT_FLAG=""
        PRERELEASE_FLAG=""
        
        if [ "${{ parameters.IsDraft }}" == "True" ]; then
          DRAFT_FLAG="--draft"
        fi
        
        if [ "${{ parameters.IsPreRelease }}" == "True" ]; then
          PRERELEASE_FLAG="--prerelease"
        fi
        
        echo "Creating release..."
        gh release create "$(ReleaseTag)" \
          --repo "$(GitHubRepo)" \
          --title "Azure CLI $(AzureCliVersion)" \
          --notes-file release-notes.md \
          $DRAFT_FLAG \
          $PRERELEASE_FLAG \
          "$PKG_FILE" \
          "${PKG_FILE}.sha256" 2>&1 | tee release-output.txt
        
        # Get release URL
        RELEASE_URL=$(gh release view "$(ReleaseTag)" --repo "$(GitHubRepo)" --json url --jq '.url')
        
        echo ""
        echo "✅ Release created successfully!"
        echo "   URL: $RELEASE_URL"
        
        # Store variables
        echo "##vso[task.setvariable variable=RELEASE_URL;isOutput=true]$RELEASE_URL"
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      name: CreateReleaseStep
      displayName: 'Create GitHub release'
    
    - bash: |
        echo "======================================"
        echo "  Release Summary"
        echo "======================================"
        echo ""
        echo "✅ GitHub Release Created Successfully!"
        echo ""
        echo "Release: $(CreateReleaseStep.RELEASE_URL)"
        echo "Tag: $(ReleaseTag)"
        echo "Version: $(AzureCliVersion)"
        echo ""
        echo "Download URL:"
        echo "  $(UploadAssets.PKG_DOWNLOAD_URL)"
        echo ""
        echo "SHA256: $(PKG_SHA256)"
        echo ""
        echo "Users can download and install:"
        echo "  1. Download from: $(CreateReleaseStep.RELEASE_URL)"
        echo "  2. Verify checksum"
        echo "  3. Install the PKG"
        echo ""
        echo "Next Steps:"
        echo "  - Update Homebrew formula with download URL"
        echo "  - Announce the release"
      displayName: 'Release summary'

- stage: Summary
  displayName: 'Pipeline Summary'
  dependsOn:
  - DownloadArtifacts
  - CreateGitHubRelease
  condition: always()
  jobs:
  - job: PrintSummary
    displayName: 'Summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "# GitHub Release Publication Summary"
        echo ""
        echo "## Configuration"
        echo "- **Version**: $(AzureCliVersion)"
        echo "- **Tag**: $(ReleaseTag)"
        echo "- **Repository**: https://github.com/$(GitHubRepo)"
        echo "- **Source Build**: $(SourceBuildId)"
        echo ""
        echo "## Release Type"
        if [ "${{ parameters.IsDraft }}" == "True" ]; then
          echo "- **Status**: Draft (not published yet)"
        elif [ "${{ parameters.IsPreRelease }}" == "True" ]; then
          echo "- **Status**: Pre-release"
        else
          echo "- **Status**: Official Release"
        fi
        echo ""
        echo "## Artifacts Published"
        echo "- Notarized and stapled macOS PKG"
        echo "- SHA256 checksum file"
        echo ""
        echo "## Next Steps"
        echo "1. ✅ Release created on GitHub"
        echo "2. Review the release page"
        if [ "${{ parameters.IsDraft }}" == "True" ]; then
          echo "3. Publish the draft release when ready"
        fi
        echo "4. Update Homebrew formula with download URL"
        echo "5. Announce the release"
      displayName: 'Pipeline summary'
