# Azure CLI - macOS Tar.gz Sign and Notarize Pipeline (v2)
# 
# Phase 3: Sign and Notarize CLI Package
# 
# This pipeline takes an unsigned CLI tar.gz from macos-tarball-build-v2 and:
# 1. Signs all Mach-O binaries with ESRP (Developer ID Application)
# 2. Creates a ZIP bundle of signed binaries
# 3. Submits to Apple for notarization via ESRP
# 4. Repackages as final signed+notarized tar.gz
#
# Input: Unsigned CLI tarball artifact from Build ID (default: 292543)
#   - cli-build-unsigned artifact from macos-tarball-build-v2 pipeline
#
# Workflow:
# ┌─────────────┐    ┌──────────────┐    ┌─────────────────┐    ┌──────────────┐
# │ Download    │───▶│ Sign all     │───▶│ Submit ZIP to   │───▶│ Create final │
# │ unsigned    │    │ binaries     │    │ Apple for       │    │ tar.gz       │
# │ tar.gz      │    │ (ESRP)       │    │ notarization    │    │              │
# └─────────────┘    └──────────────┘    └─────────────────┘    └──────────────┘
#
# IMPORTANT: Notarization is about code signatures, NOT the archive format
# - Apple records the code signature hashes
# - When users run binaries, macOS checks with Apple's servers
# - Tar.gz extraction doesn't affect signatures

trigger: none

parameters:
  - name: TarballBuildId
    displayName: 'CLI Tarball Build ID (from macos-tarball-build-v2 pipeline)'
    type: string
    default: '292664'
  
  - name: TarballArtifact
    displayName: 'Tarball Artifact Name'
    type: string
    default: 'cli-build-unsigned'
  
  - name: Architecture
    displayName: 'Architecture'
    type: string
    default: 'arm64'
    values:
    - arm64
    - x86_64
  
  - name: BundleId
    displayName: 'Bundle ID for notarization'
    type: string
    default: 'com.microsoft.azure.cli'
  
  - name: PublishToGitHub
    displayName: 'Publish to GitHub Release'
    type: boolean
    default: true
  
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  
  - name: UpdateHomebrew
    displayName: 'Update Homebrew formula after release'
    type: boolean
    default: true
  
  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: 'github.com_naga-nandyala'
    name: naga-nandyala/homebrew-mycli-app
    ref: main

variables:
  - group: 'AME ESRP Variable Group'
  
  # GitHub token for publishing releases
  - name: GITHUB_TOKEN
    value: $[ resources.repositories['homebrewtap'].token ]
  
  # Parameter variable mappings
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  - name: HomebrewTapRepo
    value: ${{ parameters.HomebrewTapRepo }}
  
  # Disable auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true

name: sign-notarize-v2-$(Build.BuildId)-${{ parameters.Architecture }}

stages:
# ============================================================================
# STAGE 1: DOWNLOAD AND ANALYZE UNSIGNED TAR.GZ
# ============================================================================
- stage: DownloadAndAnalyze
  displayName: 'Stage 1: Download and Analyze'
  jobs:
  - job: DownloadAndAnalyze
    displayName: 'Download unsigned tar.gz and analyze binaries'
    pool:
      ${{ if eq(parameters.Architecture, 'arm64') }}:
        vmImage: 'macos-15-arm64'
      ${{ else }}:
        vmImage: 'macos-15'
    
    steps:
    - checkout: self
      fetchDepth: 1
    
    # Download from Tarball Build pipeline artifacts (Build 292543)
    - task: DownloadPipelineArtifact@2
      displayName: 'Download from Tarball Build Pipeline (Build ${{ parameters.TarballBuildId }})'
      inputs:
        buildType: 'specific'
        project: 'release'
        definition: 'macos-tarball-build-v2'
        buildVersionToDownload: 'specific'
        buildId: ${{ parameters.TarballBuildId }}
        artifactName: '${{ parameters.TarballArtifact }}'
        targetPath: '$(Pipeline.Workspace)/tarball-download'
    
    - bash: |
        set -e
        
        echo "=== Unsigned Tarball from Pipeline Artifacts ==="
        echo "Build ID: ${{ parameters.TarballBuildId }}"
        echo "Artifact: ${{ parameters.TarballArtifact }}"
        echo ""
        
        echo "=== Downloaded Files ==="
        ls -lh $(Pipeline.Workspace)/tarball-download/
        echo ""
        
        mkdir -p $(Build.ArtifactStagingDirectory)/unsigned
        
        # Find the tarball in the downloaded artifact
        TARBALL=$(find $(Pipeline.Workspace)/tarball-download -name "azure-cli-*.tar.gz" | head -1)
        
        if [ -z "$TARBALL" ]; then
          echo "❌ ERROR: No azure-cli-*.tar.gz found in artifact"
          find $(Pipeline.Workspace)/tarball-download -type f
          exit 1
        fi
        
        echo "✅ Found: $TARBALL"
        TARBALL_NAME=$(basename "$TARBALL")
        echo "   Name: $TARBALL_NAME"
        echo "   Size: $(du -h "$TARBALL" | cut -f1)"
        
        cp "$TARBALL" $(Build.ArtifactStagingDirectory)/unsigned/unsigned.tar.gz
        
        # Extract version from tarball name (e.g., azure-cli-2.68.0-macos-arm64.tar.gz)
        VERSION=$(echo "$TARBALL_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        if [ -z "$VERSION" ]; then
          VERSION="unknown"
        fi
        
        echo ""
        echo "Detected version: $VERSION"
        echo "##vso[task.setvariable variable=AzureCliVersion;isOutput=true]$VERSION"
        echo "##vso[task.setvariable variable=TarballName;isOutput=true]$TARBALL_NAME"
        
      displayName: 'Prepare tarball from pipeline artifacts'
      name: DownloadStep
    
    - bash: |
        set -e
        
        echo "=== Analyzing Binaries to Sign ==="
        echo "Note: Python base was signed in Phase 1, only CLI extensions need signing"
        echo ""
        
        TARBALL="$(Build.ArtifactStagingDirectory)/unsigned/unsigned.tar.gz"
        EXTRACT_DIR=$(mktemp -d)
        
        tar -xzf "$TARBALL" -C "$EXTRACT_DIR"
        
        # Find all Mach-O binaries first (for summary)
        # IMPORTANT: Filter out "(for architecture ...)" lines from universal binaries
        # The 'file' command outputs extra lines for fat binaries which are NOT valid paths
        ALL_BINARIES="$(Build.ArtifactStagingDirectory)/all-binaries.txt"
        find "$EXTRACT_DIR" -type f -exec file {} \; | \
          grep -i "Mach-O" | \
          grep -v "(for architecture" | \
          cut -d: -f1 | \
          sed "s|$EXTRACT_DIR/||" | \
          sort -u > "$ALL_BINARIES"
        
        TOTAL_COUNT=$(wc -l < "$ALL_BINARIES")
        echo "Total Mach-O binaries in tarball: $TOTAL_COUNT"
        
        # Count by category
        PYTHON_CORE=$(grep -cE '^(bin/python|libexec/bin/python|lib/libpython)' "$ALL_BINARIES" || echo 0)
        STDLIB_MODULES=$(grep -cE 'lib-dynload.*\.so$' "$ALL_BINARIES" || echo 0)
        CLI_EXTENSIONS=$(grep -cE 'site-packages.*\.so$' "$ALL_BINARIES" || echo 0)
        DYLIBS=$(grep -cE '\.dylib$' "$ALL_BINARIES" || echo 0)
        
        echo ""
        echo "=== Binary Categories ==="
        echo "Python core binaries: $PYTHON_CORE"
        echo "Stdlib modules (.so): $STDLIB_MODULES"
        echo "CLI extension modules: $CLI_EXTENSIONS"
        echo "Dynamic libraries:    $DYLIBS"
        
        # Copy all-binaries list to binaries-to-sign (sign ALL for notarization)
        BINARIES_LIST="$(Build.ArtifactStagingDirectory)/binaries-to-sign.txt"
        cp "$ALL_BINARIES" "$BINARIES_LIST"
        
        BINARY_COUNT=$(wc -l < "$BINARIES_LIST")
        echo ""
        echo "=== Binaries to Sign ===" 
        echo "Total: $BINARY_COUNT"
        echo "##vso[task.setvariable variable=BinaryCount;isOutput=true]$BINARY_COUNT"
        
        echo ""
        head -20 "$BINARIES_LIST"
        if [ $BINARY_COUNT -gt 20 ]; then
          echo "... and $((BINARY_COUNT - 20)) more"
        fi
        
        # Keep extracted contents for signing
        mkdir -p $(Build.ArtifactStagingDirectory)/unsigned-contents
        cp -R "$EXTRACT_DIR"/* $(Build.ArtifactStagingDirectory)/unsigned-contents/
        
        rm -rf "$EXTRACT_DIR"
        
      displayName: 'Analyze and list all binaries'
      name: AnalyzeStep
    
    - publish: $(Build.ArtifactStagingDirectory)/unsigned
      artifact: unsigned-tarball
      displayName: 'Publish unsigned tarball'
    
    - publish: $(Build.ArtifactStagingDirectory)/binaries-to-sign.txt
      artifact: binaries-list
      displayName: 'Publish binaries list'

# ============================================================================
# STAGE 2: SIGN ALL BINARIES WITH ESRP
# ============================================================================
- stage: SignBinaries
  displayName: 'Stage 2: Sign Binaries (ESRP)'
  dependsOn: DownloadAndAnalyze
  condition: succeeded()
  variables:
    BinaryCount: $[ stageDependencies.DownloadAndAnalyze.DownloadAndAnalyze.outputs['AnalyzeStep.BinaryCount'] ]
  jobs:
  - job: SignWithESRP
    displayName: 'Sign $(BinaryCount) binaries with ESRP'
    pool:
      vmImage: 'windows-latest'
    timeoutInMinutes: 60
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-tarball
      displayName: 'Download unsigned tarball'
    
    - download: current
      artifact: binaries-list
      displayName: 'Download binaries list'
    
    - pwsh: |
        Write-Host "=== Preparing Binaries for ESRP Signing ==="
        Write-Host "NOTE: ESRP requires each binary in a ZIP file"
        Write-Host ""
        
        # Extract tar.gz
        $tarball = "$(Pipeline.Workspace)/unsigned-tarball/unsigned.tar.gz"
        $extractPath = "$(Pipeline.Workspace)/unsigned-contents"
        
        Write-Host "Extracting: $tarball"
        New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
        tar -xzf $tarball -C $extractPath
        
        # Read binaries list
        $fileListPath = "$(Pipeline.Workspace)/binaries-list/binaries-to-sign.txt"
        $filesToSign = Get-Content $fileListPath
        
        Write-Host "Files to sign: $($filesToSign.Count)"
        Write-Host ""
        
        # Create ZIP for each binary
        $toBeSignedDir = "$(Pipeline.Workspace)/toBeSigned"
        New-Item -ItemType Directory -Path $toBeSignedDir -Force | Out-Null
        
        $fileMapping = @{}
        $count = 0
        
        foreach ($relativePath in $filesToSign) {
          if ([string]::IsNullOrWhiteSpace($relativePath)) { continue }
          
          $fullPath = Join-Path $extractPath $relativePath
          
          if (Test-Path $fullPath) {
            $flatName = $relativePath -replace '[/\\]', '__'
            $zipName = "$flatName.zip"
            $zipPath = Join-Path $toBeSignedDir $zipName
            
            Compress-Archive -Path $fullPath -DestinationPath $zipPath -Force
            
            $fileMapping[$zipName] = @{
              "OriginalPath" = $relativePath
              "FileName" = (Split-Path $relativePath -Leaf)
            }
            
            $count++
            if ($count -le 10) {
              Write-Host "  $relativePath"
            }
          }
        }
        
        if ($count -gt 10) {
          Write-Host "  ... and $($count - 10) more"
        }
        
        Write-Host ""
        Write-Host "Created $count ZIP files for signing"
        Write-Host "Total size: $([math]::Round((Get-ChildItem $toBeSignedDir -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 2)) MB"
        
        # Save mapping
        $mappingPath = "$(Pipeline.Workspace)/file-mapping.json"
        $fileMapping | ConvertTo-Json -Depth 10 | Set-Content $mappingPath
        
      displayName: 'Create ZIP for each binary'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Sign all binaries'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/toBeSigned'
        Pattern: '*.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppDeveloperSign",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "Hardening": "--options=runtime"
              }
            }
          ]
        SessionTimeout: '120'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "=== Extracting Signed Binaries ==="
        
        $signedZipsDir = "$(Pipeline.Workspace)/toBeSigned"
        $outputDir = "$(Build.ArtifactStagingDirectory)/signed-binaries"
        $mappingPath = "$(Pipeline.Workspace)/file-mapping.json"
        
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        
        $fileMapping = Get-Content $mappingPath | ConvertFrom-Json
        $count = 0
        
        foreach ($entry in $fileMapping.PSObject.Properties) {
          $zipName = $entry.Name
          $fileInfo = $entry.Value
          $zipPath = Join-Path $signedZipsDir $zipName
          
          if (Test-Path $zipPath) {
            $tempExtract = "$(Pipeline.Workspace)/temp_extract/$zipName"
            Expand-Archive -Path $zipPath -DestinationPath $tempExtract -Force
            
            $extractedFile = Get-ChildItem -Path $tempExtract -File | Select-Object -First 1
            
            if ($extractedFile) {
              $targetPath = Join-Path $outputDir $fileInfo.OriginalPath
              $targetDir = Split-Path $targetPath -Parent
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
              Copy-Item -Path $extractedFile.FullName -Destination $targetPath -Force
              $count++
            }
          }
        }
        
        Write-Host "Extracted $count signed binaries"
        
      displayName: 'Extract signed binaries'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-binaries
      artifact: signed-binaries
      displayName: 'Publish signed binaries'

# ============================================================================
# STAGE 3: CREATE NOTARIZATION BUNDLE
# ============================================================================
- stage: CreateNotarizationBundle
  displayName: 'Stage 3: Prepare for Notarization'
  dependsOn:
  - DownloadAndAnalyze
  - SignBinaries
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndAnalyze.DownloadAndAnalyze.outputs['DownloadStep.AzureCliVersion'] ]
  jobs:
  - job: MergeAndBundle
    displayName: 'Merge signed binaries and create ZIP bundle'
    pool:
      ${{ if eq(parameters.Architecture, 'arm64') }}:
        vmImage: 'macos-15-arm64'
      ${{ else }}:
        vmImage: 'macos-15'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-tarball
      displayName: 'Download unsigned tarball'
    
    - download: current
      artifact: signed-binaries
      displayName: 'Download signed binaries'
    
    - bash: |
        set -e
        
        echo "=== Merging Signed Binaries ==="
        
        # Extract original (preserves symlinks)
        TARBALL="$(Pipeline.Workspace)/unsigned-tarball/unsigned.tar.gz"
        MERGED_DIR="$(Build.ArtifactStagingDirectory)/merged"
        
        mkdir -p "$MERGED_DIR"
        tar -xzf "$TARBALL" -C "$MERGED_DIR"
        
        echo "Extracted original with symlinks"
        
        # Overlay signed binaries
        SIGNED_DIR="$(Pipeline.Workspace)/signed-binaries"
        cd "$SIGNED_DIR"
        
        REPLACED=0
        find . -type f | while read signed_file; do
          target="$MERGED_DIR/$signed_file"
          if [ -f "$target" ]; then
            cp "$signed_file" "$target"
            REPLACED=$((REPLACED + 1))
          fi
        done
        
        echo "Overlaid signed binaries"
        
        # Restore permissions
        find "$MERGED_DIR" -type f \( -name "python*" -o -name "*.dylib" -o -name "*.so" \) -exec chmod +x {} \;
        chmod +x "$MERGED_DIR/bin/az" 2>/dev/null || true
        chmod +x "$MERGED_DIR/libexec/bin/az" 2>/dev/null || true
        
        echo "Permissions restored"
        
        # Verify symlinks
        echo ""
        echo "=== Verifying Symlinks ==="
        if [ -L "$MERGED_DIR/bin/az" ]; then
          echo "✅ bin/az is symlink: $(readlink $MERGED_DIR/bin/az)"
        fi
        
        # Verify signature
        echo ""
        echo "=== Verifying Signature ==="
        PYTHON_BIN=$(find "$MERGED_DIR" -path "*/bin/python3" -type f | head -1)
        if [ -n "$PYTHON_BIN" ]; then
          codesign -dvv "$PYTHON_BIN" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
        fi
        
        # Create ZIP for notarization
        echo ""
        echo "=== Creating Notarization Bundle ==="
        cd "$MERGED_DIR"
        ZIP_PATH="$(Build.ArtifactStagingDirectory)/azure-cli-for-notarization.zip"
        zip -r -y "$ZIP_PATH" .
        
        echo "Created: $ZIP_PATH"
        ls -lh "$ZIP_PATH"
        
      displayName: 'Merge and create ZIP bundle'
    
    - bash: |
        set -e
        
        # Also create the signed tar.gz (without notarization)
        # This is useful for comparison/testing
        
        MERGED_DIR="$(Build.ArtifactStagingDirectory)/merged"
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/signed-tarball"
        VERSION="$(AzureCliVersion)"
        ARCH="${{ parameters.Architecture }}"
        
        mkdir -p "$OUTPUT_DIR"
        
        cd "$MERGED_DIR"
        TARBALL_NAME="azure-cli-${VERSION}-macos-${ARCH}-signed.tar.gz"
        tar -czf "$OUTPUT_DIR/$TARBALL_NAME" --preserve-permissions .
        
        cd "$OUTPUT_DIR"
        shasum -a 256 "$TARBALL_NAME" | tee "$TARBALL_NAME.sha256"
        
        echo ""
        echo "Created signed tar.gz (without notarization):"
        ls -lh "$OUTPUT_DIR"
        
      displayName: 'Create signed tar.gz'
    
    - publish: $(Build.ArtifactStagingDirectory)/azure-cli-for-notarization.zip
      artifact: notarization-bundle
      displayName: 'Publish notarization bundle'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-tarball
      artifact: signed-tarball
      displayName: 'Publish signed tar.gz'

# ============================================================================
# STAGE 4: NOTARIZE WITH APPLE (ESRP)
# ============================================================================
- stage: NotarizeWithApple
  displayName: 'Stage 4: Notarize with Apple'
  dependsOn:
  - DownloadAndAnalyze
  - CreateNotarizationBundle
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndAnalyze.DownloadAndAnalyze.outputs['DownloadStep.AzureCliVersion'] ]
  jobs:
  - job: NotarizeBundle
    displayName: 'Submit to Apple for notarization'
    pool:
      vmImage: 'windows-latest'
    timeoutInMinutes: 60
    
    steps:
    - checkout: none
    
    - download: current
      artifact: notarization-bundle
      displayName: 'Download notarization bundle'
    
    - pwsh: |
        $zipPath = "$(Pipeline.Workspace)/notarization-bundle/azure-cli-for-notarization.zip"
        $targetPath = "$(Pipeline.Workspace)/azure-cli-for-notarization.zip"
        
        Copy-Item -Path $zipPath -Destination $targetPath -Force
        
        Write-Host "=== Notarization Bundle Ready ==="
        $file = Get-Item $targetPath
        Write-Host "  Name: $($file.Name)"
        Write-Host "  Size: $([math]::Round($file.Length / 1MB, 2)) MB"
        
      displayName: 'Prepare for notarization'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Notarize with Apple'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)'
        Pattern: 'azure-cli-for-notarization.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppNotarize",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "BundleId": "${{ parameters.BundleId }}"
              }
            }
          ]
        SessionTimeout: '120'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "╔════════════════════════════════════════════════════════════════╗"
        Write-Host "║                  NOTARIZATION COMPLETE                         ║"
        Write-Host "╠════════════════════════════════════════════════════════════════╣"
        Write-Host "║ Apple has recorded the code signatures for all binaries.       ║"
        Write-Host "║                                                                ║"
        Write-Host "║ When users download and run these binaries:                    ║"
        Write-Host "║   1. macOS verifies the code signature                         ║"
        Write-Host "║   2. macOS queries Apple's notarization database               ║"
        Write-Host "║   3. If found, binary runs without Gatekeeper warning          ║"
        Write-Host "║                                                                ║"
        Write-Host "║ NOTE: First run requires internet connection to Apple.         ║"
        Write-Host "║       After verification, result is cached locally.            ║"
        Write-Host "╚════════════════════════════════════════════════════════════════╝"
        
      displayName: 'Notarization complete'

# ============================================================================
# STAGE 5: CREATE FINAL SIGNED+NOTARIZED TAR.GZ
# ============================================================================
- stage: CreateFinalTarball
  displayName: 'Stage 5: Create Final Tar.gz'
  dependsOn:
  - DownloadAndAnalyze
  - NotarizeWithApple
  - CreateNotarizationBundle
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndAnalyze.DownloadAndAnalyze.outputs['DownloadStep.AzureCliVersion'] ]
  jobs:
  - job: CreateFinal
    displayName: 'Create final signed+notarized tar.gz'
    pool:
      ${{ if eq(parameters.Architecture, 'arm64') }}:
        vmImage: 'macos-15-arm64'
      ${{ else }}:
        vmImage: 'macos-15'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-tarball
      displayName: 'Download unsigned tarball'
    
    - download: current
      artifact: signed-binaries
      displayName: 'Download signed binaries'
    
    - bash: |
        set -e
        
        VERSION="$(AzureCliVersion)"
        ARCH="${{ parameters.Architecture }}"
        
        echo "=== Creating Final Signed+Notarized Tar.gz ==="
        echo "Version: $VERSION"
        echo "Architecture: $ARCH"
        echo ""
        
        # Extract original (preserves symlinks)
        TARBALL="$(Pipeline.Workspace)/unsigned-tarball/unsigned.tar.gz"
        FINAL_DIR="$(Build.ArtifactStagingDirectory)/final"
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/output"
        
        mkdir -p "$FINAL_DIR" "$OUTPUT_DIR"
        tar -xzf "$TARBALL" -C "$FINAL_DIR"
        
        # Overlay signed binaries
        SIGNED_DIR="$(Pipeline.Workspace)/signed-binaries"
        cd "$SIGNED_DIR"
        find . -type f | while read signed_file; do
          target="$FINAL_DIR/$signed_file"
          if [ -f "$target" ]; then
            cp "$signed_file" "$target"
          fi
        done
        
        # Restore permissions
        find "$FINAL_DIR" -type f \( -name "python*" -o -name "*.dylib" -o -name "*.so" \) -exec chmod +x {} \;
        chmod +x "$FINAL_DIR/bin/az" 2>/dev/null || true
        chmod +x "$FINAL_DIR/libexec/bin/az" 2>/dev/null || true
        
        # Create final tar.gz (signed and notarized)
        cd "$FINAL_DIR"
        TARBALL_NAME="azure-cli-${VERSION}-macos-${ARCH}-signed-notarized.tar.gz"
        tar -czf "$OUTPUT_DIR/$TARBALL_NAME" --preserve-permissions .
        
        # SHA256
        cd "$OUTPUT_DIR"
        shasum -a 256 "$TARBALL_NAME" | tee "$TARBALL_NAME.sha256"
        
        echo ""
        echo "=== Final Output ==="
        ls -lh "$OUTPUT_DIR"
        
      displayName: 'Create final tar.gz'
    
    - bash: |
        set -e
        
        echo "=== Final Verification ==="
        
        TARBALL=$(find "$(Build.ArtifactStagingDirectory)/output" -name "azure-cli-*.tar.gz" ! -name "*.sha256" | head -1)
        TEST_DIR=$(mktemp -d)
        
        tar -xzf "$TARBALL" -C "$TEST_DIR"
        
        # Test signature
        echo "=== Signature Verification ==="
        PYTHON_BIN=$(find "$TEST_DIR" -path "*/bin/python3" -type f | head -1)
        if [ -n "$PYTHON_BIN" ]; then
          codesign -v "$PYTHON_BIN" && echo "✅ Signature VALID" || echo "❌ Signature INVALID"
          codesign -dvv "$PYTHON_BIN" 2>&1 | grep -E "Authority|TeamIdentifier" || true
        fi
        
        # Test az command
        echo ""
        echo "=== Testing az command ==="
        "$TEST_DIR/bin/az" --version 2>&1 | head -5
        
        rm -rf "$TEST_DIR"
        
        echo ""
        echo "✅ Final verification complete"
        
      displayName: 'Verify final tar.gz'
    
    - publish: $(Build.ArtifactStagingDirectory)/output
      artifact: final-tarball
      displayName: 'Publish final tar.gz'

# ============================================================================
# STAGE 6: PUBLISH TO GITHUB (OPTIONAL)
# ============================================================================
- stage: PublishToGitHub
  displayName: 'Stage 6: Publish to GitHub'
  dependsOn:
  - DownloadAndAnalyze
  - CreateFinalTarball
  condition: and(succeeded(), eq('${{ parameters.PublishToGitHub }}', true))
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndAnalyze.DownloadAndAnalyze.outputs['DownloadStep.AzureCliVersion'] ]
  jobs:
  - job: CreateRelease
    displayName: 'Create GitHub Release'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: final-tarball
      displayName: 'Download final tarball'
    
    - task: CopyFiles@2
      displayName: 'Copy release files to staging'
      inputs:
        SourceFolder: '$(Pipeline.Workspace)/final-tarball'
        Contents: |
          azure-cli-*.tar.gz
          azure-cli-*.tar.gz.sha256
        TargetFolder: '$(Build.ArtifactStagingDirectory)/release'
        flattenFolders: true
    
    - bash: |
        VERSION="$(AzureCliVersion)"
        ARCH="${{ parameters.Architecture }}"
        
        TARBALL=$(find "$(Build.ArtifactStagingDirectory)/release" -name "azure-cli-*.tar.gz" ! -name "*.sha256" | head -1)
        SHA256_FILE="$TARBALL.sha256"
        
        echo "=== GitHub Release ==="
        echo "Version: $VERSION"
        echo "Architecture: $ARCH"
        echo "Tarball: $(basename $TARBALL)"
        echo "Size: $(ls -lh $TARBALL | awk '{print $5}')"
        echo "SHA256: $(cat $SHA256_FILE)"
        
        # Set output variable for release tag (with suffix to avoid conflicts)
        echo "##vso[task.setvariable variable=ReleaseTag]v${VERSION}-tarball-v2"
        
      displayName: 'Prepare release files'
    
    # Delete existing release if it exists (to allow re-running the pipeline)
    - task: GitHubRelease@1
      displayName: 'Delete existing release if present'
      continueOnError: true
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'delete'
        tag: '$(ReleaseTag)'
    
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(ReleaseTag)'
        title: 'Azure CLI $(AzureCliVersion) - macOS ${{ parameters.Architecture }}'
        releaseNotesSource: 'inline'
        releaseNotesInline: |
          ## Azure CLI $(AzureCliVersion) - macOS ${{ parameters.Architecture }} (Signed & Notarized)
          
          **Signed and notarized macOS tar.gz distribution.**
          
          ### Installation
          ```bash
          # Download and extract
          curl -LO https://github.com/${{ parameters.GitHubRepo }}/releases/download/$(ReleaseTag)/azure-cli-$(AzureCliVersion)-macos-${{ parameters.Architecture }}-signed-notarized.tar.gz
          tar -xzf azure-cli-$(AzureCliVersion)-macos-${{ parameters.Architecture }}-signed-notarized.tar.gz
          
          # Run
          ./bin/az --version
          ```
          
          ### Homebrew Installation (Formula)
          ```bash
          brew tap $(HomebrewTapRepo)
          brew install azure-cli-tarball-signed-notarized-v2
          ```
          
          ### Homebrew Installation (Cask)
          ```bash
          brew tap $(HomebrewTapRepo)
          brew install --cask azure-cli-tarball-signed-notarized-v2
          ```
          
          ### Verification
          ```bash
          # Verify SHA256
          shasum -a 256 -c azure-cli-$(AzureCliVersion)-macos-${{ parameters.Architecture }}-signed-notarized.tar.gz.sha256
          
          # Verify code signature
          codesign -v ./bin/az
          ```
        assets: '$(Build.ArtifactStagingDirectory)/release/*'
        addChangeLog: false
        isDraft: false
        isPreRelease: false

# ============================================================================
# STAGE 7: UPDATE HOMEBREW FORMULA
# ============================================================================
- stage: UpdateHomebrewFormula
  displayName: 'Stage 7: Update Homebrew Formula'
  dependsOn:
  - DownloadAndAnalyze
  - CreateFinalTarball
  - PublishToGitHub
  condition: and(succeeded(), eq('${{ parameters.UpdateHomebrew }}', true))
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndAnalyze.DownloadAndAnalyze.outputs['DownloadStep.AzureCliVersion'] ]
  jobs:
  - job: UpdateFormula
    displayName: 'Update Homebrew tap formula'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: homebrewtap
      persistCredentials: true
      path: homebrew-tap
    
    - download: current
      artifact: final-tarball
      displayName: 'Download final tarball for SHA256'
    
    - bash: |
        set -e
        echo "=== Update Homebrew Formula ==="
        
        VERSION="$(AzureCliVersion)"
        ARCH="${{ parameters.Architecture }}"
        GITHUB_REPO="$(GitHubRepo)"
        
        # Get SHA256 of tarball
        TARBALL=$(find "$(Pipeline.Workspace)/final-tarball" -name "azure-cli-*.tar.gz" ! -name "*.sha256" | head -1)
        SHA256=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
        
        echo "Version: $VERSION"
        echo "Architecture: $ARCH"
        echo "SHA256: $SHA256"
        
        cd $(Pipeline.Workspace)/homebrew-tap
        
        # Create Formula using printf line-by-line to avoid YAML parsing issues
        # File: azure-cli-tarball-signed-notarized-v2.rb
        mkdir -p Formula
        FORMULA_FILE="Formula/azure-cli-tarball-signed-notarized-v2.rb"
        printf 'class AzureCliTarballSignedNotarizedV2 < Formula\n' > "$FORMULA_FILE"
        printf '  desc "Microsoft Azure CLI - Code-Signed and Notarized Tarball (v2)"\n' >> "$FORMULA_FILE"
        printf '  homepage "https://learn.microsoft.com/cli/azure/"\n' >> "$FORMULA_FILE"
        printf '  version "%s"\n' "$VERSION" >> "$FORMULA_FILE"
        printf '\n' >> "$FORMULA_FILE"
        printf '  url "https://github.com/%s/releases/download/v%s-tarball-v2/azure-cli-%s-macos-%s-signed-notarized.tar.gz"\n' "$GITHUB_REPO" "$VERSION" "$VERSION" "$ARCH" >> "$FORMULA_FILE"
        printf '  sha256 "%s"\n' "$SHA256" >> "$FORMULA_FILE"
        printf '\n' >> "$FORMULA_FILE"
        printf '  def install\n' >> "$FORMULA_FILE"
        printf '    prefix.mkpath\n' >> "$FORMULA_FILE"
        printf '    system "cp", "-aRp", *Dir["*"], prefix\n' >> "$FORMULA_FILE"
        printf '    chmod 0755, bin/"az"\n' >> "$FORMULA_FILE"
        printf '  end\n' >> "$FORMULA_FILE"
        printf '\n' >> "$FORMULA_FILE"
        printf '  test do\n' >> "$FORMULA_FILE"
        printf '    system "#{bin}/az", "--version"\n' >> "$FORMULA_FILE"
        printf '  end\n' >> "$FORMULA_FILE"
        printf 'end\n' >> "$FORMULA_FILE"
        
        echo "=== Updated Formula ==="
        cat "$FORMULA_FILE"
        
        # Create Cask using printf line-by-line - simple pattern matching tested local version
        # File: azure-cli-tarball-signed-notarized-v2.rb
        mkdir -p Casks
        CASK_FILE="Casks/azure-cli-tarball-signed-notarized-v2.rb"
        printf 'cask "azure-cli-tarball-signed-notarized-v2" do\n' > "$CASK_FILE"
        printf '  version "%s"\n' "$VERSION" >> "$CASK_FILE"
        printf '  sha256 "%s"\n' "$SHA256" >> "$CASK_FILE"
        printf '\n' >> "$CASK_FILE"
        printf '  url "https://github.com/%s/releases/download/v%s-tarball-v2/azure-cli-%s-macos-%s-signed-notarized.tar.gz"\n' "$GITHUB_REPO" "$VERSION" "$VERSION" "$ARCH" >> "$CASK_FILE"
        printf '  name "Azure CLI (Tarball - Signed & Notarized v2)"\n' >> "$CASK_FILE"
        printf '  desc "Microsoft Azure CLI installed via tar.gz - signed and notarized (passwordless)"\n' >> "$CASK_FILE"
        printf '  homepage "https://learn.microsoft.com/cli/azure/"\n' >> "$CASK_FILE"
        printf '\n' >> "$CASK_FILE"
        printf '  binary "bin/az"\n' >> "$CASK_FILE"
        printf '\n' >> "$CASK_FILE"
        printf '  zap trash: "~/.azure"\n' >> "$CASK_FILE"
        printf 'end\n' >> "$CASK_FILE"
        
        echo "=== Updated Cask ==="
        cat "$CASK_FILE"
        
        # Commit and push
        git config user.name "Azure Pipeline"
        git config user.email "azure-pipeline@microsoft.com"
        git add Formula/azure-cli-tarball-signed-notarized-v2.rb Casks/azure-cli-tarball-signed-notarized-v2.rb
        git commit -m "Update Azure CLI tarball (signed-notarized) to $VERSION" || echo "No changes to commit"
        git push origin HEAD:main
        
        echo "✅ Homebrew tap updated successfully"
        
      displayName: 'Update Homebrew formula and cask'
      env:
        GITHUB_TOKEN: $(GITHUB_TOKEN)

# ============================================================================
# STAGE 8: TEST HOMEBREW INSTALLATION
# ============================================================================
- stage: TestInstallation
  displayName: 'Stage 8: Test Installation'
  dependsOn:
  - DownloadAndAnalyze
  - CreateFinalTarball
  - UpdateHomebrewFormula
  condition: and(succeeded(), eq('${{ parameters.UpdateHomebrew }}', true))
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndAnalyze.DownloadAndAnalyze.outputs['DownloadStep.AzureCliVersion'] ]
  jobs:
  
  # -------------------------------------------------------------------------
  # JOB: Test Homebrew Formula Installation
  # -------------------------------------------------------------------------
  - job: TestHomebrewFormula
    displayName: 'Test Homebrew Formula'
    pool:
      vmImage: 'macos-15-arm64'
    
    steps:
    - checkout: none
    
    - bash: |
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║  CLEANUP: Remove Pre-installed Azure CLI and System Python           ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        echo ""
        
        # ===== REMOVE AZURE CLI =====
        if command -v az &> /dev/null; then
          echo "⚠️  Pre-installed Azure CLI detected: $(which az)"
          az --version 2>/dev/null | head -3 || true
          echo ""
          
          # Uninstall via Homebrew
          echo "Removing via Homebrew..."
          brew uninstall azure-cli 2>/dev/null || true
          brew uninstall --cask azure-cli 2>/dev/null || true
          brew uninstall azure-cli-tarball-signed 2>/dev/null || true
          brew uninstall --cask azure-cli-tarball 2>/dev/null || true
          brew uninstall azure-cli-tarball-signed-notarized-v2 2>/dev/null || true
          brew uninstall --cask azure-cli-tarball-signed-notarized-v2 2>/dev/null || true
          
          # Remove symlinks
          echo "Removing symlinks..."
          sudo rm -f /usr/local/bin/az
          sudo rm -f /opt/homebrew/bin/az
          
          # Remove installation directories
          echo "Removing installation directories..."
          sudo rm -rf /usr/local/microsoft/azure-cli
          sudo rm -rf /usr/local/az
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/Cellar/azure-cli*
          sudo rm -rf /opt/homebrew/Cellar/azure-cli*
          
          hash -r
        else
          echo "✅ No pre-installed Azure CLI detected"
        fi
        echo ""
        
        # ===== REMOVE/ISOLATE SYSTEM PYTHON =====
        echo "Checking for system Python installations..."
        
        # List all Python installations
        echo "Python installations found:"
        which -a python3 2>/dev/null || echo "  (none)"
        echo ""
        
        # We don't remove system Python, but we verify our tarball doesn't use it
        echo "Note: We will verify the tarball uses its bundled Python, not system Python"
        echo ""
        
        echo "✅ Cleanup complete"
        
      displayName: 'Remove pre-installed Azure CLI'
    
    - bash: |
        set -e
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║  TEST: Homebrew Formula Installation                                 ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        echo ""
        
        echo "=== Step 1: Add Homebrew Tap ==="
        brew tap $(HomebrewTapRepo)
        echo ""
        
        echo "=== Step 2: Install Formula ==="
        brew install azure-cli-tarball-signed-notarized-v2
        echo ""
        
        echo "=== Step 3: Verify Installation ==="
        echo "Checking az command..."
        which az
        echo ""
        
        echo "Azure CLI version:"
        az --version | head -10
        echo ""
        
        echo "=== Step 4: Verify Self-Contained Python ==="
        # Get the Python path used by az
        AZ_PATH=$(which az)
        AZ_CELLAR=$(dirname $(dirname $AZ_PATH))
        BUNDLED_PYTHON=$(find $AZ_CELLAR -name "python3" -path "*/bin/*" | head -1)
        
        echo "az executable: $AZ_PATH"
        echo "Bundled Python: $BUNDLED_PYTHON"
        echo ""
        
        if [ -n "$BUNDLED_PYTHON" ]; then
          echo "Bundled Python version:"
          $BUNDLED_PYTHON --version
          echo ""
          
          # Verify it's NOT system Python
          SYSTEM_PYTHON=$(which python3 2>/dev/null || echo "")
          if [ "$BUNDLED_PYTHON" != "$SYSTEM_PYTHON" ]; then
            echo "✅ Using bundled Python (not system Python)"
          else
            echo "⚠️  WARNING: May be using system Python"
          fi
        else
          echo "❌ ERROR: Bundled Python not found!"
          exit 1
        fi
        echo ""
        
        echo "=== Step 5: Verify Code Signatures ==="
        LIBPYTHON=$(find $AZ_CELLAR -name "libpython*.dylib" | head -1)
        if [ -n "$LIBPYTHON" ]; then
          echo "Checking signature on: $LIBPYTHON"
          codesign -dv "$LIBPYTHON" 2>&1 | head -5
          echo ""
        fi
        
        echo "✅ Homebrew Formula test PASSED"
        
      displayName: 'Test Homebrew Formula installation'
    
    - bash: |
        echo "=== Cleanup ==="
        brew uninstall azure-cli-tarball-signed-notarized-v2 2>/dev/null || true
        echo "✅ Cleanup complete"
      displayName: 'Cleanup'
      condition: always()
  
  # -------------------------------------------------------------------------
  # JOB: Test Homebrew Cask Installation
  # -------------------------------------------------------------------------
  - job: TestHomebrewCask
    displayName: 'Test Homebrew Cask'
    pool:
      vmImage: 'macos-15-arm64'
    
    steps:
    - checkout: none
    
    - bash: |
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║  CLEANUP: Remove Pre-installed Azure CLI                             ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        echo ""
        
        if command -v az &> /dev/null; then
          echo "⚠️  Pre-installed Azure CLI detected"
          
          brew uninstall azure-cli 2>/dev/null || true
          brew uninstall --cask azure-cli 2>/dev/null || true
          brew uninstall azure-cli-tarball-signed 2>/dev/null || true
          brew uninstall --cask azure-cli-tarball 2>/dev/null || true
          brew uninstall azure-cli-tarball-signed-notarized-v2 2>/dev/null || true
          brew uninstall --cask azure-cli-tarball-signed-notarized-v2 2>/dev/null || true
          
          sudo rm -f /usr/local/bin/az /opt/homebrew/bin/az
          sudo rm -rf /usr/local/microsoft/azure-cli /usr/local/az
          sudo rm -rf /usr/local/Cellar/azure-cli* /opt/homebrew/Cellar/azure-cli*
          
          hash -r
        fi
        
        echo "✅ Cleanup complete"
        
      displayName: 'Remove pre-installed Azure CLI'
    
    - bash: |
        set -e
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║  TEST: Homebrew Cask Installation (No Password Required)             ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        echo ""
        
        echo "=== Step 1: Add Homebrew Tap ==="
        brew tap $(HomebrewTapRepo)
        echo ""
        
        echo "=== Step 2: Install via Cask ==="
        echo "Note: Cask installation should NOT require password"
        brew install --cask azure-cli-tarball-signed-notarized-v2
        echo ""
        
        echo "=== Step 3: Verify Installation ==="
        which az
        az --version | head -10
        echo ""
        
        echo "=== Step 4: Verify Code Signatures Preserved ==="
        AZ_CELLAR="/opt/homebrew/Caskroom/azure-cli-tarball-signed-notarized-v2/$(AzureCliVersion)"
        if [ -d "$AZ_CELLAR" ]; then
          LIBPYTHON=$(find "$AZ_CELLAR" -name "libpython*.dylib" | head -1)
          if [ -n "$LIBPYTHON" ]; then
            echo "Checking signature on: $LIBPYTHON"
            codesign -dv "$LIBPYTHON" 2>&1 | head -5
            
            if codesign -v "$LIBPYTHON" 2>/dev/null; then
              echo "✅ Code signature is VALID"
            else
              echo "❌ Code signature is INVALID"
              exit 1
            fi
          fi
        fi
        echo ""
        
        echo "=== Step 5: Verify Self-Contained Python ==="
        BUNDLED_PYTHON=$(find "$AZ_CELLAR" -name "python3" -path "*/bin/*" 2>/dev/null | head -1)
        if [ -n "$BUNDLED_PYTHON" ]; then
          echo "Bundled Python: $BUNDLED_PYTHON"
          $BUNDLED_PYTHON --version
          echo "✅ Using bundled Python"
        fi
        echo ""
        
        echo "✅ Homebrew Cask test PASSED"
        
      displayName: 'Test Homebrew Cask installation'
    
    - bash: |
        echo "=== Cleanup ==="
        brew uninstall --cask azure-cli-tarball-signed-notarized-v2 2>/dev/null || true
        echo "✅ Cleanup complete"
      displayName: 'Cleanup'
      condition: always()
  
  # -------------------------------------------------------------------------
  # JOB: Test Offline/Direct Tarball Installation
  # -------------------------------------------------------------------------
  - job: TestOfflineInstall
    displayName: 'Test Offline Tarball Install'
    pool:
      vmImage: 'macos-15-arm64'
    
    steps:
    - checkout: none
    
    - bash: |
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║  CLEANUP: Remove Pre-installed Azure CLI and Isolate System Python   ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        echo ""
        
        # ===== REMOVE AZURE CLI =====
        if command -v az &> /dev/null; then
          echo "⚠️  Pre-installed Azure CLI detected"
          
          brew uninstall azure-cli 2>/dev/null || true
          brew uninstall --cask azure-cli 2>/dev/null || true
          
          sudo rm -f /usr/local/bin/az /opt/homebrew/bin/az
          sudo rm -rf /usr/local/microsoft/azure-cli /usr/local/az
          sudo rm -rf /usr/local/Cellar/azure-cli* /opt/homebrew/Cellar/azure-cli*
          
          hash -r
        fi
        
        # ===== TEMPORARILY RENAME SYSTEM PYTHON (for strict testing) =====
        echo ""
        echo "Preparing isolated environment..."
        
        # Create a custom PATH without system Python
        export ORIGINAL_PATH="$PATH"
        
        # We'll test with minimal PATH to ensure tarball is fully self-contained
        echo "✅ Environment prepared for offline test"
        
      displayName: 'Prepare isolated environment'
    
    - download: current
      artifact: final-tarball
      displayName: 'Download signed tarball'
    
    - bash: |
        set -e
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║  TEST: Offline Tarball Installation (No System Dependencies)         ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        echo ""
        
        TARBALL=$(find "$(Pipeline.Workspace)/final-tarball" -name "azure-cli-*.tar.gz" ! -name "*.sha256" | head -1)
        
        echo "=== Step 1: Extract Tarball ==="
        echo "Tarball: $(basename $TARBALL)"
        
        INSTALL_DIR="$HOME/azure-cli-offline-test"
        mkdir -p "$INSTALL_DIR"
        tar -xzf "$TARBALL" -C "$INSTALL_DIR"
        
        echo "Extracted to: $INSTALL_DIR"
        ls -la "$INSTALL_DIR"
        echo ""
        
        echo "=== Step 2: Test with Minimal PATH (No System Python) ==="
        # Create a PATH with only essential system directories (no Homebrew, no pyenv, etc.)
        MINIMAL_PATH="/usr/bin:/bin:/usr/sbin:/sbin"
        
        echo "Testing with minimal PATH: $MINIMAL_PATH"
        echo "This ensures the tarball is truly self-contained"
        echo ""
        
        # Find the az executable
        AZ_EXE=$(find "$INSTALL_DIR" -name "az" -type f | head -1)
        if [ -z "$AZ_EXE" ]; then
          echo "❌ ERROR: az executable not found in tarball!"
          find "$INSTALL_DIR" -type f -name "*az*"
          exit 1
        fi
        
        echo "Found az: $AZ_EXE"
        chmod +x "$AZ_EXE"
        echo ""
        
        echo "=== Step 3: Run az with Minimal PATH ==="
        PATH="$MINIMAL_PATH" "$AZ_EXE" --version
        echo ""
        
        echo "=== Step 4: Verify Bundled Python is Used ==="
        BUNDLED_PYTHON=$(find "$INSTALL_DIR" -name "python3" -path "*/bin/*" | head -1)
        if [ -n "$BUNDLED_PYTHON" ]; then
          echo "Bundled Python: $BUNDLED_PYTHON"
          PATH="$MINIMAL_PATH" "$BUNDLED_PYTHON" --version
          echo "✅ Bundled Python works independently"
        else
          echo "❌ ERROR: Bundled Python not found!"
          exit 1
        fi
        echo ""
        
        echo "=== Step 5: Verify Code Signatures ==="
        LIBPYTHON=$(find "$INSTALL_DIR" -name "libpython*.dylib" | head -1)
        if [ -n "$LIBPYTHON" ]; then
          echo "Checking: $LIBPYTHON"
          codesign -dv "$LIBPYTHON" 2>&1 | head -5
          
          if codesign -v "$LIBPYTHON" 2>/dev/null; then
            echo "✅ Signature VALID"
          else
            echo "⚠️  Signature check failed (may need notarization ticket)"
          fi
        fi
        echo ""
        
        echo "=== Step 6: Test Basic Commands ==="
        PATH="$MINIMAL_PATH" "$AZ_EXE" --help | head -20
        echo ""
        
        echo "=== Step 7: Verify Gatekeeper Approval ==="
        # Check spctl assessment (if notarized)
        echo "Checking Gatekeeper status..."
        if spctl -a -v "$AZ_EXE" 2>&1 | grep -q "accepted"; then
          echo "✅ Gatekeeper: ACCEPTED"
        else
          echo "⚠️  Gatekeeper check (may need notarization)"
          spctl -a -v "$AZ_EXE" 2>&1 || true
        fi
        echo ""
        
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║  ✅ OFFLINE TARBALL TEST PASSED                                      ║"
        echo "║                                                                       ║"
        echo "║  The tarball is fully self-contained:                                ║"
        echo "║    ✅ Works without Homebrew                                         ║"
        echo "║    ✅ Works without system Python                                    ║"
        echo "║    ✅ Bundled Python runs independently                              ║"
        echo "║    ✅ Code signatures intact                                         ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        
      displayName: 'Test offline tarball installation'
    
    - bash: |
        echo "=== Cleanup ==="
        rm -rf "$HOME/azure-cli-offline-test"
        echo "✅ Cleanup complete"
      displayName: 'Cleanup'
      condition: always()

# ============================================================================
# STAGE 9: SUMMARY
# ============================================================================
- stage: Summary
  displayName: 'Stage 9: Summary'
  dependsOn:
  - DownloadAndAnalyze
  - SignBinaries
  - NotarizeWithApple
  - CreateFinalTarball
  condition: always()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadAndAnalyze.DownloadAndAnalyze.outputs['DownloadStep.AzureCliVersion'] ]
    BinaryCount: $[ stageDependencies.DownloadAndAnalyze.DownloadAndAnalyze.outputs['AnalyzeStep.BinaryCount'] ]
  jobs:
  - job: PrintSummary
    displayName: 'Print Summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - bash: |
