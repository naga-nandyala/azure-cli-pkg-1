# Azure CLI - macOS Tarball Build Pipeline (v2)
# 
# Phase 2: Build CLI Tarball Using Pre-built Python Base
# 
# This pipeline builds the Azure CLI tar.gz using a pre-built Python base
# downloaded from the macos-python-base-v2 pipeline artifacts.
#
# Input: Python Base artifact from Build ID (default: 292484)
#   - python-base-signed-notarized (recommended)
#   - python-base-signed-only
#   - python-base-unsigned
#
# Stages:
# 1. Download Python Base from pipeline artifacts
# 2. Build Azure CLI
# 3. Create Unsigned Tar.gz
# 4. Verify Build
# 5. Publish Artifacts
#
# The output is an UNSIGNED tar.gz that needs to be signed and notarized
# in a separate pipeline (macos-tarball-sign-notarize-v2.yml)

trigger: none

parameters:
  - name: PythonBaseBuildId
    displayName: 'Python Base Build ID (from macos-python-base-v2 pipeline)'
    type: string
    default: '292650'
  
  - name: PythonBaseArtifact
    displayName: 'Python Base Artifact Name'
    type: string
    default: 'python-base-signed-notarized'
    values:
    - python-base-signed-notarized   # Recommended: signed + notarized
    - python-base-signed-only        # Signed but not notarized
    - python-base-unsigned           # Unsigned (requires full signing)
  
  - name: Architecture
    displayName: 'Architecture'
    type: string
    default: 'arm64'
    values:
    - arm64
    - x86_64
  
  - name: PublishToGitHub
    displayName: 'Publish unsigned tar.gz to GitHub'
    type: boolean
    default: false
  
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'

resources:
  repositories:
  - repository: selfRepo
    type: github
    endpoint: 'github.com_naga-nandyala'
    name: naga-nandyala/azure-cli-pkg-1
    ref: main

variables:
  # Parameter variable mappings
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  
  # Disable auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true

name: tarball-build-v2-$(Build.BuildId)-${{ parameters.Architecture }}

stages:
# ============================================================================
# STAGE 1: DOWNLOAD AND VERIFY PYTHON BASE
# ============================================================================
- stage: DownloadPythonBase
  displayName: 'Stage 1: Download Python Base'
  jobs:
  - job: DownloadAndVerify
    displayName: 'Download and Verify Python Base'
    pool:
      ${{ if eq(parameters.Architecture, 'arm64') }}:
        vmImage: 'macos-15-arm64'
      ${{ else }}:
        vmImage: 'macos-15'
    
    steps:
    - checkout: self
      fetchDepth: 1
    
    # Download from Python Base pipeline artifacts (Build 292484)
    - task: DownloadPipelineArtifact@2
      displayName: 'Download from Python Base Pipeline (Build ${{ parameters.PythonBaseBuildId }})'
      inputs:
        buildType: 'specific'
        project: 'release'
        definition: 'macos-python-base-v2'
        buildVersionToDownload: 'specific'
        buildId: ${{ parameters.PythonBaseBuildId }}
        artifactName: '${{ parameters.PythonBaseArtifact }}'
        targetPath: '$(Pipeline.Workspace)/python-base-download'
    
    - bash: |
        set -e
        
        echo "=== Python Base from Pipeline Artifacts ==="
        echo "Build ID: ${{ parameters.PythonBaseBuildId }}"
        echo "Artifact: ${{ parameters.PythonBaseArtifact }}"
        echo ""
        
        echo "=== Downloaded Files ==="
        ls -lh $(Pipeline.Workspace)/python-base-download/
        echo ""
        
        mkdir -p $(Build.ArtifactStagingDirectory)/python-base
        
        # Find the tarball in the downloaded artifact
        TARBALL=$(find $(Pipeline.Workspace)/python-base-download -name "*.tar.gz" | head -1)
        
        if [ -z "$TARBALL" ]; then
          echo "❌ ERROR: No tar.gz found in artifact!"
          ls -la $(Pipeline.Workspace)/python-base-download/
          exit 1
        fi
        
        echo "✅ Found: $TARBALL"
        echo "   Size: $(du -h "$TARBALL" | cut -f1)"
        cp "$TARBALL" $(Build.ArtifactStagingDirectory)/python-base/python-base.tar.gz
        
        echo ""
        echo "Copied to:"
        ls -lh $(Build.ArtifactStagingDirectory)/python-base/
        
        # Verify it's a valid tar.gz
        tar -tzf $(Build.ArtifactStagingDirectory)/python-base/python-base.tar.gz > /dev/null
        echo "✅ Valid tar.gz archive"
        
        # Set signing status based on artifact name
        ARTIFACT="${{ parameters.PythonBaseArtifact }}"
        if [[ "$ARTIFACT" == *"signed"* ]]; then
          echo "##vso[task.setvariable variable=ExpectedSigned]true"
        else
          echo "##vso[task.setvariable variable=ExpectedSigned]false"
        fi
        
      displayName: 'Prepare Python base from pipeline'
    
    - bash: |
        set -e
        
        echo "=== Verifying Python Base Signature Status ==="
        
        TARBALL=$(Build.ArtifactStagingDirectory)/python-base/python-base.tar.gz
        EXTRACT_DIR=$(mktemp -d)
        
        tar -xzf "$TARBALL" -C "$EXTRACT_DIR"
        
        # Find Python binary
        PYTHON_BIN=$(find "$EXTRACT_DIR" -name "python3" -type f | head -1)
        
        if [ -z "$PYTHON_BIN" ]; then
          PYTHON_BIN=$(find "$EXTRACT_DIR" -path "*/bin/python*" -type f | head -1)
        fi
        
        if [ -n "$PYTHON_BIN" ]; then
          echo "Found Python binary: $PYTHON_BIN"
          echo ""
          
          if codesign -v "$PYTHON_BIN" 2>/dev/null; then
            echo "✅ Python base is SIGNED"
            echo "##vso[task.setvariable variable=PythonIsSigned;isOutput=true]true"
            codesign -dvv "$PYTHON_BIN" 2>&1 | grep -E "Authority|TeamIdentifier" || true
          else
            echo "⚠️  Python base is UNSIGNED"
            echo "##vso[task.setvariable variable=PythonIsSigned;isOutput=true]false"
          fi
        else
          echo "⚠️  Could not find Python binary to verify"
          echo "##vso[task.setvariable variable=PythonIsSigned;isOutput=true]unknown"
        fi
        
        # Count binaries
        echo ""
        echo "=== Python Base Binary Count ==="
        PYTHON_BINARY_COUNT=$(find "$EXTRACT_DIR" -type f -exec file {} \; | grep -i "Mach-O" | wc -l)
        echo "Python binaries: $PYTHON_BINARY_COUNT"
        echo "##vso[task.setvariable variable=PythonBinaryCount;isOutput=true]$PYTHON_BINARY_COUNT"
        
        rm -rf "$EXTRACT_DIR"
        
      displayName: 'Verify Python base signature'
      name: VerifyStep
    
    - publish: $(Build.ArtifactStagingDirectory)/python-base
      artifact: python-base
      displayName: 'Publish Python base artifact'

# ============================================================================
# STAGE 2: BUILD AZURE CLI
# ============================================================================
- stage: BuildAzureCli
  displayName: 'Stage 2: Build Azure CLI'
  dependsOn: DownloadPythonBase
  variables:
    PythonIsSigned: $[ stageDependencies.DownloadPythonBase.DownloadAndVerify.outputs['VerifyStep.PythonIsSigned'] ]
    PythonBinaryCount: $[ stageDependencies.DownloadPythonBase.DownloadAndVerify.outputs['VerifyStep.PythonBinaryCount'] ]
  jobs:
  - job: BuildCli
    displayName: 'Build Azure CLI (Python $(PythonBinaryCount) binaries)'
    pool:
      ${{ if eq(parameters.Architecture, 'arm64') }}:
        vmImage: 'macos-15-arm64'
      ${{ else }}:
        vmImage: 'macos-15'
    timeoutInMinutes: 60
    
    steps:
    - checkout: self
      fetchDepth: 1
    
    - download: current
      artifact: python-base
      displayName: 'Download Python base'
    
    - bash: |
        set -e
        
        echo "=== Build Configuration ==="
        echo "Architecture: ${{ parameters.Architecture }}"
        echo "Python Base Signed: $(PythonIsSigned)"
        echo "Python Binaries: $(PythonBinaryCount)"
        echo ""
        
        # Install dependencies
        brew install openssl@3
        
      displayName: 'Setup build environment'
      name: SetupStep
    
    - bash: |
        set -e
        
        echo "=== Building Azure CLI Package ==="
        
        PYTHON_BASE="$(Pipeline.Workspace)/python-base/python-base.tar.gz"
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/cli-build"
        
        mkdir -p "$OUTPUT_DIR"
        
        # Map architecture to platform-tag
        PLATFORM_TAG="macos-${{ parameters.Architecture }}"
        
        # Use our v2 build script with pre-built Python base
        # Note: Output goes to dist/binary_tar_gz_source/ by default
        python3 scripts/release/macos/build_binary_tar_gz_v2.py \
          --platform-tag "$PLATFORM_TAG" \
          --python-base-url "file://$PYTHON_BASE"
        
        # Copy output to expected location
        cp -v dist/binary_tar_gz_source/*.tar.gz "$OUTPUT_DIR/" 2>/dev/null || \
          cp -v dist/binary_tar_gz_source/azure-cli-*.tar.gz "$OUTPUT_DIR/" || \
          echo "Output should be in dist/binary_tar_gz_source/"
        
        echo ""
        echo "=== Build Output ==="
        ls -lh "$OUTPUT_DIR"/
        
        # Find the tarball and extract version from filename
        TARBALL=$(find "$OUTPUT_DIR" -name "azure-cli-*.tar.gz" | head -1)
        TARBALL_NAME=$(basename "$TARBALL")
        
        # Extract version from tarball name (e.g., azure-cli-2.68.0-macos-arm64.tar.gz)
        VERSION=$(echo "$TARBALL_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        if [ -z "$VERSION" ]; then
          VERSION="unknown"
        fi
        
        echo "Detected Azure CLI Version: $VERSION"
        echo "##vso[task.setvariable variable=TarballPath;isOutput=true]$TARBALL"
        echo "##vso[task.setvariable variable=TarballName;isOutput=true]$TARBALL_NAME"
        echo "##vso[task.setvariable variable=AzureCliVersion;isOutput=true]$VERSION"
        
      displayName: 'Build CLI package'
      name: BuildStep
    
    - publish: $(Build.ArtifactStagingDirectory)/cli-build
      artifact: cli-build-unsigned
      displayName: 'Publish unsigned CLI build'

# ============================================================================
# STAGE 3: VERIFY BUILD
# ============================================================================
- stage: VerifyBuild
  displayName: 'Stage 3: Verify Build'
  dependsOn: BuildAzureCli
  variables:
    AzureCliVersion: $[ stageDependencies.BuildAzureCli.BuildCli.outputs['BuildStep.AzureCliVersion'] ]
  jobs:
  - job: VerifyTarball
    displayName: 'Verify tar.gz package'
    pool:
      ${{ if eq(parameters.Architecture, 'arm64') }}:
        vmImage: 'macos-15-arm64'
      ${{ else }}:
        vmImage: 'macos-15'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: cli-build-unsigned
      displayName: 'Download CLI build'
    
    - bash: |
        set -e
        
        echo "=== Verifying Build ==="
        
        TARBALL=$(find "$(Pipeline.Workspace)/cli-build-unsigned" -name "azure-cli-*.tar.gz" | head -1)
        TEST_DIR=$(mktemp -d)
        
        echo "Extracting: $(basename $TARBALL)"
        tar -xzf "$TARBALL" -C "$TEST_DIR"
        
        echo ""
        echo "=== Directory Structure ==="
        ls -la "$TEST_DIR"
        ls -la "$TEST_DIR/bin"
        
        echo ""
        echo "=== Symlinks ==="
        if [ -L "$TEST_DIR/bin/az" ]; then
          echo "✅ bin/az is symlink: $(readlink $TEST_DIR/bin/az)"
        else
          echo "⚠️  bin/az is not a symlink"
        fi
        
        if [ -L "$TEST_DIR/libexec/bin/python" ]; then
          echo "✅ libexec/bin/python is symlink: $(readlink $TEST_DIR/libexec/bin/python)"
        fi
        
        echo ""
        echo "=== Testing az command ==="
        export PATH="$TEST_DIR/bin:$PATH"
        
        # Test --version
        az --version 2>&1 | head -10
        
        echo ""
        echo "=== Testing --help ==="
        az --help 2>&1 | head -5
        
        echo ""
        echo "=== Size Summary ==="
        echo "Compressed: $(ls -lh $TARBALL | awk '{print $5}')"
        echo "Extracted: $(du -sh $TEST_DIR | cut -f1)"
        
        rm -rf "$TEST_DIR"
        
        echo ""
        echo "✅ Build verification complete"
        
      displayName: 'Test az command'
    
    - bash: |
        set -e
        
        echo "=== Relocatability Test ==="
        
        TARBALL=$(find "$(Pipeline.Workspace)/cli-build-unsigned" -name "azure-cli-*.tar.gz" | head -1)
        
        # Test 1: Original location
        DIR1=$(mktemp -d)/azure-cli
        mkdir -p "$DIR1"
        tar -xzf "$TARBALL" -C "$DIR1"
        
        echo "Test 1: $DIR1"
        "$DIR1/bin/az" --version 2>&1 | head -1
        
        # Test 2: Different location
        DIR2=$(mktemp -d)/different-path/cli
        mkdir -p "$DIR2"
        tar -xzf "$TARBALL" -C "$DIR2"
        
        echo "Test 2: $DIR2"
        "$DIR2/bin/az" --version 2>&1 | head -1
        
        # Test 3: Move directory
        DIR3=$(mktemp -d)/moved-cli
        mv "$DIR1" "$DIR3"
        
        echo "Test 3: $DIR3 (moved)"
        "$DIR3/bin/az" --version 2>&1 | head -1
        
        echo ""
        echo "✅ Relocatability test passed - az works from any location"
        
      displayName: 'Test relocatability'

# ============================================================================
# STAGE 4: SUMMARY
# ============================================================================
- stage: Summary
  displayName: 'Stage 4: Build Summary'
  dependsOn:
  - DownloadPythonBase
  - BuildAzureCli
  - VerifyBuild
  condition: always()
  variables:
    AzureCliVersion: $[ stageDependencies.BuildAzureCli.BuildCli.outputs['BuildStep.AzureCliVersion'] ]
    PythonIsSigned: $[ stageDependencies.DownloadPythonBase.DownloadAndVerify.outputs['VerifyStep.PythonIsSigned'] ]
  jobs:
  - job: PrintSummary
    displayName: 'Print Build Summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - bash: |
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║              AZURE CLI BUILD SUMMARY (v2)                            ║"
        echo "╠══════════════════════════════════════════════════════════════════════╣"
        echo "║ CLI Version:          $(AzureCliVersion)"
        echo "║ Architecture:         ${{ parameters.Architecture }}"
        echo "║ Python Base Signed:   $(PythonIsSigned)"
        echo "║ Python Base Build:    ${{ parameters.PythonBaseBuildId }}"
        echo "║ Python Base Artifact: ${{ parameters.PythonBaseArtifact }}"
        echo "╠══════════════════════════════════════════════════════════════════════╣"
        echo "║ OUTPUT ARTIFACT:                                                     ║"
        echo "║   cli-build-unsigned                                                 ║"
        echo "╠══════════════════════════════════════════════════════════════════════╣"
        echo "║ NEXT STEP:                                                           ║"
        echo "║   Run macos-tarball-sign-notarize-v2.yml to sign and notarize        ║"
        echo "║   Input: cli-build-unsigned artifact from this build                 ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        
      displayName: 'Print summary'
