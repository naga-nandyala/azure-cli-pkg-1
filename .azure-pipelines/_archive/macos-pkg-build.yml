# Azure CLI - macOS PKG Build Pipeline
# This pipeline builds unsigned PKG installers for macOS (ARM64 and x86_64)
# Note: macOS-13 Intel runners are retired, so both architectures are built on Apple Silicon

trigger: none # Manual trigger only

parameters:
  - name: CreateGitHubRelease
    displayName: 'Create GitHub Release with artifacts'
    type: boolean
    default: false
  - name: Prerelease
    displayName: 'Mark as pre-release'
    type: boolean
    default: false
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'

variables:
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: PYTHON_VERSION
    value: '3.12'
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}

name: build-macos-pkg-$(Date:yyyyMMdd)-$(Rev:r)

stages:
- stage: BuildPkg
  displayName: 'Build macOS PKG Installers'
  jobs:
  
  # Build ARM64 package on Apple Silicon
  # (macOS-13 Intel runners retired - both jobs now run on macos-latest)
  - job: BuildARM64
    displayName: 'Build PKG (ARM64)'
    pool:
      vmImage: 'macos-15-arm64'  # Apple Silicon (ARM64) - limited public preview
    
    variables:
      ARCH: 'arm64'
      PLATFORM_TAG: 'macos-arm64'
    
    steps:
    - checkout: self
      clean: true
    
    - task: UsePythonVersion@0
      displayName: 'Set up Python $(PYTHON_VERSION)'
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
        addToPath: true
    
    - bash: |
        # Auto-detect version from azure-cli-core/__init__.py
        VERSION=$(python -c "import re; content = open('src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\''\"](.+?)['\''\"]', content); print(m.group(1) if m else 'ERROR')")
        if [ "$VERSION" = "ERROR" ]; then
          echo "❌ Failed to detect version from azure-cli-core"
          exit 1
        fi
        echo "Auto-detected version from code: $VERSION"
        echo "##vso[task.setvariable variable=CLI_VERSION]$VERSION"
      displayName: 'Auto-detect version from code'
    
    - bash: |
        if ! command -v pkgbuild >/dev/null 2>&1; then
          echo "Installing Xcode Command Line Tools..."
          xcode-select --install || true
          until command -v pkgbuild >/dev/null 2>&1; do
            echo "Waiting for Xcode Command Line Tools..."
            sleep 10
          done
        fi
        echo "✅ pkgbuild: $(which pkgbuild)"
        echo "✅ productbuild: $(which productbuild)"
      displayName: 'Verify Build Tools'
    
    - bash: python -m pip install --upgrade pip setuptools wheel
      displayName: 'Upgrade pip'
    
    - bash: mkdir -p dist/macos_pkg
      displayName: 'Create dist directory'
    
    - bash: |
        echo "========================================"
        echo "Building macOS ARM64 PKG Installer"
        echo "========================================"
        echo "Host: $(uname -m) (Apple Silicon)"
        echo "Python: $(python --version)"
        echo "Version: $(CLI_VERSION)"
        echo "Target: ARM64 (native)"
        echo ""
        
        python scripts/release/macos/build_pkg_installer.py --platform-tag $(PLATFORM_TAG)
        
        echo ""
        echo "========================================"
        echo "✅ ARM64 Build Complete"
        echo "========================================"
        ls -lh dist/macos_pkg/*.pkg
      displayName: 'Build ARM64 PKG installer'
    
    - bash: |
        echo "=== Verifying ARM64 Package ==="
        cd dist/macos_pkg
        
        # Find the PKG file (version is embedded in filename)
        PKG_FILE=$(ls azure-cli-*-$(PLATFORM_TAG).pkg 2>/dev/null | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "  ❌ No PKG file found matching pattern: azure-cli-*-$(PLATFORM_TAG).pkg"
          echo "  Available files:"
          ls -la
          exit 1
        fi
        
        SHA_FILE="${PKG_FILE}.sha256"
        
        echo "  ✅ PKG: $PKG_FILE ($(du -h "$PKG_FILE" | cut -f1))"
        
        if [ -f "$SHA_FILE" ]; then
          echo "  ✅ SHA256: $(cat "$SHA_FILE" | cut -d' ' -f1)"
        else
          echo "  ❌ SHA256 missing: $SHA_FILE"
          exit 1
        fi
        
        pkgutil --check-signature "$PKG_FILE" 2>&1 | head -3 || true
        echo "  Files: $(pkgutil --payload-files "$PKG_FILE" | wc -l | xargs)"
        echo ""
        echo "✅ ARM64 package verified"
      displayName: 'Verify ARM64 package'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Upload ARM64 PKG artifact'
      inputs:
        targetPath: 'dist/macos_pkg'
        artifact: 'pkg-installer-macos-arm64'
        publishLocation: 'pipeline'
  
  # Build x86_64 package on Apple Silicon (cross-package)
  - job: BuildX86_64
    displayName: 'Build PKG (x86_64)'
    pool:
      vmImage: 'macos-latest'  # Apple Silicon (macOS-15)
    
    variables:
      ARCH: 'x86_64'
      PLATFORM_TAG: 'macos-x86_64'
    
    steps:
    - checkout: self
      clean: true
    
    - task: UsePythonVersion@0
      displayName: 'Set up Python $(PYTHON_VERSION)'
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
        addToPath: true
    
    - bash: |
        if [ -n "$(Version)" ]; then
          echo "VERSION=$(Version)" >> $AZURE_PIPELINES_ENV
          echo "Using provided version: $(Version)"
        else
          VERSION=$(python -c "import re; content = open('src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\''\"'](.+?)['\''\"']', content); print(m.group(1) if m else 'ERROR')")
          if [ "$VERSION" = "ERROR" ]; then
            echo "❌ Failed to detect version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $AZURE_PIPELINES_ENV
          echo "Using version from azure-cli-core: $VERSION"
        fi
        echo "##vso[task.setvariable variable=CLI_VERSION]$VERSION"
      displayName: 'Set VERSION environment variable'
    
    - bash: |
        if ! command -v pkgbuild >/dev/null 2>&1; then
          echo "Installing Xcode Command Line Tools..."
          xcode-select --install || true
          until command -v pkgbuild >/dev/null 2>&1; do
            echo "Waiting for Xcode Command Line Tools..."
            sleep 10
          done
        fi
        echo "✅ pkgbuild: $(which pkgbuild)"
        echo "✅ productbuild: $(which productbuild)"
      displayName: 'Verify Build Tools'
    
    - bash: python -m pip install --upgrade pip setuptools wheel
      displayName: 'Upgrade pip'
    
    - bash: mkdir -p dist/macos_pkg
      displayName: 'Create dist directory'
    
    - bash: |
        echo "========================================"
        echo "Building macOS x86_64 PKG Installer"
        echo "========================================"
        echo "Host: $(uname -m) (Apple Silicon)"
        echo "Python: $(python --version)"
        echo "Version: $(CLI_VERSION)"
        echo "Target: x86_64 (cross-package)"
        echo ""
        
        python scripts/release/macos/build_pkg_installer.py --platform-tag $(PLATFORM_TAG)
        
        echo ""
        echo "========================================"
        echo "✅ x86_64 Build Complete"
        echo "========================================"
        ls -lh dist/macos_pkg/*.pkg
      displayName: 'Build x86_64 PKG installer'
    
    - bash: |
        echo "=== Verifying x86_64 Package ==="
        cd dist/macos_pkg
        
        # Find the PKG file (version is embedded in filename)
        PKG_FILE=$(ls azure-cli-*-$(PLATFORM_TAG).pkg 2>/dev/null | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "  ❌ No PKG file found matching pattern: azure-cli-*-$(PLATFORM_TAG).pkg"
          echo "  Available files:"
          ls -la
          exit 1
        fi
        
        SHA_FILE="${PKG_FILE}.sha256"
        
        echo "  ✅ PKG: $PKG_FILE ($(du -h "$PKG_FILE" | cut -f1))"
        
        if [ -f "$SHA_FILE" ]; then
          echo "  ✅ SHA256: $(cat "$SHA_FILE" | cut -d' ' -f1)"
        else
          echo "  ❌ SHA256 missing: $SHA_FILE"
          exit 1
        fi
        
        pkgutil --check-signature "$PKG_FILE" 2>&1 | head -3 || true
        echo "  Files: $(pkgutil --payload-files "$PKG_FILE" | wc -l | xargs)"
        echo ""
        echo "✅ x86_64 package verified"
      displayName: 'Verify x86_64 package'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Upload x86_64 PKG artifact'
      inputs:
        targetPath: 'dist/macos_pkg'
        artifact: 'pkg-installer-macos-x86_64'
        publishLocation: 'pipeline'

- stage: CreateGitHubRelease
  displayName: 'Create GitHub Release'
  dependsOn: BuildPkg
  condition: and(succeeded(), eq('${{ parameters.CreateGitHubRelease }}', true))
  jobs:
  - job: PublishRelease
    displayName: 'Publish to GitHub Releases'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: self
      clean: true
    
    - task: UsePythonVersion@0
      displayName: 'Set up Python $(PYTHON_VERSION)'
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
        addToPath: true
    
    - bash: |
        # Auto-detect version from azure-cli-core/__init__.py
        VERSION=$(python -c "import re; content = open('src/azure-cli-core/azure/cli/core/__init__.py').read(); m = re.search(r'__version__\s*=\s*['\''\"](.+?)['\''\"]', content); print(m.group(1) if m else 'ERROR')")
        if [ "$VERSION" = "ERROR" ]; then
          echo "❌ Failed to detect version from azure-cli-core"
          exit 1
        fi
        echo "Auto-detected version: $VERSION"
        echo "##vso[task.setvariable variable=CLI_VERSION]$VERSION"
      displayName: 'Auto-detect version from code'
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARM64 artifact'
      inputs:
        artifact: 'pkg-installer-macos-arm64'
        path: '$(Pipeline.Workspace)/artifacts-arm64'
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download x86_64 artifact'
      inputs:
        artifact: 'pkg-installer-macos-x86_64'
        path: '$(Pipeline.Workspace)/artifacts-x86_64'
    
    - bash: |
        mkdir -p release
        VERSION="$(CLI_VERSION)"
        
        echo "=== Preparing Release Assets ==="
        find $(Pipeline.Workspace)/artifacts-arm64 -type f
        find $(Pipeline.Workspace)/artifacts-x86_64 -type f
        
        cp $(Pipeline.Workspace)/artifacts-arm64/*.pkg release/
        cp $(Pipeline.Workspace)/artifacts-arm64/*.sha256 release/
        cp $(Pipeline.Workspace)/artifacts-x86_64/*.pkg release/
        cp $(Pipeline.Workspace)/artifacts-x86_64/*.sha256 release/
        
        echo ""
        echo "=== Release Files ==="
        ls -lh release/
      displayName: 'Prepare release assets'
    
    - pwsh: |
        $version = "$(CLI_VERSION)"
        $tag = "azure-cli-pkg-v$version"
        $repo = "$(GitHubRepo)"
        $prerelease = if ("${{ parameters.Prerelease }}" -eq "true") { $true } else { $false }
        
        $body = @"
        # Azure CLI v$version - macOS PKG Installer
        
        ## 🍺 Homebrew Cask Installation
        
        ``````bash
        brew tap naga-nandyala/mycli-app
        brew install --cask azure-cli-pkg
        ``````
        
        ## 📦 Direct Installation
        
        **Apple Silicon**: ``azure-cli-$version-macos-arm64.pkg``  
        **Intel**: ``azure-cli-$version-macos-x86_64.pkg``
        
        ``````bash
        sudo installer -pkg azure-cli-$version-macos-<arch>.pkg -target /
        az --version
        ``````
        
        ## Package Info
        
        - **Self-contained Python 3.13.11** (no external dependencies)
        - **Location**: ``/usr/local/microsoft/azure-cli/``
        - **Executable**: ``/usr/local/bin/az``
        - **Package ID**: ``com.microsoft.azure-cli``
        
        ## Verification
        
        ``````bash
        shasum -a 256 -c azure-cli-$version-macos-<arch>.pkg.sha256
        ``````
        
        ## Uninstall
        
        ``````bash
        # Via Homebrew Cask
        brew uninstall --cask azure-cli-pkg
        
        # Manual
        sudo rm -rf /usr/local/microsoft/azure-cli
        sudo rm /usr/local/bin/az
        ``````
        "@
        
        $apiUrl = "https://api.github.com/repos/$repo/releases"
        $headers = @{
          Authorization = "Bearer $(GITHUB_PAT)"
          Accept = "application/vnd.github.v3+json"
        }
        
        $releaseData = @{
          tag_name = $tag
          name = "Azure CLI $version for macOS"
          body = $body
          draft = $false
          prerelease = $prerelease
        } | ConvertTo-Json
        
        Write-Host "Creating GitHub release: $tag"
        $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Post -Body $releaseData -ContentType 'application/json'
        
        Write-Host "✅ Release created: $($release.html_url)"
        
        $uploadUrl = $release.upload_url -replace '\{\?name,label\}', ''
        Write-Host "##vso[task.setvariable variable=UPLOAD_URL]$uploadUrl"
      displayName: 'Create GitHub Release'
      env:
        GITHUB_PAT: $(GITHUB_PAT)
    
    - pwsh: |
        $uploadUrl = "$(UPLOAD_URL)"
        $headers = @{
          Authorization = "Bearer $(GITHUB_PAT)"
          Accept = "application/vnd.github.v3+json"
        }
        
        $files = Get-ChildItem -Path "release" -File
        foreach ($file in $files) {
          $uploadUrlFull = "$uploadUrl?name=$($file.Name)"
          $contentType = if ($file.Extension -eq ".pkg") { "application/octet-stream" } else { "text/plain" }
          
          Write-Host "Uploading: $($file.Name)"
          Invoke-RestMethod -Uri $uploadUrlFull -Headers $headers -Method Post -InFile $file.FullName -ContentType $contentType
          Write-Host "  ✅ Uploaded"
        }
        
        Write-Host ""
        Write-Host "✅ All files uploaded successfully!"
      displayName: 'Upload release assets'
      env:
        GITHUB_PAT: $(GITHUB_PAT)

- stage: Summary
  displayName: 'Build Summary'
  dependsOn: BuildPkg
  condition: always()
  jobs:
  - job: PrintSummary
    displayName: 'Print Build Summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "# Azure CLI macOS PKG Build Summary"
        echo ""
        echo "## Configuration"
        echo "- **Version**: Auto-detected from code"
        echo "- **Python**: 3.13.11 (self-contained)"
        echo "- **Build Method**: productbuild"
        echo "- **Runner**: macos-latest (Apple Silicon)"
        echo "- **Create Release**: ${{ parameters.CreateGitHubRelease }}"
        echo ""
        echo "## Build Status"
        echo "- **macOS ARM64 (Apple Silicon)**: ✅ Built"
        echo "- **macOS x86_64 (Intel)**: ✅ Built (cross-package)"
        echo ""
        echo "## Note"
        echo "macOS-13 Intel runners retired in 2025. Both architectures"
        echo "are now built on Apple Silicon runners using architecture-specific"
        echo "Python binaries from python-build-standalone."
        echo ""
        echo "## Package Features"
        echo "- ✅ Self-contained Python runtime (no dependencies)"
        echo "- ✅ Native macOS PKG installer"
        echo "- ✅ Homebrew Cask compatible"
        echo "- ✅ SHA256 checksums included"
        echo "- ✅ Both ARM64 and x86_64 support"
      displayName: 'Build Summary'
