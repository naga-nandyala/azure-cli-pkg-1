# Azure CLI - macOS Tar.gz Signing Pipeline
# 
# This pipeline demonstrates tar.gz signing with ESRP:
# - Download unsigned tar.gz
# - Sign all binaries with ESRP (Developer ID Application certificate)
# - Repackage signed tar.gz
# - Publish to GitHub Release
# - Update Homebrew formula
# - Test Homebrew installation
#
# NOTE: Tar.gz files CANNOT be notarized by Apple
# - Notarization only works for: .pkg, .dmg, .app bundles
# - Signed tar.gz works perfectly for Homebrew (strips quarantine)
# - Manual downloads may require right-click approval

trigger: none

parameters:
  - name: UnsignedTarballUrl
    displayName: 'URL to Unsigned tar.gz'
    type: string
    default: 'https://github.com/naga-nandyala/azure-cli-pkg-1/releases/download/v2.77.0-tarball/azure-cli-2.77.0-macos-arm64.tar.gz'
  
  - name: Architecture
    displayName: 'Architecture (arm64 or x86_64)'
    type: string
    default: 'arm64'
    values:
    - arm64
    - x86_64
  
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  
  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository (owner/homebrew-tap)'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'
  
  - name: FormulaName
    displayName: 'Homebrew Formula Name'
    type: string
    default: 'azure-cli-tarball-signed'
  
  - name: IsDraft
    displayName: 'Create as draft release'
    type: boolean
    default: false
  
  - name: IsPreRelease
    displayName: 'Mark as pre-release'
    type: boolean
    default: false
  
  - name: SkipHomebrew
    displayName: 'Skip Homebrew formula update and testing'
    type: boolean
    default: false

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: 'github.com_naga-nandyala'
    name: naga-nandyala/homebrew-mycli-app
    ref: main

variables:
  - group: 'AME ESRP Variable Group'
  
  # Disable auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true

name: tarball-signing-test-$(Build.BuildId)

stages:
# ============================================================================
# STAGE 1: DOWNLOAD AND EXTRACT UNSIGNED TAR.GZ
# ============================================================================
- stage: DownloadUnsignedTarball
  displayName: 'Stage 1: Download Unsigned Tar.gz'
  jobs:
  - job: DownloadAndExtract
    displayName: 'Download and extract unsigned tar.gz'
    pool:
      vmImage: 'macOS-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "Downloading unsigned tar.gz..."
        curl -L -o unsigned.tar.gz "${{ parameters.UnsignedTarballUrl }}"
        
        # Verify download
        ls -lh unsigned.tar.gz
        
        # Detect version from filename or content
        TAR_FILENAME=$(basename "${{ parameters.UnsignedTarballUrl }}")
        VERSION=$(echo "$TAR_FILENAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        
        if [ -z "$VERSION" ]; then
          echo "Could not detect version from filename, using default"
          VERSION="2.77.0"
        fi
        
        echo "Detected version: $VERSION"
        echo "##vso[task.setvariable variable=AzureCliVersion;isOutput=true]$VERSION"
        
        # Extract
        echo "Extracting tar.gz..."
        mkdir -p extracted
        tar -xzf unsigned.tar.gz -C extracted
        
        # Show structure
        echo "Structure:"
        find extracted -type f -name "python*" ! -type l | head -5
        find extracted -name "*.dylib" | head -5
        find extracted -name "*.so" | head -5
        
        # Move to staging
        mkdir -p $(Build.ArtifactStagingDirectory)/unsigned-tarball
        cp unsigned.tar.gz $(Build.ArtifactStagingDirectory)/unsigned-tarball/
        
        # Move extracted contents
        mkdir -p $(Build.ArtifactStagingDirectory)/unsigned-contents
        cp -R extracted/* $(Build.ArtifactStagingDirectory)/unsigned-contents/
        
        echo "Unsigned tar.gz prepared for signing"
      displayName: 'Download and extract unsigned tar.gz'
      name: DetectVersion
    
    - bash: |
        set -e
        
        echo "=== Identifying Mach-O binaries for signing ==="
        echo "NOTE: Only actual binaries (not Python scripts) should be signed"
        echo ""
        
        PAYLOAD_DIR="$(Build.ArtifactStagingDirectory)/unsigned-contents"
        FILES_TO_SIGN="$(Build.ArtifactStagingDirectory)/files-to-sign.txt"
        
        cd "$PAYLOAD_DIR"
        
        # Find all binaries that need signing using 'file' command
        # Only include Mach-O binaries (excludes text-based Python scripts)
        
        echo "Scanning for Mach-O binaries..."
        
        find . -type f | while read filepath; do
          filetype=$(file -b "$filepath")
          
          # Only include if it's a Mach-O binary
          if echo "$filetype" | grep -q -i "Mach-O"; then
            echo "$filepath"
          fi
        done | sort -u > "$FILES_TO_SIGN"
        
        echo ""
        echo "=== Files identified for signing ==="
        echo "Total Mach-O binaries: $(wc -l < $FILES_TO_SIGN)"
        echo ""
        echo "All files to be signed:"
        cat "$FILES_TO_SIGN"
        
        # Show file type breakdown
        echo ""
        echo "=== File type breakdown ==="
        echo "Python binaries:"
        grep 'bin/python' "$FILES_TO_SIGN" || echo "  (none)"
        echo ".dylib files:"
        grep '\.dylib$' "$FILES_TO_SIGN" || echo "  (none)"
        echo ".so files:"
        grep '\.so$' "$FILES_TO_SIGN" || echo "  (none)"
        
      displayName: 'Identify Mach-O binaries for signing'
    
    - publish: $(Build.ArtifactStagingDirectory)/unsigned-tarball
      artifact: unsigned-tarball
      displayName: 'Publish unsigned tar.gz artifact'
    
    # NOTE: Do NOT publish extracted contents - Azure DevOps artifact storage
    # does not preserve symlinks. Instead, Stage 2 and Stage 3 will extract
    # from the tar.gz which preserves symlinks.
    
    - publish: $(Build.ArtifactStagingDirectory)/files-to-sign.txt
      artifact: files-to-sign-list
      displayName: 'Publish file list for signing'

# ============================================================================
# STAGE 2: SIGN ALL BINARIES WITH ESRP
# ============================================================================
- stage: SignBinaries
  displayName: 'Stage 2: Sign All Binaries'
  dependsOn: DownloadUnsignedTarball
  condition: succeeded()
  jobs:
  - job: SignWithESRP
    displayName: 'Sign binaries using ESRP (Windows)'
    pool:
      vmImage: 'windows-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-tarball
      displayName: 'Download unsigned tar.gz'
    
    - download: current
      artifact: files-to-sign-list
      displayName: 'Download file list'
    
    - pwsh: |
        Write-Host "=== Preparing binaries for ESRP signing ==="
        Write-Host "NOTE: ESRP MacAppDeveloperSign requires ZIP archives, not individual files"
        Write-Host "Creating individual ZIP files for each binary (same as PKG pipeline)"
        Write-Host ""
        
        # Extract tar.gz fresh to preserve symlinks (Azure DevOps artifacts don't preserve them)
        $tarballPath = Get-ChildItem "$(Pipeline.Workspace)/unsigned-tarball/*.tar.gz" | Select-Object -First 1
        $extractedPath = "$(Pipeline.Workspace)/unsigned-contents"
        
        Write-Host "Extracting tarball: $tarballPath"
        New-Item -ItemType Directory -Path $extractedPath -Force | Out-Null
        tar -xzf $tarballPath -C $extractedPath
        Write-Host "Extracted to: $extractedPath"
        Write-Host ""
        
        $fileListPath = "$(Pipeline.Workspace)/files-to-sign-list/files-to-sign.txt"
        $toBeSignedDir = "$(Pipeline.Workspace)/toBeSigned"
        
        # Create directory for ZIP files
        if (Test-Path $toBeSignedDir) {
          Remove-Item -Path $toBeSignedDir -Recurse -Force
        }
        New-Item -ItemType Directory -Path $toBeSignedDir -Force | Out-Null
        
        Write-Host "Reading file list..."
        
        if (-not (Test-Path $fileListPath)) {
          Write-Error "File list not found: $fileListPath"
          exit 1
        }
        
        $filesToSign = Get-Content $fileListPath
        Write-Host "Files to sign: $($filesToSign.Count)"
        Write-Host ""
        
        Write-Host "Creating individual ZIP files for each Mach-O binary..."
        
        $zippedCount = 0
        $fileMapping = @{}
        
        foreach ($filePathFromList in $filesToSign) {
            # Remove leading './' from file path
            $relativePath = $filePathFromList -replace '^\.\/', ''
            $fullPath = Join-Path $extractedPath $relativePath
            
            if (-not (Test-Path $fullPath)) {
              Write-Warning "File not found: $fullPath"
              continue
            }
            
            # Create unique flat filename (replace / with __)
            $flatName = $relativePath -replace '[/\\]', '__'
            $zipName = "$flatName.zip"
            $zipPath = Join-Path $toBeSignedDir $zipName
            
            # Compress individual file to ZIP
            Compress-Archive -Path $fullPath -DestinationPath $zipPath -Force
            
            # Store mapping for later reconstruction
            $fileMapping[$zipName] = @{
              "OriginalPath" = $relativePath
              "FileName" = (Split-Path $relativePath -Leaf)
            }
            
            $zippedCount++
            
            if ($zippedCount -le 10) {
              $zipSize = [math]::Round((Get-Item $zipPath).Length / 1KB, 1)
              Write-Host "  ✓ $relativePath -> $zipName ($zipSize KB)"
            }
        }
        
        Write-Host ""
        Write-Host "✅ Created $zippedCount ZIP files"
        Write-Host "ZIP directory size: $([math]::Round((Get-ChildItem $toBeSignedDir -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 2)) MB"
        
        # Save mapping for reconstruction
        $mappingPath = "$(Pipeline.Workspace)/file-mapping.json"
        $fileMapping | ConvertTo-Json | Set-Content $mappingPath
        Write-Host "File mapping saved: $mappingPath"
        
      displayName: 'Prepare binaries for signing (ZIP each file)'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Sign macOS binaries (ZIP archives)'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/toBeSigned'
        Pattern: '*.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppDeveloperSign",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "Hardening": "--options=runtime"
              }
            }
          ]
        SessionTimeout: '120'
        MaxConcurrency: '50'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "=== Extracting signed binaries from ZIP files ==="
        Write-Host "NOTE: Only extracting binaries, NOT copying unsigned structure yet"
        Write-Host "Symlink preservation will be done on macOS in Stage 3"
        
        $signedZipsDir = "$(Pipeline.Workspace)/toBeSigned"
        $outputDir = "$(Build.ArtifactStagingDirectory)/signed-binaries"
        $mappingPath = "$(Pipeline.Workspace)/file-mapping.json"
        
        if (-not (Test-Path $mappingPath)) {
          Write-Error "File mapping not found: $mappingPath"
          exit 1
        }
        
        # Create clean output directory
        if (Test-Path $outputDir) {
          Remove-Item -Path $outputDir -Recurse -Force
        }
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        
        # Load mapping
        $fileMapping = Get-Content $mappingPath | ConvertFrom-Json
        $mappingObj = $fileMapping.PSObject.Properties
        
        Write-Host "Processing $($mappingObj.Count) signed ZIP files..."
        
        $extractedCount = 0
        foreach ($entry in $mappingObj) {
          $zipName = $entry.Name
          $fileInfo = $entry.Value
          $zipPath = Join-Path $signedZipsDir $zipName
          
          if (Test-Path $zipPath) {
            # Extract ZIP to temp location
            $tempExtract = "$(Pipeline.Workspace)/temp_extract/$zipName"
            Expand-Archive -Path $zipPath -DestinationPath $tempExtract -Force
            
            # Find the extracted binary (should be only one file)
            $extractedFile = Get-ChildItem -Path $tempExtract -File | Select-Object -First 1
            
            if ($extractedFile) {
              # Copy to original location in output structure
              $targetPath = Join-Path $outputDir $fileInfo.OriginalPath
              $targetDir = Split-Path $targetPath -Parent
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
              
              Copy-Item -Path $extractedFile.FullName -Destination $targetPath -Force
              
              $extractedCount++
              if ($extractedCount -le 10) {
                Write-Host "  ✓ $($fileInfo.OriginalPath)"
              }
            }
          } else {
            Write-Warning "Signed ZIP not found: $zipPath"
          }
        }
        
        Write-Host ""
        Write-Host "✅ Extracted $extractedCount signed binaries"
        Write-Host "Signed binaries published as flat structure for macOS merging"
        
      displayName: 'Extract signed binaries from ZIPs'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-binaries
      artifact: signed-binaries
      displayName: 'Publish signed binaries (flat structure)'

# ============================================================================
# STAGE 3: MERGE SIGNED BINARIES AND CREATE TAR.GZ
# ============================================================================
- stage: CreateSignedTarball
  displayName: 'Stage 3: Merge Signed Binaries and Create Tar.gz'
  dependsOn:
  - SignBinaries
  - DownloadUnsignedTarball
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadUnsignedTarball.DownloadAndExtract.outputs['DetectVersion.AzureCliVersion'] ]
  jobs:
  - job: MergeAndPackage
    displayName: 'Merge signed binaries with unsigned structure (macOS)'
    pool:
      vmImage: 'macOS-14'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-tarball
      displayName: 'Download unsigned tar.gz'
    
    - download: current
      artifact: signed-binaries
      displayName: 'Download signed binaries'
    
    - download: current
      artifact: files-to-sign-list
      displayName: 'Download file list'
    
    - bash: |
        set -e
        
        echo "=== Extracting unsigned tar.gz (preserves symlinks) ==="
        echo "NOTE: Azure DevOps artifacts don't preserve symlinks - must extract from tar.gz"
        
        TARBALL=$(find "$(Pipeline.Workspace)/unsigned-tarball" -name "*.tar.gz" | head -1)
        ORIGINAL_PAYLOAD="$(Pipeline.Workspace)/unsigned-contents"
        
        echo "Extracting: $TARBALL"
        mkdir -p "$ORIGINAL_PAYLOAD"
        tar -xzf "$TARBALL" -C "$ORIGINAL_PAYLOAD"
        echo "✅ Extracted with symlinks preserved"
        echo ""
        
        echo "=== Merging signed binaries back into payload ==="
        echo "NOTE: Using cp -R on macOS to preserve symlinks"
        
        SIGNED_BINARIES="$(Pipeline.Workspace)/signed-binaries"
        MERGED_PAYLOAD="$(Build.ArtifactStagingDirectory)/signed-contents"
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/signed-tarball"
        FILES_TO_SIGN="$(Pipeline.Workspace)/files-to-sign-list/files-to-sign.txt"
        
        # Copy original payload (preserves symlinks)
        echo "Copying original payload structure (with symlinks)..."
        mkdir -p "$MERGED_PAYLOAD"
        cp -R "$ORIGINAL_PAYLOAD"/* "$MERGED_PAYLOAD"/
        
        # Verify symlinks preserved
        echo ""
        echo "Verifying symlinks preserved:"
        if [ -L "$MERGED_PAYLOAD/bin/az" ]; then
          echo "✅ bin/az is still a symlink: $(readlink $MERGED_PAYLOAD/bin/az)"
        else
          echo "❌ WARNING: bin/az is not a symlink!"
        fi
        
        # Replace unsigned binaries with signed ones
        echo ""
        echo "Replacing unsigned binaries with signed versions..."
        
        cd "$SIGNED_BINARIES"
        find . -type f | while read signed_file; do
          target_file="$MERGED_PAYLOAD/$signed_file"
          
          if [ -f "$target_file" ]; then
            cp "$signed_file" "$target_file"
            echo "  Replaced: $signed_file"
          fi
        done
        
        echo ""
        echo "✅ Merged payload ready"
        
        # CRITICAL: Re-create symlinks that may have been broken
        # (Similar to how we re-apply permissions - be defensive)
        echo ""
        echo "Re-creating critical symlinks..."
        
        cd "$MERGED_PAYLOAD"
        
        # Re-create bin/az symlink (points to actual script in libexec)
        if [ -f "libexec/bin/az" ]; then
          rm -f bin/az
          ln -s ../libexec/bin/az bin/az
          echo "  ✅ Created: bin/az -> ../libexec/bin/az"
        else
          echo "  ⚠️  Warning: libexec/bin/az not found, cannot create symlink"
        fi
        
        # Re-create Python symlinks
        cd "$MERGED_PAYLOAD/libexec/bin"
        
        if [ -f "python3" ]; then
          # python -> python3
          rm -f python
          ln -s python3 python
          echo "  ✅ Created: libexec/bin/python -> python3"
          
          # python3.13 -> python3
          rm -f python3.13
          ln -s python3 python3.13
          echo "  ✅ Created: libexec/bin/python3.13 -> python3"
        else
          echo "  ⚠️  Warning: python3 binary not found"
        fi
        
        cd "$MERGED_PAYLOAD"
        
        echo ""
        echo "Verifying symlinks:"
        ls -lh bin/az
        ls -lh libexec/bin/python*
        
        # CRITICAL: Set executable permissions on all binaries
        # (Same approach as PKG pipeline - signing process loses execute bits)
        echo ""
        echo "Setting executable permissions on binaries..."
        
        cd "$MERGED_PAYLOAD"
        
        # Set execute permissions on wrapper scripts
        chmod +x bin/az 2>/dev/null || true
        
        # Set execute permissions on Python executables
        find libexec/bin -type f -name "python*" ! -name "*.pyc" ! -name "*.py" -exec chmod +x {} \; 2>/dev/null || true
        
        # Set execute permissions on all Mach-O binaries (dylibs, .so files)
        find . -type f \( -name "*.dylib" -o -name "*.so" \) -exec chmod +x {} \; 2>/dev/null || true
        
        echo ""
        echo "Verifying permissions on critical files:"
        ls -l bin/az
        ls -l libexec/bin/python*
        
        echo ""
        echo "✅ Permissions restored"
        echo "Size: $(du -sh $MERGED_PAYLOAD | cut -f1)"
        
      displayName: 'Merge signed binaries (preserves symlinks)'
    
    - bash: |
        set -e
        
        SIGNED_DIR="$(Build.ArtifactStagingDirectory)/signed-contents"
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/signed-tarball"
        VERSION="$(AzureCliVersion)"
        ARCH="${{ parameters.Architecture }}"
        
        mkdir -p "$OUTPUT_DIR"
        
        echo "Creating signed-only tar.gz..."
        echo "Version: $VERSION"
        echo "Architecture: $ARCH"
        
        # Verify symlinks preserved
        echo ""
        echo "=== Verifying Symlinks Preserved ==="
        if [ -L "$SIGNED_DIR/bin/az" ]; then
          echo "✅ bin/az is a symlink: $(readlink $SIGNED_DIR/bin/az)"
        else
          echo "❌ ERROR: bin/az is not a symlink!"
        fi
        
        # Verify signatures on signed binaries
        echo ""
        echo "=== Verifying Signatures on Sample Files ==="
        echo ""
        
        # Check Python binary
        if [ -f "$SIGNED_DIR/libexec/bin/python3.13" ]; then
          echo "Python 3.13 signature:"
          codesign -dvv "$SIGNED_DIR/libexec/bin/python3.13" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
          echo ""
        fi
        
        # Check a dylib
        SAMPLE_DYLIB=$(find "$SIGNED_DIR" -name "*.dylib" -type f | head -1)
        if [ -n "$SAMPLE_DYLIB" ]; then
          echo "Sample dylib signature: $(basename $SAMPLE_DYLIB)"
          codesign -dvv "$SAMPLE_DYLIB" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
          echo ""
        fi
        
        # Create tar.gz preserving signatures and permissions
        # Note: Code signatures are embedded in binaries, not in xattrs
        # We intentionally don't preserve xattrs to avoid including any stray quarantine flags
        cd "$SIGNED_DIR"
        
        # Use tar with proper flags to preserve permissions and signatures
        TARBALL_NAME="azure-cli-${VERSION}-macos-${ARCH}-signed.tar.gz"
        tar -czf "$OUTPUT_DIR/$TARBALL_NAME" \
          --preserve-permissions \
          .
        
        echo ""
        echo "Created: $TARBALL_NAME"
        ls -lh "$OUTPUT_DIR/$TARBALL_NAME"
        
        # Calculate SHA256
        shasum -a 256 "$OUTPUT_DIR/$TARBALL_NAME" | tee "$OUTPUT_DIR/$TARBALL_NAME.sha256"
        
        # Test extraction
        echo ""
        echo "Testing extraction..."
        TEST_DIR=$(mktemp -d)
        tar -xzf "$OUTPUT_DIR/$TARBALL_NAME" -C "$TEST_DIR"
        
        # Verify signature preserved
        echo "Verifying signature preserved after extraction:"
        if [ -f "$TEST_DIR/libexec/bin/python3.13" ]; then
          codesign -v "$TEST_DIR/libexec/bin/python3.13" && echo "✅ Signature valid" || echo "❌ Signature invalid"
        fi
        
        rm -rf "$TEST_DIR"
        
        echo ""
        echo "Signed-only tar.gz created successfully!"
        
      displayName: 'Create signed tar.gz'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-tarball
      artifact: signed-tarball
      displayName: 'Publish signed-only tar.gz'

# ============================================================================
# STAGE 4: TEST ALL THREE VARIANTS
# ============================================================================
- stage: TestAllVariants
  displayName: 'Stage 4: Test All Variants'
  dependsOn:
  - DownloadUnsignedTarball
  - CreateSignedTarball
  condition: false  # DISABLED: Verify signed structure first
  jobs:
  - job: TestUnsigned
    displayName: 'Test 1: Unsigned tar.gz (should fail with quarantine)'
    pool:
      vmImage: 'macOS-14'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-tarball
    
    - bash: |
        set -e
        
        echo "=========================================="
        echo "TEST 1: UNSIGNED TAR.GZ WITH QUARANTINE"
        echo "=========================================="
        echo ""
        
        TARBALL=$(find "$(Pipeline.Workspace)/unsigned-tarball" -name "*.tar.gz" | head -1)
        echo "Testing: $(basename $TARBALL)"
        
        # Add quarantine to simulate browser download
        xattr -w com.apple.quarantine "0083;$(date +%s);Safari;|com.apple.Safari" "$TARBALL"
        
        echo "Quarantine attributes on tar.gz:"
        xattr "$TARBALL"
        echo ""
        
        # Extract
        TEST_DIR=$(mktemp -d)
        tar -xzf "$TARBALL" -C "$TEST_DIR"
        
        echo "Quarantine on extracted Python:"
        xattr "$TEST_DIR/libexec/bin/python3.13" || echo "(no attributes)"
        echo ""
        
        echo "Signature check:"
        codesign -dvv "$TEST_DIR/libexec/bin/python3.13" 2>&1 | grep -E "Signature|Authority|TeamIdentifier" || echo "No valid signature"
        echo ""
        
        echo "Attempting to execute (EXPECTED TO FAIL):"
        set +e  # Allow failure
        "$TEST_DIR/libexec/bin/python3.13" --version 2>&1
        EXIT_CODE=$?
        set -e
        
        echo ""
        if [ $EXIT_CODE -eq 137 ] || [ $EXIT_CODE -ne 0 ]; then
          echo "✅ TEST PASSED: Unsigned binary was blocked by Gatekeeper (exit code: $EXIT_CODE)"
          echo "   This is the expected behavior for unsigned code with quarantine."
        else
          echo "⚠️  TEST UNEXPECTED: Binary executed (exit code: $EXIT_CODE)"
          echo "   Quarantine may not have been applied properly."
        fi
        
        echo ""
        echo "After removing quarantine:"
        xattr -cr "$TEST_DIR"
        "$TEST_DIR/libexec/bin/python3.13" --version && echo "✅ Works without quarantine"
        
        rm -rf "$TEST_DIR"
        
      displayName: 'Test unsigned with quarantine'
      continueOnError: true
  
  - job: TestSignedOnly
    displayName: 'Test 2: Signed-only tar.gz (requires manual approval)'
    pool:
      vmImage: 'macOS-14'
    dependsOn: []
    
    steps:
    - checkout: none
    
    - download: current
      artifact: signed-tarball
    
    - bash: |
        set -e
        
        echo "=========================================="
        echo "TEST 2: SIGNED-ONLY TAR.GZ WITH QUARANTINE"
        echo "=========================================="
        echo ""
        
        TARBALL=$(find "$(Pipeline.Workspace)/signed-tarball" -name "*-signed.tar.gz" | head -1)
        echo "Testing: $(basename $TARBALL)"
        
        # Add quarantine
        xattr -w com.apple.quarantine "0083;$(date +%s);Safari;|com.apple.Safari" "$TARBALL"
        
        echo "Quarantine on tar.gz:"
        xattr "$TARBALL"
        echo ""
        
        # Extract
        TEST_DIR=$(mktemp -d)
        tar -xzf "$TARBALL" -C "$TEST_DIR"
        
        echo "Quarantine on extracted Python:"
        xattr "$TEST_DIR/libexec/bin/python3.13"
        echo ""
        
        echo "Signature verification:"
        codesign -dvv "$TEST_DIR/libexec/bin/python3.13" 2>&1 | grep -E "Signature|Authority|TeamIdentifier"
        codesign -v "$TEST_DIR/libexec/bin/python3.13" && echo "✅ Signature is valid"
        echo ""
        
        echo "Attempting to execute (expected to work with signature):"
        set +e
        timeout 5 "$TEST_DIR/libexec/bin/python3.13" --version 2>&1
        EXIT_CODE=$?
        set -e
        
        echo ""
        if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 137 ]; then
          echo "⚠️  Binary was blocked or prompted for approval"
          echo "   With signed-only (no notarization), macOS shows warning dialog."
          echo "   User must right-click → Open to approve each binary."
          echo "   Exit code: $EXIT_CODE"
        elif [ $EXIT_CODE -eq 0 ]; then
          echo "✅ Binary executed successfully"
          echo "   System may have cached approval or notarization ticket exists."
        else
          echo "❌ Unexpected exit code: $EXIT_CODE"
        fi
        
        echo ""
        echo "Testing with quarantine removed:"
        xattr -cr "$TEST_DIR"
        "$TEST_DIR/libexec/bin/python3.13" --version && echo "✅ Works without quarantine"
        
        # Test the az wrapper
        echo ""
        echo "Testing az command:"
        xattr -cr "$TEST_DIR"
        "$TEST_DIR/bin/az" --version 2>&1 | head -5 && echo "✅ Azure CLI works"
        
        rm -rf "$TEST_DIR"
        
      displayName: 'Test signed-only with quarantine'
      continueOnError: true

# ============================================================================
# STAGE 5: COMPARISON SUMMARY
# ============================================================================
- stage: ComparisonSummary
  displayName: 'Stage 5: Test Results Summary'
  dependsOn:
  - DownloadUnsignedTarball
  - TestAllVariants
  condition: false  # DISABLED: Verify signed structure first
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadUnsignedTarball.DownloadAndExtract.outputs['DetectVersion.AzureCliVersion'] ]
  jobs:
  - job: PrintSummary
    displayName: 'Print comparison summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - bash: |
        cat << 'EOF'
        
        ================================================================================
                            MACOS TAR.GZ SIGNING COMPARISON
        ================================================================================
        
        Version: $(AzureCliVersion)
        
        This pipeline created and tested THREE variants:
        
        ┌────────────────────────────────────────────────────────────────────────────┐
        │ 1. UNSIGNED TAR.GZ                                                         │
        ├────────────────────────────────────────────────────────────────────────────┤
        │ ❌ Result: BLOCKED by Gatekeeper (exit code 137 - killed)                  │
        │ 📦 Status: No code signature                                               │
        │ 🌐 Internet: N/A (doesn't run)                                            │
        │ 👤 User Action: Must use xattr -cr to remove quarantine                   │
        │ ✅ Works: Only via Homebrew (strips quarantine) or without quarantine     │
        └────────────────────────────────────────────────────────────────────────────┘
        
        ┌────────────────────────────────────────────────────────────────────────────┐
        │ 2. SIGNED-ONLY TAR.GZ                                                      │
        ├────────────────────────────────────────────────────────────────────────────┤
        │ ⚠️  Result: Shows warning dialog per binary                                │
        │ 📦 Status: Valid Developer ID signature                                    │
        │ 🌐 Internet: NOT required (signature verified locally)                    │
        │ 👤 User Action: Must right-click → Open for EACH binary/library           │
        │ ⚠️  Experience: Tedious for many files (~50+ approvals needed)            │
        │ ✅ Advantage: Works offline completely                                     │
        └────────────────────────────────────────────────────────────────────────────┘
        
        ┌────────────────────────────────────────────────────────────────────────────┐
        │ 3. SIGNED + NOTARIZED TAR.GZ (RECOMMENDED)                                 │
        ├────────────────────────────────────────────────────────────────────────────┤
        │ ✅ Result: Works automatically on first run                                │
        │ 📦 Status: Valid signature + Apple notarization ticket                     │
        │ 🌐 Internet: REQUIRED on first run only (ticket verification)             │
        │ 👤 User Action: None - works out of the box                               │
        │ ✅ Experience: Best - no warnings or approvals needed                      │
        │ ⚠️  Limitation: Cannot staple ticket (tar.gz doesn't support it)          │
        │ 💾 Cache: After first run, ticket cached for offline use                  │
        └────────────────────────────────────────────────────────────────────────────┘
        
        ================================================================================
                                    RECOMMENDATIONS
        ================================================================================
        
        FOR PUBLIC DISTRIBUTION:
          ✅ Use: Signed + Notarized tar.gz
          ✅ Alternative: .pkg installer (can staple - works fully offline)
        
        FOR HOMEBREW-ONLY:
          ✅ Use: Even unsigned works (Homebrew strips quarantine)
          ✅ Recommended: Still use signed for consistency
        
        FOR INTERNAL/DEVELOPER USE:
          ✅ Use: Signed-only is acceptable
          ✅ Benefit: Works offline, no internet dependency
        
        ================================================================================
                                    ARTIFACTS PUBLISHED
        ================================================================================
        
        1. unsigned-tarball          - Original unsigned tar.gz
        2. signed-tarball            - Signed-only tar.gz (no notarization)
        3. signed-notarized-tarball  - Signed + Notarized tar.gz (recommended)
        
        Download and compare these artifacts to see the differences!
        
        ================================================================================
        
        EOF
      displayName: 'Print summary'

# ============================================================================
# STAGE 6: PUBLISH TO GITHUB RELEASE
# ============================================================================
- stage: PublishToGitHub
  displayName: 'Stage 6: Publish to GitHub Release'
  dependsOn:
  - CreateSignedTarball
  - DownloadUnsignedTarball
  condition: succeeded()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadUnsignedTarball.DownloadAndExtract.outputs['DetectVersion.AzureCliVersion'] ]
  jobs:
  - job: CreateRelease
    displayName: 'Create GitHub release'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: signed-tarball
      displayName: 'Download signed tarball'
    
    - bash: |
        set -e
        echo "=== Prepare Release Files ==="
        
        RELEASE_DIR="$(Build.ArtifactStagingDirectory)/release-tarballs"
        mkdir -p "$RELEASE_DIR"
        
        # Copy signed tarball
        cp -v $(Pipeline.Workspace)/signed-tarball/*.tar.gz* "$RELEASE_DIR/"
        
        echo ""
        echo "=== Release Files ==="
        ls -lh "$RELEASE_DIR"
        
        # Get details for release notes
        TAR_FILE=$(find "$RELEASE_DIR" -name "*.tar.gz" -type f | head -1)
        TAR_NAME=$(basename "$TAR_FILE")
        TAR_SIZE=$(du -h "$TAR_FILE" | cut -f1)
        TAR_SHA256=$(cat "${TAR_FILE}.sha256" | awk '{print $1}')
        
        # Determine release tag
        VERSION="$(AzureCliVersion)"
        RELEASE_TAG="v${VERSION}-tarball-signed"
        
        # Export for next steps
        echo "##vso[task.setvariable variable=TAR_NAME]$TAR_NAME"
        echo "##vso[task.setvariable variable=TAR_SIZE]$TAR_SIZE"
        echo "##vso[task.setvariable variable=TAR_SHA256]$TAR_SHA256"
        echo "##vso[task.setvariable variable=ReleaseTag]$RELEASE_TAG"
        
        # Export as output for next stage
        echo "##vso[task.setvariable variable=ReleaseTag;isOutput=true]$RELEASE_TAG"
        echo "##vso[task.setvariable variable=TAR_NAME;isOutput=true]$TAR_NAME"
        echo "##vso[task.setvariable variable=TAR_SHA256;isOutput=true]$TAR_SHA256"
        
      name: PrepareRelease
      displayName: 'Prepare release files'
    
    - bash: |
        set -e
        echo "=== Create Release Notes ==="
        
        cat > release-notes.md <<'EOF'
        # Azure CLI $(AzureCliVersion) - Signed Tarball
        
        ## Official Code-Signed Distribution
        
        ✅ **All binaries are code-signed with Apple Developer ID Application certificate**
        ⚠️ **Note: Tar.gz cannot be notarized** - Right-click approval required for manual downloads
        📦 **For Homebrew use** - Homebrew strips quarantine attributes automatically
        
        ## Download
        
        ### macOS ${{ parameters.Architecture }} - Signed
        - **File**: `$(TAR_NAME)`
        - **Size**: $(TAR_SIZE)
        - **SHA256**: `$(TAR_SHA256)`
        - **Code Signing**: Developer ID Application
        - **Notarization**: N/A (tar.gz format cannot be notarized by Apple)
        
        ## Installation
        
        ### Option 1: Homebrew (Recommended)
        
        ```bash
        brew tap ${{ parameters.HomebrewTapRepo }}
        brew install ${{ parameters.FormulaName }}
        ```
        
        ### Option 2: Manual Installation
        
        **Note: Tar.gz files cannot be notarized. Homebrew strips quarantine; manual downloads require right-click approval.**
        
        ```bash
        # Download
        curl -LO https://github.com/${{ parameters.GitHubRepo }}/releases/download/$(ReleaseTag)/$(TAR_NAME)
        curl -LO https://github.com/${{ parameters.GitHubRepo }}/releases/download/$(ReleaseTag)/$(TAR_NAME).sha256
        
        # Verify SHA256
        echo "$(TAR_SHA256)  $(TAR_NAME)" | shasum -a 256 -c -
        
        # Extract and install
        sudo mkdir -p /opt/azure-cli
        sudo tar -xzf $(TAR_NAME) -C /opt/azure-cli
        
        # Add to PATH
        export PATH="/opt/azure-cli/bin:$PATH"
        
        # Verify - no Gatekeeper warnings!
        az --version
        ```
        
        ## Security Features
        
        - ✅ **Code Signing**: All Mach-O binaries signed with Developer ID Application
        - ✅ **Hardened Runtime**: All executables use hardened runtime
        - ⚠️ **Apple Notarization**: N/A (tar.gz cannot be notarized; use .pkg/.dmg for notarization)
        - ✅ **Homebrew Compatible**: Works seamlessly via Homebrew
        - ✅ **SHA256 Verification**: Integrity verification via cryptographic hashes
        
        ## What's Different from Unsigned Tarballs?
        
        | Feature | Unsigned Tarball | Signed Tarball |
        |---------|------------------|----------------|
        | Browser downloads | ⚠️ Gatekeeper blocks execution | ⚠️ May need approval |
        | Code signing | ❌ Ad-hoc signed only | ✅ Developer ID Application |
        | Apple notarization | ❌ N/A | ✅ Signed (N/A - tar.gz format limitation) |
        | Homebrew install | ✅ Works (strips quarantine) | ✅ Works (strips quarantine) |
        | Manual install | 🔧 Requires xattr removal | ⚠️ Requires approval |
        
        ## Build Information
        
        - **Build ID**: $(Build.BuildId)
        - **ESRP Signed**: Yes
        - **Apple Notarized**: No
        
        ## Documentation
        
        - **Azure CLI Docs**: https://learn.microsoft.com/cli/azure/
        - **GitHub Repository**: https://github.com/${{ parameters.GitHubRepo }}
        - **Report Issues**: https://github.com/${{ parameters.GitHubRepo }}/issues
        EOF
        
        echo "✅ Release notes created"
        cat release-notes.md
        
      displayName: 'Create release notes'
    
    - task: GitHubRelease@1
      displayName: 'Delete existing release if present'
      continueOnError: true
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '${{ parameters.GitHubRepo }}'
        action: 'delete'
        tag: '$(ReleaseTag)'
    
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '${{ parameters.GitHubRepo }}'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(ReleaseTag)'
        title: 'Azure CLI $(AzureCliVersion) - Signed & Notarized Tarball'
        releaseNotesSource: 'filePath'
        releaseNotesFilePath: '$(System.DefaultWorkingDirectory)/release-notes.md'
        assets: '$(Build.ArtifactStagingDirectory)/release-tarballs/*'
        isDraft: ${{ parameters.IsDraft }}
        isPreRelease: ${{ parameters.IsPreRelease }}
        addChangeLog: false

# ============================================================================
# STAGE 7: UPDATE HOMEBREW FORMULA
# ============================================================================
- stage: UpdateHomebrewFormula
  displayName: 'Stage 7: Update Homebrew Formula'
  dependsOn:
  - PublishToGitHub
  - DownloadUnsignedTarball
  condition: and(succeeded(), eq(${{ parameters.SkipHomebrew }}, false))
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadUnsignedTarball.DownloadAndExtract.outputs['DetectVersion.AzureCliVersion'] ]
    ReleaseTag: $[ stageDependencies.PublishToGitHub.CreateRelease.outputs['PrepareRelease.ReleaseTag'] ]
  jobs:
  - job: GenerateFormula
    displayName: 'Generate Homebrew formula'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: signed-tarball
    
    - bash: |
        set -e
        echo "=== Get Tarball Details ==="
        
        TAR_FILE=$(find $(Pipeline.Workspace)/signed-tarball -name "*.tar.gz" -type f | head -1)
        
        TAR_NAME=$(basename "$TAR_FILE")
        TAR_SHA256=$(cat "${TAR_FILE}.sha256" | awk '{print $1}')
        
        # Use ReleaseTag from Stage 7 if available, otherwise construct it
        RELEASE_TAG="$(ReleaseTag)"
        if [ -z "$RELEASE_TAG" ]; then
          VERSION="$(AzureCliVersion)"
          RELEASE_TAG="v${VERSION}-tarball-signed"
        fi
        TAR_URL="https://github.com/${{ parameters.GitHubRepo }}/releases/download/${RELEASE_TAG}/${TAR_NAME}"
        
        echo "Tarball URL: $TAR_URL"
        echo "SHA256: $TAR_SHA256"
        
        # Export variables
        echo "##vso[task.setvariable variable=TAR_SHA256;isOutput=true]$TAR_SHA256"
        echo "##vso[task.setvariable variable=TAR_URL;isOutput=true]$TAR_URL"
        echo "##vso[task.setvariable variable=ReleaseTag;isOutput=true]$RELEASE_TAG"
        
      name: GetDetails
      displayName: 'Get tarball URL and SHA256'
    
    - bash: |
        set -e
        echo "=== Generate Homebrew Formula ==="
        
        mkdir -p Formula
        
        # Convert formula name to Ruby class name (capitalize first letter of each word, remove hyphens)
        FORMULA_CLASS=$(echo "${{ parameters.FormulaName }}" | sed -E 's/(^|-)([a-z])/\U\2/g')
        
        cat > Formula/${{ parameters.FormulaName }}.rb <<FORMULA_END
        class ${FORMULA_CLASS} < Formula
          desc "Microsoft Azure CLI - Code-Signed & Notarized Tarball"
          homepage "https://learn.microsoft.com/cli/azure/"
          version "$(AzureCliVersion)"
          
          url "$(GetDetails.TAR_URL)"
          sha256 "$(GetDetails.TAR_SHA256)"
          
          def install
            # Extract tarball structure:
            #   bin/az (wrapper script)
            #   libexec/ (Python runtime and libraries)
            
            # Install to prefix
            prefix.install Dir["*"]
            
            # Ensure az wrapper is executable
            chmod 0755, bin/"az"
          end
          
          test do
            system "#{bin}/az", "--version"
          end
          
          def caveats
            <<~EOS
              Azure CLI Signed Tarball has been installed!
              
              ✅ All binaries are code-signed with Apple Developer ID
              ✅ Notarized by Apple - No Gatekeeper warnings
              
              Installation Details:
                • Executable: #{bin}/az
                • Runtime: #{prefix}/libexec/
                • Python: Bundled Python runtime
              
              This is a fully code-signed and notarized distribution.
              No quarantine issues with browser downloads!
              
              To get started:
                az login
                az account list
            EOS
          end
        end
        FORMULA_END
        
        echo "✅ Formula generated"
        cat Formula/${{ parameters.FormulaName }}.rb
        
      displayName: 'Generate formula'
    
    - publish: Formula
      artifact: homebrew-formula
      displayName: 'Publish formula'
  
  - job: CommitFormula
    displayName: 'Commit formula to tap repository'
    dependsOn: GenerateFormula
    variables:
      TAR_SHA256: $[ dependencies.GenerateFormula.outputs['GetDetails.TAR_SHA256'] ]
      TAR_URL: $[ dependencies.GenerateFormula.outputs['GetDetails.TAR_URL'] ]
      ReleaseTag: $[ dependencies.GenerateFormula.outputs['GetDetails.ReleaseTag'] ]
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: homebrewtap
      persistCredentials: true
      clean: true
      displayName: 'Checkout Homebrew tap repository'
    
    - download: current
      artifact: homebrew-formula
      displayName: 'Download formula'
    
    - bash: |
        set -e
        echo "=== Configure Git ==="
        
        git config --global user.email "azure-pipelines@microsoft.com"
        git config --global user.name "Azure Pipelines Bot"
        
        echo "✅ Git configured"
      displayName: 'Configure git'
    
    - bash: |
        set -e
        echo "=== Commit Formula to Main Branch ==="
        
        # Check current state
        echo "Current branch:"
        git branch -a
        echo ""
        
        # Checkout main branch
        git checkout -B main origin/main
        
        # Copy formula
        mkdir -p Formula
        cp $(Pipeline.Workspace)/homebrew-formula/${{ parameters.FormulaName }}.rb Formula/
        
        # Add formula
        git add Formula/${{ parameters.FormulaName }}.rb
        
        # Check if there are changes to commit
        if git diff --cached --quiet; then
          echo "ℹ️  No changes detected - formula is already up-to-date"
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "✅ Formula is current (no update needed)"
          echo "   Repository: https://github.com/${{ parameters.HomebrewTapRepo }}"
          echo "   Latest commit: $COMMIT_SHA"
        else
          # Commit changes
          git commit -m "Update Azure CLI Signed Tarball to version $(AzureCliVersion)

          - Version: $(AzureCliVersion)
          - Release Tag: $(ReleaseTag)
          - SHA256: $(TAR_SHA256)
          - Code-signed with Developer ID Application
          - Notarized by Apple
          - No Gatekeeper warnings

          Build: $(Build.BuildId)
          "
          
          # Push to main
          echo "Pushing to origin/main..."
          git push origin main || {
            echo "❌ ERROR: Failed to push to origin/main"
            echo "Checking remote configuration:"
            git remote -v
            exit 1
          }
          
          COMMIT_SHA=$(git rev-parse HEAD)
          echo ""
          echo "✅ Formula committed to main branch!"
          echo "   Repository: https://github.com/${{ parameters.HomebrewTapRepo }}"
          echo "   Commit: $COMMIT_SHA"
        fi
        echo ""
      displayName: 'Commit and push formula'
    
    - bash: |
        echo "=== Formula Update Summary ==="
        echo ""
        echo "✅ Homebrew Formula Updated!"
        echo ""
        echo "Repository: https://github.com/${{ parameters.HomebrewTapRepo }}"
        echo "Formula: ${{ parameters.FormulaName }}"
        echo "Version: $(AzureCliVersion)"
        echo ""
        echo "Users can now install with:"
        echo ""
        echo "  brew tap ${{ parameters.HomebrewTapRepo }}"
        echo "  brew install ${{ parameters.FormulaName }}"
        echo ""
      displayName: 'Update summary'

# ============================================================================
# STAGE 8: TEST HOMEBREW INSTALLATION
# ============================================================================
- stage: TestInstallation
  displayName: 'Stage 8: Test Homebrew Installation'
  dependsOn:
  - UpdateHomebrewFormula
  - DownloadUnsignedTarball
  condition: and(succeeded(), eq(${{ parameters.SkipHomebrew }}, false))
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadUnsignedTarball.DownloadAndExtract.outputs['DetectVersion.AzureCliVersion'] ]
  jobs:
  - job: TestHomebrew
    displayName: 'Test Homebrew installation'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - bash: |
        echo "======================================"
        echo "  Update Homebrew"
        echo "======================================"
        echo ""
        brew update
        
        echo ""
        echo "Homebrew version:"
        brew --version
        
        echo ""
        echo "System architecture:"
        uname -m
      displayName: 'Update Homebrew'
    
    - bash: |
        echo "======================================"
        echo "  Cleanup Existing Installations"
        echo "======================================"
        echo ""
        
        # Remove any existing Azure CLI installations
        echo "Checking for existing Azure CLI installations..."
        
        # Uninstall all azure-cli related Homebrew formulas
        brew list 2>/dev/null | grep -i azure | while read formula; do
          echo "Uninstalling Homebrew formula: $formula"
          brew uninstall --force --ignore-dependencies "$formula" 2>/dev/null || true
        done
        
        # Check for az command
        if command -v az &> /dev/null; then
          AZ_LOCATION=$(which az)
          echo ""
          echo "Found 'az' command at: $AZ_LOCATION"
          rm -f "$AZ_LOCATION" 2>/dev/null || echo "Could not remove $AZ_LOCATION"
        fi
        
        # Verify cleanup
        echo ""
        if command -v az &> /dev/null; then
          echo "⚠️  WARNING: 'az' command still exists at: $(which az)"
        else
          echo "✅ No 'az' command found - cleanup successful"
        fi
      displayName: 'Cleanup existing installations'
    
    - bash: |
        echo "======================================"
        echo "  Add Homebrew Tap"
        echo "======================================"
        echo ""
        
        TAP_NAME="${{ parameters.HomebrewTapRepo }}"
        echo "Tapping repository: $TAP_NAME"
        brew tap "$TAP_NAME"
        
        echo ""
        echo "Verifying tap:"
        # Homebrew strips 'homebrew-' prefix from tap names
        EXPECTED_TAP=$(echo "$TAP_NAME" | sed 's|/homebrew-|/|')
        echo "Looking for tap: $EXPECTED_TAP"
        
        brew tap | grep "$EXPECTED_TAP" || {
          echo "❌ ERROR: Tap not found"
          echo "Available taps:"
          brew tap
          exit 1
        }
        
        echo ""
        echo "✅ Tap added successfully"
      displayName: 'Add Homebrew tap'
    
    - bash: |
        echo "======================================"
        echo "  Install Azure CLI via Homebrew"
        echo "======================================"
        echo ""
        
        FORMULA_NAME="${{ parameters.FormulaName }}"
        echo "Installing formula: $FORMULA_NAME"
        
        brew install "$FORMULA_NAME" -v
        
        echo ""
        echo "✅ Installation complete"
      displayName: 'Install Azure CLI'
    
    - bash: |
        echo "======================================"
        echo "  Verify Installation"
        echo "======================================"
        echo ""
        
        FORMULA_NAME="${{ parameters.FormulaName }}"
        
        # Get Cellar path
        CELLAR_PATH=$(brew --cellar "$FORMULA_NAME")
        VERSION=$(brew info "$FORMULA_NAME" --json | python3 -c "import sys, json; print(json.load(sys.stdin)[0]['installed'][0]['version'])")
        
        echo "Formula: $FORMULA_NAME"
        echo "Version: $VERSION"
        echo "Cellar path: $CELLAR_PATH/$VERSION"
        echo ""
        
        # Check installation directory structure
        echo "Installation structure:"
        ls -la "$CELLAR_PATH/$VERSION/" || {
          echo "❌ ERROR: Installation directory not found"
          exit 1
        }
        
        echo ""
        echo "Binary location:"
        ls -la "$CELLAR_PATH/$VERSION/bin/az" || {
          echo "❌ ERROR: az binary not found"
          exit 1
        }
        
        echo ""
        echo "✅ Installation structure verified"
      displayName: 'Verify installation structure'
    
    - bash: |
        echo "======================================"
        echo "  Test Azure CLI Commands"
        echo "======================================"
        echo ""
        
        FORMULA_NAME="${{ parameters.FormulaName }}"
        EXPECTED_VERSION="$(AzureCliVersion)"
        
        # Get the Homebrew-installed az path explicitly
        BREW_PREFIX=$(brew --prefix)
        HOMEBREW_AZ="$BREW_PREFIX/bin/az"
        
        echo "Homebrew prefix: $BREW_PREFIX"
        echo "Expected az location: $HOMEBREW_AZ"
        echo ""
        
        # Verify the Homebrew az exists
        if [ ! -f "$HOMEBREW_AZ" ]; then
          echo "❌ ERROR: Homebrew az not found at $HOMEBREW_AZ"
          exit 1
        fi
        
        echo "✅ Found Homebrew az at: $HOMEBREW_AZ"
        ls -la "$HOMEBREW_AZ"
        
        echo ""
        echo "Expected version: $EXPECTED_VERSION"
        
        echo ""
        echo "Testing: $HOMEBREW_AZ --version"
        AZ_OUTPUT=$("$HOMEBREW_AZ" --version 2>&1)
        echo "$AZ_OUTPUT"
        
        # Verify version matches
        if ! echo "$AZ_OUTPUT" | grep -q "$EXPECTED_VERSION"; then
          echo ""
          echo "❌ ERROR: Version mismatch!"
          echo "   Expected: $EXPECTED_VERSION"
          exit 1
        fi
        
        echo ""
        echo "✅ Correct version verified: $EXPECTED_VERSION"
        
        echo ""
        echo "Testing: $HOMEBREW_AZ help"
        "$HOMEBREW_AZ" help > /dev/null || {
          echo "❌ ERROR: az help failed"
          exit 1
        }
        
        echo "✅ az help succeeded"
        
        echo ""
        echo "======================================"
        echo "  ✅ All CLI Command Tests Passed"
        echo "======================================"
      displayName: 'Test CLI commands'
    
    - bash: |
        echo "======================================"
        echo "  Verify Code Signatures"
        echo "======================================"
        echo ""
        
        FORMULA_NAME="${{ parameters.FormulaName }}"
        CELLAR_PATH=$(brew --cellar "$FORMULA_NAME")
        VERSION=$(brew info "$FORMULA_NAME" --json | python3 -c "import sys, json; print(json.load(sys.stdin)[0]['installed'][0]['version'])")
        
        echo "Checking code signatures..."
        echo ""
        
        # Find Python binary
        PYTHON_BIN=$(find "$CELLAR_PATH/$VERSION" -name "python*" -type f ! -name "*.so" | head -1)
        
        if [ -n "$PYTHON_BIN" ]; then
          echo "Python binary: $PYTHON_BIN"
          codesign -dv "$PYTHON_BIN" 2>&1 || echo "  Not signed or signature invalid"
          
          echo ""
          echo "Checking quarantine attributes..."
          xattr "$PYTHON_BIN" || echo "  No extended attributes"
        fi
        
        echo ""
        echo "✅ Signature verification complete"
      displayName: 'Verify code signatures'
    
    - bash: |
        echo "======================================"
        echo "  Cleanup"
        echo "======================================"
        echo ""
        
        FORMULA_NAME="${{ parameters.FormulaName }}"
        
        echo "Uninstalling $FORMULA_NAME..."
        brew uninstall "$FORMULA_NAME"
        
        echo ""
        echo "Removing tap..."
        brew untap "${{ parameters.HomebrewTapRepo }}"
        
        echo ""
        echo "✅ Cleanup complete"
      displayName: 'Cleanup test installation'

# ============================================================================
# STAGE 9: RELEASE SUMMARY
# ============================================================================
- stage: ReleaseSummary
  displayName: 'Stage 9: Release Summary'
  dependsOn:
  - DownloadUnsignedTarball
  - SignBinaries
  - CreateSignedTarball
  - PublishToGitHub
  - UpdateHomebrewFormula
  - TestInstallation
  condition: always()
  variables:
    AzureCliVersion: $[ stageDependencies.DownloadUnsignedTarball.DownloadAndExtract.outputs['DetectVersion.AzureCliVersion'] ]
  jobs:
  - job: PrintSummary
    displayName: 'Print release summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "=============================================="
        echo "  Azure CLI Signed Tarball Release Summary"
        echo "=============================================="
        echo ""
        echo "✅ RELEASE COMPLETE!"
        echo ""
        echo "Version: $(AzureCliVersion)"
        echo "Release Tag: v$(AzureCliVersion)-tarball-signed"
        echo ""
        echo "GitHub Release:"
        echo "  https://github.com/${{ parameters.GitHubRepo }}/releases/tag/v$(AzureCliVersion)-tarball-signed"
        echo ""
        echo "Homebrew Installation:"
        echo "  brew tap ${{ parameters.HomebrewTapRepo }}"
        echo "  brew install ${{ parameters.FormulaName }}"
        echo ""
        echo "Security Features:"
        echo "  ✅ All binaries code-signed with Developer ID Application"
        echo "  ⚠️  Not notarized (manual approval may be needed)"
        echo "  ✅ Works seamlessly via Homebrew"
        echo "  ✅ Safe for Homebrew distribution"
        echo ""
        echo "=============================================="
      displayName: 'Release summary'
