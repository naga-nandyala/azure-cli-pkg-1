trigger: none

pr: none

parameters:
  - name: AzureCliVersion
    displayName: 'Azure CLI Version'
    type: string
    default: '3.0.0'
  
  - name: BundleId
    displayName: 'Bundle Identifier'
    type: string
    default: 'com.microsoft.azure.cli'
  
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  
  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'
  
  - name: CaskName
    displayName: 'Homebrew Cask Name'
    type: string
    default: 'azure-cli-pr2'
  
  - name: ReleaseTag
    displayName: 'GitHub Release Tag'
    type: string
    default: 'v3.0.0-pr2'

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: github.com_naga-nandyala
    name: naga-nandyala/homebrew-mycli-app

variables:
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true
  
  - name: GITHUB_TOKEN
    value: $(GitHubPAT)

pool:
  vmImage: 'macOS-latest'

stages:

# ============================================================================
# STAGE 1: DOWNLOAD NOTARIZED PKG FROM GITHUB RELEASE
# ============================================================================
- stage: DownloadPkg
  displayName: '📦 Download Notarized PKG from GitHub'
  jobs:
  - job: Download
    displayName: 'Download from GitHub Release'
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "=== Downloading Notarized PKG from GitHub Release ==="
        echo "Repository: ${{ parameters.GitHubRepo }}"
        echo "Release Tag: ${{ parameters.ReleaseTag }}"
        echo "Architecture: arm64 (Apple Silicon)"
        echo ""
        
        # Construct download URL
        REPO="${{ parameters.GitHubRepo }}"
        TAG="${{ parameters.ReleaseTag }}"
        VERSION="${{ parameters.AzureCliVersion }}"
        PKG_NAME="azure-cli-${VERSION}-macos-arm64-notarized.pkg"
        
        # GitHub release asset URL
        RELEASE_URL="https://github.com/${REPO}/releases/download/${TAG}/${PKG_NAME}"
        
        echo "Download URL: $RELEASE_URL"
        echo ""
        
        # Create download directory
        mkdir -p "$(Pipeline.Workspace)/notarized-pkg"
        
        # Download the PKG with detailed output
        echo "Downloading..."
        OUTPUT_FILE="$(Pipeline.Workspace)/notarized-pkg/${PKG_NAME}"
        
        HTTP_CODE=$(curl -L -w "%{http_code}" -o "$OUTPUT_FILE" "$RELEASE_URL")
        
        echo ""
        echo "HTTP Response Code: $HTTP_CODE"
        
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ERROR: Download failed with HTTP $HTTP_CODE"
          echo ""
          echo "Possible issues:"
          echo "  - Release tag '$TAG' doesn't exist"
          echo "  - PKG file '$PKG_NAME' not found in release"
          echo "  - Repository '$REPO' is private or doesn't exist"
          echo ""
          echo "Please verify:"
          echo "  1. Release exists at: https://github.com/${REPO}/releases/tag/${TAG}"
          echo "  2. PKG is uploaded to the release"
          exit 1
        fi
        
        echo ""
        echo "=== Download Complete ==="
        ls -lh "$(Pipeline.Workspace)/notarized-pkg"/*.pkg
        
        PKG_FILE=$(find "$(Pipeline.Workspace)/notarized-pkg" -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: PKG file not found after download"
          exit 1
        fi
        
        # Verify file is not empty
        FILE_SIZE=$(stat -f%z "$PKG_FILE" 2>/dev/null || stat -c%s "$PKG_FILE" 2>/dev/null)
        if [ "$FILE_SIZE" -lt 1000 ]; then
          echo "❌ ERROR: Downloaded file is too small ($FILE_SIZE bytes)"
          echo "File contents:"
          cat "$PKG_FILE"
          exit 1
        fi
        
        echo ""
        echo "✅ PKG downloaded successfully"
        echo "File: $PKG_FILE"
        echo "Size: $(du -h "$PKG_FILE" | cut -f1) ($FILE_SIZE bytes)"
        
        # Verify it's actually a PKG file
        FILE_TYPE=$(file "$PKG_FILE")
        echo "File type: $FILE_TYPE"
        
        if ! echo "$FILE_TYPE" | grep -q "xar archive"; then
          echo "⚠️  WARNING: File may not be a valid PKG (expected 'xar archive')"
        fi
        
      displayName: 'Download notarized PKG from GitHub'
    
    - publish: '$(Pipeline.Workspace)/notarized-pkg'
      artifact: notarized-pkg
      displayName: 'Publish notarized PKG artifact'

# ============================================================================
# STAGE 2: UPDATE HOMEBREW CASK
# ============================================================================
- stage: UpdateHomebrew
  displayName: '🍺 Update Homebrew Cask'
  dependsOn: DownloadPkg
  jobs:
  - job: UpdateCask
    displayName: 'Update Cask formula'
    steps:
    - checkout: homebrewtap
      persistCredentials: true
      clean: true
    
    - bash: |
        set -e
        echo "=== Configuring Git ==="
        git config user.name "Azure Pipeline"
        git config user.email "azuredevops@microsoft.com"
        
        echo "Current branch: $(git branch --show-current)"
        echo "Latest commit: $(git log -1 --oneline)"
        
      displayName: 'Configure git'
    
    - bash: |
        set -e
        
        echo "=== Generating Homebrew Cask (matching complete-pr2) ==="
        
        VERSION="${{ parameters.AzureCliVersion }}"
        TAG_NAME="${{ parameters.ReleaseTag }}"
        CASK_NAME="${{ parameters.CaskName }}"
        PKG_NAME="azure-cli-${VERSION}-macos-arm64-notarized.pkg"
        PKG_URL="https://github.com/${{ parameters.GitHubRepo }}/releases/download/${TAG_NAME}/${PKG_NAME}"
        
        echo "Cask name: $CASK_NAME"
        echo "PKG URL: $PKG_URL"
        
        # Download PKG to calculate SHA256
        echo ""
        echo "Downloading PKG to calculate SHA256..."
        curl -L -o temp.pkg "$PKG_URL"
        SHA256=$(shasum -a 256 temp.pkg | cut -d' ' -f1)
        rm temp.pkg
        
        echo "SHA256: $SHA256"
        
        # Generate Cask file matching complete-pr2 structure
        CASK_FILE="Casks/${CASK_NAME}.rb"
        mkdir -p Casks
        
        cat > "$CASK_FILE" << CASK_EOF
        cask "${CASK_NAME}" do
          version "${VERSION}"
          sha256 "${SHA256}"
          
          url "${PKG_URL}"
          name "Azure CLI (PR2 - Versioned)"
          desc "Microsoft Azure Command-Line Interface with versioned installation support"
          homepage "https://docs.microsoft.com/cli/azure/"
        
          pkg "${PKG_NAME}"
        
          postflight do
            # Display installation summary
            version_dir = "/usr/local/microsoft/azure-cli/#{version}"
            current_link = "/usr/local/microsoft/azure-cli/current"
            
            if File.directory?(version_dir)
              ohai "Azure CLI #{version} installed successfully"
              puts "Installation directory: #{version_dir}"
              
              if File.symlink?(current_link)
                active_version = File.readlink(current_link)
                puts "Active version: #{active_version}"
                
                # Check if this is an upgrade
                if active_version != version.to_s
                  opoo "Previous version (#{active_version}) is still installed"
                  puts "To remove old versions, run:"
                  puts "  sudo /usr/local/microsoft/azure-cli/cleanup-old-versions.sh"
                end
              end
            else
              opoo "Installation directory not found: #{version_dir}"
            end
          end
        
          uninstall_preflight do
            current_link = "/usr/local/microsoft/azure-cli/current"
            
            if File.symlink?(current_link)
              current_version = File.readlink(current_link)
              ohai "Removing Azure CLI active version: #{current_version}"
              
              # Count total versions
              versions_dir = "/usr/local/microsoft/azure-cli"
              if Dir.exist?(versions_dir)
                version_dirs = Dir.glob("#{versions_dir}/[0-9]*").select { |f| File.directory?(f) }
                
                if version_dirs.length > 1
                  opoo "You have #{version_dirs.length} versions installed"
                  puts "Only the launcher and 'current' symlink will be removed."
                  puts "Version directories will remain for manual inspection."
                  puts ""
                  puts "To remove ALL versions and data, run:"
                  puts "  brew uninstall --zap --cask ${CASK_NAME}"
                end
              end
            else
              opoo "No active Azure CLI installation found"
            end
          end
        
          uninstall pkgutil: "${{ parameters.BundleId }}",
                    delete:  [
                      "/usr/local/bin/az",
                      "/usr/local/microsoft/azure-cli/current",
                      "/usr/local/microsoft/azure-cli/cleanup-old-versions.sh",
                    ]
        
          # Note: Version directories are NOT deleted to preserve user's ability to rollback
          # Users can manually remove them or use 'zap' for complete cleanup
          
          zap trash: "~/.azure",
              rmdir: "/usr/local/microsoft/azure-cli"
        
          caveats <<~EOS
            Azure CLI #{version} has been installed with versioned directory structure.
        
            Installation location:
              /usr/local/microsoft/azure-cli/#{version}/
        
            Active version symlink:
              /usr/local/microsoft/azure-cli/current -> #{version}
        
            Launcher script:
              /usr/local/bin/az
        
            Multiple versions can coexist side-by-side. When you upgrade, the previous
            version will be preserved automatically.
        
            To remove old versions:
              sudo /usr/local/microsoft/azure-cli/cleanup-old-versions.sh
        
            To manually switch versions (advanced):
              sudo ln -sf <version> /usr/local/microsoft/azure-cli/current
              Example: sudo ln -sf 2.80.0 /usr/local/microsoft/azure-cli/current
        
            To verify installation:
              az --version
              ls -la /usr/local/microsoft/azure-cli/
        
            For complete removal including all versions:
              brew uninstall --zap --cask ${CASK_NAME}
          EOS
        end
        CASK_EOF
        
        echo ""
        echo "✅ Cask generated (matches complete-pr2 structure):"
        cat "$CASK_FILE"
        
      displayName: 'Generate Cask file'
    
    - bash: |
        set -e
        
        echo "=== Committing Cask to Repository ==="
        
        CASK_NAME="${{ parameters.CaskName }}"
        VERSION="${{ parameters.AzureCliVersion }}"
        CASK_FILE="Casks/${CASK_NAME}.rb"
        
        # Ensure Casks directory exists
        mkdir -p Casks
        
        echo ""
        echo "=== Cask Content ==="
        cat "$CASK_FILE"
        
        echo ""
        echo "=== Git Status ==="
        git status
        
        # Add and commit
        git add "$CASK_FILE"
        
        if git diff --staged --quiet; then
          echo "ℹ️  No changes to commit (cask already up to date)"
        else
          git commit -m "Update ${CASK_NAME} to ${VERSION} (notarized) - Build $(Build.BuildId)"
          
          echo ""
          echo "=== Pushing to GitHub ==="
          git push origin HEAD:main
          
          echo ""
          echo "✅ Cask committed and pushed"
        fi
        
      displayName: 'Commit Cask to repository'

# ============================================================================
# STAGE 3: DIAGNOSE PKG CONTENTS
# ============================================================================
- stage: DiagnosePkg
  displayName: '🔍 Diagnose PKG Contents'
  dependsOn: DownloadPkg
  jobs:
  - job: InspectPkg
    displayName: 'Inspect PKG structure and scripts'
    steps:
    - checkout: none
    
    - download: current
      artifact: notarized-pkg
      displayName: 'Download notarized PKG'
    
    - bash: |
        set -e
        
        echo "================================================"
        echo "=== PKG STRUCTURE DIAGNOSIS ==="
        echo "================================================"
        echo ""
        
        PKG_FILE=$(find "$(Pipeline.Workspace)/notarized-pkg" -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: PKG file not found"
          exit 1
        fi
        
        echo "PKG File: $PKG_FILE"
        echo ""
        
        # Extract PKG to inspect contents
        TEMP_DIR=$(mktemp -d)
        echo "Extracting PKG to: $TEMP_DIR"
        
        cd "$TEMP_DIR"
        pkgutil --expand "$PKG_FILE" expanded
        
        echo ""
        echo "=== PKG Structure ==="
        find expanded/ -print | head -100
        
        echo ""
        echo "=== Package Info ==="
        if [ -f expanded/PackageInfo ]; then
          cat expanded/PackageInfo
        fi
        
        echo ""
        echo "=== Distribution XML ==="
        if [ -f expanded/Distribution ]; then
          cat expanded/Distribution
        fi
        
        echo ""
        echo "=== Scripts Directory ==="
        if [ -d expanded/Scripts ]; then
          echo "Scripts found:"
          ls -la expanded/Scripts/
          echo ""
          
          for script in expanded/Scripts/*; do
            if [ -f "$script" ]; then
              echo "--- Content of $(basename $script) ---"
              cat "$script"
              echo ""
            fi
          done
        else
          echo "No Scripts directory found"
        fi
        
        echo ""
        echo "=== Component Packages ==="
        for component in expanded/*.pkg; do
          if [ -d "$component" ]; then
            echo "Component: $(basename $component)"
            
            if [ -f "$component/PackageInfo" ]; then
              echo "  PackageInfo:"
              cat "$component/PackageInfo" | head -20
            fi
            
            if [ -d "$component/Scripts" ]; then
              echo "  Scripts:"
              ls -la "$component/Scripts/"
              
              for script in "$component/Scripts"/*; do
                if [ -f "$script" ]; then
                  echo "    --- $(basename $script) ---"
                  cat "$script" | head -100
                  echo ""
                fi
              done
            fi
            echo ""
          fi
        done
        
        echo ""
        echo "=== Attempting Manual Script Execution Test ==="
        # Try to run scripts manually to see detailed errors
        if [ -d expanded/Scripts ]; then
          for script in expanded/Scripts/preinstall expanded/Scripts/postinstall; do
            if [ -f "$script" ]; then
              echo "Testing: $(basename $script)"
              bash -x "$script" || echo "Script failed with exit code: $?"
              echo ""
            fi
          done
        fi
        
        # Cleanup
        cd -
        rm -rf "$TEMP_DIR"
        
      displayName: 'Diagnose PKG structure and scripts'

# ============================================================================
# STAGE 4: TEST HOMEBREW CASK INSTALLATION
# ============================================================================
- stage: TestHomebrewInstall
  displayName: '🍺 Test Homebrew Cask Installation'
  dependsOn: UpdateHomebrew
  jobs:
  - job: HomebrewInstall
    displayName: 'Install via Homebrew Cask'
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "================================================"
        echo "=== Testing Fresh Installation ==="
        echo "================================================"
        echo ""
        
        # Clean any existing installation
        echo "Cleaning previous installations..."
        brew uninstall --cask ${{ parameters.CaskName }} 2>/dev/null || true
        brew untap ${{ parameters.HomebrewTapRepo }} 2>/dev/null || true
        
        sudo rm -rf /usr/local/bin/az 2>/dev/null || true
        sudo rm -rf /usr/local/microsoft/azure-cli 2>/dev/null || true
        
        echo "✅ Clean slate ready"
        echo ""
        
        # Add tap
        echo "Adding Homebrew tap..."
        brew tap ${{ parameters.HomebrewTapRepo }}
        echo ""
        
        # Install cask
        echo "Installing ${{ parameters.CaskName }}..."
        brew install --cask ${{ parameters.CaskName }}
        
        # Wait for installation to complete
        sleep 5
        
        echo ""
        echo "=== Verification ==="
        
        # Check az command
        if command -v az &> /dev/null; then
          echo "✅ 'az' command available"
          az --version | head -5
        else
          echo "❌ 'az' command not found"
          exit 1
        fi
        
        echo ""
        
        # Check version directory
        VERSION="${{ parameters.AzureCliVersion }}"
        VERSION_DIR="/usr/local/microsoft/azure-cli/$VERSION"
        
        if [ -d "$VERSION_DIR" ]; then
          echo ""
          echo "✅ Version directory exists: $VERSION_DIR"
        else
          echo ""
          echo "❌ Version directory not found: $VERSION_DIR"
          exit 1
        fi
        
        # Check symlink
        CURRENT_LINK="/usr/local/microsoft/azure-cli/current"
        if [ -L "$CURRENT_LINK" ]; then
          CURRENT_TARGET=$(readlink "$CURRENT_LINK")
          echo ""
          echo "✅ 'current' symlink exists: $CURRENT_LINK -> $CURRENT_TARGET"
          
          if [ "$CURRENT_TARGET" = "$VERSION" ]; then
            echo "✅ Symlink points to correct version"
          else
            echo "❌ Symlink points to wrong version. Expected: $VERSION, Got: $CURRENT_TARGET"
            exit 1
          fi
        else
          echo ""
          echo "❌ 'current' symlink missing: $CURRENT_LINK"
          exit 1
        fi
        
        # Check Python
        PYTHON_BIN="$VERSION_DIR/bin/python3"
        if [ -x "$PYTHON_BIN" ]; then
          echo ""
          echo "✅ Python executable exists and is executable: $PYTHON_BIN"
        else
          echo ""
          echo "❌ Python executable missing or not executable: $PYTHON_BIN"
          ls -l "$PYTHON_BIN" 2>&1 || echo "File not found"
          exit 1
        fi
        
        echo ""
        echo "=== All Tests Passed! ==="
        
      displayName: 'Test fresh installation'

# ============================================================================
# STAGE 5: SUMMARY
# ============================================================================
- stage: Summary
  displayName: '📊 Test Summary'
  dependsOn:
  - DownloadPkg
  - DiagnosePkg
  - UpdateHomebrew
  - TestHomebrewInstall
  condition: always()
  jobs:
  - job: PrintSummary
    displayName: 'Print test summary'
    steps:
    - checkout: none
    
    - bash: |
        echo "================================================"
        echo "NOTARIZED PACKAGE TEST SUMMARY"
        echo "================================================"
        echo ""
        echo "Package:      azure-cli-${{ parameters.AzureCliVersion }}-macos-arm64-notarized.pkg"
        echo "Release:      ${{ parameters.ReleaseTag }}"
        echo "Repository:   ${{ parameters.GitHubRepo }}"
        echo "Cask:         ${{ parameters.CaskName }}"
        echo ""
        echo "Test Stages:"
        echo "  1. Download PKG:          Completed"
        echo "  2. Diagnose PKG:          Completed (check for script errors)"
        echo "  3. Update Homebrew Cask:  Completed"
        echo "  4. Homebrew Install Test: Check results"
        echo ""
        echo "Purpose: Diagnose why notarized PKG install scripts fail"
        echo ""
        echo "================================================"
        
      displayName: 'Print summary'
