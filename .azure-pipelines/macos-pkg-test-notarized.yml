trigger: none

pr: none

parameters:
  - name: AzureCliVersion
    displayName: 'Azure CLI Version'
    type: string
    default: '3.0.0'
  
  - name: BundleId
    displayName: 'Bundle Identifier'
    type: string
    default: 'com.microsoft.azure.cli'
  
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  
  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'
  
  - name: CaskName
    displayName: 'Homebrew Cask Name'
    type: string
    default: 'azure-cli-pr2'
  
  - name: ReleaseTag
    displayName: 'GitHub Release Tag'
    type: string
    default: 'v3.0.0-pr2'

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: github.com_naga-nandyala
    name: naga-nandyala/homebrew-mycli-app

variables:
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true
  
  - name: GITHUB_TOKEN
    value: $(GitHubPAT)

pool:
  vmImage: 'macOS-latest'

stages:

# ============================================================================
# STAGE 1: DOWNLOAD NOTARIZED PKG FROM GITHUB RELEASE
# ============================================================================
- stage: DownloadPkg
  displayName: '📦 Download Notarized PKG from GitHub'
  jobs:
  - job: Download
    displayName: 'Download from GitHub Release'
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "=== Downloading Notarized PKG from GitHub Release ==="
        echo "Repository: ${{ parameters.GitHubRepo }}"
        echo "Release Tag: ${{ parameters.ReleaseTag }}"
        echo "Architecture: arm64 (Apple Silicon)"
        echo ""
        
        # Construct download URL
        REPO="${{ parameters.GitHubRepo }}"
        TAG="${{ parameters.ReleaseTag }}"
        VERSION="${{ parameters.AzureCliVersion }}"
        PKG_NAME="azure-cli-${VERSION}-macos-arm64-notarized.pkg"
        
        # GitHub release asset URL
        RELEASE_URL="https://github.com/${REPO}/releases/download/${TAG}/${PKG_NAME}"
        
        echo "Download URL: $RELEASE_URL"
        echo ""
        
        # Create download directory
        mkdir -p "$(Pipeline.Workspace)/notarized-pkg"
        
        # Download the PKG with detailed output
        echo "Downloading..."
        OUTPUT_FILE="$(Pipeline.Workspace)/notarized-pkg/${PKG_NAME}"
        
        HTTP_CODE=$(curl -L -w "%{http_code}" -o "$OUTPUT_FILE" "$RELEASE_URL")
        
        echo ""
        echo "HTTP Response Code: $HTTP_CODE"
        
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ERROR: Download failed with HTTP $HTTP_CODE"
          echo ""
          echo "Possible issues:"
          echo "  - Release tag '$TAG' doesn't exist"
          echo "  - PKG file '$PKG_NAME' not found in release"
          echo "  - Repository '$REPO' is private or doesn't exist"
          echo ""
          echo "Please verify:"
          echo "  1. Release exists at: https://github.com/${REPO}/releases/tag/${TAG}"
          echo "  2. PKG is uploaded to the release"
          exit 1
        fi
        
        echo ""
        echo "=== Download Complete ==="
        ls -lh "$(Pipeline.Workspace)/notarized-pkg"/*.pkg
        
        PKG_FILE=$(find "$(Pipeline.Workspace)/notarized-pkg" -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: PKG file not found after download"
          exit 1
        fi
        
        # Verify file is not empty
        FILE_SIZE=$(stat -f%z "$PKG_FILE" 2>/dev/null || stat -c%s "$PKG_FILE" 2>/dev/null)
        if [ "$FILE_SIZE" -lt 1000 ]; then
          echo "❌ ERROR: Downloaded file is too small ($FILE_SIZE bytes)"
          echo "File contents:"
          cat "$PKG_FILE"
          exit 1
        fi
        
        echo ""
        echo "✅ PKG downloaded successfully"
        echo "File: $PKG_FILE"
        echo "Size: $(du -h "$PKG_FILE" | cut -f1) ($FILE_SIZE bytes)"
        
        # Verify it's actually a PKG file
        FILE_TYPE=$(file "$PKG_FILE")
        echo "File type: $FILE_TYPE"
        
        if ! echo "$FILE_TYPE" | grep -q "xar archive"; then
          echo "⚠️  WARNING: File may not be a valid PKG (expected 'xar archive')"
        fi
        
      displayName: 'Download notarized PKG from GitHub'
    
    - publish: '$(Pipeline.Workspace)/notarized-pkg'
      artifact: notarized-pkg
      displayName: 'Publish notarized PKG artifact'

# ============================================================================
# STAGE 2: UPDATE HOMEBREW CASK
# ============================================================================
- stage: UpdateHomebrew
  displayName: '🍺 Update Homebrew Cask'
  dependsOn: DownloadPkg
  jobs:
  - job: UpdateCask
    displayName: 'Update Cask formula'
    steps:
    - checkout: homebrewtap
      persistCredentials: true
      clean: true
    
    - bash: |
        set -e
        echo "=== Configuring Git ==="
        git config user.name "Azure Pipeline"
        git config user.email "azuredevops@microsoft.com"
        
        echo "Current branch: $(git branch --show-current)"
        echo "Latest commit: $(git log -1 --oneline)"
        
      displayName: 'Configure git'
    
    - bash: |
        set -e
        
        echo "=== Generating Homebrew Cask (matching complete-pr2) ==="
        
        VERSION="${{ parameters.AzureCliVersion }}"
        TAG_NAME="${{ parameters.ReleaseTag }}"
        CASK_NAME="${{ parameters.CaskName }}"
        PKG_NAME="azure-cli-${VERSION}-macos-arm64-notarized.pkg"
        PKG_URL="https://github.com/${{ parameters.GitHubRepo }}/releases/download/${TAG_NAME}/${PKG_NAME}"
        
        echo "Cask name: $CASK_NAME"
        echo "PKG URL: $PKG_URL"
        
        # Download PKG to calculate SHA256
        echo ""
        echo "Downloading PKG to calculate SHA256..."
        curl -L -o temp.pkg "$PKG_URL"
        SHA256=$(shasum -a 256 temp.pkg | cut -d' ' -f1)
        rm temp.pkg
        
        echo "SHA256: $SHA256"
        
        # Generate Cask file matching complete-pr2 structure
        CASK_FILE="Casks/${CASK_NAME}.rb"
        mkdir -p Casks
        
        cat > "$CASK_FILE" << CASK_EOF
        cask "${CASK_NAME}" do
          version "${VERSION}"
          sha256 "${SHA256}"
          
          url "${PKG_URL}"
          name "Azure CLI (PR2 - Versioned)"
          desc "Microsoft Azure Command-Line Interface with versioned installation support"
          homepage "https://docs.microsoft.com/cli/azure/"
        
          pkg "${PKG_NAME}"
        
          postflight do
            # Ensure 'current' symlink exists and points to this version
            version_dir = "/usr/local/microsoft/azure-cli/#{version}"
            current_link = "/usr/local/microsoft/azure-cli/current"
            
            # Ensure installation directory exists
            unless File.directory?(version_dir)
              opoo "Installation directory not found: #{version_dir}"
              next
            end
            
            # Remove existing symlink or file (if any)
            if File.symlink?(current_link) || File.exist?(current_link)
              system_command "/bin/rm", args: ["-f", current_link], sudo: true
            end
            
            # Create new symlink pointing to this version (full path)
            system_command "/bin/ln", args: ["-sf", version_dir, current_link], sudo: true
            ohai "Created symlink: #{current_link} -> #{version_dir}"
            
            # Inform user
            ohai "Azure CLI #{version} installed successfully"
            puts "Installation directory: #{version_dir}"
            puts "Active version symlink: #{current_link} -> #{version_dir}"
            
            # Check for older versions
            versions_dir = "/usr/local/microsoft/azure-cli"
            version_dirs = Dir.glob("#{versions_dir}/[0-9]*").select { |f| File.directory?(f) }
            if version_dirs.length > 1
              opoo "You have #{version_dirs.length} Azure CLI versions installed."
              puts "Previous versions are preserved automatically."
              puts "To remove old versions, run:"
              puts "  sudo /usr/local/microsoft/azure-cli/cleanup-old-versions.sh"
            end
          end
        
          uninstall_preflight do
            current_link = "/usr/local/microsoft/azure-cli/current"
            
            if File.symlink?(current_link)
              current_version = File.readlink(current_link)
              ohai "Removing Azure CLI active version: #{current_version}"
              
              # Count total versions
              versions_dir = "/usr/local/microsoft/azure-cli"
              if Dir.exist?(versions_dir)
                version_dirs = Dir.glob("#{versions_dir}/[0-9]*").select { |f| File.directory?(f) }
                
                if version_dirs.length > 1
                  opoo "You have #{version_dirs.length} versions installed"
                  puts "Only the launcher and 'current' symlink will be removed."
                  puts "Version directories will remain for manual inspection."
                  puts ""
                  puts "To remove ALL versions and data, run:"
                  puts "  brew uninstall --zap --cask ${CASK_NAME}"
                end
              end
            else
              opoo "No active Azure CLI installation found"
            end
          end
        
          uninstall pkgutil: "${{ parameters.BundleId }}",
                    delete:  [
                      "/usr/local/bin/az",
                      "/usr/local/microsoft/azure-cli/current",
                      "/usr/local/microsoft/azure-cli/cleanup-old-versions.sh",
                    ]
        
          # Note: Version directories are NOT deleted to preserve user's ability to rollback
          # Users can manually remove them or use 'zap' for complete cleanup
          
          zap trash: "~/.azure",
              rmdir: "/usr/local/microsoft/azure-cli"
        
          caveats <<~EOS
            Azure CLI #{version} has been installed with versioned directory structure.
        
            Installation location:
              /usr/local/microsoft/azure-cli/#{version}/
        
            Active version symlink:
              /usr/local/microsoft/azure-cli/current -> /usr/local/microsoft/azure-cli/#{version}
        
            Launcher script:
              /usr/local/bin/az
        
            Multiple versions can coexist side-by-side. When you upgrade, the previous
            version will be preserved automatically.
        
            To remove old versions:
              sudo /usr/local/microsoft/azure-cli/cleanup-old-versions.sh
        
            To manually switch versions (advanced):
              sudo ln -sf /usr/local/microsoft/azure-cli/<version> /usr/local/microsoft/azure-cli/current
              Example: sudo ln -sf /usr/local/microsoft/azure-cli/2.80.0 /usr/local/microsoft/azure-cli/current
        
            To verify installation:
              az --version
              ls -la /usr/local/microsoft/azure-cli/
        
            For complete removal including all versions:
              brew uninstall --zap --cask ${CASK_NAME}
          EOS
        end
        CASK_EOF
        
        echo ""
        echo "✅ Cask generated (matches complete-pr2 structure):"
        cat "$CASK_FILE"
        
      displayName: 'Generate Cask file'
    
    - bash: |
        set -e
        
        echo "=== Committing Cask to Repository ==="
        
        CASK_NAME="${{ parameters.CaskName }}"
        VERSION="${{ parameters.AzureCliVersion }}"
        CASK_FILE="Casks/${CASK_NAME}.rb"
        
        # Ensure Casks directory exists
        mkdir -p Casks
        
        echo ""
        echo "=== Cask Content ==="
        cat "$CASK_FILE"
        
        echo ""
        echo "=== Git Status ==="
        git status
        
        # Add and commit
        git add "$CASK_FILE"
        
        if git diff --staged --quiet; then
          echo "ℹ️  No changes to commit (cask already up to date)"
        else
          git commit -m "Update ${CASK_NAME} to ${VERSION} (notarized) - Build $(Build.BuildId)"
          
          echo ""
          echo "=== Pushing to GitHub ==="
          git push origin HEAD:main
          
          echo ""
          echo "✅ Cask committed and pushed"
        fi
        
      displayName: 'Commit Cask to repository'

# ============================================================================
# STAGE 3: DIAGNOSE PKG CONTENTS
# ============================================================================
- stage: DiagnosePkg
  displayName: '🔍 Diagnose PKG Contents'
  dependsOn: DownloadPkg
  jobs:
  - job: InspectPkg
    displayName: 'Inspect PKG structure and scripts'
    steps:
    - checkout: none
    
    - download: current
      artifact: notarized-pkg
      displayName: 'Download notarized PKG'
    
    - bash: |
        set -e
        
        echo "================================================"
        echo "=== PKG STRUCTURE DIAGNOSIS ==="
        echo "================================================"
        echo ""
        
        PKG_FILE=$(find "$(Pipeline.Workspace)/notarized-pkg" -name "*.pkg" -type f | head -1)
        
        if [ -z "$PKG_FILE" ]; then
          echo "❌ ERROR: PKG file not found"
          exit 1
        fi
        
        echo "PKG File: $PKG_FILE"
        echo ""
        
        # Extract PKG to inspect contents
        TEMP_DIR=$(mktemp -d)
        echo "Extracting PKG to: $TEMP_DIR"
        
        cd "$TEMP_DIR"
        pkgutil --expand "$PKG_FILE" expanded
        
        echo ""
        echo "=== PKG Structure ==="
        find expanded/ -print | head -100
        
        echo ""
        echo "=== Package Info ==="
        if [ -f expanded/PackageInfo ]; then
          cat expanded/PackageInfo
        fi
        
        echo ""
        echo "=== Distribution XML ==="
        if [ -f expanded/Distribution ]; then
          cat expanded/Distribution
        fi
        
        echo ""
        echo "=== Scripts Directory ==="
        if [ -d expanded/Scripts ]; then
          echo "Scripts found:"
          ls -la expanded/Scripts/
          echo ""
          
          for script in expanded/Scripts/*; do
            if [ -f "$script" ]; then
              echo "--- Content of $(basename $script) ---"
              cat "$script"
              echo ""
            fi
          done
        else
          echo "No Scripts directory found"
        fi
        
        echo ""
        echo "=== Component Packages ==="
        for component in expanded/*.pkg; do
          if [ -d "$component" ]; then
            echo "Component: $(basename $component)"
            
            if [ -f "$component/PackageInfo" ]; then
              echo "  PackageInfo:"
              cat "$component/PackageInfo" | head -20
            fi
            
            if [ -d "$component/Scripts" ]; then
              echo "  Scripts:"
              ls -la "$component/Scripts/"
              
              for script in "$component/Scripts"/*; do
                if [ -f "$script" ]; then
                  echo "    --- $(basename $script) ---"
                  cat "$script" | head -100
                  echo ""
                fi
              done
            fi
            echo ""
          fi
        done
        
        echo ""
        echo "=== Attempting Manual Script Execution Test ==="
        # Try to run scripts manually to see detailed errors
        if [ -d expanded/Scripts ]; then
          for script in expanded/Scripts/preinstall expanded/Scripts/postinstall; do
            if [ -f "$script" ]; then
              echo "Testing: $(basename $script)"
              bash -x "$script" || echo "Script failed with exit code: $?"
              echo ""
            fi
          done
        fi
        
        # Cleanup
        cd -
        rm -rf "$TEMP_DIR"
        
      displayName: 'Diagnose PKG structure and scripts'

# ============================================================================
# STAGE 4: TEST HOMEBREW CASK INSTALLATION
# ============================================================================
- stage: TestHomebrewInstall
  displayName: '🍺 Test Homebrew Cask Installation'
  dependsOn: UpdateHomebrew
  jobs:
  - job: HomebrewInstall
    displayName: 'Install via Homebrew Cask'
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "================================================"
        echo "=== Testing Fresh Installation ==="
        echo "================================================"
        echo ""
        
        # Clean any existing installation
        echo "Cleaning previous installations..."
        brew uninstall --cask ${{ parameters.CaskName }} 2>/dev/null || true
        brew untap ${{ parameters.HomebrewTapRepo }} 2>/dev/null || true
        
        sudo rm -rf /usr/local/bin/az 2>/dev/null || true
        sudo rm -rf /usr/local/microsoft/azure-cli 2>/dev/null || true
        
        echo "✅ Clean slate ready"
        echo ""
        
        # Add tap
        echo "Adding Homebrew tap..."
        brew tap ${{ parameters.HomebrewTapRepo }}
        echo ""
        
        # Install cask
        echo "Installing ${{ parameters.CaskName }}..."
        brew install --cask ${{ parameters.CaskName }}
        
        # Wait for installation to complete
        sleep 5
        
        echo ""
        echo "=== Verification ==="
        
        # Check az command
        if command -v az &> /dev/null; then
          echo "✅ 'az' command available"
          az --version | head -5
        else
          echo "❌ 'az' command not found"
          exit 1
        fi
        
        echo ""
        
        # Check version directory
        VERSION="${{ parameters.AzureCliVersion }}"
        VERSION_DIR="/usr/local/microsoft/azure-cli/$VERSION"
        
        if [ -d "$VERSION_DIR" ]; then
          echo ""
          echo "✅ Version directory exists: $VERSION_DIR"
        else
          echo ""
          echo "❌ Version directory not found: $VERSION_DIR"
          exit 1
        fi
        
        # Check symlink
        CURRENT_LINK="/usr/local/microsoft/azure-cli/current"
        if [ -L "$CURRENT_LINK" ]; then
          CURRENT_TARGET=$(readlink "$CURRENT_LINK")
          echo ""
          echo "✅ 'current' symlink exists: $CURRENT_LINK -> $CURRENT_TARGET"
          
          # Handle both absolute and relative symlink targets
          # Absolute: /usr/local/microsoft/azure-cli/3.0.0
          # Relative: 3.0.0
          SYMLINK_VERSION=$(basename "$CURRENT_TARGET")
          
          if [ "$SYMLINK_VERSION" = "$VERSION" ]; then
            echo "✅ Symlink points to correct version: $SYMLINK_VERSION"
          else
            echo "❌ Symlink points to wrong version. Expected: $VERSION, Got: $SYMLINK_VERSION"
            exit 1
          fi
        else
          echo ""
          echo "❌ 'current' symlink missing: $CURRENT_LINK"
          exit 1
        fi
        
        # Check Python
        PYTHON_BIN="$VERSION_DIR/bin/python3"
        if [ -x "$PYTHON_BIN" ]; then
          echo ""
          echo "✅ Python executable exists and is executable: $PYTHON_BIN"
        else
          echo ""
          echo "❌ Python executable missing or not executable: $PYTHON_BIN"
          ls -l "$PYTHON_BIN" 2>&1 || echo "File not found"
          exit 1
        fi
        
        # Test actual CLI functionality
        echo ""
        echo "=== CLI Functionality Test ==="
        if az version >/dev/null 2>&1; then
          echo "✅ 'az version' command works"
        else
          echo "❌ 'az version' command failed"
          exit 1
        fi
        
        # Test az --help (capture both stdout and stderr, ignore warnings)
        if az --help 2>&1 | grep -qi "azure\|command"; then
          echo "✅ 'az --help' command works"
        else
          echo "❌ 'az --help' command failed"
          echo "Output:"
          az --help 2>&1 || true
          exit 1
        fi
        
        echo ""
        echo "=== All Tests Passed! ==="
        
      displayName: 'Test fresh installation'
  
  - job: TestUpgrade
    displayName: 'Test upgrade with version preservation'
    dependsOn: HomebrewInstall
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "================================================"
        echo "UPGRADE TEST (Version Preservation)"
        echo "================================================"
        echo ""
        
        # This test simulates upgrade by:
        # 1. Creating a fake old version directory
        # 2. Upgrading to current version
        # 3. Verifying both versions coexist
        
        echo "Setting up mock previous installation..."
        
        INSTALL_ROOT="/usr/local/microsoft/azure-cli"
        OLD_VERSION="2.79.0"
        NEW_VERSION="${{ parameters.AzureCliVersion }}"
        
        # Create mock old version with absolute path symlink (matching postflight behavior)
        sudo mkdir -p "$INSTALL_ROOT/$OLD_VERSION/bin"
        echo "Mock version $OLD_VERSION" | sudo tee "$INSTALL_ROOT/$OLD_VERSION/bin/mock.txt"
        sudo ln -sf "$INSTALL_ROOT/$OLD_VERSION" "$INSTALL_ROOT/current"
        
        echo "Mock old version created: $OLD_VERSION"
        echo ""
        
        # Install current version (simulates upgrade)
        echo "Installing current version (simulating upgrade)..."
        brew tap ${{ parameters.HomebrewTapRepo }} 2>/dev/null || true
        brew install --cask ${{ parameters.CaskName }}
        
        echo ""
        echo "=== Checking Version Preservation ==="
        
        # Both versions should exist
        if [ ! -d "$INSTALL_ROOT/$OLD_VERSION" ]; then
          echo "❌ Old version directory removed (should be preserved)"
          exit 1
        fi
        echo "✅ Old version preserved: $OLD_VERSION"
        
        if [ ! -d "$INSTALL_ROOT/$NEW_VERSION" ]; then
          echo "❌ New version directory not found"
          exit 1
        fi
        echo "✅ New version installed: $NEW_VERSION"
        
        # Current should point to new version (could be absolute or relative)
        CURRENT_TARGET=$(readlink "$INSTALL_ROOT/current")
        CURRENT_VERSION=$(basename "$CURRENT_TARGET")
        
        if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
          echo "❌ Current symlink not updated (points to $CURRENT_VERSION)"
          exit 1
        fi
        echo "✅ Current symlink updated to: $NEW_VERSION"
        
        # List all versions
        echo ""
        echo "All installed versions:"
        ls -la "$INSTALL_ROOT/"
        
        # Verify az command still works with new version
        echo ""
        echo "=== CLI Functionality After Upgrade ==="
        
        INSTALLED_VERSION=$(az --version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "CLI reports version: $INSTALLED_VERSION"
        
        if [ "$INSTALLED_VERSION" != "$NEW_VERSION" ]; then
          echo "⚠️  Version mismatch (CLI reports $INSTALLED_VERSION, directory is $NEW_VERSION)"
          echo "ℹ️  This is expected when testing with unsigned build - directory name != actual CLI version"
        else
          echo "✅ CLI version matches directory: $NEW_VERSION"
        fi
        
        # Most important: verify CLI actually works
        if az --help 2>&1 | grep -qi "azure\|command"; then
          echo "✅ CLI is functional after upgrade"
        else
          echo "❌ CLI not functional"
          exit 1
        fi
        
        # Test that old version is still accessible via direct symlink change
        echo ""
        echo "=== Testing Manual Version Switch ==="
        
        # Switch to old version (using absolute path)
        echo "Switching symlink to: $INSTALL_ROOT/$OLD_VERSION"
        sudo rm -f "$INSTALL_ROOT/current"
        sudo ln -s "$INSTALL_ROOT/$OLD_VERSION" "$INSTALL_ROOT/current"
        
        CURRENT_TARGET=$(readlink "$INSTALL_ROOT/current")
        CURRENT_VERSION=$(basename "$CURRENT_TARGET")
        echo "Debug: OLD_VERSION='$OLD_VERSION'"
        echo "Debug: CURRENT_TARGET='$CURRENT_TARGET'"
        echo "Debug: CURRENT_VERSION='$CURRENT_VERSION'"
        
        if [ "$CURRENT_VERSION" != "$OLD_VERSION" ]; then
          echo "❌ Failed to switch to old version (expected: $OLD_VERSION, got: $CURRENT_VERSION)"
          exit 1
        fi
        echo "✅ Switched to old version: $OLD_VERSION"
        
        # Switch back to new version
        echo "Switching symlink back to: $INSTALL_ROOT/$NEW_VERSION"
        sudo rm -f "$INSTALL_ROOT/current"
        sudo ln -s "$INSTALL_ROOT/$NEW_VERSION" "$INSTALL_ROOT/current"
        
        CURRENT_TARGET=$(readlink "$INSTALL_ROOT/current")
        CURRENT_VERSION=$(basename "$CURRENT_TARGET")
        if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
          echo "❌ Failed to switch back to new version"
          exit 1
        fi
        echo "✅ Switched back to new version: $NEW_VERSION"
        
        echo ""
        echo "✅ Upgrade test PASSED - versions preserved correctly"
        
      displayName: 'Test upgrade scenario'
  
  - job: TestPermissions
    displayName: 'Test permissions and structure'
    dependsOn: TestUpgrade
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "================================================"
        echo "PERMISSIONS AND STRUCTURE TEST"
        echo "================================================"
        echo ""
        
        INSTALL_ROOT="/usr/local/microsoft/azure-cli"
        VERSION_DIR="$INSTALL_ROOT/${{ parameters.AzureCliVersion }}"
        
        echo "=== File Permissions Verification ==="
        
        # Check launcher permissions
        if [ -x "/usr/local/bin/az" ]; then
          echo "✅ Launcher is executable: /usr/local/bin/az"
          ls -l /usr/local/bin/az
        else
          echo "❌ Launcher not executable"
          exit 1
        fi
        
        # Check Python executable permissions
        echo ""
        echo "Python executables:"
        PYTHON_EXES=$(find "$VERSION_DIR/bin" -type f -name "python*" ! -name "*.py" ! -name "*.pyc" 2>/dev/null || true)
        
        if [ -z "$PYTHON_EXES" ]; then
          echo "❌ No Python executables found in $VERSION_DIR/bin"
          exit 1
        fi
        
        for pyexe in $PYTHON_EXES; do
          if [ -x "$pyexe" ]; then
            echo "✅ $pyexe (executable)"
          else
            echo "❌ $pyexe (not executable)"
            exit 1
          fi
        done
        
        # Check shared libraries exist
        echo ""
        echo "Shared libraries check:"
        DYLIB_COUNT=$(find "$VERSION_DIR" -name "*.dylib" 2>/dev/null | wc -l)
        SO_COUNT=$(find "$VERSION_DIR" -name "*.so" 2>/dev/null | wc -l)
        
        echo "Found $DYLIB_COUNT .dylib files"
        echo "Found $SO_COUNT .so files"
        
        if [ "$DYLIB_COUNT" -eq 0 ] && [ "$SO_COUNT" -eq 0 ]; then
          echo "⚠️  Warning: No shared libraries found"
        else
          echo "✅ Shared libraries present"
        fi
        
        # Check directory structure
        echo ""
        echo "=== Directory Structure Verification ==="
        
        EXPECTED_DIRS=(
          "$VERSION_DIR/bin"
          "$VERSION_DIR/lib"
        )
        
        for dir in "${EXPECTED_DIRS[@]}"; do
          if [ -d "$dir" ]; then
            echo "✅ $dir exists"
          else
            echo "⚠️  $dir not found (may be optional)"
          fi
        done
        
        echo ""
        echo "✅ Permissions and structure test PASSED"
        
      displayName: 'Test permissions and structure'
  
  - job: TestCleanup
    displayName: 'Test cleanup utility'
    dependsOn: TestPermissions
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "================================================"
        echo "CLEANUP UTILITY TEST"
        echo "================================================"
        echo ""
        
        INSTALL_ROOT="/usr/local/microsoft/azure-cli"
        CLEANUP_SCRIPT="$INSTALL_ROOT/cleanup-old-versions.sh"
        
        if [ ! -f "$CLEANUP_SCRIPT" ]; then
          echo "⚠️  Cleanup script not found: $CLEANUP_SCRIPT"
          echo "This is expected if the PKG doesn't include it yet"
          exit 0
        fi
        
        echo "Found cleanup script: $CLEANUP_SCRIPT"
        echo ""
        
        # Show current versions
        echo "Versions before cleanup:"
        ls -d "$INSTALL_ROOT"/*/ 2>/dev/null || echo "No version directories"
        
        echo ""
        echo "Current active version:"
        readlink "$INSTALL_ROOT/current"
        
        # Test cleanup script (dry run mode if available)
        echo ""
        echo "Testing cleanup script..."
        sudo "$CLEANUP_SCRIPT" || echo "Cleanup script executed"
        
        echo ""
        echo "✅ Cleanup utility test completed"
        
      displayName: 'Test cleanup utility'
  
  - job: TestUninstall
    displayName: 'Test uninstall behavior'
    dependsOn: TestCleanup
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "================================================"
        echo "UNINSTALL TEST"
        echo "================================================"
        echo ""
        
        INSTALL_ROOT="/usr/local/microsoft/azure-cli"
        
        # Show what's installed before uninstall
        echo "Before uninstall:"
        ls -la "$INSTALL_ROOT/" 2>/dev/null || echo "Directory not found"
        
        echo ""
        echo "Uninstalling ${{ parameters.CaskName }}..."
        brew uninstall --cask ${{ parameters.CaskName }}
        
        echo ""
        echo "=== Verifying Uninstall ==="
        
        # Launcher should be removed
        if [ -f "/usr/local/bin/az" ]; then
          echo "❌ Launcher still exists"
          exit 1
        fi
        echo "✅ Launcher removed"
        
        # Current symlink should be removed
        if [ -L "$INSTALL_ROOT/current" ]; then
          echo "❌ Current symlink still exists"
          exit 1
        fi
        echo "✅ Current symlink removed"
        
        # Version directories should still exist (per design)
        if [ -d "$INSTALL_ROOT/${{ parameters.AzureCliVersion }}" ]; then
          echo "✅ Version directory preserved (by design)"
        else
          echo "ℹ️  Version directory removed (acceptable)"
        fi
        
        echo ""
        echo "=== Testing ZAP (Complete Removal) ==="
        
        # Reinstall for zap test
        brew install --cask ${{ parameters.CaskName }}
        
        # Zap should remove everything
        brew uninstall --zap --cask ${{ parameters.CaskName }}
        
        if [ -d "$INSTALL_ROOT" ]; then
          echo "⚠️  Installation directory still exists after zap"
          ls -la "$INSTALL_ROOT/"
        else
          echo "✅ Complete removal with --zap successful"
        fi
        
        echo ""
        echo "✅ Uninstall test PASSED"
        
      displayName: 'Test uninstall and zap'

# ============================================================================
# STAGE 5: SUMMARY
# ============================================================================
- stage: Summary
  displayName: '📊 Test Summary'
  dependsOn:
  - DownloadPkg
  - DiagnosePkg
  - UpdateHomebrew
  - TestHomebrewInstall
  condition: always()
  jobs:
  - job: PrintSummary
    displayName: 'Print test summary'
    steps:
    - checkout: none
    
    - bash: |
        echo "================================================"
        echo "NOTARIZED PACKAGE TEST SUMMARY"
        echo "================================================"
        echo ""
        echo "Package:      azure-cli-${{ parameters.AzureCliVersion }}-macos-arm64-notarized.pkg"
        echo "Release:      ${{ parameters.ReleaseTag }}"
        echo "Repository:   ${{ parameters.GitHubRepo }}"
        echo "Cask:         ${{ parameters.CaskName }}"
        echo ""
        echo "Test Stages:"
        echo "  1. Download PKG:          Completed"
        echo "  2. Diagnose PKG:          Completed (check for script errors)"
        echo "  3. Update Homebrew Cask:  Completed"
        echo "  4. Homebrew Install Test: Check results"
        echo ""
        echo "Purpose: Diagnose why notarized PKG install scripts fail"
        echo ""
        echo "================================================"
        
      displayName: 'Print summary'
