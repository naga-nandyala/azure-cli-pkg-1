trigger: none

pr: none

parameters:
- name: AzureCliVersion
  displayName: 'Azure CLI Version to Test'
  type: string
  default: '2.0.0'

- name: HomebrewTapRepo
  displayName: 'Homebrew Tap Repository (owner/repo)'
  type: string
  default: 'naga-nandyala/homebrew-mycli-app'

- name: FormulaName
  displayName: 'Formula Name'
  type: string
  default: 'azure-cli-pr'

- name: GitHubRepo
  displayName: 'GitHub Repository (owner/repo)'
  type: string
  default: 'naga-nandyala/azure-cli-pkg-1'

- name: ReleaseTag
  displayName: 'GitHub Release Tag'
  type: string
  default: 'v2.0.0'

variables:
  # Disable CodeQL and other auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  
  - name: AzureCliVersion
    value: ${{ parameters.AzureCliVersion }}
  - name: HomebrewTapRepo
    value: ${{ parameters.HomebrewTapRepo }}
  - name: FormulaName
    value: ${{ parameters.FormulaName }}
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  - name: ReleaseTag
    value: ${{ parameters.ReleaseTag }}

stages:
- stage: TestHomebrewFormula
  displayName: 'Test Homebrew Formula Installation'
  jobs:
  - job: TestOnMacOS
    displayName: 'Test formula on macOS'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "======================================"
        echo "  System Information"
        echo "======================================"
        echo ""
        echo "macOS Version:"
        sw_vers
        echo ""
        echo "Homebrew Version:"
        brew --version
        echo ""
        echo "Architecture:"
        uname -m
      displayName: 'Show system information'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Remove Pre-installed Azure CLI"
        echo "======================================"
        echo ""
        
        # Check if az is already installed
        if command -v az &> /dev/null; then
          echo "⚠️  Azure CLI is pre-installed on this agent"
          echo "Current version:"
          az --version | head -5
          echo ""
          echo "Location: $(which az)"
          echo ""
          
          # Try to uninstall via Homebrew first
          echo "Attempting to uninstall via Homebrew..."
          brew uninstall azure-cli 2>/dev/null || echo "Not installed via Homebrew"
          
          # Remove symlinks
          echo "Removing az symlinks..."
          sudo rm -f /usr/local/bin/az 2>/dev/null || true
          sudo rm -f /opt/homebrew/bin/az 2>/dev/null || true
          
          # Remove installation directories
          echo "Removing Azure CLI directories..."
          sudo rm -rf /usr/local/az 2>/dev/null || true
          sudo rm -rf /opt/az 2>/dev/null || true
          sudo rm -rf /usr/local/Cellar/azure-cli* 2>/dev/null || true
          sudo rm -rf /opt/homebrew/Cellar/azure-cli* 2>/dev/null || true
          
          # Clear PATH cache
          hash -r
          
          echo ""
          if command -v az &> /dev/null; then
            echo "⚠️  Azure CLI still found at: $(which az)"
            echo "This might be in a system location we can't remove"
          else
            echo "✅ Azure CLI successfully removed"
          fi
        else
          echo "✅ No pre-installed Azure CLI found"
        fi
        echo ""
      displayName: 'Remove pre-installed Azure CLI'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Add Homebrew Tap"
        echo "======================================"
        echo ""
        echo "Adding tap: $(HomebrewTapRepo)"
        
        brew tap $(HomebrewTapRepo)
        
        echo ""
        echo "✅ Tap added successfully"
        echo ""
        echo "Available formulas in tap:"
        brew search $(HomebrewTapRepo)
      displayName: 'Add Homebrew tap'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Install Formula"
        echo "======================================"
        echo ""
        echo "Installing: $(FormulaName)"
        
        brew install $(FormulaName)
        
        echo ""
        echo "✅ Formula installed successfully"
      displayName: 'Install Azure CLI from formula'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Diagnose and Fix Installation"
        echo "======================================"
        echo ""
        
        echo "Current PATH:"
        echo "$PATH"
        echo ""
        
        echo "Checking installation locations:"
        echo ""
        
        # Find where Homebrew installed it
        CELLAR_PATH="/usr/local/Cellar/azure-cli-pr/$(AzureCliVersion)"
        
        echo "1. Checking Homebrew Cellar: $CELLAR_PATH"
        if [ -d "$CELLAR_PATH" ]; then
          echo "   ✅ Found installation directory"
          echo "   Total size: $(du -sh "$CELLAR_PATH" | cut -f1)"
          echo ""
          echo "   Directory structure (first 20 entries):"
          ls -la "$CELLAR_PATH/" | head -20
        else
          echo "   ❌ Not found: $CELLAR_PATH"
        fi
        echo ""
        
        # Check for bin/az
        echo "2. Checking for bin/az executable:"
        if [ -f "$CELLAR_PATH/bin/az" ]; then
          echo "   ✅ Found: $CELLAR_PATH/bin/az"
          ls -la "$CELLAR_PATH/bin/az"
          
          # Check permissions
          if [ -x "$CELLAR_PATH/bin/az" ]; then
            echo "   ✅ File is already executable"
          else
            echo "   ❌ ERROR: File is NOT executable - FIXING NOW"
            echo "   Setting executable permissions..."
            chmod +x "$CELLAR_PATH/bin/az"
            echo "   After fix:"
            ls -la "$CELLAR_PATH/bin/az"
          fi
        else
          echo "   ❌ Not found: $CELLAR_PATH/bin/az"
        fi
        echo ""
        
        # Check for microsoft/azure-cli directory
        echo "3. Checking for microsoft/azure-cli directory:"
        if [ -d "$CELLAR_PATH/microsoft/azure-cli" ]; then
          echo "   ✅ Found: $CELLAR_PATH/microsoft/azure-cli"
          
          # Check Python executable permissions
          PYTHON_EXEC="$CELLAR_PATH/microsoft/azure-cli/bin/python3"
          if [ -f "$PYTHON_EXEC" ]; then
            echo "   Python executable:"
            ls -la "$PYTHON_EXEC"
            
            if [ -x "$PYTHON_EXEC" ]; then
              echo "   ✅ Python is executable"
            else
              echo "   ❌ Python NOT executable - FIXING NOW"
              chmod +x "$PYTHON_EXEC"
              echo "   After fix:"
              ls -la "$PYTHON_EXEC"
            fi
          fi
        else
          echo "   ❌ Not found: $CELLAR_PATH/microsoft/azure-cli"
        fi
        echo ""
        
        # Check symlink in /usr/local/bin
        echo "4. Checking Homebrew symlink:"
        if [ -L /usr/local/bin/az ]; then
          echo "   ✅ Symlink exists: /usr/local/bin/az"
          ls -la /usr/local/bin/az
          echo "   Target: $(readlink /usr/local/bin/az)"
        elif [ -f /usr/local/bin/az ]; then
          echo "   ⚠️  /usr/local/bin/az exists but is not a symlink"
          ls -la /usr/local/bin/az
        else
          echo "   ❌ Not found: /usr/local/bin/az"
          echo "   Homebrew should have created this symlink"
        fi
        echo ""
        
        # Verify wrapper script content
        echo "5. Checking wrapper script content:"
        if [ -f "$CELLAR_PATH/bin/az" ]; then
          echo "   Contents of $CELLAR_PATH/bin/az:"
          cat "$CELLAR_PATH/bin/az"
        fi
        echo ""
        
        echo "✅ Diagnostic complete"
      displayName: 'Diagnose and fix Homebrew installation'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Verify Installation"
        echo "======================================"
        echo ""
        
        # Check if az command is available
        if ! command -v az &> /dev/null; then
          echo "❌ ERROR: 'az' command not found in PATH"
          echo ""
          echo "Troubleshooting information:"
          echo "1. Checking if /usr/local/bin is in PATH:"
          echo "$PATH" | grep -o "/usr/local/bin" || echo "   ❌ /usr/local/bin NOT in PATH"
          echo ""
          echo "2. Manual check for /usr/local/bin/az:"
          ls -la /usr/local/bin/az 2>/dev/null || echo "   ❌ File does not exist"
          echo ""
          echo "3. Direct execution test:"
          if [ -f /usr/local/bin/az ]; then
            echo "   Attempting to run directly..."
            /usr/local/bin/az --version || echo "   ❌ Direct execution failed"
          fi
          exit 1
        fi
        
        echo "✅ 'az' command found in PATH"
        echo ""
        
        # Get az location
        echo "az location:"
        which az
        echo ""
        
        # Check version
        echo "Azure CLI Version:"
        az --version
        
        echo ""
        echo "✅ Azure CLI is working correctly"
      displayName: 'Verify az command works'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Test Basic Commands"
        echo "======================================"
        echo ""
        
        # Test help command
        echo "Testing: az --help"
        az --help > /dev/null
        echo "✅ Help command works"
        echo ""
        
        # Test version command
        echo "Testing: az version"
        az version
        echo "✅ Version command works"
        echo ""
        
        # Test extension list (should work without login)
        echo "Testing: az extension list"
        az extension list
        echo "✅ Extension list works"
        echo ""
        
        echo "======================================"
        echo "  All Tests Passed! ✅"
        echo "======================================"
      displayName: 'Test basic az commands'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Cleanup - Uninstall Homebrew Formula"
        echo "======================================"
        echo ""
        
        echo "Uninstalling $(FormulaName)..."
        brew uninstall $(FormulaName) || echo "Formula already uninstalled"
        
        # Verify uninstallation
        if command -v az &> /dev/null; then
          echo "⚠️  WARNING: 'az' command still found in PATH"
          which az
        else
          echo "✅ Azure CLI uninstalled successfully"
        fi
        
        echo ""
        echo "Removing tap..."
        brew untap $(HomebrewTapRepo) || echo "Tap already removed"
        
        echo ""
        echo "✅ Cleanup complete"
      displayName: 'Cleanup - Uninstall Homebrew'
      condition: always()

  - job: TestOfflineInstall
    displayName: 'Test offline PKG installation'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "======================================"
        echo "  System Information"
        echo "======================================"
        echo ""
        echo "macOS Version:"
        sw_vers
        echo ""
        echo "Architecture:"
        uname -m
      displayName: 'Show system information'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Remove Pre-installed Azure CLI"
        echo "======================================"
        echo ""
        
        # Check if az is already installed
        if command -v az &> /dev/null; then
          echo "⚠️  Azure CLI is pre-installed on this agent"
          echo "Current version:"
          az --version | head -5
          echo ""
          echo "Location: $(which az)"
          echo ""
          
          # Try to uninstall via Homebrew first
          echo "Attempting to uninstall via Homebrew..."
          brew uninstall azure-cli 2>/dev/null || echo "Not installed via Homebrew"
          
          # Remove symlinks
          echo "Removing az symlinks..."
          sudo rm -f /usr/local/bin/az 2>/dev/null || true
          sudo rm -f /opt/homebrew/bin/az 2>/dev/null || true
          
          # Remove installation directories
          echo "Removing Azure CLI directories..."
          sudo rm -rf /usr/local/az 2>/dev/null || true
          sudo rm -rf /opt/az 2>/dev/null || true
          sudo rm -rf /usr/local/Cellar/azure-cli* 2>/dev/null || true
          sudo rm -rf /opt/homebrew/Cellar/azure-cli* 2>/dev/null || true
          
          # Clear PATH cache
          hash -r
          
          echo ""
          if command -v az &> /dev/null; then
            echo "⚠️  Azure CLI still found at: $(which az)"
            echo "This might be in a system location we can't remove"
          else
            echo "✅ Azure CLI successfully removed"
          fi
        else
          echo "✅ No pre-installed Azure CLI found"
        fi
        echo ""
      displayName: 'Remove pre-installed Azure CLI'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Download Notarized PKG from GitHub Release"
        echo "======================================"
        echo ""
        echo "Release: $(ReleaseTag)"
        echo "Repository: $(GitHubRepo)"
        echo ""
        
        # Construct PKG download URL (using the actual filename from the release)
        PKG_URL="https://github.com/$(GitHubRepo)/releases/download/$(ReleaseTag)/azure-cli-$(AzureCliVersion)-macos-arm64-notarized.pkg"
        
        echo "Downloading PKG from: $PKG_URL"
        
        # Download and check if it's actually a PKG file
        HTTP_CODE=$(curl -L -w "%{http_code}" -o azure-cli.pkg "$PKG_URL")
        
        echo ""
        echo "HTTP Response Code: $HTTP_CODE"
        
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ERROR: Failed to download PKG (HTTP $HTTP_CODE)"
          echo ""
          echo "This likely means:"
          echo "1. The release exists but has no PKG asset attached"
          echo "2. The PKG filename doesn't match azure-cli-$(AzureCliVersion)-macos-arm64-notarized.pkg"
          echo "3. The release $(ReleaseTag) doesn't exist"
          echo ""
          echo "Please check: https://github.com/$(GitHubRepo)/releases/tag/$(ReleaseTag)"
          exit 1
        fi
        
        # Check file size (should be at least 10MB for real PKG)
        FILE_SIZE=$(stat -f%z azure-cli.pkg 2>/dev/null || stat -c%s azure-cli.pkg)
        echo "Downloaded file size: $FILE_SIZE bytes ($(numfmt --to=iec $FILE_SIZE 2>/dev/null || echo 'N/A'))"
        
        if [ "$FILE_SIZE" -lt 1000000 ]; then
          echo ""
          echo "❌ ERROR: Downloaded file is too small ($FILE_SIZE bytes)"
          echo "Expected a PKG file of 10+ MB, got less than 1 MB"
          echo ""
          echo "The release likely has no valid PKG asset."
          echo ""
          echo "Downloaded content:"
          head -20 azure-cli.pkg
          exit 1
        fi
        
        echo ""
        echo "✅ PKG downloaded successfully"
        ls -lh azure-cli.pkg
      displayName: 'Download PKG from GitHub release'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Verify PKG Signature and Notarization"
        echo "======================================"
        echo ""
        
        # Check if PKG is signed
        echo "Checking PKG signature..."
        pkgutil --check-signature azure-cli.pkg
        
        echo ""
        echo "Checking notarization status..."
        spctl -a -vv -t install azure-cli.pkg
        
        echo ""
        echo "✅ PKG is properly signed and notarized"
      displayName: 'Verify PKG signature and notarization'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Install PKG (Offline Installation)"
        echo "======================================"
        echo ""
        
        echo "Installing azure-cli.pkg..."
        sudo installer -pkg azure-cli.pkg -target /
        
        echo ""
        echo "✅ PKG installed successfully"
      displayName: 'Install PKG offline'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Verify Offline Installation"
        echo "======================================"
        echo ""
        
        echo "Current PATH:"
        echo "$PATH"
        echo ""
        
        echo "Checking installation locations:"
        echo ""
        
        # Check expected launcher location (Microsoft standard path)
        echo "1. Checking /usr/local/bin/az (expected launcher):"
        if [ -f /usr/local/bin/az ]; then
          echo "   ✅ Found: /usr/local/bin/az"
          ls -la /usr/local/bin/az
          
          # Check if it's executable
          if [ -x /usr/local/bin/az ]; then
            echo "   ✅ File is executable"
          else
            echo "   ⚠️  WARNING: File is NOT executable (fixing...)"
            sudo chmod +x /usr/local/bin/az
            echo "   ✅ Made executable"
          fi
        else
          echo "   ❌ ERROR: /usr/local/bin/az not found!"
          echo "   PKG should have installed it directly to /usr/local/bin/"
        fi
        echo ""
        
        # Check Microsoft standard installation directory
        echo "2. Checking /usr/local/microsoft/azure-cli/ (Microsoft standard path):"
        if [ -d /usr/local/microsoft/azure-cli ]; then
          echo "   ✅ Found directory: /usr/local/microsoft/azure-cli"
          echo "   Contents:"
          ls -la /usr/local/microsoft/azure-cli/ 2>/dev/null | head -15
          echo ""
          
          if [ -f /usr/local/microsoft/azure-cli/bin/python3 ]; then
            echo "   ✅ Found Python: /usr/local/microsoft/azure-cli/bin/python3"
            ls -la /usr/local/microsoft/azure-cli/bin/python3
          else
            echo "   ❌ ERROR: Python not found in venv"
          fi
        else
          echo "   ❌ ERROR: /usr/local/microsoft/azure-cli directory not found!"
          echo ""
          echo "   Checking for OLD incorrect path /usr/local/az/:"
          if [ -d /usr/local/az ]; then
            echo "   ⚠️  FOUND OLD PATH: /usr/local/az/"
            echo "   This means the PKG repack step used wrong install-location!"
            echo "   Check line 566 in complete pipeline - should be '/usr/local' not '/usr/local/az'"
            ls -la /usr/local/az/ 2>/dev/null | head -15
          fi
        fi
        echo ""
        
        # Verify wrapper script has correct Python path
        echo "3. Checking wrapper script Python path:"
        if [ -f /usr/local/bin/az ]; then
          echo "   Searching for Python path in wrapper script:"
          grep -n "VENV_DIR\|/usr/local" /usr/local/bin/az || echo "   (no path found)"
          
          # Verify it points to correct location
          if grep -q "/usr/local/microsoft/azure-cli" /usr/local/bin/az; then
            echo "   ✅ Wrapper script has correct Python path"
          else
            echo "   ⚠️  WARNING: Wrapper script may have incorrect Python path"
          fi
        fi
        echo ""
        
        # Verify az command works
        echo "4. Testing az command:"
        if command -v az &> /dev/null; then
          echo "   ✅ 'az' command found in PATH"
          echo "   Location: $(which az)"
          echo ""
          echo "   Azure CLI Version:"
          az --version | head -10
        else
          echo "   ❌ ERROR: 'az' command still not found in PATH"
          echo ""
          echo "   This suggests the PKG installation failed to:"
          echo "   - Install the launcher at /usr/local/bin/az"
          echo "   - Set executable permissions on /usr/local/bin/az"
          exit 1
        fi
        
        echo ""
        echo "✅ Offline PKG installation successful"
        
      displayName: 'Verify offline installation works'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Test Basic Commands (Offline)"
        echo "======================================"
        echo ""
        
        # Ensure /usr/local/bin is in PATH
        export PATH="/usr/local/bin:$PATH"
        hash -r
        
        # Test help command
        echo "Testing: az --help"
        az --help > /dev/null
        echo "✅ Help command works"
        echo ""
        
        # Test version command
        echo "Testing: az version"
        az version
        echo "✅ Version command works"
        echo ""
        
        echo "======================================"
        echo "  Offline Installation Tests Passed! ✅"
        echo "======================================"
      displayName: 'Test basic commands offline'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Cleanup - Uninstall Azure CLI"
        echo "======================================"
        echo ""
        
        echo "Uninstalling Azure CLI installed via PKG..."
        
        # Remove the az symlink
        if [ -L "/usr/local/bin/az" ]; then
          echo "Removing symlink: /usr/local/bin/az"
          sudo rm -f /usr/local/bin/az
        fi
        
        # Remove the Azure CLI installation directory
        if [ -d "/usr/local/az" ]; then
          echo "Removing directory: /usr/local/az"
          sudo rm -rf /usr/local/az
        fi
        
        # Verify uninstallation
        if command -v az &> /dev/null; then
          echo "⚠️  WARNING: 'az' command still found in PATH"
          which az
        else
          echo "✅ Azure CLI uninstalled successfully"
        fi
        
        echo ""
        echo "Removing downloaded PKG..."
        rm -f azure-cli.pkg
        
        echo ""
        echo "✅ Cleanup complete"
      displayName: 'Cleanup - Uninstall PKG'
      condition: always()

- stage: TestFormulaValidation
  displayName: 'Validate Formula Syntax'
  jobs:
  - job: ValidateFormula
    displayName: 'Validate formula with brew audit'
    pool:
      vmImage: 'macos-14'
    
    steps:
    - checkout: none
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Add Tap and Audit Formula"
        echo "======================================"
        echo ""
        
        # Add tap
        brew tap $(HomebrewTapRepo)
        
        echo "Running brew audit on $(FormulaName)..."
        echo ""
        
        # Audit the formula (checks for common issues)
        brew audit --formula $(FormulaName)
        
        echo ""
        echo "✅ Formula audit passed"
      displayName: 'Audit formula'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Formula Information"
        echo "======================================"
        echo ""
        
        echo "Formula info:"
        brew info $(FormulaName)
        
        echo ""
        echo "Formula contents:"
        brew cat $(FormulaName)
        
        echo ""
        echo "✅ Formula inspection complete"
      displayName: 'Show formula details'
    
    - bash: |
        set -e
        echo "======================================"
        echo "  Test Formula Installation (Dry Run)"
        echo "======================================"
        echo ""
        
        # Test installation without actually installing
        brew fetch $(FormulaName)
        
        echo ""
        echo "✅ Formula can be fetched successfully"
      displayName: 'Test formula fetch'
    
    - bash: |
        brew untap $(HomebrewTapRepo)
        echo "✅ Cleanup complete"
      displayName: 'Cleanup'
      condition: always()

- stage: TestSummary
  displayName: 'Test Summary'
  dependsOn:
  - TestHomebrewFormula
  - TestFormulaValidation
  condition: succeededOrFailed()
  jobs:
  - job: Summary
    displayName: 'Show test summary'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - bash: |
        echo "======================================"
        echo "  Homebrew Formula Test Summary"
        echo "======================================"
        echo ""
        echo "✅ Test Results:"
        echo ""
        echo "1. Homebrew Formula Installation - Completed"
        echo "2. Offline PKG Installation - Completed"
        echo "3. Formula Validation - Completed"
        echo ""
        echo "Formula: $(FormulaName)"
        echo "Version: $(AzureCliVersion)"
        echo "Tap: $(HomebrewTapRepo)"
        echo "Release: $(ReleaseTag)"
        echo ""
        echo "The formula is ready for use!"
        echo ""
        echo "Users can install with:"
        echo "  brew tap $(HomebrewTapRepo)"
        echo "  brew install $(FormulaName)"
        echo ""
        echo "Or download PKG directly from:"
        echo "  https://github.com/$(GitHubRepo)/releases/tag/$(ReleaseTag)"
      displayName: 'Test summary'
