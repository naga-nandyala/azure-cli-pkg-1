# Azure CLI - macOS Tar.gz Sign and Notarize Pipeline (v3)
# 
# Sign and Notarize CLI Package (Homebrew Python Approach)
# 
# This v3 pipeline is SIMPLER than v2 because:
# - Only ~10 binaries to sign (vs ~91 in v2)
# - No Python runtime binaries (handled by Homebrew)
# - 89% reduction in signing/notarization time
#
# This pipeline takes unsigned CLI tar.gz files from macos-tarball-build-v3 and:
# 1. Signs all native extension .so files with ESRP (Developer ID Application)
# 2. Creates a ZIP bundle of signed binaries
# 3. Submits to Apple for notarization via ESRP
# 4. Repackages as final signed+notarized tar.gz
#
# Input: Unsigned CLI tarball artifacts from Build ID
#   - cli-build-unsigned-v3-arm64 artifact (ARM64/Apple Silicon)
#   - cli-build-unsigned-v3-x86_64 artifact (Intel)
#
# Workflow (for each architecture in parallel):
# ┌─────────────┐    ┌──────────────┐    ┌─────────────────┐    ┌──────────────┐
# │ Download    │───▶│ Sign ~10     │───▶│ Submit ZIP to   │───▶│ Create final │
# │ unsigned    │    │ .so files    │    │ Apple for       │    │ tar.gz       │
# │ tar.gz      │    │ (ESRP)       │    │ notarization    │    │              │
# └─────────────┘    └──────────────┘    └─────────────────┘    └──────────────┘
#
# Binary Categories in v3:
# - cryptography: ~3-4 .so files (Rust-based crypto)
# - cffi: 1 .so file
# - bcrypt: 1 .so file  
# - pynacl: 1 .so file
# - yaml: 1 .so file
# - psutil: 1 .so file
# - pymsalruntime: 1 .dylib (optional, for broker auth)
# Total: ~10 files vs ~91 in v2
#
# Output Artifacts (both architectures):
# - cli-signed-notarized-v3-arm64
# - cli-signed-notarized-v3-x86_64

trigger: none

parameters:
  - name: TarballBuildId
    displayName: 'CLI Tarball Build ID (from macos-tarball-build-v3 pipeline)'
    type: string
    default: '295856'
  
  - name: BundleId
    displayName: 'Bundle ID for notarization'
    type: string
    default: 'com.microsoft.azure.cli'
  
  - name: PublishToGitHub
    displayName: 'Publish to GitHub Release'
    type: boolean
    default: true
  
  - name: GitHubRepo
    displayName: 'GitHub Repository (owner/repo)'
    type: string
    default: 'naga-nandyala/azure-cli-pkg-1'
  
  - name: UpdateHomebrew
    displayName: 'Update Homebrew cask after release'
    type: boolean
    default: true
  
  - name: HomebrewTapRepo
    displayName: 'Homebrew Tap Repository'
    type: string
    default: 'naga-nandyala/homebrew-mycli-app'

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: 'github.com_naga-nandyala'
    name: naga-nandyala/homebrew-mycli-app
    ref: main

variables:
  - group: 'AME ESRP Variable Group'
  
  # GitHub token for publishing releases
  - name: GITHUB_TOKEN
    value: $[ resources.repositories['homebrewtap'].token ]
  
  # Parameter variable mappings
  - name: GitHubRepo
    value: ${{ parameters.GitHubRepo }}
  - name: HomebrewTapRepo
    value: ${{ parameters.HomebrewTapRepo }}
  
  # Disable auto-injection tasks
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: CodeQL.enabled
    value: false
  - name: runCodesignValidationInjection
    value: false
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1
  - name: DOTNET_NOLOGO
    value: 1
  - name: NugetSecurityAnalysisWarningLevel
    value: none
  - name: skipNugetSecurityAnalysis
    value: true

name: sign-notarize-v3-$(Build.BuildId)

stages:
# ============================================================================
# STAGE 1: DOWNLOAD AND ANALYZE UNSIGNED TAR.GZ (Both Architectures)
# ============================================================================
- stage: DownloadAndAnalyze
  displayName: 'Stage 1: Download and Analyze'
  jobs:
  - job: DownloadAndAnalyze
    displayName: 'Download and analyze'
    strategy:
      matrix:
        ARM64:
          ARCH: 'arm64'
          VM_IMAGE: 'macos-15-arm64'
          ARTIFACT_NAME: 'cli-build-unsigned-v3-arm64'
        Intel:
          ARCH: 'x86_64'
          VM_IMAGE: 'macos-15'
          ARTIFACT_NAME: 'cli-build-unsigned-v3-x86_64'
    pool:
      vmImage: $(VM_IMAGE)
    
    steps:
    - checkout: self
      fetchDepth: 1
    
    # Download from Tarball Build pipeline artifacts
    - task: DownloadPipelineArtifact@2
      displayName: 'Download from Build Pipeline (Build ${{ parameters.TarballBuildId }}) - $(ARCH)'
      inputs:
        buildType: 'specific'
        project: 'release'
        definition: 'macos-tarball-build-v3'
        buildVersionToDownload: 'specific'
        buildId: ${{ parameters.TarballBuildId }}
        artifactName: '$(ARTIFACT_NAME)'
        targetPath: '$(Pipeline.Workspace)/tarball-download'
    
    - bash: |
        set -e
        
        echo "=== Unsigned Tarball from Pipeline Artifacts (v3) ==="
        echo "Build ID: ${{ parameters.TarballBuildId }}"
        echo "Artifact: $(ARTIFACT_NAME)"
        echo "Architecture: $(ARCH)"
        echo ""
        
        echo "=== Downloaded Files ==="
        ls -lh $(Pipeline.Workspace)/tarball-download/
        echo ""
        
        mkdir -p $(Build.ArtifactStagingDirectory)/unsigned
        
        # Find the tarball in the downloaded artifact
        TARBALL=$(find $(Pipeline.Workspace)/tarball-download -name "azure-cli-*.tar.gz" | head -1)
        
        if [ -z "$TARBALL" ]; then
          echo "❌ ERROR: No azure-cli-*.tar.gz found in artifact"
          find $(Pipeline.Workspace)/tarball-download -type f
          exit 1
        fi
        
        echo "✅ Found: $TARBALL"
        TARBALL_NAME=$(basename "$TARBALL")
        echo "   Name: $TARBALL_NAME"
        echo "   Size: $(du -h "$TARBALL" | cut -f1)"
        
        cp "$TARBALL" $(Build.ArtifactStagingDirectory)/unsigned/unsigned.tar.gz
        
        # Extract version from tarball name
        VERSION=$(echo "$TARBALL_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        if [ -z "$VERSION" ]; then
          VERSION="unknown"
        fi
        
        echo ""
        echo "Detected version: $VERSION"
        echo "##vso[task.setvariable variable=AzureCliVersion;isOutput=true]$VERSION"
        echo "##vso[task.setvariable variable=TarballName;isOutput=true]$TARBALL_NAME"
        
      displayName: 'Prepare tarball from pipeline artifacts'
      name: DownloadStep
    
    - bash: |
        set -e
        
        echo "=== Analyzing Binaries to Sign (v3 - CLI Extensions Only) ==="
        echo "Architecture: $(ARCH)"
        echo "NOTE: v3 does NOT bundle Python, so only CLI native extensions need signing"
        echo ""
        
        TARBALL="$(Build.ArtifactStagingDirectory)/unsigned/unsigned.tar.gz"
        EXTRACT_DIR=$(mktemp -d)
        
        tar -xzf "$TARBALL" -C "$EXTRACT_DIR"
        
        # Find all Mach-O binaries
        ALL_BINARIES="$(Build.ArtifactStagingDirectory)/all-binaries.txt"
        find "$EXTRACT_DIR" -type f -exec file {} \; | \
          grep -i "Mach-O" | \
          grep -v "(for architecture" | \
          cut -d: -f1 | \
          sed "s|$EXTRACT_DIR/||" | \
          sort -u > "$ALL_BINARIES"
        
        TOTAL_COUNT=$(wc -l < "$ALL_BINARIES" | tr -d ' ')
        echo "Total Mach-O binaries in tarball: $TOTAL_COUNT"
        
        # Categorize binaries
        echo ""
        echo "=== Binary Categories (v3) ==="
        
        # All binaries should be in site-packages (CLI extensions)
        CLI_EXTENSIONS=$(grep -cE 'site-packages.*\.so$' "$ALL_BINARIES" || echo 0)
        DYLIBS=$(grep -cE '\.dylib$' "$ALL_BINARIES" || echo 0)
        
        echo "CLI extension modules (.so): $CLI_EXTENSIONS"
        echo "Dynamic libraries (.dylib):  $DYLIBS"
        echo ""
        
        # List each binary with its package
        echo "=== Detailed Binary List ==="
        while IFS= read -r binary; do
          if [ -n "$binary" ]; then
            PKG=$(echo "$binary" | grep -oE 'site-packages/[^/]+' | cut -d'/' -f2 || echo "unknown")
            NAME=$(basename "$binary")
            SIZE=$(du -h "$EXTRACT_DIR/$binary" | cut -f1)
            echo "  $NAME ($SIZE) - package: $PKG"
          fi
        done < "$ALL_BINARIES"
        
        # All binaries need signing for notarization
        BINARIES_LIST="$(Build.ArtifactStagingDirectory)/binaries-to-sign.txt"
        cp "$ALL_BINARIES" "$BINARIES_LIST"
        
        BINARY_COUNT=$(wc -l < "$BINARIES_LIST" | tr -d ' ')
        echo ""
        echo "=== Summary ===" 
        echo "Total binaries to sign: $BINARY_COUNT"
        echo "Comparison: v3 has ~10 binaries vs ~91 in v2 (89% reduction)"
        echo "##vso[task.setvariable variable=BinaryCount;isOutput=true]$BINARY_COUNT"
        
        # Keep extracted contents for signing
        mkdir -p $(Build.ArtifactStagingDirectory)/unsigned-contents
        cp -R "$EXTRACT_DIR"/* $(Build.ArtifactStagingDirectory)/unsigned-contents/
        
        rm -rf "$EXTRACT_DIR"
        
      displayName: 'Analyze and list all binaries'
      name: AnalyzeStep
    
    - publish: $(Build.ArtifactStagingDirectory)/unsigned
      artifact: unsigned-tarball-$(ARCH)
      displayName: 'Publish unsigned tarball ($(ARCH))'
    
    - publish: $(Build.ArtifactStagingDirectory)/binaries-to-sign.txt
      artifact: binaries-list-$(ARCH)
      displayName: 'Publish binaries list ($(ARCH))'
    
    - publish: $(Build.ArtifactStagingDirectory)/unsigned-contents
      artifact: unsigned-contents-$(ARCH)
      displayName: 'Publish unsigned contents ($(ARCH))'

# ============================================================================
# STAGE 2: SIGN ALL BINARIES WITH ESRP (Both Architectures)
# ============================================================================
- stage: SignBinaries
  displayName: 'Stage 2: Sign Binaries (ESRP)'
  dependsOn: DownloadAndAnalyze
  condition: succeeded()
  jobs:
  - job: SignWithESRP
    displayName: 'Sign binaries'
    strategy:
      matrix:
        ARM64:
          ARCH: 'arm64'
        Intel:
          ARCH: 'x86_64'
    pool:
      vmImage: 'windows-latest'
    timeoutInMinutes: 30  # Faster than v2 since fewer binaries
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-contents-$(ARCH)
      displayName: 'Download unsigned contents ($(ARCH))'
    
    - download: current
      artifact: binaries-list-$(ARCH)
      displayName: 'Download binaries list ($(ARCH))'
    
    - pwsh: |
        Write-Host "=== Preparing Binaries for ESRP Signing (v3 - $(ARCH)) ==="
        Write-Host "NOTE: Only ~10 CLI extension binaries (vs ~91 in v2)"
        Write-Host ""
        
        $extractPath = "$(Pipeline.Workspace)/unsigned-contents-$(ARCH)"
        
        # Read binaries list
        $fileListPath = "$(Pipeline.Workspace)/binaries-list-$(ARCH)/binaries-to-sign.txt"
        $filesToSign = Get-Content $fileListPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
        
        Write-Host "Files to sign: $($filesToSign.Count)"
        Write-Host ""
        
        # Create ZIP for each binary
        $toBeSignedDir = "$(Pipeline.Workspace)/toBeSigned"
        New-Item -ItemType Directory -Path $toBeSignedDir -Force | Out-Null
        
        $fileMapping = @{}
        $count = 0
        
        foreach ($relativePath in $filesToSign) {
          $fullPath = Join-Path $extractPath $relativePath
          
          if (Test-Path $fullPath) {
            $flatName = $relativePath -replace '[/\\]', '__'
            $zipName = "$flatName.zip"
            $zipPath = Join-Path $toBeSignedDir $zipName
            
            Compress-Archive -Path $fullPath -DestinationPath $zipPath -Force
            
            $fileMapping[$zipName] = @{
              "OriginalPath" = $relativePath
              "FileName" = (Split-Path $relativePath -Leaf)
            }
            
            $count++
            Write-Host "  [$count] $relativePath"
          }
        }
        
        Write-Host ""
        Write-Host "Created $count ZIP files for signing"
        Write-Host "Total size: $([math]::Round((Get-ChildItem $toBeSignedDir -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 2)) MB"
        
        # Save mapping
        $mappingPath = "$(Pipeline.Workspace)/file-mapping.json"
        $fileMapping | ConvertTo-Json -Depth 10 | Set-Content $mappingPath
        
      displayName: 'Create ZIP for each binary ($(ARCH))'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Sign all binaries (Developer ID Application)'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/toBeSigned'
        Pattern: '*.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppDeveloperSign",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "Hardening": "--options=runtime"
              }
            }
          ]
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
    
    - pwsh: |
        Write-Host "=== Extracting Signed Binaries ==="
        
        $signedZipsDir = "$(Pipeline.Workspace)/toBeSigned"
        $outputDir = "$(Build.ArtifactStagingDirectory)/signed-binaries"
        $mappingPath = "$(Pipeline.Workspace)/file-mapping.json"
        
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        
        $fileMapping = Get-Content $mappingPath | ConvertFrom-Json
        $count = 0
        
        foreach ($entry in $fileMapping.PSObject.Properties) {
          $zipName = $entry.Name
          $fileInfo = $entry.Value
          $zipPath = Join-Path $signedZipsDir $zipName
          
          if (Test-Path $zipPath) {
            $tempExtract = "$(Pipeline.Workspace)/temp_extract/$zipName"
            Expand-Archive -Path $zipPath -DestinationPath $tempExtract -Force
            
            $extractedFile = Get-ChildItem -Path $tempExtract -File | Select-Object -First 1
            
            if ($extractedFile) {
              $targetPath = Join-Path $outputDir $fileInfo.OriginalPath
              $targetDir = Split-Path $targetPath -Parent
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
              Copy-Item -Path $extractedFile.FullName -Destination $targetPath -Force
              $count++
              Write-Host "  [$count] $($fileInfo.OriginalPath)"
            }
          }
        }
        
        Write-Host ""
        Write-Host "Extracted $count signed binaries"
        
      displayName: 'Extract signed binaries ($(ARCH))'
    
    - publish: $(Build.ArtifactStagingDirectory)/signed-binaries
      artifact: signed-binaries-$(ARCH)
      displayName: 'Publish signed binaries ($(ARCH))'

# ============================================================================
# STAGE 3: CREATE NOTARIZATION BUNDLE (Both Architectures)
# ============================================================================
- stage: CreateNotarizationBundle
  displayName: 'Stage 3: Prepare for Notarization'
  dependsOn:
  - DownloadAndAnalyze
  - SignBinaries
  condition: succeeded()
  jobs:
  - job: MergeAndBundle
    displayName: 'Merge and create ZIP bundle'
    strategy:
      matrix:
        ARM64:
          ARCH: 'arm64'
          VM_IMAGE: 'macos-15-arm64'
        Intel:
          ARCH: 'x86_64'
          VM_IMAGE: 'macos-15'
    pool:
      vmImage: $(VM_IMAGE)
    
    steps:
    - checkout: none
    
    - download: current
      artifact: unsigned-tarball-$(ARCH)
      displayName: 'Download unsigned tarball ($(ARCH))'
    
    - download: current
      artifact: signed-binaries-$(ARCH)
      displayName: 'Download signed binaries ($(ARCH))'
    
    - bash: |
        set -e
        
        echo "=== Merging Signed Binaries (v3 - $(ARCH)) ==="
        
        # Extract original (preserves symlinks and launcher)
        TARBALL="$(Pipeline.Workspace)/unsigned-tarball-$(ARCH)/unsigned.tar.gz"
        MERGED_DIR="$(Build.ArtifactStagingDirectory)/merged"
        
        mkdir -p "$MERGED_DIR"
        tar -xzf "$TARBALL" -C "$MERGED_DIR"
        
        echo "Extracted original tarball"
        
        # Overlay signed binaries
        SIGNED_DIR="$(Pipeline.Workspace)/signed-binaries-$(ARCH)"
        cd "$SIGNED_DIR"
        
        REPLACED=0
        find . -type f | while read signed_file; do
          target="$MERGED_DIR/$signed_file"
          if [ -f "$target" ]; then
            cp "$signed_file" "$target"
            REPLACED=$((REPLACED + 1))
            echo "  Replaced: $signed_file"
          fi
        done
        
        echo ""
        echo "Overlaid signed binaries"
        
        # Restore permissions
        find "$MERGED_DIR" -name "*.so" -exec chmod +x {} \;
        find "$MERGED_DIR" -name "*.dylib" -exec chmod +x {} \;
        chmod +x "$MERGED_DIR/bin/az" 2>/dev/null || true
        chmod +x "$MERGED_DIR/libexec/bin/az" 2>/dev/null || true
        
        echo "Permissions restored"
        
        # Verify symlinks
        echo ""
        echo "=== Verifying Structure ==="
        if [ -L "$MERGED_DIR/bin/az" ]; then
          echo "✅ bin/az is symlink: $(readlink "$MERGED_DIR/bin/az")"
        fi
        
        # Verify signatures on a sample binary
        echo ""
        echo "=== Verifying Signature (sample) ==="
        SAMPLE_SO=$(find "$MERGED_DIR" -name "*.so" -type f | head -1)
        if [ -n "$SAMPLE_SO" ]; then
          echo "Sample: $(basename "$SAMPLE_SO")"
          codesign -dvv "$SAMPLE_SO" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
        fi
        
        # Export version for later stages
        TARBALL_NAME=$(basename "$TARBALL")
        VERSION=$(echo "$TARBALL_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        if [ -z "$VERSION" ]; then
          VERSION="unknown"
        fi
        echo "##vso[task.setvariable variable=AzureCliVersion;isOutput=true]$VERSION"
        
      displayName: 'Merge signed binaries ($(ARCH))'
      name: MergeStep
    
    - bash: |
        set -e
        
        echo "=== Creating Notarization ZIP Bundle ($(ARCH)) ==="
        
        MERGED_DIR="$(Build.ArtifactStagingDirectory)/merged"
        BUNDLE_DIR="$(Build.ArtifactStagingDirectory)/notarization-bundle"
        
        mkdir -p "$BUNDLE_DIR"
        
        # Get version from original tarball name
        TARBALL="$(Pipeline.Workspace)/unsigned-tarball-$(ARCH)/unsigned.tar.gz"
        TARBALL_NAME=$(ls -1 $(Pipeline.Workspace)/unsigned-tarball-$(ARCH)/*.tar.gz 2>/dev/null | head -1 || echo "")
        if [ -n "$TARBALL_NAME" ]; then
          VERSION=$(basename "$TARBALL_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        fi
        if [ -z "$VERSION" ]; then
          VERSION="unknown"
        fi
        
        ZIP_NAME="azure-cli-${VERSION}-macos-$(ARCH)-nopython-signed.zip"
        
        # Create ZIP for notarization (use -y to preserve symlinks in zip)
        cd "$MERGED_DIR"
        zip -r -y "$BUNDLE_DIR/$ZIP_NAME" .
        
        echo "Created: $ZIP_NAME"
        echo "Size: $(du -h "$BUNDLE_DIR/$ZIP_NAME" | cut -f1)"
        
        ls -lh "$BUNDLE_DIR/"
        
      displayName: 'Create notarization ZIP ($(ARCH))'
    
    # Note: We only publish the ZIP bundle for notarization.
    # Stage 5 will re-extract from unsigned-tarball to preserve symlinks,
    # then overlay signed-binaries. Azure DevOps artifacts don't preserve symlinks.
    
    - publish: $(Build.ArtifactStagingDirectory)/notarization-bundle
      artifact: notarization-bundle-$(ARCH)
      displayName: 'Publish notarization bundle ($(ARCH))'

# ============================================================================
# STAGE 4: NOTARIZE WITH APPLE (ESRP) - Both Architectures
# ============================================================================
- stage: NotarizeWithApple
  displayName: 'Stage 4: Notarize with Apple'
  dependsOn:
  - DownloadAndAnalyze
  - CreateNotarizationBundle
  condition: succeeded()
  jobs:
  - job: NotarizeBundle
    displayName: 'Submit to Apple for notarization'
    strategy:
      matrix:
        ARM64:
          ARCH: 'arm64'
        Intel:
          ARCH: 'x86_64'
    pool:
      vmImage: 'windows-latest'
    timeoutInMinutes: 60
    
    steps:
    - checkout: none
    
    - download: current
      artifact: notarization-bundle-$(ARCH)
      displayName: 'Download notarization bundle ($(ARCH))'
    
    - pwsh: |
        Write-Host "=== Submitting to Apple for Notarization (v3 - $(ARCH)) ==="
        Write-Host "Bundle ID: ${{ parameters.BundleId }}"
        Write-Host ""
        
        $bundleDir = "$(Pipeline.Workspace)/notarization-bundle-$(ARCH)"
        $zipFile = Get-ChildItem -Path $bundleDir -Filter "*.zip" | Select-Object -First 1
        
        Write-Host "ZIP file: $($zipFile.Name)"
        Write-Host "Size: $([math]::Round($zipFile.Length / 1MB, 2)) MB"
        
        # Prepare for ESRP notarization
        $toNotarizeDir = "$(Pipeline.Workspace)/toNotarize"
        New-Item -ItemType Directory -Path $toNotarizeDir -Force | Out-Null
        Copy-Item -Path $zipFile.FullName -Destination $toNotarizeDir
        
      displayName: 'Prepare for notarization ($(ARCH))'
    
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP - Notarize with Apple ($(ARCH))'
      inputs:
        ConnectedServiceName: 'ame_esrp_connection'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/toNotarize'
        Pattern: '*.zip'
        signConfigType: 'inlineSignParams'
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppNotarize",
              "ToolName": "sign",
              "ToolVersion": "1.0",
              "Parameters": {
                "BundleId": "${{ parameters.BundleId }}"
              }
            }
          ]
        SessionTimeout: '120'
        MaxConcurrency: '1'
        MaxRetryAttempts: '3'
    
    - pwsh: |
        Write-Host "=== Notarization Complete ($(ARCH)) ==="
        Write-Host "The binaries are now registered with Apple's notarization service."
        Write-Host "When users run the binaries, macOS will verify them with Apple."
        
      displayName: 'Notarization complete ($(ARCH))'
    
    - publish: $(Pipeline.Workspace)/toNotarize
      artifact: notarized-bundle-$(ARCH)
      displayName: 'Publish notarized bundle ($(ARCH))'

# ============================================================================
# STAGE 5: CREATE FINAL SIGNED+NOTARIZED TAR.GZ (Both Architectures)
# ============================================================================
- stage: CreateFinalTarball
  displayName: 'Stage 5: Create Final Tar.gz'
  dependsOn:
  - DownloadAndAnalyze
  - NotarizeWithApple
  - CreateNotarizationBundle
  condition: succeeded()
  jobs:
  - job: CreateFinal
    displayName: 'Create final signed+notarized tar.gz'
    strategy:
      matrix:
        ARM64:
          ARCH: 'arm64'
          VM_IMAGE: 'macos-15-arm64'
        Intel:
          ARCH: 'x86_64'
          VM_IMAGE: 'macos-15'
    pool:
      vmImage: $(VM_IMAGE)
    
    steps:
    - checkout: none
    
    # Download unsigned tarball (preserves symlinks when extracted)
    - download: current
      artifact: unsigned-tarball-$(ARCH)
      displayName: 'Download unsigned tarball ($(ARCH))'
    
    # Download signed binaries to overlay
    - download: current
      artifact: signed-binaries-$(ARCH)
      displayName: 'Download signed binaries ($(ARCH))'
    
    - bash: |
        set -e
        
        echo "=== Creating Final Signed+Notarized Tarball (v3 - $(ARCH)) ==="
        
        # Get version from tarball name
        UNSIGNED_TARBALL=$(find $(Pipeline.Workspace)/unsigned-tarball-$(ARCH) -name "*.tar.gz" | head -1)
        TARBALL_NAME_ORIG=$(basename "$UNSIGNED_TARBALL")
        VERSION=$(echo "$TARBALL_NAME_ORIG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        if [ -z "$VERSION" ]; then
          VERSION="unknown"
        fi
        
        ARCH="$(ARCH)"
        TARBALL_NAME="azure-cli-${VERSION}-macos-${ARCH}-nopython-signed-notarized.tar.gz"
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/final"
        FINAL_DIR="$(Build.ArtifactStagingDirectory)/merged"
        
        mkdir -p "$OUTPUT_DIR" "$FINAL_DIR"
        
        echo "Version: $VERSION"
        echo "Architecture: $ARCH"
        echo ""
        
        # Extract unsigned tarball (preserves symlinks!)
        echo "=== Extracting unsigned tarball (preserves symlinks) ==="
        TARBALL="$(Pipeline.Workspace)/unsigned-tarball-$(ARCH)/unsigned.tar.gz"
        tar -xzf "$TARBALL" -C "$FINAL_DIR"
        
        # Verify symlink is preserved
        if [ -L "$FINAL_DIR/bin/az" ]; then
          echo "✅ bin/az symlink preserved: $(readlink "$FINAL_DIR/bin/az")"
        else
          echo "⚠️ bin/az is not a symlink, will recreate..."
          rm -f "$FINAL_DIR/bin/az"
          ln -s ../libexec/bin/az "$FINAL_DIR/bin/az"
          echo "✅ Recreated symlink: bin/az -> ../libexec/bin/az"
        fi
        
        # Overlay signed binaries
        echo ""
        echo "=== Overlaying signed binaries ==="
        SIGNED_DIR="$(Pipeline.Workspace)/signed-binaries-$(ARCH)"
        cd "$SIGNED_DIR"
        REPLACED=0
        find . -type f | while read signed_file; do
          target="$FINAL_DIR/$signed_file"
          if [ -f "$target" ]; then
            cp "$signed_file" "$target"
            REPLACED=$((REPLACED + 1))
            echo "  Replaced: $signed_file"
          fi
        done
        echo "Overlaid signed binaries"
        
        # Restore permissions
        echo ""
        echo "=== Restoring permissions ==="
        find "$FINAL_DIR" -name "*.so" -exec chmod +x {} \;
        find "$FINAL_DIR" -name "*.dylib" -exec chmod +x {} \;
        chmod +x "$FINAL_DIR/libexec/bin/az" 2>/dev/null || true
        
        # Create final tar.gz (preserves symlinks with default tar behavior)
        echo ""
        echo "=== Creating final tarball ==="
        cd "$FINAL_DIR"
        tar -czf "$OUTPUT_DIR/$TARBALL_NAME" --preserve-permissions .
        
        # Generate SHA256
        cd "$OUTPUT_DIR"
        shasum -a 256 "$TARBALL_NAME" > "$TARBALL_NAME.sha256"
        
        echo "=== Final Artifacts ==="
        ls -lh "$OUTPUT_DIR"
        echo ""
        cat "$TARBALL_NAME.sha256"
        
        echo "##vso[task.setvariable variable=TarballName;isOutput=true]$TARBALL_NAME"
        echo "##vso[task.setvariable variable=AzureCliVersion;isOutput=true]$VERSION"
        
      displayName: 'Create final tar.gz ($(ARCH))'
      name: CreateStep
    
    - bash: |
        set -e
        
        echo "=== Verifying Final Tarball ($(ARCH)) ==="
        
        OUTPUT_DIR="$(Build.ArtifactStagingDirectory)/final"
        TARBALL=$(ls "$OUTPUT_DIR"/*.tar.gz | head -1)
        TEST_DIR=$(mktemp -d)
        
        tar -xzf "$TARBALL" -C "$TEST_DIR"
        
        # Check structure
        echo "Structure:"
        ls -la "$TEST_DIR"
        
        # Check symlink
        if [ -L "$TEST_DIR/bin/az" ]; then
          echo "✅ bin/az symlink exists"
        fi
        
        # Check launcher
        if [ -x "$TEST_DIR/libexec/bin/az" ]; then
          echo "✅ libexec/bin/az is executable"
        fi
        
        # Verify a signed binary
        echo ""
        echo "=== Signature Verification ==="
        SAMPLE_SO=$(find "$TEST_DIR" -name "*.so" -type f | head -1)
        if [ -n "$SAMPLE_SO" ]; then
          echo "Checking: $(basename "$SAMPLE_SO")"
          codesign -dvv "$SAMPLE_SO" 2>&1 | head -20
        fi
        
        # Test CLI (requires Homebrew Python)
        echo ""
        echo "=== Testing CLI ==="
        if brew list python@3.13 &>/dev/null; then
          export AZ_DEBUG=1
          "$TEST_DIR/bin/az" version 2>&1 | head -10
          echo "✅ CLI works correctly"
        else
          echo "⚠️ Homebrew Python 3.13 not installed, skipping CLI test"
        fi
        
        rm -rf "$TEST_DIR"
        
      displayName: 'Verify final tarball ($(ARCH))'
    
    - publish: $(Build.ArtifactStagingDirectory)/final
      artifact: 'cli-signed-notarized-v3-$(ARCH)'
      displayName: 'Publish final signed+notarized tarball ($(ARCH))'

# ============================================================================
# STAGE 6: PUBLISH TO GITHUB (OPTIONAL) - Both Architectures
# ============================================================================
- stage: PublishToGitHub
  displayName: 'Stage 6: Publish to GitHub'
  dependsOn:
  - DownloadAndAnalyze
  - CreateFinalTarball
  condition: and(succeeded(), eq('${{ parameters.PublishToGitHub }}', true))
  jobs:
  - job: CreateRelease
    displayName: 'Create GitHub Release'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none
    
    - download: current
      artifact: 'cli-signed-notarized-v3-arm64'
      displayName: 'Download signed tarball (ARM64)'
    
    - download: current
      artifact: 'cli-signed-notarized-v3-x86_64'
      displayName: 'Download signed tarball (Intel)'
    
    - task: CopyFiles@2
      displayName: 'Copy ARM64 release files to staging'
      inputs:
        SourceFolder: '$(Pipeline.Workspace)/cli-signed-notarized-v3-arm64'
        Contents: |
          azure-cli-*.tar.gz
          azure-cli-*.tar.gz.sha256
        TargetFolder: '$(Build.ArtifactStagingDirectory)/release'
        flattenFolders: true
    
    - task: CopyFiles@2
      displayName: 'Copy Intel release files to staging'
      inputs:
        SourceFolder: '$(Pipeline.Workspace)/cli-signed-notarized-v3-x86_64'
        Contents: |
          azure-cli-*.tar.gz
          azure-cli-*.tar.gz.sha256
        TargetFolder: '$(Build.ArtifactStagingDirectory)/release'
        flattenFolders: true
    
    - bash: |
        # Get version from one of the tarballs
        ARM64_TARBALL=$(find "$(Build.ArtifactStagingDirectory)/release" -name "*arm64*.tar.gz" ! -name "*.sha256" | head -1)
        VERSION=$(basename "$ARM64_TARBALL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        
        echo "=== GitHub Release ==="
        echo "Version: $VERSION"
        echo ""
        echo "=== Release Assets ==="
        ls -lh "$(Build.ArtifactStagingDirectory)/release/"
        echo ""
        echo "=== SHA256 Checksums ==="
        cat "$(Build.ArtifactStagingDirectory)/release/"*.sha256
        
        echo "##vso[task.setvariable variable=ReleaseTag]v${VERSION}-v3"
        echo "##vso[task.setvariable variable=AzureCliVersion]${VERSION}"
        
      displayName: 'Prepare release files'
    
    - task: GitHubRelease@1
      displayName: 'Delete existing release if present'
      continueOnError: true
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'delete'
        tag: '$(ReleaseTag)'
    
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: 'github.com_naga-nandyala'
        repositoryName: '$(GitHubRepo)'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(ReleaseTag)'
        title: 'Azure CLI $(AzureCliVersion) - macOS v3 (Homebrew Python)'
        releaseNotesSource: 'inline'
        releaseNotesInline: |
          ## Azure CLI $(AzureCliVersion) - macOS (v3 - Homebrew Python)
          
          This release uses Homebrew Python instead of bundling Python runtime.
          Smaller download (~42MB vs ~83MB) and shares Python with other tools.
          
          ### Available Architectures
          - **Apple Silicon (arm64)**: azure-cli-$(AzureCliVersion)-macos-arm64-nopython-signed-notarized.tar.gz
          - **Intel (x86_64)**: azure-cli-$(AzureCliVersion)-macos-x86_64-nopython-signed-notarized.tar.gz
          
          ### Requirements
          - macOS 11+ (Big Sur or later)
          - Homebrew Python 3.13
          
          ### Installation via Homebrew Cask (Recommended)
          ```bash
          brew tap $(HomebrewTapRepo)
          brew install --cask azure-cli-v3
          ```
          
          ### Manual Installation
          ```bash
          brew install python@3.13
          # Download tarball for your architecture
          tar xzf azure-cli-$(AzureCliVersion)-macos-<arch>-nopython-signed-notarized.tar.gz
          ./bin/az version
          ```
          
          ### Alternative Python Sources
          The portable launcher supports Homebrew, python.org, pyenv, or custom path via AZ_PYTHON.
          
          ### Verification
          ```bash
          codesign -v bin/az
          spctl --assess -vv bin/az
          ```
        assets: '$(Build.ArtifactStagingDirectory)/release/*'
        addChangeLog: false

# ============================================================================
# STAGE 7: UPDATE HOMEBREW CASK (Both Architectures)
# ============================================================================
- stage: UpdateHomebrewCask
  displayName: 'Stage 7: Update Homebrew Cask'
  dependsOn:
  - DownloadAndAnalyze
  - CreateFinalTarball
  - PublishToGitHub
  condition: and(succeeded(), eq('${{ parameters.UpdateHomebrew }}', true))
  jobs:
  - job: UpdateCask
    displayName: 'Update Homebrew Cask Definition'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: homebrewtap
      persistCredentials: true
      path: homebrew-tap
    
    - download: current
      artifact: 'cli-signed-notarized-v3-arm64'
      displayName: 'Download signed tarball (ARM64)'
    
    - download: current
      artifact: 'cli-signed-notarized-v3-x86_64'
      displayName: 'Download signed tarball (Intel)'
    
    - bash: |
        set -e
        
        GITHUB_REPO="${{ parameters.GitHubRepo }}"
        
        # Get version and SHA256 for both architectures
        ARM64_TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-v3-arm64 -name "*.tar.gz" ! -name "*.sha256" | head -1)
        X86_64_TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-v3-x86_64 -name "*.tar.gz" ! -name "*.sha256" | head -1)
        
        VERSION=$(basename "$ARM64_TARBALL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        
        ARM64_SHA256=$(cat ${ARM64_TARBALL}.sha256 | cut -d' ' -f1)
        X86_64_SHA256=$(cat ${X86_64_TARBALL}.sha256 | cut -d' ' -f1)
        
        echo "=== Updating Homebrew Cask ==="
        echo "Version: $VERSION"
        echo "ARM64 SHA256: $ARM64_SHA256"
        echo "x86_64 SHA256: $X86_64_SHA256"
        
        cd $(Pipeline.Workspace)/homebrew-tap
        
        # Create Cask with architecture-specific blocks
        mkdir -p Casks
        CASK_FILE="Casks/azure-cli-v3.rb"
        
        # Build cask file using echo to avoid YAML parsing issues with Ruby syntax
        {
          echo 'cask "azure-cli-v3" do'
          echo "  version \"${VERSION}\""
          echo ''
          echo '  on_arm do'
          echo "    sha256 \"${ARM64_SHA256}\""
          echo "    url \"https://github.com/${GITHUB_REPO}/releases/download/v${VERSION}-v3/azure-cli-${VERSION}-macos-arm64-nopython-signed-notarized.tar.gz\""
          echo '  end'
          echo ''
          echo '  on_intel do'
          echo "    sha256 \"${X86_64_SHA256}\""
          echo "    url \"https://github.com/${GITHUB_REPO}/releases/download/v${VERSION}-v3/azure-cli-${VERSION}-macos-x86_64-nopython-signed-notarized.tar.gz\""
          echo '  end'
          echo ''
          echo '  name "Azure CLI"'
          echo '  desc "Microsoft Azure CLI (Lightweight - uses Homebrew Python)"'
          echo '  homepage "https://docs.microsoft.com/cli/azure/"'
          echo ''
          echo '  depends_on formula: "python@3.13"'
          echo ''
          echo '  binary "bin/az"'
          echo ''
          echo '  zap trash: "~/.azure"'
          echo 'end'
        } > "$CASK_FILE"
        
        echo "=== Updated Cask ==="
        cat "$CASK_FILE"
        
        # Commit and push
        git config user.name "Azure Pipeline"
        git config user.email "azure-pipeline@microsoft.com"
        git add Casks/azure-cli-v3.rb
        git commit -m "Update azure-cli-v3 to $VERSION (both architectures)" || echo "No changes to commit"
        git push origin HEAD:main
        
        echo "Homebrew cask updated successfully"
        
      displayName: 'Update cask definition (both architectures)'

# ============================================================================
# STAGE 8: TEST INSTALLATION (Both Architectures)
# ============================================================================
- stage: TestInstallation
  displayName: 'Stage 8: Test Installation'
  dependsOn:
  - DownloadAndAnalyze
  - CreateFinalTarball
  - UpdateHomebrewCask
  condition: and(succeeded(), eq('${{ parameters.UpdateHomebrew }}', true))
  jobs:
  - job: TestCaskInstall
    displayName: 'Test Homebrew Cask Installation'
    strategy:
      matrix:
        ARM64:
          ARCH: 'arm64'
          VM_IMAGE: 'macos-15-arm64'
        Intel:
          ARCH: 'x86_64'
          VM_IMAGE: 'macos-15'
    pool:
      vmImage: $(VM_IMAGE)
    
    steps:
    - checkout: none
    
    - bash: |
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║  CLEANUP: Remove Pre-installed Azure CLI ($(ARCH))                   ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        echo ""
        
        if command -v az &> /dev/null; then
          echo "Pre-installed Azure CLI detected: $(which az)"
          az --version 2>/dev/null | head -3 || true
          echo ""
          
          echo "Removing via Homebrew..."
          brew uninstall azure-cli 2>/dev/null || true
          brew uninstall --cask azure-cli 2>/dev/null || true
          brew uninstall azure-cli-v3 2>/dev/null || true
          brew uninstall --cask azure-cli-v3 2>/dev/null || true
          
          echo "Removing symlinks..."
          sudo rm -f /usr/local/bin/az
          sudo rm -f /opt/homebrew/bin/az
          
          echo "Removing installation directories..."
          sudo rm -rf /usr/local/microsoft/azure-cli
          sudo rm -rf /usr/local/az
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/Cellar/azure-cli*
          sudo rm -rf /opt/homebrew/Cellar/azure-cli*
          
          hash -r
        else
          echo "No pre-installed Azure CLI detected"
        fi
        echo ""
        echo "Cleanup complete"
        
      displayName: 'Remove pre-installed Azure CLI ($(ARCH))'
    
    - bash: |
        set -e
        
        echo "=== Testing Homebrew Cask Installation (v3 - $(ARCH)) ==="
        
        # Ensure Python 3.13 is installed first
        if ! brew list python@3.13 &>/dev/null; then
          echo "Installing Python 3.13..."
          brew install python@3.13
        fi
        
        # Add tap and install (NO --no-quarantine - binaries are signed+notarized!)
        brew tap ${{ parameters.HomebrewTapRepo }}
        brew install --cask azure-cli-v3
        
        # Verify
        which az
        az version
        
        INSTALLED_VERSION=$(az version -o tsv --query '"azure-cli"' 2>/dev/null || echo "unknown")
        
        echo ""
        echo "Installed version: $INSTALLED_VERSION"
        echo ""
        echo "Cask installation successful ($(ARCH))"
        
        # Cleanup
        brew uninstall --cask azure-cli-v3
        
      displayName: 'Test cask install ($(ARCH))'
  
  - job: TestOfflineInstall
    displayName: 'Test Offline/Tarball Installation'
    strategy:
      matrix:
        ARM64:
          ARCH: 'arm64'
          VM_IMAGE: 'macos-15-arm64'
        Intel:
          ARCH: 'x86_64'
          VM_IMAGE: 'macos-15'
    pool:
      vmImage: $(VM_IMAGE)
    
    steps:
    - checkout: none
    
    - bash: |
        echo "╔══════════════════════════════════════════════════════════════════════╗"
        echo "║  CLEANUP: Remove Pre-installed Azure CLI ($(ARCH))                   ║"
        echo "╚══════════════════════════════════════════════════════════════════════╝"
        echo ""
        
        if command -v az &> /dev/null; then
          echo "Pre-installed Azure CLI detected: $(which az)"
          az --version 2>/dev/null | head -3 || true
          echo ""
          
          echo "Removing via Homebrew..."
          brew uninstall azure-cli 2>/dev/null || true
          brew uninstall --cask azure-cli 2>/dev/null || true
          
          echo "Removing symlinks..."
          sudo rm -f /usr/local/bin/az
          sudo rm -f /opt/homebrew/bin/az
          
          echo "Removing installation directories..."
          sudo rm -rf /usr/local/Cellar/azure-cli*
          sudo rm -rf /opt/homebrew/Cellar/azure-cli*
          
          hash -r
        else
          echo "No pre-installed Azure CLI detected"
        fi
        echo ""
        
      displayName: 'Remove pre-installed Azure CLI ($(ARCH))'
    
    - download: current
      artifact: 'cli-signed-notarized-v3-$(ARCH)'
      displayName: 'Download signed tarball ($(ARCH))'
    
    - bash: |
        set -e
        
        echo "=== Testing Offline/Direct Tarball Installation ($(ARCH)) ==="
        
        TARBALL=$(find $(Pipeline.Workspace)/cli-signed-notarized-v3-$(ARCH) -name "*.tar.gz" ! -name "*.sha256" | head -1)
        TEST_DIR="$HOME/azure-cli-test"
        
        mkdir -p "$TEST_DIR"
        tar -xzf "$TARBALL" -C "$TEST_DIR"
        
        # Ensure Homebrew Python is installed
        if ! brew list python@3.13 &>/dev/null; then
          brew install python@3.13
        fi
        
        # Test with debug mode
        export AZ_DEBUG=1
        "$TEST_DIR/bin/az" version
        
        INSTALLED_VERSION=$("$TEST_DIR/bin/az" version -o tsv --query '"azure-cli"' 2>/dev/null || echo "unknown")
        
        echo ""
        echo "Installed version: $INSTALLED_VERSION"
        echo ""
        echo "Offline installation successful ($(ARCH))"
        
        # Cleanup
        rm -rf "$TEST_DIR"
        
      displayName: 'Test offline install ($(ARCH))'

